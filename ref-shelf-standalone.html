  }
  body.fullscreen-grid .grid-card-tags .tag-pill{
    font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;
    max-width:none;
  }
  /* 浮动添加按钮 */
  body.fullscreen-grid .fs-fab{
    position:fixed;bottom:32px;right:40px;z-index:20;
    width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff;font-size:26px;font-weight:300;line-height:1;
    box-shadow:0 8px 24px rgba(232,148,60,.4);
    display:grid;place-items:center;transition:.2s;
  }
  body.fullscreen-grid .fs-fab:hover{transform:scale(1.08);box-shadow:0 12px 32px rgba(232,148,60,.5);}

  /* ===== 全屏图片预览器 ===== */
  /* 图片预览弹窗 —— 半透浅灰遮罩 + 淡入淡出过渡 */
  /* ===== 分层堆叠相册预览器 ===== */
  /* 底层：半透明深色遮罩 + 弱模糊，弱化后方页面 */
  .img-viewer{
    position:fixed;inset:0;z-index:10010;
    background:rgba(15,17,22,.92);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;
    overflow:hidden;
    opacity:0;transition:opacity .3s ease;
  }
  .img-viewer.show{display:flex;opacity:1;}

  /* 舞台容器：承载 3D 旋转木马圆环（仅 .carousel-mode 模式）
   * ★ 改造为 3D Carousel（cult-ui 旋转木马）：卡片围成圆环，整体 rotateY 旋转 */
  .img-viewer.carousel-mode .stage{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:visible;
    /* 3D 透视：让圆环有纵深感 */
    perspective:1400px;
    perspective-origin:50% 50%;
  }
  /* 旋转木马圆环：所有卡片挂载于此，整体 rotateY 旋转
   * 卡片尺寸缩小为 1.1 倍：300×400 → 330×440，视觉精致
   * 尺寸通过 CSS 变量 --card-w/--card-h 控制，支持 1.5 倍放大模式 */
  .img-viewer.carousel-mode .carousel-ring{
    position:relative;
    width:var(--card-w,330px);height:var(--card-h,440px);
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.25,.46,.45,.94);
    will-change:transform;
  }
  .img-viewer.carousel-mode .carousel-ring.dragging{
    transition:none;
  }

  /* 背景图层：默认隐藏，cover-bg-mode 模式下显示虚化封面大图 */
  .img-viewer.carousel-mode .carousel-bg{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center;
    filter:blur(40px) brightness(.4);
    opacity:0;transition:opacity .4s ease;
    transform:scale(1.1);
  }
  .img-viewer.carousel-mode.cover-bg-mode .carousel-bg{opacity:1;}
  /* cover-bg-mode 下移除纯色遮罩，沿用虚化封面背景 */
  .img-viewer.carousel-mode.cover-bg-mode{
    background:transparent;
  }

  /* ===== 照片卡片：3D 旋转木马单卡（仅 .carousel-mode）
   * 去除白底相纸边框，照片直接铺满卡片，尺寸由 CSS 变量控制 */
  .img-viewer.carousel-mode .photo-card{
    position:absolute;top:0;left:0;
    width:var(--card-w,330px);height:var(--card-h,440px);
    /* 去除白色相纸背景和 padding，照片直接铺满 */
    background:transparent;
    padding:0;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    backface-visibility:hidden;
    box-shadow:0 16px 48px rgba(0,0,0,.5);
    transform-style:preserve-3d;
  }
  .img-viewer.carousel-mode .photo-card img{
    width:100%;height:100%;
    object-fit:cover;          /* 照片铺满整个卡片，无白边 */
    border-radius:8px;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
    display:block;
  }
  /* 当前焦点卡片青蓝发光高亮 */
  .img-viewer.carousel-mode .photo-card.is-active{
    box-shadow:0 24px 80px rgba(56,189,248,.35),0 8px 32px rgba(0,0,0,.5);
  }

  /* ===== 原堆叠相册样式（仅 .stack-mode 模式，非景点照片查看使用）===== */
  .img-viewer.stack-mode .stage{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .img-viewer.stack-mode .photo-card{
    position:absolute;
    background:#fff;
    padding:12px;
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .55s cubic-bezier(.25,.46,.45,.94),
               opacity .4s ease;
    will-change:transform;
    backface-visibility:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .img-viewer.stack-mode .photo-card img{
    max-width:70vw;max-height:66vh;object-fit:contain;
    border-radius:2px;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
    display:block;
  }
  .img-viewer.stack-mode .photo-card.dragging{ transition:none !important; }
  .img-viewer.stack-mode .photo-card.no-transition{ transition:none !important; }
  .img-viewer.stack-mode .photo-card.main{
    z-index:10;transform:translate(0,0) rotate(0deg) scale(1);opacity:1;
    box-shadow:0 24px 80px rgba(0,0,0,.55),0 8px 32px rgba(0,0,0,.3);
  }
  .img-viewer.stack-mode .photo-card.prev{
    z-index:8;transform:translate(-130px,32px) rotate(-8deg) scale(.78);opacity:.5;
  }
  .img-viewer.stack-mode .photo-card.next{
    z-index:8;transform:translate(130px,32px) rotate(8deg) scale(.78);opacity:.5;
  }
  .img-viewer.stack-mode .photo-card.far-prev{
    z-index:6;transform:translate(-240px,58px) rotate(-14deg) scale(.64);opacity:.22;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
  }
  .img-viewer.stack-mode .photo-card.far-next{
    z-index:6;transform:translate(240px,58px) rotate(14deg) scale(.64);opacity:.22;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
  }

  /* ===== 上层控件：左右切换按钮 ===== */
  .img-viewer .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:52px;height:52px;border-radius:50%;
    background:rgba(248,250,252,.1);border:1px solid rgba(248,250,252,.18);
    color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s ease,transform .25s ease,opacity .25s ease;
    z-index:20;
  }
  .img-viewer .nav-btn:hover{background:rgba(248,250,252,.22);transform:translateY(-50%) scale(1.1);}
  .img-viewer .nav-btn.disabled{opacity:.25;pointer-events:none;}
  .img-viewer .nav-prev{left:28px;}
  .img-viewer .nav-next{right:28px;}

  /* ===== 上层控件：关闭按钮 ===== */
  .img-viewer .close-btn{
    position:absolute;top:22px;right:28px;
    width:42px;height:42px;border-radius:50%;
    background:rgba(248,250,252,.1);border:1px solid rgba(248,250,252,.18);
    color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s ease,transform .25s ease;z-index:20;
  }
  .img-viewer .close-btn:hover{background:rgba(232,148,60,.55);transform:rotate(90deg);}

  /* ===== 上层控件：下载按钮 ===== */
  .img-viewer .download-btn{
    position:absolute;top:22px;left:28px;
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s ease,transform .25s ease;z-index:20;
  }
  .img-viewer .download-btn:hover{background:rgba(248,250,252,.22);transform:scale(1.1);}

  /* ===== 上层控件：页码提示 ===== */
  .img-viewer .counter{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.6);font-size:14px;font-weight:500;
    background:rgba(0,0,0,.35);padding:6px 18px;border-radius:20px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:20;
  }
  .img-viewer .viewer-media-tabs{position:absolute;top:22px;left:86px;z-index:22;display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .img-viewer .viewer-media-tabs[hidden]{display:none;}
  .img-viewer .viewer-media-tab{border:0;border-radius:7px;padding:6px 11px;background:transparent;color:rgba(255,255,255,.68);font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap;}
  .img-viewer .viewer-media-tab:hover{background:rgba(255,255,255,.16);color:#fff;}
  .img-viewer .viewer-media-tab.is-active{background:#e8e9eb;color:#0f1116;}

  /* ===== 底部缩略图层：横向排列，当前高亮放大 ===== */
  .img-viewer .thumb-strip{
    position:absolute;bottom:64px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;padding:8px 12px;
    background:rgba(0,0,0,.3);border-radius:12px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    max-width:90vw;overflow-x:auto;overflow-y:hidden;
    z-index:20;
  }
  .img-viewer .thumb-strip::-webkit-scrollbar{height:0;}
  .img-viewer .thumb-strip .thumb{
    width:52px;height:52px;border-radius:6px;object-fit:cover;
    cursor:pointer;opacity:.5;flex-shrink:0;
    border:2px solid transparent;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:opacity .2s ease,transform .2s ease,border-color .2s ease;
  }
  .img-viewer .thumb-strip .thumb:hover{opacity:.85;transform:scale(1.05);}
  .img-viewer .thumb-strip .thumb.active{
    opacity:1;transform:scale(1.2);
    border-color:#7dd3fc;
    box-shadow:0 4px 16px rgba(125,211,252,.18);
  }

  /* 底部操作提示 */
  .img-viewer .hint{

  /* ============================================================
   * ===== 地球启动层 CSS（HyperFrames / GSAP 动画目标元素）=====
   * 全屏覆盖主内容的地球启动页：#launch-screen 容器 z-index:50，
   * 内部粒子背景 z-index:2、地球 z-index:1、标题按钮 z-index:10。
   * 点击「开始记录」后由 GSAP timeline 淡出隐藏，露出主地图内容。
   * 注意：body 背景保持主项目原有渐变，纯黑深空背景仅作用于 #launch-screen。
   * ============================================================ */

  /* 启动层容器：fixed 全屏，纯黑深空背景，覆盖主内容 */
  #launch-screen{
    position:fixed;
    inset:0;
    z-index:50;                                       /* 高于主内容（header/地图/卡片），低于模态框(默认隐藏) */
    background:#000;                                  /* 纯黑深空背景，强化地球科技氛围 */
    overflow:hidden;
  }

  /* 粒子星空背景（position:absolute 相对 #launch-screen，z-index:2）
   * 基于 ogl 的 WebGL 粒子，canvas 由脚本自动创建并 append。
   * 放在地球之上才能让粒子明显可见（地球canvas会遮挡下方图层） */
  #prism-bg{
    position:absolute;                                /* 改为 absolute（容器内定位，原 earth-startup 为 fixed） */
    inset:0;
    width:100%;
    height:100%;
    z-index:2;                                        /* 地球(z-index:1)之上、标题按钮(z-index:10)之下 */
    pointer-events:none;                              /* 不拦截鼠标，让地球可拖拽 */
    overflow:hidden;
    background:transparent;
  }
  #prism-bg canvas{display:block;width:100%;height:100%;}

  /* 3D 地球容器（position:absolute 相对 #launch-screen，z-index:1，可交互拖拽缩放） */
  #globeViz{
    position:absolute;                                /* 改为 absolute（容器内定位，原 earth-startup 为 fixed） */
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:auto;                              /* 允许鼠标拖拽旋转与滚轮缩放 */
  }
  #globeViz canvas{width:100%!important;height:100%!important;display:block;}

  /* 标题 + 按钮悬浮层（position:absolute 相对 #launch-screen，z-index:10，整体穿透） */
  .launch-overlay{
    position:absolute;                                /* 改为 absolute（容器内定位，原 earth-startup 为 fixed） */
    inset:0;
    z-index:10;
    pointer-events:none;                              /* 整体穿透，让鼠标事件落到地球 */
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;                           /* 垂直居中：标题与按钮位于页面正中 */
  }

  /* 标题双层结构：外层包裹，内含发光层与扫光层 */
  .launch-title-wrap{
    position:relative;
    display:inline-block;
    line-height:1.1;
    will-change:transform,opacity;                    /* GPU 加速，GSAP tween 友好 */
  }
  /* 标题通用字体属性（两层共用，确保完全对齐） */
  .launch-title,
  .launch-title-glow{
    font-size:clamp(2.5rem, 6vw, 5rem);              /* 全屏自适应 */
    font-family:'Playfair Display','Figtree','Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",serif;
    font-weight:400;
    font-variation-settings:'wght' 400;             /* 【SKILL.md 4.1】Playfair Display 可变字体基重，VP JS 动态覆盖 wght */
    letter-spacing:0.08em;
    margin:0;
    white-space:nowrap;
  }
  /* 发光层（绝对定位，底层）：白色文字 + 微光 text-shadow */
  .launch-title-glow{
    position:absolute;
    inset:0;
    color:transparent;                                /* 仅显示光晕，不显示实色文字（避免与 VP 字符叠加发虚）*/
    text-shadow:0 0 20px rgba(56,189,248,0.55),
               0 0 40px rgba(56,189,248,0.3);
    pointer-events:none;
  }
  /* 扫光层（上层）：background-clip:text 实现 shiny 扫光 */
  .launch-title{
    position:relative;
    color:#38bdf8;                                    /* VP 基色：青蓝（JS 按 influence 动态覆盖）*/
    user-select:none;
  }
  /* shiny 扫光动画：渐变位置循环移动 */
  @keyframes shinySweep{
    0%   { background-position:150% 0; }
    26.7%{ background-position:-50% 0; }
    50%  { background-position:-50% 0; }
    76.7%{ background-position:150% 0; }
    100% { background-position:150% 0; }
  }

  /* ===== SmokyText 烟雾文字特效：启动页标题 Chinese Footprint（移植自 originkit smokytex）=====
     原理：每个字符从左下方旋转 skew 飞入，text-shadow 由大模糊烟雾→0 凝实，
     形成烟雾聚合成字的效果。颜色青蓝(#7dd3fc)适配深空 3D 地球科技氛围。
     性能：一次性 CSS 动画（animation:both），完成后字符静态，不与 globe.gl 持续争抢资源；
     动画期间 will-change 仅作用于字符 transform/opacity，结束后清除（anti-slop）。 */
  .smt-title{
    position:relative;
    font-size:clamp(2.5rem,6vw,5rem);               /* 与原 .launch-title 一致，居中尺寸不变 */
    font-family:'Playfair Display','Figtree','Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",serif;
    font-weight:400;
    font-variation-settings:'wght' 400;             /* 【SKILL.md 4.1】Playfair Display 可变字体基重 */
    letter-spacing:0.08em;
    margin:0;
    white-space:nowrap;
    user-select:none;
    text-align:center;
    line-height:1.1;
    color:transparent;                              /* 父级透明，渐变由子字符 .smt-char 各自承载 */
    /* 注：渐变 background-clip:text 直接作用于每个 .smt-char（inline-block），
       避免父级渐变在 inline-block 子元素上裁切失败的问题。父级仅做布局容器。 */
  }
  /* 词容器：inline-block nowrap，保证单词不折行（originkit 分组结构）*/
  .smt-word{display:inline-block;white-space:nowrap;}
  /* 字符 span：每个字符自带渐变背景（background-clip:text），保证渐变在 inline-block 字符上正确显现；
     text-shadow 仅在动画期作烟雾辉光，终点 none 让渐变填充显现 */
  .smt-char{
    display:inline-block;
    /* 渐变背景直接作用于字符自身，避免 inline-block 子元素无法正确裁切父级背景的问题 */
    /* 加重渐变：深蓝(#1e40af)→亮青(#22d3ee)→亮白(#f0f9ff)→亮青→深蓝，色彩跨度更大、渐变更鲜明 */
    background:linear-gradient(110deg,#1e40af 0%,#22d3ee 30%,#f0f9ff 50%,#22d3ee 70%,#1e40af 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    text-shadow:none;                                /* 默认无阴影；动画 both 填充接管（终点 none 显露渐变）*/
    opacity:0;                                       /* 动画触发前隐藏，触发后由 animation:both 接管 */
    will-change:transform,opacity;                   /* text-shadow 非 GPU，仅 transform/opacity 提速 */
    backface-visibility:hidden;
  }
  /* 空格字符：保留两单词间词距（Chinese 与 Footprint 之间）*/
  .smt-char.smt-space{width:0.5em;}
  @media (prefers-reduced-motion: reduce){
    .smt-char{opacity:1;animation:none!important;transform:none;text-shadow:0 0 12px rgba(125,211,252,.6);}
  }

  /* 副标题：smokytex 烟雾动画（纯色文字，无渐变填充，避免乱码）*/
  .launch-subtitle{
    font-size:clamp(1.05rem,2.2vw,1.6rem);
    letter-spacing:0.05em;
    margin-top:18px;
    margin-bottom:6px;
    font-weight:400;
    text-align:center;
    background:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    color:#bae6fd;
    -webkit-text-fill-color:#bae6fd;
    animation:none;
    will-change:auto;
  }
  /* 副标题 smokytex 字符：纯色文字，烟雾动画接管渲染 */
  .launch-subtitle .smt-char{
    background:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    -webkit-text-fill-color:#bae6fd;
    color:#bae6fd;
    text-shadow:none;
    font-family:'Figtree','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
    font-size:inherit;
    font-weight:400;
    display:inline-block;
    opacity:0;
    will-change:transform,opacity;
    backface-visibility:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    .launch-subtitle{
      animation:none;
      background-image:none;
      color:rgba(186,230,253,0.75);
      -webkit-text-fill-color:rgba(186,230,253,0.75);
    }
    .launch-subtitle .smt-char{
      opacity:1;
    }
  }

  /* 底部诗意标语：绝对定位锚定启动页底部（图1「— 把流浪写成诗 —」同款布局）
     配色：青蓝渐变字（呼应主标题 Chinese Footprint 的青蓝家族），在深色星空中鲜艳醒目 */
  .launch-motto{
    position:absolute;                                  /* 相对 .launch-overlay（inset:0）定位 */
    left:0;
    right:0;
    bottom:6vh;
    margin:0;
    font-size:clamp(1.02rem,1.9vw,1.4rem);
    font-weight:600;
    letter-spacing:0.22em;
    text-indent:0.22em;                                /* 抵消末字符字距，保持视觉居中 */
    background-image:linear-gradient(90deg,#0ea5e9,#22d3ee 28%,#a5f3fc 50%,#7dd3fc 68%,#0ea5e9);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 8px rgba(34,211,238,.55)) drop-shadow(0 0 22px rgba(14,165,233,.4)); /* 双层青蓝辉光（渐变字用 drop-shadow，避免 text-shadow 透底）*/
    text-align:center;
    white-space:nowrap;                                /* 单行呈现，禁止折行 */
    will-change:transform,opacity;
  }

  /* ===== Shiny CTA 按钮（源自 21st.dev ShinyButton，适配为原生 CSS + 项目青蓝配色）=====
   * 核心特效：conic-gradient 旋转渐变边框 + 圆点纹理遮罩 + 内部 shimmer 旋转光 + hover 呼吸光晕
   * @property 声明动画可插值的自定义属性（gradient-angle/angle-offset/percent/shine）
   * 颜色适配：highlight 从纯蓝改为青蓝 #38bdf8，保持与项目青蓝家族一致 */
  @property --gradient-angle{
    syntax:"<angle>";
    initial-value:0deg;
    inherits:false;
  }
  @property --gradient-angle-offset{
    syntax:"<angle>";
    initial-value:0deg;
    inherits:false;
  }
  @property --gradient-percent{
    syntax:"<percentage>";
    initial-value:5%;
    inherits:false;
  }
  @property --gradient-shine{
    syntax:"<color>";
    initial-value:#ffffff;
    inherits:false;
  }

  /* 启动按钮：Shiny CTA 风格（深色底 + 青蓝旋转渐变边框 + 圆点纹理 + 内部 shimmer）*/
  .launch-btn{
    --shiny-cta-bg:rgba(6,10,20,0.35);                /* 半透明深蓝黑底（透出地球背景）*/
    --shiny-cta-bg-subtle:rgba(15,26,46,0.35);        /* 半透明暗蓝灰内阴影色 */
    --shiny-cta-fg:#e0f7ff;                          /* 亮青白文字（青蓝家族）*/
    --shiny-cta-highlight:#38bdf8;                   /* 青蓝高光（项目调色板 sky-400）*/
    --shiny-cta-highlight-subtle:#7dd3fc;            /* 浅青蓝高光（#7dd3fc）*/
    --animation:gradient-angle linear infinite;
    --duration:3s;
    --shadow-size:2px;
    --transition:800ms cubic-bezier(0.25,1,0.5,1);

    pointer-events:auto;                              /* 穿透层中唯一可交互元素 */
    isolation:isolate;
    position:relative;
    overflow:hidden;
    margin-top:56px;                                  /* 距副标题留白 */
    padding:16px 52px;
    will-change:transform,opacity;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    letter-spacing:3px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid transparent;
    border-radius:var(--radius-pill);               /* 大圆角胶囊形 */
    color:var(--shiny-cta-fg);
    /* 双层背景：内层纯色填充 + 外层 conic-gradient 仅绘制边框区域（border-box vs padding-box）*/
    background:linear-gradient(var(--shiny-cta-bg),var(--shiny-cta-bg)) padding-box,
               conic-gradient(
                 from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
                 transparent,
                 var(--shiny-cta-highlight) var(--gradient-percent),
                 var(--gradient-shine) calc(var(--gradient-percent) * 2),
                 var(--shiny-cta-highlight) calc(var(--gradient-percent) * 3),
                 transparent calc(var(--gradient-percent) * 4)
               ) border-box;
    box-shadow:inset 0 0 0 1px var(--shiny-cta-bg-subtle),
               0 4px 18px rgba(0,0,0,0.5),
               0 0 14px rgba(56,189,248,0.15);
    transition:var(--transition);
    transition-property:--gradient-angle-offset,--gradient-percent,--gradient-shine;
  }
  /* 闪光图标 */
  .launch-btn .sparkle{
    font-size:18px;
    line-height:1;
    filter:drop-shadow(0 0 4px rgba(125,211,252,0.7));
  }
  /* 按下反馈：translate 独立于 transform（GSAP scale 不冲突）*/
  .launch-btn:active{
    translate:0 1px;
  }

  /* 圆点纹理遮罩（::before）：白点网格 + conic 旋转遮罩，z-index:-1 位于内容之下 */
  .launch-btn::before{
    content:'';
    pointer-events:none;
    position:absolute;
    inset-inline-start:50%;
    inset-block-start:50%;
    translate:-50% -50%;
    z-index:-1;
    --size:calc(100% - var(--shadow-size) * 3);
    --position:2px;
    --space:calc(var(--position) * 2);
    width:var(--size);
    height:var(--size);
    background:radial-gradient(
      circle at var(--position) var(--position),
      #fff calc(var(--position) / 4),
      transparent 0
    ) padding-box;
    background-size:var(--space) var(--space);
    background-repeat:space;
    mask-image:conic-gradient(
      from calc(var(--gradient-angle) + 45deg),
      #000,
      transparent 10% 90%,
      #000
    );
    border-radius:inherit;
    opacity:0.4;
  }

  /* 内部 shimmer 旋转光（::after）：斜向渐变 + 底部径向遮罩，z-index:-1 */
  .launch-btn::after{
    content:'';
    pointer-events:none;
    position:absolute;
    inset-inline-start:50%;
    inset-block-start:50%;
    translate:-50% -50%;
    z-index:-1;
    --animation:shimmer linear infinite;
    width:100%;
    aspect-ratio:1;
    background:linear-gradient(
      -50deg,
      transparent,
      var(--shiny-cta-highlight),
      transparent
    );
    mask-image:radial-gradient(circle at bottom,transparent 40%,#000);
    opacity:0.6;
  }

  /* 内容 span 提升层级（在 ::before/::after 之上）*/
  .launch-btn>span{
    position:relative;
    z-index:1;
  }
  /* 呼吸光晕（span::before）：hover 时显现的底部内阴影呼吸动画 */
  .launch-btn>span::before{
    content:'';
    pointer-events:none;
    position:absolute;
    inset-inline-start:50%;
    inset-block-start:50%;
    translate:-50% -50%;
    z-index:-1;
    --size:calc(100% + 1rem);
    width:var(--size);
    height:var(--size);
    box-shadow:inset 0 -1ex 2rem 4px var(--shiny-cta-highlight);
    opacity:0;
    transition:opacity var(--transition);
    animation:calc(var(--duration) * 1.5) breathe linear infinite;
  }

  /* 动画驱动：按钮 + ::before + ::after 共享 gradient-angle + shimmer 动画（默认暂停）*/
  .launch-btn,
  .launch-btn::before,
  .launch-btn::after{
    animation:var(--animation) var(--duration),
              var(--animation) calc(var(--duration) / 0.4) reverse paused;
    animation-composition:add;
  }
  @keyframes gradient-angle{
    to{ --gradient-angle:360deg; }
  }
  @keyframes shimmer{
    to{ rotate:360deg; }
  }
  @keyframes breathe{
    from,to{ scale:1; }
    50%{ scale:1.2; }
  }

  /* ===== 引力相册按钮（照片管理标题旁）===== */
  .gravity-gallery-btn{
    font-size:12px;font-weight:700;color:#a6d2be;
    background:rgba(166,210,190,.12);
    border:1px solid rgba(166,210,190,.35);
    border-radius:var(--radius-xs,8px);
    padding:5px 12px;cursor:pointer;
    letter-spacing:.5px;
    transition:all .3s cubic-bezier(.2,.8,.3,1);
    white-space:nowrap;
  }
  .gravity-gallery-btn:hover{
    background:rgba(166,210,190,.22);
    border-color:rgba(166,210,190,.6);
    color:#c8e6d5;
    box-shadow:0 2px 12px rgba(166,210,190,.2);
    transform:translateY(-1px);
  }

  /* ===== 引力相册全屏覆盖层 ===== */
  .gravity-gallery-overlay{
    position:fixed;inset:0;z-index:10005;
    display:none;flex-direction:column;
    background:radial-gradient(ellipse at center,#0f1419 0%,#05070a 100%);
    animation:gravityFadeIn .4s ease;
  }
  @keyframes gravityFadeIn{ from{opacity:0;} to{opacity:1;} }
  .gravity-gallery-overlay.active{display:flex;}
  .gravity-gallery-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 24px;
    background:rgba(10,12,16,.6);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.06);
    z-index:10;
  }
  .gravity-gallery-title{
    font-family:'Noto Serif SC',serif;
    font-size:20px;font-weight:700;
    background:linear-gradient(180deg,#fefaf0 0%,#f0e6d2 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:2px;
  }
  .gravity-gallery-close{
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:#ccc;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s ease;
  }
  .gravity-gallery-close:hover{
    background:rgba(255,100,100,.2);
    border-color:rgba(255,100,100,.4);
    color:#ff8080;
    transform:rotate(90deg);
  }
  #gravityCanvas{
    flex:1;width:100%;display:block;cursor:grab;
  }
  #gravityCanvas:active{cursor:grabbing;}
  /* 引力相册中央装饰边框 —— 框选照片活动区域，不遮挡照片（纯边线+柔和内发光）*/
  .gravity-gallery-frame{
    position:absolute;
    left:50%;
    transform:translate(-50%,-50%);  /* 以中心点定位，top 由 JS 设置为中心点 */
    border:1px solid rgba(166,210,190,.18);
    border-radius:16px;
    pointer-events:none;  /* 不拦截鼠标，照片可正常拖拽 */
    box-shadow:inset 0 0 80px rgba(166,210,190,.05),0 0 30px rgba(0,0,0,.3);
    z-index:5;
    opacity:0;  /* 初始隐藏，openGravityGallery 时显示 */
    transition:opacity .4s ease;
  }
  /* 边框四角装饰（青绿色角标，增强框选感）*/
  .gravity-gallery-frame .gf-corner{
    position:absolute;width:24px;height:24px;
    pointer-events:none;
  }
  .gravity-gallery-frame .gf-corner.tl{ top:-1px;left:-1px; border-top:2px solid rgba(166,210,190,.5); border-left:2px solid rgba(166,210,190,.5); border-radius:16px 0 0 0; }
  .gravity-gallery-frame .gf-corner.tr{ top:-1px;right:-1px; border-top:2px solid rgba(166,210,190,.5); border-right:2px solid rgba(166,210,190,.5); border-radius:0 16px 0 0; }
  .gravity-gallery-frame .gf-corner.bl{ bottom:-1px;left:-1px; border-bottom:2px solid rgba(166,210,190,.5); border-left:2px solid rgba(166,210,190,.5); border-radius:0 0 0 16px; }
  .gravity-gallery-frame .gf-corner.br{ bottom:-1px;right:-1px; border-bottom:2px solid rgba(166,210,190,.5); border-right:2px solid rgba(166,210,190,.5); border-radius:0 0 16px 0; }
  .gravity-gallery-hint{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:12px;color:rgba(166,210,190,.5);
    letter-spacing:1px;pointer-events:none;
    background:rgba(0,0,0,.4);padding:6px 16px;border-radius:999px;
    backdrop-filter:blur(8px);
  }

  .memory-album{--album-paper:#f3eee4;--album-ink:#183743;--album-muted:#687b80;--album-accent:#a35b38;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.86),transparent 48%),#e8edef;padding:24px 34px 72px;}

.dg-root {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  --dg-radius: 520px;
  --dg-viewer-pad: 72px;
  --dg-circ: calc(var(--dg-radius) * 3.14);
  --dg-rot-y: calc((360deg / var(--dg-segments-x)) / 2);
  --dg-rot-x: calc((360deg / var(--dg-segments-y)) / 2);
  --dg-item-width: calc(var(--dg-circ) / var(--dg-segments-x));
  --dg-item-height: calc(var(--dg-circ) / var(--dg-segments-y));
  --dg-surface: #08182a;
}

.dg-root,
.dg-root * { box-sizing: border-box; }

.dg-main {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  background: var(--dg-surface);
}

.dg-stage {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  perspective: calc(var(--dg-radius) * 2);
  perspective-origin: 50% 50%;
  contain: layout paint size;
}

.dg-sphere,
.dg-item,
.dg-image { transform-style: preserve-3d; }

.dg-sphere {
  transform: translateZ(calc(var(--dg-radius) * -1));
  will-change: transform;
}

.dg-item {
  width: calc(var(--dg-item-width) * var(--dg-size-x));
  height: calc(var(--dg-item-height) * var(--dg-size-y));
  position: absolute;
  inset: -999px;
  margin: auto;
  transform-origin: 50% 50%;
  backface-visibility: hidden;
  transform:
    rotateY(calc(var(--dg-rot-y) * (var(--dg-offset-x) + ((var(--dg-size-x) - 1) / 2)) + var(--dg-rot-y-delta, 0deg)))
    rotateX(calc(var(--dg-rot-x) * (var(--dg-offset-y) - ((var(--dg-size-y) - 1) / 2)) + var(--dg-rot-x-delta, 0deg)))
    translateZ(var(--dg-radius));
}

.dg-image {
  position: absolute;
  display: block;
  inset: 9px;
  border: 1px solid rgba(151, 199, 255, .18);
  border-radius: var(--dg-tile-radius, 12px);
  background: var(--dg-surface);
  overflow: hidden;
  backface-visibility: hidden;
  cursor: grab;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  pointer-events: auto;
  transform: translateZ(0);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
  transition: border-color 180ms ease, filter 180ms ease;
}

.dg-image:hover { border-color: rgba(135, 190, 255, .62); }
.dg-image:active { cursor: grabbing; }
.dg-image:focus-visible { outline: 2px solid #78adff; outline-offset: 2px; }

.dg-image img,
.dg-enlarge img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  pointer-events: none;
  backface-visibility: hidden;
  filter: var(--dg-image-filter, none);
}

.dg-overlay,
.dg-overlay-blur {
  position: absolute;
  inset: 0;
  margin: auto;
  z-index: 3;
  pointer-events: none;
}

.dg-overlay {
  background-image: radial-gradient(rgba(8, 24, 42, 0) 61%, var(--dg-surface) 100%);
}

.dg-overlay-blur {
  -webkit-mask-image: radial-gradient(rgba(8, 24, 42, 0) 68%, var(--dg-surface) 92%);
  mask-image: radial-gradient(rgba(8, 24, 42, 0) 68%, var(--dg-surface) 92%);
  display: none;
}

.dg-edge-fade {
  position: absolute;
  left: 0;
  right: 0;
  height: 92px;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--dg-surface));
}

.dg-edge-fade.top { top: 0; transform: rotate(180deg); }
.dg-edge-fade.bottom { bottom: 0; }

.dg-viewer {
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--dg-viewer-pad);
}

.dg-scrim {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: rgba(1, 7, 15, .58);
  pointer-events: none;
  opacity: 0;
  transition: opacity 300ms ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.dg-root[data-enlarging="true"] .dg-scrim {
  opacity: 1;
  pointer-events: auto;
}

.dg-enlarge {
  position: absolute;
  z-index: 30;
  overflow: hidden;
  border: 1px solid rgba(151, 199, 255, .32);
  border-radius: var(--dg-enlarge-radius, 24px);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .12);
  pointer-events: none;
  transform-origin: top left;
  will-change: left, top, width, height, opacity;
}

body.light-theme .dg-root { --dg-surface: #e8f1f8; }
body.light-theme .dg-image { border-color: rgba(2, 132, 199, .22); }
body.light-theme .dg-overlay { background-image: radial-gradient(rgba(232, 241, 248, 0) 61%, var(--dg-surface) 100%); }
body.light-theme .dg-scrim { background: rgba(25, 48, 69, .42); }

@media (prefers-reduced-motion: reduce) {
  .dg-sphere { will-change: auto; }
  .dg-item,
  .dg-image,
  .dg-scrim,
  .dg-enlarge { transition-duration: 0ms !important; }
}
