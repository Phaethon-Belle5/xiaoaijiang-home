  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    z-index:80;opacity:0;visibility:hidden;pointer-events:none;transition:.25s;
    display:flex;align-items:center;gap:12px;
    background:rgba(20,28,38,.96);color:#fff;padding:11px 12px 11px 16px;border-radius:var(--radius-sm);
    border:1px solid rgba(125,211,252,.16);font-size:13px;box-shadow:var(--shadow);
    width:max-content;max-width:min(520px,calc(100vw - 28px));text-align:left;
  }
  .toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);}
  .toast.error{background:rgba(69,18,24,.98);border-color:rgba(252,165,165,.28);}
  .toast-copy{display:grid;gap:3px;min-width:0;line-height:1.45;}
  .toast-title{font-size:13px;font-weight:800;color:#f8fafc;}
  .toast-message{font-size:12px;color:#cbd5e1;overflow-wrap:anywhere;}
  .toast.error .toast-message{color:#fecaca;}
  .toast-action,.toast-close{
    flex:0 0 auto;border:1px solid rgba(125,211,252,.28);background:rgba(56,189,248,.11);
    color:#e0f7ff;cursor:pointer;font:700 12px/1 inherit;transition:background .2s ease,transform .2s ease;
  }
  .toast-action{min-height:34px;padding:0 13px;border-radius:var(--radius-pill);white-space:nowrap;}
  .toast-close{width:30px;height:30px;padding:0;border-radius:var(--radius-xs);font-size:18px;}
  .toast-action:hover,.toast-close:hover{background:rgba(56,189,248,.2);}
  .toast-action:active,.toast-close:active{transform:scale(.98);}
  .toast-action:focus-visible,.toast-close:focus-visible{outline:2px solid var(--accent-l);outline-offset:2px;}
  @media(max-width:640px){
    .toast{bottom:16px;align-items:stretch;flex-wrap:wrap;}
    .toast-copy{flex:1 1 calc(100% - 42px);}
    .toast-action{order:3;flex:1 1 100%;}
    .toast-close{margin-left:auto;}
  }

  /* 账号与云端同步 */
  .auth-overlay{
    position:fixed;inset:0;z-index:var(--z-top);display:none;place-items:center;padding:20px;
    background:rgba(0,0,0,.76);backdrop-filter:blur(18px) saturate(120%);
    -webkit-backdrop-filter:blur(18px) saturate(120%);
  }
  .auth-overlay.show{display:grid;}
  .auth-panel{
    width:min(430px,100%);border:1px solid rgba(125,211,252,.22);border-radius:var(--radius);
    background:linear-gradient(145deg,rgba(12,19,28,.98),rgba(5,8,12,.98));
    box-shadow:0 28px 90px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.07);
    max-height:calc(100dvh - 40px);overflow-x:hidden;overflow-y:auto;
  }
  .auth-panel-head{padding:28px 28px 18px;position:relative;}
  .auth-kicker{margin:0 0 8px;color:var(--accent-l);font:700 11px/1.2 'Inter',sans-serif;letter-spacing:1.6px;text-transform:uppercase;}
  .auth-title{margin:0;color:var(--ink);font:750 25px/1.2 'Inter',sans-serif;letter-spacing:-.5px;}
  .auth-desc{margin:10px 0 0;color:#a8b6c7;font-size:13px;line-height:1.65;}
  .auth-close{position:absolute;right:16px;top:16px;width:34px;height:34px;border:0;border-radius:var(--radius-xs);background:rgba(255,255,255,.06);color:#cbd5e1;font-size:22px;cursor:pointer;}
  .auth-close:hover{background:rgba(255,255,255,.1);color:#fff;}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;margin:0 28px;border-bottom:1px solid rgba(255,255,255,.09);}
  .auth-tab{padding:12px;border:0;border-bottom:2px solid transparent;background:transparent;color:#94a3b8;font:650 13px/1 'Inter',sans-serif;cursor:pointer;}
  .auth-tab.active{border-bottom-color:var(--accent);color:#e0f7ff;}
  .auth-form{display:grid;gap:15px;padding:23px 28px 28px;}
  .auth-field{display:grid;gap:7px;}
  .auth-field label{color:#d7e1ec;font-size:12px;font-weight:650;}
  .auth-field input{
    width:100%;height:44px;border:1px solid rgba(148,163,184,.24);border-radius:var(--radius-sm);
    background:#080d13;color:#f8fafc;padding:0 13px;font:500 14px/1 'Inter',sans-serif;outline:none;
  }
  .auth-field input::placeholder{color:#718096;}
  .auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.12);}
  .auth-submit{height:44px;border:0;border-radius:var(--radius-pill);background:linear-gradient(135deg,var(--accent-l),var(--accent));color:#03131d;font-weight:800;cursor:pointer;}
  .auth-submit:hover{filter:brightness(1.06);}
  .auth-submit:active{transform:scale(.98);}
  .auth-submit:disabled{cursor:wait;opacity:.62;}
  .auth-link{justify-self:center;border:0;background:transparent;color:var(--accent-l);font-size:12px;cursor:pointer;padding:2px 8px;}
  .auth-message{display:none;margin:0;padding:10px 12px;border-radius:var(--radius-sm);font-size:12px;line-height:1.55;background:rgba(56,189,248,.09);color:#bae6fd;}
  .auth-message.show{display:block;}
  .auth-message.error{background:rgba(239,68,68,.1);color:#fecaca;}
  .auth-local-option{display:grid;gap:9px;padding-top:3px;border-top:1px solid rgba(255,255,255,.08);}
  .auth-local-btn{
    height:44px;border:1px solid rgba(125,211,252,.26);border-radius:var(--radius-pill);
    background:rgba(56,189,248,.06);color:#dbeafe;font-weight:750;cursor:pointer;
  }
  .auth-local-btn:hover{border-color:rgba(125,211,252,.5);background:rgba(56,189,248,.11);}
  .auth-local-btn:focus-visible{outline:2px solid var(--accent-l);outline-offset:2px;}
  .auth-local-note{margin:0;color:#7f8da0;font-size:11px;line-height:1.55;text-align:center;}
  .account-panel{padding:25px 28px 28px;display:grid;gap:18px;}
  .account-email{font-size:15px;color:#f8fafc;overflow-wrap:anywhere;}
  .account-note{color:#94a3b8;font-size:12px;line-height:1.65;}
  .account-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .account-action{height:42px;border-radius:var(--radius-pill);border:1px solid rgba(148,163,184,.25);background:rgba(255,255,255,.04);color:#dbeafe;font-weight:700;cursor:pointer;}
  .account-action.primary{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.12);color:#e0f7ff;}
  .account-action.signout{grid-column:1/-1;}
  .account-action:hover{background:rgba(255,255,255,.08);}
  .account-action:disabled{cursor:wait;opacity:.58;}
  .account-password-form{display:grid;gap:14px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);}
  .account-password-form[hidden]{display:none;}
  .account-password-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .account-sync-status{
    display:flex;align-items:center;gap:9px;min-height:38px;margin:0;padding:9px 12px;
    border:1px solid rgba(56,189,248,.2);border-radius:var(--radius-sm);
    background:rgba(56,189,248,.07);color:#bae6fd;font-size:12px;line-height:1.5;
  }
  .account-sync-status[hidden]{display:none;}
  .account-sync-status::before{
    content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(56,189,248,.12),0 0 12px rgba(56,189,248,.45);
  }
  .account-sync-status.syncing::before{animation:accountSyncPulse 1.15s ease-in-out infinite;}
  .account-sync-status.partial{border-color:rgba(251,191,36,.28);background:rgba(245,158,11,.09);color:#fde68a;}
  .account-sync-status.partial::before{background:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.12);}
  .account-sync-status.error{border-color:rgba(248,113,113,.25);background:rgba(239,68,68,.09);color:#fecaca;}
  .account-sync-status.error::before{background:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.12);}
  .account-sync-status.ok{border-color:rgba(52,211,153,.28);background:rgba(16,185,129,.09);color:#a7f3d0;}
  .account-sync-status.ok::before{background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.12);}
  .folder-section{display:grid;gap:12px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);}
  .folder-section .account-actions{grid-template-columns:1fr;}
  .media-filter{display:flex;align-items:center;gap:2px;width:max-content;max-width:100%;margin:0 0 12px;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(127,145,166,.09);}
  .media-filter .mf-tab{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;line-height:1;cursor:pointer;transition:color .2s ease,background .2s ease;}
  .media-filter .mf-tab:hover{color:var(--ink);}.media-filter .mf-tab.is-active{background:var(--accent);color:#fff;}.media-filter .mf-tab.is-empty{opacity:.48;}
  .media-filter .mf-tab i{font-style:normal;font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums;}
  .thumb-video .thumb-video-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;width:44px;height:44px;border:2px solid rgba(255,255,255,.84);border-radius:50%;background:rgba(0,0,0,.48);place-items:center;color:#fff;pointer-events:none;}
  .thumb-video .thumb-video-badge svg{margin-left:2px;}.thumb-video .thumb-video-tag{position:absolute;left:6px;bottom:6px;padding:2px 7px;border-radius:999px;background:rgba(56,189,248,.92);color:#04121d;font-size:10px;font-weight:800;pointer-events:none;}
  .video-lightbox{position:fixed;z-index:10020;inset:0;display:none;align-items:center;justify-content:center;padding:90px 80px 150px;background:rgba(15,17,22,.92);backdrop-filter:blur(6px);}
  .video-lightbox.show{display:flex}.video-lightbox video{max-width:min(1100px,100%);max-height:calc(100dvh - 240px);background:#0f1116;border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.6);}
  .video-viewer-toolbar{position:absolute;top:22px;left:28px;right:84px;display:flex;justify-content:space-between;align-items:center;gap:16px;z-index:4;}
  .video-viewer-library,.video-viewer-actions{display:flex;align-items:center;gap:8px;min-width:0;}

  /* 视图切换标签 —— 0.2s 柔和底色过渡 */
  /* ===== 统一切换按钮组选中态样式（全局统一）===== */
  /* 容器：胶囊形底座 */
  .view-tabs{
    display:flex;gap:2px;background:#0f0f0f;border-radius:10px;padding:3px;margin-bottom:18px;
  }
  .view-tab{
    flex:0 0 auto;text-align:center;padding:8px 16px;font-size:13px;font-weight:600;
    color:#8a94a3;border-radius:7px;cursor:pointer;border:none;background:transparent;
    /* 统一过渡动画：背景色、文字色、阴影、位移平滑切换 */
    transition:background .3s cubic-bezier(.4,0,.2,1),color .3s cubic-bezier(.4,0,.2,1),
               box-shadow .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1);
  }
  /* ===== 修改点：顶部「城市视图/省份视图」按钮均分容器宽度 ===== */
  /* 仅 #leftPanel 内的按钮组使用 flex:1 平分容器，右侧「列表/全部」保持自适应宽度 */
  #leftPanel .view-tabs .view-tab{
    flex:1 1 0;padding:8px 12px;
  }
  /* 未选中 hover：浅色提升 + 轻微上浮 */
  .view-tab:hover:not(.active){
    color:var(--ink);background:rgba(0,0,0,.6);transform:translateY(-1px);
  }
  /* 选中态：白色实底 + 暖橙文字 + 柔和阴影 + 轻微上浮 */
  .view-tab.active{
    background:#080808;color:var(--accent-d);
    box-shadow:0 2px 8px rgba(31,42,55,.10),0 0 0 1px rgba(232,148,60,.15);
    transform:translateY(-1px);
  }
  .view-tab.active:hover{
    background:#080808;box-shadow:0 4px 12px rgba(31,42,55,.12),0 0 0 1px rgba(232,148,60,.25);
  }
  /* ===== 字体层级标准化：三级文字体系 ===== */
  /* 一级标题（模块标题）：加粗深灰黑 */
  .dash-card .ctitle{
    font-size:13px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:6px;
    line-height:1.4;
  }
  /* ===== Variable Proximity 可变字体效果：Chinese Footprint ===== */
  /* 容器：与原 canvas-text-wrap 保持一致的间距与高度，左对齐与下方统计文字统一 */
  .vp-title-wrap{
    position:relative;margin-bottom:6px;line-height:1.4;height:44px;
    display:flex;align-items:center;
  }
  /* ===== Variable Proximity 可变字体效果：Chinese Footprint（reactbits variable-proximity）===== */
  /* 容器：主地图面板内标题，水平居中展示，与下方统计文字视觉对齐 */
  .vp-title-wrap{
    position:relative;margin-bottom:6px;line-height:1.4;height:44px;
    display:flex;align-items:center;justify-content:center;
  }
  /* 标题：Playfair Display 艺术衬线可变字体（Fraunces 被禁后的合规替代），青蓝基色，字号 26px */
  /* 颜色与发光由 JS 按 influence 动态设置（鼠标越近越亮越发光），CSS 仅设 transition 保证平滑 */
  /* 【SKILL.md 4.1】Playfair Display 仅有 wght 轴，无 opsz，VP JS 仅驱动 wght */
  .vp-title{
    margin:0;font-size:26px;letter-spacing:.5px;line-height:1.4;
    font-family:'Playfair Display','Figtree','Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",serif;
    font-variation-settings:'wght' 400;font-weight:400;
    color:#38bdf8; /* 基色：青蓝主色（降级，JS 会覆盖） */
    user-select:none;
  }
  /* 词间距：Chinese 与 Footprint 两单词间适当空位（主地图 + 启动页标题通用） */
  .vp-char.vp-space{
    width:0.5em;
  }
  /* 每个字符 span：inline-block 以便 getBoundingClientRect 准确测量中心坐标供 VP 计算 */
  /* 【text-rewind 入场动画】字符从下方滑入回卷，逐字延迟，参考 kokonut text-rewind */
  /* 默认隐藏（opacity:0 + 翻转），等待 .rewind-play 类触发后才播放，确保用户能看见入场画面 */
  .vp-char{
    display:inline-block;
    transition:font-variation-settings .12s ease-out,font-weight .12s ease-out,color .15s ease-out,filter .15s ease-out;
    opacity:0;
    transform:translateY(1em) rotateX(-90deg);
    transform-origin:bottom;
    will-change:font-variation-settings,color,filter;
  }
  /* 启动页大标题字符默认可见（GSAP autoAlpha 处理 .launch-title-wrap 淡入入场，无需 rewind 动画） */
  .launch-title .vp-char{
    opacity:1;
    transform:none;
  }
  /* JS 在页面完全加载后给标题添加 .rewind-play，触发逐字回卷入场 */
  .vp-title.rewind-play .vp-char{
    animation:vpRewindIn .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes vpRewindIn{
    0%{opacity:0;transform:translateY(1em) rotateX(-90deg);}
    55%{opacity:1;transform:translateY(-0.12em) rotateX(15deg);}
    100%{opacity:1;transform:translateY(0) rotateX(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .vp-char{
      opacity:1;transform:none;animation:none;transition:none;
    }
  }
  /* 二级内容（景点名、年月、统计数字）：常规字重中度灰 */
  .dash-card .csub{font-size:15px;color:var(--ink);font-weight:400;line-height:1.7;margin-bottom:18px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .dash-card .csub b{color:var(--accent-d);font-size:18px;font-weight:800;}
  /* 进度条 —— 圆角两端，低饱和暖橙填充，浅米背景 */
  .prog-row{margin-bottom:16px;}
  .prog-row:last-child{margin-bottom:0;}
  .prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  /* 三级辅助文字（景点数量、标签）：浅灰小字 */
  .prog-head .label{font-size:14px;color:var(--muted);font-weight:500;}
  .prog-head .val{font-size:14px;color:var(--muted);font-weight:600;}
  .prog-head .val b{color:var(--blue-d);font-size:16px;font-weight:800;}
  .prog-bar{height:10px;border-radius:var(--radius-bar);background:#161616;overflow:hidden;}
  .trip-row{margin-bottom:2px;}
  .prog-fill{height:100%;border-radius:var(--radius-bar);transition:width .6s cubic-bezier(.2,.8,.3,1);}
  .prog-fill.blue{background:linear-gradient(90deg,#7dd3fc,var(--blue-d));}
  .prog-fill.gold{background:linear-gradient(90deg,var(--accent-l),var(--accent-d));}
  /* 统计三宫格 —— 加宽间距，放大数字方框 */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}  /* gap 8px→12px, mt 4→6 */
  .stat-cell{
    text-align:center;padding:18px 8px;border-radius:var(--radius-sm);background:#0f0f0f;border:1px solid var(--line);  /* padding 12px 6px→18px 8px, radius 10→12 */
  }
  .stat-cell .num{font-size:30px;font-weight:800;line-height:1.1;}   /* 22px→30px */
  .stat-cell .num.blue{color:var(--blue-d);}
  .stat-cell .num.gold{color:var(--accent-d);}
  .stat-cell .num.gray{color:#8a96a3;}
  .stat-cell .lbl{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.3;}  /* 10.5px→12px, mt 3→5 */
  .stat-cell .pct{font-size:28px;font-weight:800;color:var(--accent-d);line-height:1.1;}  /* 20px→28px */

  /* ===== 已点亮城市卡片展示区 —— 列表自适应高度，不设独立max-height ===== */
  .city-cards-list{
    display:flex;flex-direction:column;gap:14px;
    /* 【修复点】增加左右内边距，预留卡片3D摆动安全区域，避免左侧被容器边缘裁切 */
    padding:2px 6px 2px 6px;
  }
  /* ===== 3D 透视城市卡片（对标 aceternity 3d-card-effect）===== */
  /* 卡片外层：白色圆角容器 + 柔和底层阴影，悬浮浮空基底 */
  /* ===== Wobble Card 摆动卡牌效果（全站统一）===== */
  .city-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    /* 【SKILL.md 4.4 SHAPE CONSISTENCY LOCK】原 23px 硬编码改为圆角变量系统 --radius:16px */
    padding:14px 16px;cursor:pointer;position:relative;
    box-shadow:var(--shadow-sm);
    /* 透视容器 + 3D 空间保留：让卡片整体可做立体摆动 */
    perspective:1000px;
    transform-style:preserve-3d;
    /* 【修复点】摆动过渡延长至 .4s，回弹更柔和，避免突兀位移 */
    transition:transform .4s cubic-bezier(.2,.8,.3,1),box-shadow .4s ease,border-color .4s ease;
    will-change:transform;
    /* 【性能优化】隔离卡片内部布局/样式重排范围，hover 摆动不触发整页重排 */
    contain:layout style;
  }
  /* hover：轻微提升阴影 + 边框高亮（摆动由 JS mousemove 驱动）*/
  .city-card{
    overflow:hidden;  /* 【meteors】流星裁剪在卡片内，不溢出 */
  }
  /* ===== 【meteors 流星动态背景】参考 aceternity meteors，仅卡片底层衬底 ===== */
  /* 每张卡片挂载独立流星层，z-index:0 置于图文下层；pointer-events:none 不拦截交互 */
  .meteors-layer{
    position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  /* 卡片内容元素提升至流星层之上，确保图文、星级、标签清晰可见 */
  .city-card>.city-card-head,.city-card>.city-card-thumbs,.city-card>.city-card-tags,
  .grid-card>.fs-hero,.grid-card>.grid-card-body{
    position:relative;z-index:1;
  }
  .meteors-layer .meteor{
    position:absolute;top:0;left:50%;
    width:2px;height:2px;  /* 【修复】1px→2px 增大可见性，适配深色背景 */
    background:linear-gradient(to bottom,rgba(186,230,253,0),rgba(186,230,253,.85));
    border-radius:9999px;
    /* 流星尾迹：增强光尾亮度，保证深黑底板可见 */
    box-shadow:0 0 0 1px rgba(186,230,253,.15),0 0 16px 6px rgba(56,189,248,.35),0 0 24px 8px rgba(56,189,248,.15);
    transform:rotate(215deg);
    animation:meteorFall var(--meteor-dur,3s) linear infinite;
    animation-delay:var(--meteor-delay,0s);
    opacity:0;
  }
  @keyframes meteorFall{
    0%{transform:rotate(215deg) translateX(0);opacity:0;}
    10%{opacity:1;}
    70%{opacity:.9;}
    100%{transform:rotate(215deg) translateX(var(--meteor-dist,160px));opacity:0;}
  }
  .city-card:hover{
    box-shadow:var(--shadow-hover);
    /* 【SKILL.md 4.2 COLOR CONSISTENCY LOCK】原 rgba(232,148,60,.4) 橙色违反单一 accent 规范，改为青蓝家族 */
    border-color:rgba(125,211,252,.45);
  }
  /* ===== Border Glow 边缘光辉效果（参考 reactbits border-glow）=====
     参数：edgeSensitivity=34, glowIntensity=1.3, borderRadius=23, animated=true
     颜色适配页面橙蓝渐变（呼应 Chinese Footprint），卡片背景维持浅色以保持页面统一 */
  @property --bglow-angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
  /* 边缘光辉层：跟随鼠标的径向渐变，mask 成边缘 ring */
  .city-card-bglow{
    position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;z-index:0;
    opacity:var(--bglow-a,0);
    transition:opacity .18s ease;
    background:radial-gradient(150px circle at var(--bgx,50%) var(--bgy,50%),
      rgba(56,189,248,1),rgba(14,165,233,.85) 28%,rgba(125,211,252,.6) 52%,transparent 72%);
    -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    mask-composite:exclude;
    padding:4px;
  }
  /* 入场扫描动画层（animated=true）：conic 光带绕边缘扫过一圈 */
  .city-card-bglow-intro{
    position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;z-index:0;
    --bglow-angle:0deg;
    background:conic-gradient(from var(--bglow-angle),
      transparent 0deg,rgba(56,189,248,.9) 35deg,rgba(125,211,252,.75) 70deg,transparent 110deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    mask-composite:exclude;
    padding:4px;
    animation:bglow-sweep 1.15s cubic-bezier(.22,.8,.3,1) forwards;
  }
  @keyframes bglow-sweep{
    0%{--bglow-angle:0deg;opacity:0;}
    18%{opacity:1;}
    100%{--bglow-angle:360deg;opacity:0;}
  }
  .city-card-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;
  }
  .city-card-name{font-size:16px;font-weight:800;color:var(--ink);text-shadow:0 0 8px rgba(248,250,252,.25);}  /* 【提亮】城市卡片名称发光 */
  .city-card-date{font-size:13.5px;color:var(--muted);white-space:nowrap;font-weight:500;}
  /* ===== 卡片缩略图容器：3D 漂浮透视效果核心区域 ===== */
  /* preserve-3d 让子元素在 3D 空间中变换；悬浮时整体倾斜漂浮 */
  .city-card-thumbs{
    display:flex;gap:6px;margin-bottom:12px;
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
  }
  .city-card-thumb{
    position:relative;width:54px;height:54px;border-radius:8px;overflow:hidden;
    background:#080808;border:1px solid var(--line-2);flex:0 0 auto;
    /* 每张缩略图独立 3D 浮空：translateZ 让图片向观察者方向浮起 */
    transform:translateZ(0px);
    transition:transform .4s cubic-bezier(.2,.8,.3,1),box-shadow .4s ease;
  }
  /* ===== 修复：单张缩略图独立悬浮（不再整卡联动）===== */
  /* hover 绑定到单张 .city-card-thumb 本身，而非 .city-card:hover */
  .city-card-thumb:hover{
    transform:perspective(600px) rotateX(-6deg) rotateY(6deg) translateZ(30px) scale(1.06);
    box-shadow:0 12px 30px rgba(0,0,0,.18);
  }
  /* +N 更多照片：去除方框，仅保留文字样式 */
  .city-card-thumb-more{
    transform:translateZ(0px);
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
  }
  .city-card-thumb-more:hover{
    transform:translateZ(25px) scale(1.05);
  }
  .city-card-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .city-card-thumb-more{
    width:auto;height:54px;min-width:28px;
    background:transparent;color:var(--muted);
    font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    border:none;border-radius:0;padding:0 0 0 4px;
    transform:translateZ(0px);
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
    cursor:pointer;
  }
  .city-card-thumb-more:hover{color:var(--accent-d);}
  /* 标签行：不参与 3D 变换，保持清晰可读 */
  .city-card-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .city-card-tags:empty{display:none;}
  /* 空态提示 */
  .city-cards-empty{
    text-align:center;font-size:14px;color:var(--muted);line-height:1.7;
    padding:28px 10px;border:1px dashed var(--line);border-radius:var(--radius-sm);background:rgba(255,255,255,.5);
  }
  /* 胶囊标签 —— 低饱和暖橙底色，圆角放大 */
  .tag-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 12px;border-radius:14px;font-size:12.5px;font-weight:600;line-height:1.5;
    max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:transform .2s ease;
  }
  .tag-pill:hover{transform:scale(1.05);}
  .tag-pill.scenic{background:rgba(46,125,50,.1);color:#2e7d32;}
  .tag-pill.food{background:rgba(232,148,60,.12);color:var(--accent-d);}
  .tag-pill.other{background:rgba(61,127,184,.1);color:var(--blue-d);}
  /* 年月选择器行 */
  /* 【弹窗尺寸放大】年月行水平 18→22px，垂直 10→11px，与各模块统一 */
  .month-picker{
    display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;
    padding:11px 22px;border-bottom:1px solid var(--line);background:#080808;flex:0 0 auto;
  }
  .month-picker>label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;padding-top:7px;}
  .month-entries{display:flex;flex:1 1 280px;min-width:220px;flex-direction:column;gap:7px;}
  .month-entry{display:flex;align-items:center;gap:7px;min-width:0;}
  .month-entry-index{width:42px;flex:0 0 42px;font-size:11px;color:var(--muted);text-align:right;}
  .month-picker input[type=month]{
    width:150px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;color:var(--ink);background:#080808;
  }
  .month-picker .btn{padding:6px 12px;font-size:12px;}
  .month-remove-btn{
    width:28px;height:28px;padding:0;border:1px solid rgba(248,113,113,.25);border-radius:7px;
    background:rgba(127,29,29,.14);color:#fca5a5;font-size:16px;line-height:1;cursor:pointer;
  }
  .month-remove-btn:hover{border-color:rgba(248,113,113,.55);background:rgba(127,29,29,.24);}
  .month-add-btn{color:var(--accent-d);border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.08);}
  .att-info-value.is-multi-month{font-size:14px;line-height:1.45;text-align:center;}
  /* 标签管理区 —— 放大间距与字号 */
  /* 【弹窗尺寸放大】标签区上间距 16→18px，与景点区一致，三个模块分隔均匀 */
  .tag-section{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);}
  /* ===== 弹窗分区标题统一样式（照片管理/标签管理/景点管理 三标题字号、字重、颜色、对齐完全一致）===== */
  .section-title{
    font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px;
    margin:12px 0 8px 0;
  }
  /* 兼容旧的 .ts-title（保留，避免其他地方引用断掉） */
  .tag-section .ts-title{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin:12px 0 8px 0;}
  .tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:26px;}
  .tag-list:empty::after{content:'还没有添加标签';font-size:13px;color:#aab3bf;}

  /* ===== 弹窗标签管理区 3D 漂浮透视效果（复用城市卡片同款动画）===== */
  /* 仅作用于弹窗内 .tag-section .tag-list 中的标签，不影响卡片标签 */
  .tag-section .tag-list{
    /* 透视容器：给内部标签提供 3D 空间 */
    perspective:600px;
  }
  .tag-section .tag-list .tag-pill{
    /* preserve-3d 让标签在 3D 空间中变换；覆盖原有 transition 增加倾斜过渡 */
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s ease;
    will-change:transform;
  }
  /* 悬浮时标签向观察者方向浮起 + 柔和阴影加深 */
  .tag-section .tag-list .tag-pill:hover{
    transform:translateZ(20px) scale(1.05);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
  }
  /* 标签文字和删除叉号保持水平不扭曲：强制 flatten 子元素 */
  .tag-section .tag-list .tag-pill > *{
    transform:translateZ(0px);
  }
  .tag-pill .tag-del{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.10);  /* 14px→16px */
    font-size:12px;line-height:1;cursor:pointer;border:none;color:inherit;padding:0;flex:0 0 auto;  /* 11px→12px */
  }
  .tag-pill .tag-del:hover{background:rgba(0,0,0,.22);}
  .tag-add-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  /* 【弹窗尺寸缩小】标签输入框缩小 */
  /* 【Bug修复】输入框加深色背景，白字深底可读（原无 background 导致白字白底看不见） */
  .tag-add-row input[type=text]{
    flex:1 1 120px;min-width:0;border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;font-size:13px;color:var(--ink);background:#080808;
  }
  .tag-add-row input[type=text]::placeholder{color:#6b7280;}
  .tag-add-row select{
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;color:var(--ink);background:#080808;
  }
  .tag-add-row .btn{padding:6px 12px;font-size:12px;background:#080808;color:var(--blue-d);}

  /* ===== 弯曲时间曲线时间轴样式 ===== */
  /* 迷你时间轴容器（右侧面板内） */
  .mini-timeline{
    width:100%;position:relative;cursor:pointer;
  }
  .mini-timeline svg{width:100%;height:100%;display:block;overflow:visible;position:relative;z-index:1;}
  /* ===== 预览态：点阵背景由 Originkit Globe 点阵地球取代（常驻显示，悬停旋转）===== */
  /* 预览态：SVG 内容层置于 canvas 之上（默认隐藏，点击后显示）*/
  .mini-timeline.tl-preview svg{position:relative;z-index:1;pointer-events:none;}
  /* 预览态：隐藏全部轨迹内容——所有圆点、文字、连线，仅显示 dot-grid 网格背景 */
  .mini-timeline.tl-preview .tl-dot{opacity:0 !important;}
  .mini-timeline.tl-preview .tl-label,
  .mini-timeline.tl-preview .tl-date,
  .mini-timeline.tl-preview .tl-date-bg{opacity:0 !important;}
  .mini-timeline.tl-preview .tl-seg{opacity:0 !important;}
  .mini-timeline.tl-preview .tl-walker{opacity:0 !important;}
  /* ===== Originkit Globe 点阵地球（基于 cobe ~5KB WebGL，预览态常驻显示）===== */
  /* 替换原 reactbits dot-field：预览态始终显示，鼠标悬停轨迹区域时才自转 */
  .tl-globe-wrap{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    pointer-events:none;z-index:0;opacity:0;
    transition:opacity .5s ease;
  }
  .tl-globe-wrap.globe-on{opacity:1;pointer-events:auto;z-index:2;}
  .tl-globe-canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none;border-radius:50%;user-select:none;-webkit-user-select:none;}
  .tl-globe-canvas.globe-grabbing{cursor:grabbing;}
  /* ===== soft-aurora 柔和极光动态背景（参考 reactbits soft-aurora）===== */
  /* 始终存在于轨迹画布底层，z-index 在 dot-grid(::before) 之上、SVG 内容(z-index:1) 之下 */
  /* 【修改】去除极光图层静态光斑光源：移除径向渐变背景，仅保留图层结构与动画代码 */
  /* 画布仅剩纯黑底色 + dot-grid 点阵网格，无任何渐变明暗、光斑、发光图层 */
  .mini-timeline::after{
    content:'';position:absolute;inset:0;
    pointer-events:none;z-index:0;
    background:none;  /* 【修改】清除径向渐变光斑光源 */
    opacity:0;        /* 【修改】图层不可见，仅保留结构与动画代码 */
    transition:opacity .6s ease;
    filter:blur(8px);
    animation:auroraDrift 14s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift{
    0%{background-position:0% 0%, 0% 0%, 0% 0%;}
    50%{background-position:3% -2%, -2% 3%, 2% -1%;}
    100%{background-position:-2% 3%, 3% -2%, -3% 2%;}
  }
  /* 时间轴空态 */
  .timeline-empty{
    text-align:center;font-size:14px;color:var(--muted);line-height:1.7;
    padding:32px 10px;border:1px dashed var(--line);border-radius:12px;background:#080808;
  }
  /* 曲线节点：hover 上浮 + 淡橙底色浮层 */
  .tl-node{cursor:pointer;transition:all .25s ease;}
  .tl-node:hover .tl-dot{r:7;filter:drop-shadow(0 3px 8px rgba(232,148,60,.55));}
  .tl-node:hover .tl-label{font-weight:800;}
  .tl-node:hover .tl-date-bg{fill:rgba(232,148,60,.12);}
  .tl-dot{transition:all .25s ease;}
  /* 城市圆点初始隐藏（除第一个起点外），光带抵达后淡入显示 */
  .tl-dot.tl-dot-hidden{opacity:0;}
  .tl-dot.tl-dot-show{opacity:1;}
  .tl-label{font-size:12px;font-weight:600;fill:var(--ink);pointer-events:none;transition:all .2s;}
  .tl-date{font-size:10px;font-weight:600;fill:var(--accent-d);pointer-events:none;}
  .tl-date-bg{fill:rgba(232,148,60,.08);transition:fill .25s ease;}
  /* 曲线线条：细渐变柔和曲线 —— 初始完全隐藏，点击后逐段显示 */
  .tl-curve{fill:none;stroke:#38bdf8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  /* 单段生长路径：逐段绘制使用，初始隐藏 */
  .tl-seg{fill:none;stroke:#38bdf8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  /* 暖橙渐变光带：跟随线段前端移动，初始隐藏 */
  .tl-walker{opacity:0;transition:opacity .15s;}
  .tl-walker.tl-walker-show{opacity:1;}
  /* 光带抵达城市节点时的闪烁高亮 */
  @keyframes tlFlash{
    0%,100%{opacity:1;}
    50%{opacity:0.4;transform:scale(1.8);}
  }
  .tl-walker.tl-flashing .tl-walker-head{animation:tlFlash .3s ease-in-out 2;transform-box:fill-box;transform-origin:center;}

  /* ===== 哆啦A梦行进卡通人物样式（命名空间 .a_meng 隔离，防全局冲突）===== */
  /* 飞行上下弹跳动画，行进时通过 .tl-walking 状态触发 */
  @keyframes flyBounce{0%{transform:translateY(-4px);}100%{transform:translateY(4px);}}
  /* 尾巴摆动动画，全程播放 */
  @keyframes tail_running{0%{transform:rotate(5deg);}100%{transform:rotate(10deg);}}
  /* 竹蜻蜓持续旋转动画，全程播放 */
  @keyframes rotating{0%{transform:rotateX(-66deg) rotateZ(0deg);}100%{transform:rotateX(-66deg) rotateZ(360deg);}}
  /* 行进中：哆啦A梦上下弹跳模拟飞行 */
  .tl-walker.tl-walking .a_meng{animation:flyBounce .5s ease-in-out infinite alternate;}
  /* 抵达城市：停止弹跳，原地静置 */
  .tl-walker.tl-arrived .a_meng{animation:none;}
  /* 拖尾光轨：渐变暖橙发光 */
  .tl-walker-tail{filter:blur(1px);}
  /* ===== Bug2修复：层级控制，哆啦A梦置顶不被光影遮挡 ===== */
  /* 哆啦A梦容器强制提升层叠上下文，渲染在光晕/拖尾/星光/脉冲之上 */
  .tl-walker-char{isolation:isolate;position:relative;z-index:999;}
  /* 发光光晕降低层级，避免覆盖哆啦A梦（缩小脉动幅度+降透明度）*/
  .tl-walker .tl-walker-glow{z-index:0;}
  /* 拖尾光轨降低层级 */
  .tl-walker .tl-walker-tail{z-index:0;}

  /* ===== 蛇形动态连线动画样式 ===== */
  /* 动画播放中的单段：dashoffset 从段长→0，逐段生长 */
  .tl-seg.seg-growing{
    opacity:1;
    animation:segGrow var(--seg-dur,800ms) linear forwards;
  }
  @keyframes segGrow{
    from{stroke-dashoffset:var(--seg-len,200);}
    to{stroke-dashoffset:0;}
  }
  /* 动画完成后：已绘制的段保持显示 */
  .tl-seg.seg-done{opacity:1;stroke-dasharray:none;stroke-dashoffset:0;}
  /* 流光渐变定义在 JS 中动态注入 */
  /* 节点高亮发光：连线途经时触发 */
  .tl-dot.tl-active{
    r:8;filter:drop-shadow(0 0 10px rgba(232,148,60,.8)) drop-shadow(0 0 4px rgba(255,200,100,.9));
    transition:r .2s ease,filter .2s ease;
  }
  .tl-label.tl-active{font-weight:800;fill:var(--accent-d);transition:fill .2s,font-weight .2s;}
  /* 动画完成提示 */
  .tl-anim-hint{
    position:absolute;top:8px;right:12px;font-size:11px;font-weight:600;
    color:var(--accent);background:rgba(8,8,8,.9);padding:4px 12px;
    border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);
    pointer-events:none;opacity:0;transition:opacity .4s;
    z-index:5;
  }
  .tl-anim-hint.show{opacity:1;}

  /* ===== 城市文字淡入浮现动画（向上位移+透明度渐变） ===== */
  /* 初始状态：文字完全隐藏，向下偏移 6px */
  .tl-label, .tl-date, .tl-date-bg{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;}
  /* 淡入显示：光带抵达城市后添加 .tl-text-show 类触发 */
  .tl-label.tl-text-show, .tl-date.tl-text-show, .tl-date-bg.tl-text-show{opacity:1;transform:translateY(0);}

  /* ===== 【标题优化】「我的旅行轨迹」标题：居中 + 加粗 + shiny-text 流动扫光（参考 reactbits shiny-text）===== */
  /* 仅作用于 #tlSectionTitle，不影响其他 .csub 元素；保留原 margin-bottom 与下方按钮间距 */
  /* 【对齐按钮】扫光速度 3.5s、文字主色 #38bdf8 与「点击展示旅行轨迹」按钮一致 */
  #tlSectionTitle{
    text-align:center;            /* 水平居中，取消原有左对齐 */
    font-size:17px;               /* 适度微调字号提升层级，不挤压下方按钮 */
    font-weight:800;              /* 粗体加厚，提升厚重醒目感 */
    color:#b5b5b5;                /* 字体颜色（浅灰） */
    background:linear-gradient(110deg,#b5b5b5 0%,#b5b5b5 30%,#e0f7ff 48%,#ffffff 50%,#e0f7ff 52%,#b5b5b5 70%,#b5b5b5 100%);
    background-size:250% 100%;    /* 背景加宽，为横向滚动扫光留出位移空间 */
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent; /* 文字镂空显示流动渐变高光 */
    animation:tlShinySweep 3.5s linear infinite; /* 扫光速度与按钮镜面扫描 3.5s 一致 */
  }
  @keyframes tlShinySweep{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  /* ===== 双功能按钮样式（specular-button 镜面玻璃质感，参考 reactbits specular-button）===== */
  /* 仅替换视觉样式，尺寸/间距/字号/字重/位置完全保留原值 */
  .tl-btn-row{display:flex;gap:10px;margin-bottom:14px;}
  .tl-btn{
    flex:1;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700;
    cursor:pointer;text-align:center;
    white-space:nowrap;
    /* 镜面玻璃基底：半透深色玻璃 + 背景模糊，适配黑色科技深色主题，不遮挡下方极光/点阵 */
    position:relative;overflow:hidden;
    background:rgba(8,8,8,0.55);
    backdrop-filter:blur(8px) saturate(140%);
    -webkit-backdrop-filter:blur(8px) saturate(140%);
    color:#38bdf8;  /* 【需求4】两者字体颜色统一为按钮1的青蓝色 */
    border:none;
    transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s ease,border-color .25s ease,opacity .25s ease;
    will-change:transform;
  }
  /* 内发光层：底部青蓝辉光，营造玻璃内透感 */
  .tl-btn::before{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(120% 80% at 50% 120%, rgba(56,189,248,0.20), transparent 60%);
    opacity:.6;pointer-events:none;transition:opacity .3s ease;
  }
  /* 顶部流动高光镜面扫描条（specular 核心视觉） */
  .tl-btn::after{
    content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;
    background:linear-gradient(105deg, transparent 0%, rgba(186,230,253,0) 35%, rgba(186,230,253,0.35) 50%, rgba(186,230,253,0) 65%, transparent 100%);
    transform:skewX(-18deg);pointer-events:none;
    animation:tlSpecSweep 5.5s ease-in-out infinite;
  }
  @keyframes tlSpecSweep{
    0%{left:-60%;}
    55%{left:120%;}
    100%{left:120%;}
  }
  /* 原生 hover/active 按压微缩放 */
  .tl-btn:hover{transform:translateY(-1px) scale(1.015);box-shadow:0 6px 18px rgba(56,189,248,.30);}
  .tl-btn:hover::before{opacity:1;}
  .tl-btn:active{transform:translateY(0) scale(0.985);}
  .tl-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .tl-btn:disabled::after{animation:none;}

  /* 按钮1（激活选中）：镜面高光增强 + 品牌青蓝高亮边框 */
  .tl-btn-primary{
    border:1.5px solid rgba(56,189,248,.7);
    box-shadow:0 3px 12px rgba(56,189,248,.25), inset 0 0 12px rgba(56,189,248,.12);
  }
  .tl-btn-primary::after{animation-duration:3.5s;background:linear-gradient(105deg, transparent 0%, rgba(186,230,253,0) 30%, rgba(186,230,253,0.5) 50%, rgba(186,230,253,0) 70%, transparent 100%);}
  .tl-btn-primary:hover{box-shadow:0 6px 20px rgba(56,189,248,.4), inset 0 0 14px rgba(56,189,248,.18);border-color:rgba(56,189,248,.95);}
  /* 按钮2：与按钮1边框、文字、颜色、背景、阴影、镜面完全一致 */
  .tl-btn-secondary{
    border:1.5px solid rgba(56,189,248,.7);
    box-shadow:0 3px 12px rgba(56,189,248,.25), inset 0 0 12px rgba(56,189,248,.12);
  }
  .tl-btn-secondary::after{animation-duration:3.5s;background:linear-gradient(105deg, transparent 0%, rgba(186,230,253,0) 30%, rgba(186,230,253,0.5) 50%, rgba(186,230,253,0) 70%, transparent 100%);}
  .tl-btn-secondary:hover{box-shadow:0 6px 20px rgba(56,189,248,.4), inset 0 0 14px rgba(56,189,248,.18);border-color:rgba(56,189,248,.95);}

  /* ===== 时间轴全屏弹窗 ===== */
  .timeline-modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);
    display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .timeline-modal-overlay.show{display:flex;animation:tlFadeIn .25s ease;}
  @keyframes tlFadeIn{from{opacity:0;}to{opacity:1;}}
  .timeline-modal{
    width:92vw;max-width:1200px;height:88vh;max-height:800px;
    background:#080808;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
    display:flex;flex-direction:column;overflow:hidden;
    animation:tlScaleIn .3s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes tlScaleIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .timeline-modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 28px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .timeline-modal-head h2{font-size:20px;font-weight:800;color:var(--ink);margin:0;}
  .timeline-modal-head .tl-close{
    width:36px;height:36px;border-radius:50%;border:none;background:#0f0f0f;
    font-size:18px;cursor:pointer;color:var(--muted);transition:.18s;
    display:grid;place-items:center;
  }
  .timeline-modal-head .tl-close:hover{background:#1a1a1a;color:var(--ink);transform:rotate(90deg);}
  .timeline-modal-body{
    flex:1;overflow:auto;padding:30px 40px;position:relative;
  }
  .timeline-modal-body svg{width:100%;height:auto;display:block;overflow:visible;min-height:100%;position:relative;z-index:1;}
  /* ===== 新增：light-rays 光束动态交互背景（参考 reactbits light-rays）===== */
  /* 仅作用于全览弹窗内容区底层，z-index 在 SVG 时间轴之下 */
  .timeline-modal-body::before{
    content:'';position:absolute;inset:0;
    pointer-events:none;z-index:0;
    background:
      conic-gradient(from var(--rays-angle,0deg) at var(--rays-cx,50%) var(--rays-cy,-10%),
        transparent 0deg,
        rgba(56,189,248,0.06) 8deg,
        transparent 16deg,
        rgba(14,165,233,0.05) 24deg,
        transparent 32deg,
        rgba(125,211,252,0.07) 40deg,
        transparent 48deg,
        rgba(56,189,248,0.04) 56deg,
        transparent 64deg,
        rgba(14,165,233,0.06) 72deg,
        transparent 80deg,
        rgba(125,211,252,0.05) 88deg,
        transparent 96deg,
        rgba(56,189,248,0.07) 104deg,
        transparent 112deg,
        rgba(14,165,233,0.04) 120deg,
        transparent 128deg,
        rgba(125,211,252,0.06) 136deg,
        transparent 144deg,
        rgba(56,189,248,0.05) 152deg,
        transparent 160deg,
        rgba(14,165,233,0.07) 168deg,
        transparent 180deg);
    opacity:0.8;
    filter:blur(2px);
    animation:raysSweep 18s linear infinite;
    transition:--rays-cx .5s ease-out, --rays-cy .5s ease-out;  /* 鼠标移出时缓慢回弹 */
  }
  @keyframes raysSweep{
    from{--rays-angle:0deg;}
    to{--rays-angle:360deg;}
  }
  /* 注册 --rays-angle 为可动画属性 */
  @property --rays-angle{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }
  /* 注册 --rays-cx/--rays-cy 为可过渡属性，鼠标交互时平滑跟随 */
  @property --rays-cx{
    syntax:'<percentage>';
    inherits:false;
    initial-value:50%;
  }
  @property --rays-cy{
    syntax:'<percentage>';
    inherits:false;
    initial-value:-10%;
  }
  /* 大图弹窗中的节点样式 —— hover 上浮 + 淡橙浮层 */
  .tl-modal-node{cursor:pointer;transition:all .25s ease;}
  .tl-modal-node:hover .tl-modal-dot{r:10;filter:drop-shadow(0 3px 10px rgba(232,148,60,.5));}
  .tl-modal-dot{transition:all .25s ease;}
  .tl-modal-label{font-size:16px;font-weight:700;fill:var(--ink);pointer-events:none;}
  .tl-modal-date{font-size:13px;font-weight:600;fill:var(--accent-d);pointer-events:none;}
  .tl-modal-date-bg{fill:rgba(232,148,60,.08);transition:fill .25s ease;}
  .tl-modal-node:hover .tl-modal-date-bg{fill:rgba(232,148,60,.14);}
  /* 弹窗曲线：细渐变柔和曲线 */
  .tl-modal-curve{fill:none;stroke:url(#tlModalGrad);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  /* 弹窗中封面照片样式 —— 细微阴影区分 */
  .tl-cover{border-radius:10px;overflow:hidden;border:2px solid #fff;
    box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none;}

  /* ===== 固定嵌入照片卡片（摆放在线条两侧，非悬浮弹窗） ===== */
  /* 相纸白边 + 分层柔和阴影，滑入旋转落地动画见下方特效区 */
  .tl-embed-photo{cursor:pointer;}
  .tl-embed-photo .tl-cover{pointer-events:auto;}
  /* ===== 时间轴照片 3D 漂浮效果（SVG 模拟浮空放大）===== */
  /* SVG 内不支持 CSS perspective，用 transform-origin + scale 模拟浮空 */
  .tl-embed-photo .tl-cover,
  .tl-embed-photo rect.tl-embed-bg{
    transition:transform .35s cubic-bezier(.2,.8,.3,1),filter .35s ease;
    transform-box:fill-box;
    transform-origin:center center;
  }
  /* 悬浮时照片放大 + 亮度提升 + 阴影加深，模拟浮空 */
  .tl-embed-photo.tl-embed-show:hover .tl-cover{
    transform:scale(1.12);
    filter:brightness(1.08) drop-shadow(0 6px 14px rgba(0,0,0,.2));
  }
  .tl-embed-photo.tl-embed-show:hover rect.tl-embed-bg{
    transform:scale(1.12);
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.18));
  }
  /* 多图数量标注同步放大，保持相对位置 */
  .tl-embed-photo .tl-embed-count,
  .tl-embed-photo .tl-embed-count-bg{
    transition:transform .35s cubic-bezier(.2,.8,.3,1);
    transform-box:fill-box;
    transform-origin:center center;
  }
  .tl-embed-photo.tl-embed-show:hover .tl-embed-count,
  .tl-embed-photo.tl-embed-show:hover .tl-embed-count-bg{
    transform:scale(1.12);
  }
  /* 照片白色相纸边框 */
  .tl-embed-photo rect.tl-embed-bg{
    fill:#fff;
    stroke:rgba(0,0,0,.06);
    stroke-width:0.5;
    pointer-events:auto;
  }
  /* 多图数量标注（右下角小字） */
  .tl-embed-count{
    font-size:9px;
    fill:#fff;
    font-weight:600;
  }
  .tl-embed-count-bg{
    fill:rgba(0,0,0,.45);
  }
  /* 城市节点高亮发光（光带抵达时） */
  .tl-modal-dot.tl-dot-active{
    r:11;
    filter:drop-shadow(0 0 12px rgba(232,148,60,.8)) drop-shadow(0 0 6px rgba(255,176,96,.6));
    transition:all .2s ease;
  }

  /* ===== 多层流光特效 CSS ===== */
  /* 流光光带外层发光光晕（包裹主光带的扩散光环） */
  .tl-walker .tl-walker-glow{
    animation:tlGlowPulse 1.2s ease-in-out infinite;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes tlGlowPulse{
    0%,100%{opacity:0.25;transform:scale(1);}
    50%{opacity:0.4;transform:scale(1.2);}
  }
  /* 光带内部循环流动明暗条纹（持续滚动质感） */
  .tl-walker .tl-walker-stripe{
    animation:tlStripeFlow 0.8s linear infinite;
  }
  @keyframes tlStripeFlow{
    from{opacity:0.4;}to{opacity:0.9;}
  }
  /* 星光粒子：细碎闪烁，落地后缓慢衰减淡出 */
  .tl-sparkle{
    animation:tlSparkleLife 1.5s ease-out forwards;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes tlSparkleLife{
    0%{opacity:0;transform:scale(0) rotate(0deg);}
    20%{opacity:1;transform:scale(1) rotate(45deg);}
    100%{opacity:0;transform:scale(0.3) rotate(180deg);}
  }
  /* 环形脉冲光圈：抵达城市时扩散高亮 */
  .tl-pulse-ring{
    animation:tlPulseRing 1s ease-out forwards;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes tlPulseRing{
    0%{opacity:0.8;r:8;stroke-width:3;}
    100%{opacity:0;r:30;stroke-width:0.5;}
  }
  /* 文字组合动画：上浮+渐显+轻微缩放 */
  .tl-modal-label, .tl-modal-date, .tl-modal-date-bg{
    opacity:0;transform:translateY(8px) scale(0.9);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1);
    transform-box:fill-box;transform-origin:center;
  }
  .tl-modal-label.tl-text-show, .tl-modal-date.tl-text-show, .tl-modal-date-bg.tl-text-show{
    opacity:1;transform:translateY(0) scale(1);
  }
  /* 照片滑入旋转堆叠落地动画 */
  .tl-embed-photo{
    opacity:0;
    transform:translateX(30px) rotate(8deg) scale(0.8);
    transform-box:fill-box;transform-origin:center;
    transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.3,1);
  }
  .tl-embed-photo.tl-embed-show{
    opacity:1;transform:translateX(0) rotate(0deg) scale(1);
  }
  /* 全屏弹窗画布：极淡暖橙径向渐变背景 */
  .timeline-modal-body{
    background:radial-gradient(ellipse at 50% 30%,rgba(255,240,220,.4) 0%,rgba(255,250,245,.1) 40%,transparent 70%);
  }
  /* 弹窗线条细微外发光 */
  .tl-modal-curve, .tl-seg{
    filter:drop-shadow(0 0 2px rgba(232,148,60,.25));
  }

  /* ===== 景点详情页（毛玻璃卡片风格） ===== */
  /* 全屏覆盖层：浅渐变底色 + 毛玻璃质感 */
  /* ===== 城市详情页（点击城市卡片后）：虚化封面背景 + 金色标题 + 景点网格 =====
   * 视觉层级：底层虚化封面(z:0) → 中层标题/简介/网格(z:10) → 顶层编辑面板/轮播(z:20) */
  .att-detail-overlay{
    position:fixed;inset:0;z-index:10001;
    display:none;flex-direction:column;
    background:#0a0c10;
    overflow-x:hidden;overflow-y:auto; /* 超过 4 个景点时允许垂直滑动 */
    animation:attFadeIn .4s ease;
  }
  .att-detail-overlay.show{display:flex;}
  @keyframes attFadeIn{from{opacity:0;}to{opacity:1;}}
  /* 底层：虚化城市封面背景图 */
  .att-detail-bg{
    position:fixed;inset:0;z-index:0;
    background-size:cover;background-position:center;
    filter:blur(4px) brightness(.70);
    transform:scale(1.08);
    transition:background-image .4s ease;
  }
  /* 底层暗化遮罩（半透明深色渐变，增强文字可读性，不遮挡封面图） */
  .att-detail-bg::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,10,14,.25) 0%,rgba(8,10,14,.55) 100%);
  }
  /* 中层：内容容器（收紧留白，提升紧凑度） */
  .att-detail-inner{
    position:relative;z-index:10;
    width:100%;max-width:960px;margin:0 auto;
    padding:36px 32px 32px;
    display:flex;flex-direction:column;align-items:center;
    gap:0;
  }
  /* 顶部关闭按钮 */
  .att-detail-close{
    position:fixed;top:24px;right:28px;z-index:30;
    width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
    background:rgba(20,24,30,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:18px;cursor:pointer;color:rgba(255,255,255,.85);
    display:grid;place-items:center;transition:.25s;
  }
  .att-detail-close:hover{background:rgba(255,255,255,.15);color:#fff;transform:rotate(90deg);}
  /* 右上角"编辑城市信息"按钮：位于关闭按钮左侧，同排玻璃拟态风格 */
  .att-detail-edit{
    position:fixed;top:24px;right:84px;z-index:30;
    height:42px;padding:0 18px;border-radius:21px;border:1px solid rgba(255,255,255,.18);
    background:rgba(20,24,30,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:14px;font-weight:600;cursor:pointer;color:rgba(255,255,255,.88);
    display:inline-flex;align-items:center;gap:7px;transition:.25s;
  }
  .att-detail-edit:hover{background:rgba(255,255,255,.15);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  /* 城市主标题：大号衬线字体 + 象牙白暖渐变（柔和高级，贴合深色旅行回忆底色） */
  .att-detail-city-name{
    font-family:'Noto Serif SC','Source Han Serif SC',serif;
    font-size:clamp(40px,7vw,84px);font-weight:700;
    text-align:center;letter-spacing:6px;line-height:1.1;
    background:linear-gradient(180deg,#fefaf0 0%,#f0e6d2 50%,#ddd0b0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(240,230,210,.25);
    margin-bottom:14px;
  }
  /* 城市简介文字（透明展示，适当放大尺寸） */
  .att-detail-desc{
    width:100%;
    padding:0;margin:0;
    background:transparent;border:none;border-radius:0;
    color:#ede4d0;font-size:18px;font-weight:600;line-height:1.9;
    letter-spacing:1px;
    font-family:inherit;text-align:center;
    text-shadow:0 1px 8px rgba(20,12,4,.7),0 0 4px rgba(20,12,4,.5);
  }
  .att-detail-desc.empty{display:none;}
  .att-detail-desc .desc-label{display:none;}
  /* 城市简介：缓慢逐字呈现动画 */
  .att-detail-desc.revealing{
    overflow:hidden;
  }
  .att-detail-desc .desc-text{
    display:inline-block;
    animation:descReveal 1.6s steps(40,end) both;
  }
  @keyframes descReveal{
    0%{clip-path:inset(0 100% 0 0);opacity:0;}
    100%{clip-path:inset(0 0 0 0);opacity:1;}
  }
  /* ===== Shiny Text 闪光文字效果（参照 reactbits.dev/shiny-text）=====
   * 原理：linear-gradient 渐变 + background-clip:text 裁切 + 动画移动渐变位置
   * 基础色 + 高光色，高光带以 120° 扩散从左向右扫过文字 */
  .shiny-text{
    background:linear-gradient(110deg,
      var(--shiny-base,#e8c068) 0%,
      var(--shiny-base,#e8c068) 35%,
      var(--shiny-shine,#ffffff) 50%,
      var(--shiny-base,#e8c068) 65%,
      var(--shiny-base,#e8c068) 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    animation:shinySweep 2.5s linear infinite;
  }
  @keyframes shinySweep{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  /* 景点网格区标题（应用 Shiny Text，删除英文 ATTRACTIONS） */
  .att-grid-title{
    font-size:16px;font-weight:700;letter-spacing:4px;margin-bottom:24px;
  }

  /* ============================================================ */
  /* ===== 新增模块1：全局轻量化科技装饰层（z-index:5，不遮挡主体）===== */
  /* ============================================================ */
  .att-tech-deco{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;}
  /* 极低透明度细网格辅助线（叠加在虚化封面上层） */
  .att-tech-grid{
    position:absolute;inset:0;opacity:.06;
    background-image:
      linear-gradient(rgba(120,180,255,.5) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,180,255,.5) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
  }
  /* 左右两侧竖向流动蓝光条 */
  .att-tech-side{position:absolute;top:0;bottom:0;width:2px;opacity:.18;}
  .att-tech-side-l{left:0;background:linear-gradient(180deg,transparent,rgba(100,170,255,.8) 50%,transparent);background-size:100% 300%;animation:techSideFlow 8s linear infinite;}
  .att-tech-side-r{right:0;background:linear-gradient(180deg,transparent,rgba(100,170,255,.8) 50%,transparent);background-size:100% 300%;animation:techSideFlow 8s linear infinite reverse;}
  @keyframes techSideFlow{0%{background-position:0 -300%;}100%{background-position:0 300%;}}
  /* 角落缓慢漂浮粒子 */
  .att-tech-particles{position:absolute;inset:0;}
  .att-tech-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(120,180,255,.5);box-shadow:0 0 6px rgba(120,180,255,.6);}

  /* ============================================================ */
  /* ===== 新增模块2：城市基础数据玻璃信息栏（横向4项）===== */
  /* ============================================================ */
  .att-info-bar{
    width:100%;max-width:760px;margin-bottom:22px;
    display:flex;align-items:center;justify-content:center;gap:0;
    padding:14px 12px;border-radius:14px;
    background:rgba(14,20,30,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(100,170,255,.22);
    box-shadow:0 0 24px rgba(60,130,220,.12),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .att-info-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
  .att-info-label{font-size:11px;letter-spacing:1.5px;color:rgba(166,210,190,.7);text-transform:uppercase;}
  .att-info-value{font-size:19px;font-weight:700;color:#e8a87c;letter-spacing:.5px;text-shadow:0 0 10px rgba(232,168,124,.22);}
  .att-info-sep{width:1px;height:28px;background:linear-gradient(180deg,transparent,rgba(166,210,190,.3),transparent);}
  .att-info-gallery-btn{margin-top:1px;padding:3px 10px;font-size:10px;line-height:1.35;}

  /* ============================================================ */
  /* 城市简介容器（去除玻璃背景边框，透明展示，文字直接浮于背景） */
  /* ============================================================ */
  .att-desc-wrap{
    width:100%;max-width:680px;margin-bottom:18px;
    padding:0;border-radius:0;
    background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;
    border:none;position:static;overflow:visible;
  }
  /* 流光扫描线移除（透明容器无需） */
  .att-desc-wrap::before,.att-desc-wrap::after{display:none;}

  /* 景点卡片网格
   * 卡片采用固定基准尺寸（2 个景点时的 0.8 倍），1-4 个景点一屏内居中排列；
   * 超过 4 个景点时网格纵向延伸，外层 overlay 滚动显示。
   * --att-cols 由 JS 按景点数写入（1-4），超过 4 固定 4 列。 */
  .att-grid{
    width:100%;display:grid;
    grid-template-columns:repeat(var(--att-cols,2),var(--att-card-w,374px));
    grid-auto-rows:var(--att-card-h,396px);
    gap:18px;justify-content:center;align-content:start;
  }
  /* 单张景点卡片：固定尺寸，等高等宽，背景取景点第一张照片 */
  .att-card{
    position:relative;border-radius:16px;overflow:hidden;
    cursor:pointer;background-size:cover;background-position:center;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 8px 28px rgba(0,0,0,.4);
    transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s ease;
    will-change:transform;
  }
  /* 卡片底部渐变遮罩，保证文字可读 */
  .att-card::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 35%,rgba(8,10,14,.35) 60%,rgba(8,10,14,.88) 100%);
    transition:opacity .3s ease;
  }
  .att-card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 18px 48px rgba(0,0,0,.55),0 0 28px rgba(100,170,255,.25),0 0 0 1px rgba(100,170,255,.3);
  }
  /* 卡片文字层 */
  .att-card-text{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:18px 18px 16px;
  }
  /* 单景点照片数量小字（卡片底部数据点缀） */
  .att-card-photo-count{
    position:absolute;top:10px;right:10px;z-index:3;
    padding:3px 8px;border-radius:10px;
    background:rgba(14,20,30,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(100,170,255,.25);
    font-size:11px;font-weight:600;color:rgba(180,210,255,.85);letter-spacing:.5px;
    display:flex;align-items:center;gap:3px;
  }
  .att-card-edit-btn{
    position:absolute;top:10px;left:10px;z-index:4;
    padding:5px 9px;border:1px solid rgba(255,255,255,.28);border-radius:8px;
    background:rgba(8,12,18,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:rgba(255,255,255,.9);font:600 11px/1.2 inherit;cursor:pointer;
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .att-card-edit-btn:hover{background:rgba(14,165,233,.78);border-color:rgba(125,211,252,.85);transform:translateY(-1px);}
  .att-card-city{
    font-size:14px;font-weight:700;color:rgba(245,235,215,.9);
    letter-spacing:1.5px;margin-bottom:6px;
    text-shadow:0 1px 6px rgba(0,0,0,.8),0 0 12px rgba(245,235,215,.15);
  }
  .att-card-name{
    font-size:26px;font-weight:800;line-height:1.25;
    margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
    /* Shiny Text 闪光效果：冷白基底 + 淡蓝高光扫过，与暖色系形成冷暖对比 */
    background:linear-gradient(110deg,#ffffff 0%,#ffffff 35%,#bfe4ff 50%,#ffffff 65%,#ffffff 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:shinySweep 3s linear infinite;
    filter:drop-shadow(0 1px 8px rgba(0,0,0,.8));
  }
  .att-card-date{
    font-size:14px;font-weight:600;color:rgba(245,240,230,.92);line-height:1.4;
    margin-bottom:6px;
    text-shadow:0 1px 6px rgba(0,0,0,.85);
  }
  .att-card-notes{
    font-size:15px;font-weight:500;color:rgba(245,240,230,.88);line-height:1.5;
    overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    text-shadow:0 1px 6px rgba(0,0,0,.85);
  }
  /* 景点网格上方操作提示：单击编辑 / 双击看照片（独立行，不参与网格布局） */
  .att-grid-hint{
    width:100%;
    text-align:center;
    margin:6px 0 14px;
    font-size:12.5px;font-weight:500;letter-spacing:.4px;
    color:rgba(190,205,225,.62);
    text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .att-grid-hint b{font-weight:600;color:rgba(140,200,255,.8);}
  body.light-theme .att-grid-hint{color:rgba(70,90,115,.72);text-shadow:none;}
  body.light-theme .att-grid-hint b{color:rgba(2,110,190,.78);}
  /* 卡片无照片占位 */
  .att-card-empty{
    position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(135deg,#1a1f28,#141821);
    z-index:1;
  }
  .att-card-empty svg{width:40px;height:40px;color:rgba(255,255,255,.2);}
  /* 空状态 */
  .att-detail-empty{
    padding:80px 32px;text-align:center;color:rgba(255,255,255,.5);
  }
  .att-detail-empty .big{font-size:18px;font-weight:600;display:block;margin-bottom:8px;color:rgba(255,255,255,.75);}
  .att-detail-empty .sub{font-size:14px;}

  /* ===== 景点编辑浮层（单击卡片弹出，深色玻璃，字段与原景点管理一致）===== */
  .att-edit-overlay{
    position:fixed;inset:0;z-index:10020;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(6,8,12,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .att-edit-overlay.show{display:flex;animation:attFadeIn .25s ease;}
  .att-edit-panel{
    width:min(560px,100%);max-height:84vh;overflow-y:auto;
    background:rgba(16,20,26,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.14);border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    padding:28px;
    animation:attCardIn .35s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes attCardIn{from{transform:scale(.96) translateY(10px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
  .att-edit-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
  .att-edit-title .x{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);cursor:pointer;font-size:16px;}
  .att-edit-title .x:hover{background:rgba(255,255,255,.18);color:#fff;}
  .att-edit-row{margin-bottom:16px;}
  .att-edit-row label{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px;letter-spacing:1px;}
  .att-edit-row input,.att-edit-row textarea{
    width:100%;padding:10px 14px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#fff;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;
  }
  .att-edit-row input:focus,.att-edit-row textarea:focus{border-color:rgba(232,192,104,.5);}
  .att-edit-row textarea{min-height:64px;resize:vertical;line-height:1.6;}
  .att-edit-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .att-edit-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.12);cursor:grab;}
  .att-edit-thumb:active{cursor:grabbing;}
  .att-edit-thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .att-edit-thumb .del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;line-height:1;display:grid;place-items:center;}
  /* 拖拽交换位置视觉反馈 */
  .att-edit-thumb.dragging{opacity:.4;}
  .att-edit-thumb.drag-over{outline:2px solid #38bdf8;outline-offset:2px;}
  .att-edit-upload{width:72px;height:72px;border-radius:10px;border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);cursor:pointer;display:grid;place-items:center;font-size:24px;transition:.2s;}
  .att-edit-upload:hover{border-color:rgba(232,192,104,.5);color:rgba(232,192,104,.9);}
  .att-edit-hint{font-size:12px;color:rgba(255,255,255,.4);margin-top:10px;}

  /* ===== 视图切换标签（与顶部切换栏完全统一样式）===== */
  .view-tabs{display:flex;gap:2px;background:#0f0f0f;border-radius:10px;padding:3px;}
  .view-tab{
    flex:0 0 auto;border:none;background:transparent;padding:8px 16px;border-radius:7px;
    font-size:13px;font-weight:600;color:#8a94a3;cursor:pointer;
    /* 统一过渡动画参数 */
    transition:background .3s cubic-bezier(.4,0,.2,1),color .3s cubic-bezier(.4,0,.2,1),
               box-shadow .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1);
  }
  /* 选中态：白色实底 + 暖橙文字 + 柔和阴影 + 轻微上浮 */
  .view-tab.active{
    background:#080808;color:var(--accent-d);
    box-shadow:0 2px 8px rgba(31,42,55,.10),0 0 0 1px rgba(232,148,60,.15);
    transform:translateY(-1px);
  }
  .view-tab.active:hover{
    background:#080808;box-shadow:0 4px 12px rgba(31,42,55,.12),0 0 0 1px rgba(232,148,60,.25);
  }
  /* 未选中 hover：浅色提升 + 轻微上浮 */
  .view-tab:hover:not(.active){
    color:var(--ink);background:rgba(0,0,0,.6);transform:translateY(-1px);
  }
  /* ===== 网格总览 ===== */
  .city-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
    max-height:340px;overflow-y:auto;padding-right:4px;
  }
  .city-grid::-webkit-scrollbar{width:5px;}
  .city-grid::-webkit-scrollbar-thumb{background:#2a3340;border-radius:3px;}
  /* ===== Wobble Card 摆动卡牌效果（与列表视图统一）===== */
  .grid-card{
    border-radius:10px;overflow:hidden;cursor:pointer;  /* 【meteors】overflow:hidden 裁剪流星在卡片内 */
    border:1px solid var(--line);background:#080808;
    /* 透视容器 + 3D 空间保留：让卡片整体可做立体摆动 */
    perspective:1000px;
    transform-style:preserve-3d;
    /* 【修复点】摆动过渡延长至 .4s，回弹更柔和 */
    transition:transform .4s cubic-bezier(.2,.8,.3,1),box-shadow .4s ease,border-color .4s ease;
    will-change:transform;
  }
  /* hover：轻微提升阴影 + 边框高亮（摆动由 JS mousemove 驱动）*/
  .grid-card:hover{box-shadow:0 8px 20px rgba(31,42,55,.14);border-color:rgba(232,148,60,.4);}
  /* ===== 3D 漂浮封面区：preserve-3d 让封面图在 3D 空间中变换 ===== */
  .grid-card .fs-hero{
    transform-style:preserve-3d;
    /* 【修复点】overflow:hidden 限制封面图放大后不溢出卡片边框 */
    overflow:hidden;
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
  }
  /* 【修复点】移除 translateZ(30px) 浮起，避免卡片摆动时封面图溢出 */
  .grid-card:hover .fs-hero{
    transform:translateZ(0);
  }
  .grid-card-cover{
    width:100%;height:80px;object-fit:cover;display:block;background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  }
  .grid-card-cover-placeholder{
    width:100%;height:80px;display:grid;place-items:center;
    background:linear-gradient(135deg,#0a0f1a,#050505);color:#94a3b8;font-size:22px;
  }
  .grid-card-body{padding:7px 9px;}
  .grid-card-name{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 8px rgba(248,250,252,.25);}  /* 【提亮】网格卡片名称发光 */
  .grid-card-meta{display:flex;align-items:center;justify-content:space-between;gap:4px;}
  .grid-card-date{font-size:10.5px;color:var(--muted);}
  .grid-card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
  .grid-card-tags .tag-pill{font-size:9.5px;padding:1px 6px;max-width:60px;}
  /* ===== 星级评分 ===== */
  .star-rating{display:inline-flex;align-items:center;gap:2px;}
  .star-rating .star{
    display:inline-flex;font-size:18px;color:#ddd;cursor:pointer;transition:.15s;line-height:1;user-select:none;
  }
  .star-rating .star.active{color:#38bdf8;}
  .star-rating .star:hover{color:#f5c46a;}
  .star-display{display:inline-flex;gap:1px;}
  .star-display .star{font-size:13px;color:#38bdf8;line-height:1;text-shadow:none;}
  .star-display .star.empty{color:#64748b;}
  /* ===== 统一星级 SVG =====
   * 5 颗星完全一致，仅通过颜色区分 active/inactive；
   * 尺寸用 1em 继承容器 font-size，各容器通过 font-size 控制整体大小 */
  .star-svg{
    width:1em;height:1em;flex:0 0 auto;display:inline-block;
    color:#38bdf8;vertical-align:-0.125em;pointer-events:none;
  }
  .star-svg.inactive{color:#64748b;}
  body.light-theme .star-svg{color:#4f46e5;}
  body.light-theme .star-svg.inactive{color:#dbe3ec;}
  /* ===== 弹窗增强：封面图 + 景点 ===== */
  /* 【弹窗尺寸放大】封面区内边距水平 18→22px，垂直 10→11px，与各模块统一 */
  .cover-section{padding:11px 22px;border-bottom:1px solid var(--line);background:#080808;flex:0 0 auto;}
  .cover-section label{font-size:12px;color:var(--muted);font-weight:600;margin-right:10px;}
  /* =====【封面预览修复】固定高度 + 水平居中，杜绝拉伸变形 ===== */
  /* 【弹窗尺寸放大】压缩封面预览高度 250→160px，把垂直空间让给下方滚动容器 */
  /* 容器：高度固定 160px，宽度 80%，margin 左右 auto 实现水平居中（左右空余宽度相同） */
  .cover-preview-wrap{
    position:relative;width:80%;height:160px;margin:6px auto 0;
    border-radius:8px;           /* 圆角，和整体UI统一 */
    border:none;                 /* 去除边框线，照片无框选边框，更简洁 */
    overflow:hidden;              /* 超出容器部分裁剪 */
    background:#080808;           /* 空状态背景 */
    display:none;                 /* 默认隐藏，有图才显示 */
  }
  /* 图片：绝对定位铺满容器，object-fit:contain 完整显示原图，不裁切不拉伸 */
  /* 容器空白区域由 .cover-preview-wrap 的深色底色(#080808)填充，简洁不花哨 */
  .cover-preview-wrap .cover-preview{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;            /* 完整展示原图，保持比例，不裁切不变形 */
    object-position:center center;/* 水平+垂直居中，适配竖图/横图/方形 */
    display:block;cursor:pointer;border:none;border-radius:8px;
  }
  /* 【弹窗尺寸缩小】封面上传按钮缩小 */
  .cover-upload-btn{
    display:inline-block;padding:5px 12px;font-size:12px;font-weight:600;
    background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;
  }
  /* 【弹窗尺寸放大】推荐指数行水平 18→22px，垂直 10→11px，与各模块统一 */
  .rating-row{display:flex;align-items:center;gap:10px;padding:11px 22px;border-bottom:1px solid var(--line);background:#080808;flex:0 0 auto;}
  .rating-row label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  /* 城市简介输入区（星级正下方，编辑态输入） */
  /* 【弹窗尺寸放大】简介行水平 18→22px，垂直 10→11px，与各模块统一 */
  .city-desc-row{display:flex;align-items:flex-start;gap:10px;padding:11px 22px;border-bottom:1px solid var(--line);background:#080808;flex:0 0 auto;}
  .city-desc-row label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;padding-top:8px;}
  .city-desc-input{flex:1;min-height:60px;max-height:120px;resize:vertical;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;line-height:1.6;font-family:inherit;outline:none;transition:border-color .2s;}
  .city-desc-input:focus{border-color:rgba(56,189,248,.5);}
  .city-desc-row .btn{flex-shrink:0;align-self:flex-start;margin-top:2px;}
  /* 景点管理 */
  /* 【弹窗尺寸放大】景点区顶部加虚线分隔 + 与标签区一致的上下间距，三个模块排版均衡 */
  .attraction-section{margin-top:18px;padding:0 0 14px;border-top:1px dashed var(--line);}
  /* 【弹窗尺寸缩小】景点项 padding 14→10px，圆角 10→8px */
  .attraction-item{
    background:#080808;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:10px;
  }
  .attraction-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  /* 【弹窗尺寸缩小】景点名称输入框缩小 */
  .attraction-name-input{
    flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font-size:13px;color:var(--ink);background:#080808;
  }
  .attraction-date-input{
    flex:0 0 auto;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font-size:12px;color:var(--muted);background:#080808;cursor:pointer;
  }
  /* 【弹窗尺寸缩小】景点删除按钮 28→24px */
  .attraction-del{
    border:none;background:#fee;color:#c53030;width:24px;height:24px;border-radius:6px;
    cursor:pointer;font-size:14px;display:grid;place-items:center;flex:0 0 auto;
  }
  /* 【弹窗尺寸缩小】景点缩略图区间距 7→5px */
  .attraction-thumbs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
  /* ===== 景点照片 3D 浮空透视效果（全站统一标准）===== */
  /* 透视容器：给内部照片缩略图提供 3D 空间 */
  .attraction-thumbs{perspective:600px;}
  /* 拖拽上传高亮：虚线边框 + 柔和底色，提示当前可投放区（不改动原有视觉） */
  .attraction-thumbs.attraction-thumbs-dragover{
    outline:2px dashed rgba(125,211,252,.8);outline-offset:3px;
    background:rgba(125,211,252,.08);border-radius:8px;
  }
  /* 【弹窗尺寸缩小】景点缩略图 64→52px */
  .attraction-thumb{
    /* overflow 改为 visible：允许 3D 浮起后照片溢出容器不被裁剪 */
    position:relative;width:52px;height:52px;border-radius:7px;overflow:visible;
    border:1px solid var(--line);cursor:pointer;
    /* preserve-3d 让照片在 3D 空间中变换 */
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.3,1),box-shadow .4s ease;
  }
  /* ===== 修正点：移除 rotateY 左右侧倾 + translateX 偏移 ===== */
  /* 仅保留 rotateX（上下立体翻转）+ translateY（垂直上浮）+ translateZ（向观察者浮起）+ scale */
  /* 无水平方向左右偏移，透视原点在照片中心，视觉居中浮空 */
  .attraction-thumb:hover{
    transform:perspective(600px) rotateX(-6deg) translateY(-6px) translateZ(30px) scale(1.06);
    box-shadow:0 12px 30px rgba(0,0,0,.18);
  }
  /* 拖拽交换位置视觉反馈 */
  .attraction-thumb.dragging{ opacity:.4; }
  .attraction-thumb.drag-over{ outline:2px solid #38bdf8; outline-offset:2px; }
  /* 图片本体圆角裁剪，防止 overflow:visible 后图片溢出圆角 */
  .attraction-thumb img{
    width:100%;height:100%;object-fit:cover;display:block;border-radius:7px;
  }
  .attraction-thumb-video-badge,.att-edit-thumb-video-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border:1px solid rgba(255,255,255,.82);border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;pointer-events:none;}
  .attraction-thumb-video-badge svg,.att-edit-thumb-video-badge svg{margin-left:2px;}
  /* 【弹窗尺寸缩小】景点照片删除按钮 22→18px */
  .attraction-thumb .del{
    position:absolute;top:0;right:0;width:18px;height:18px;background:rgba(0,0,0,.55);
    color:#fff;border:none;border-radius:0 0 0 6px;cursor:pointer;font-size:10px;
    display:grid;place-items:center;
  }
  /* 【弹窗尺寸缩小】景点备注输入框缩小 */
  .attraction-notes{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font-size:12px;color:var(--ink);resize:vertical;min-height:28px;background:#080808;
  }
  /* 【弹窗尺寸缩小】添加景点按钮 padding 14→10px，字号 14→13px */
  .attraction-add-btn{
    display:block;width:100%;padding:10px;border:1px dashed var(--line);border-radius:var(--radius-xs);
    background:linear-gradient(135deg,rgba(232,148,60,.04),rgba(232,148,60,.08));
    color:var(--accent-d);font-size:13px;font-weight:600;cursor:pointer;
    transition:background .25s ease,border-color .25s ease,transform .2s ease;
  }
  .attraction-add-btn:hover{
    border-color:var(--accent);
    background:linear-gradient(135deg,rgba(232,148,60,.1),rgba(232,148,60,.16));
    transform:translateY(-1px);
  }
  /* 【弹窗尺寸优化】景点上传按钮放大 */
  .attraction-upload-btn{
    display:inline-block;padding:3px 8px;font-size:11px;font-weight:600;
    background:#080808;color:#38bdf8;border:1px solid #2a3340;border-radius:5px;cursor:pointer;
  }
  /* ===== 全屏总览模式 ===== */
  body.fullscreen-grid header{display:none;}
  body.fullscreen-grid #mapWrap{
    position:fixed;inset:0;z-index:9999;background:#0f0f0f;
    display:flex;flex-direction:column;padding:0;
  }
  body.fullscreen-grid #map{display:none;}
  body.fullscreen-grid .legend{display:none;}
  body.fullscreen-grid .map-search{display:none;}
  body.fullscreen-grid .map-loader{display:none;}
  body.fullscreen-grid .left-panel{display:none;}

  /* 全屏顶栏：标题 + 视图切换 */
  body.fullscreen-grid #cityCardsPanel > div:first-child{
    display:flex;align-items:center;justify-content:space-between;

  /* 全屏网格模式隐藏「列表/全部」切换按钮（退出全屏由「返回上一页」按钮承担）*/
  body.fullscreen-grid .view-tabs{display:none;margin-bottom:0;background:#0f0f0f;border-radius:10px;padding:3px;}
  /* ===== 【新增】返回上一页按钮：复用 specular-button 镜面玻璃风格，仅全屏网格模式显示 ===== */
  #fsBackBtn{
    /* 默认隐藏（列表视图不占空间）*/
    display:none;
    margin-left:14px;white-space:nowrap;
    /* 复用 tl-btn-secondary 镜面玻璃质感 */
    position:relative;cursor:pointer;
    padding:8px 18px;border-radius:10px;font-size:14px;font-weight:600;
    color:#e0f7ff;background:rgba(8,8,8,.6);
    border:1.5px solid rgba(56,189,248,.7);
    box-shadow:0 3px 12px rgba(56,189,248,.25),inset 0 0 12px rgba(56,189,248,.12);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    overflow:hidden;
  }
  /* 底层玻璃高光 */
  #fsBackBtn::before{
    content:'';position:absolute;inset:0;border-radius:10px;opacity:.5;
    background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 50%);
    transition:opacity .25s ease;pointer-events:none;
  }
  /* 顶部流动高光镜面扫描条（specular 核心，复用 tl-btn::after 的 tlSpecSweep 动画）*/
  #fsBackBtn::after{
    content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;
    background:linear-gradient(105deg,transparent 0%,rgba(186,230,253,0) 35%,rgba(186,230,253,.35) 50%,rgba(186,230,253,0) 65%,transparent 100%);
    transform:skewX(-18deg);pointer-events:none;
    animation:tlSpecSweep 5.5s ease-in-out infinite;
  }
  #fsBackBtn:hover{
    transform:translateY(-1px) scale(1.015);
    box-shadow:0 6px 20px rgba(56,189,248,.4),inset 0 0 14px rgba(56,189,248,.18);
    border-color:rgba(56,189,248,.95);
  }
  #fsBackBtn:hover::before{opacity:1;}
  #fsBackBtn:active{transform:translateY(0) scale(.985);}
  /* 全屏网格模式才显示返回按钮 */
  body.fullscreen-grid #fsBackBtn{display:inline-block;}
  /* 省份筛选条 —— 默认隐藏，仅全屏网格模式下显示 */
  .fs-province-filter{display:none;}

    display:flex;gap:8px;overflow-x:auto;padding:12px 40px 20px;background:#080808;
    border-bottom:1px solid var(--line);position:sticky;top:73px;z-index:50;
    /* 【修复遮挡】top 由 56px 改为 73px（顶栏实际高度），吸顶时紧贴顶栏下方，顶部不再被顶栏覆盖 */
  }

  body.fullscreen-grid .fs-province-filter .prov-pill{
    flex-shrink:0;padding:8px 20px;border-radius:22px;font-size:15px;font-weight:600;
    background:#0f0f0f;color:var(--muted);cursor:pointer;transition:background .25s ease,color .25s ease,border-color .25s ease;border:2px solid transparent;
    white-space:nowrap;
  }
  body.fullscreen-grid .fs-province-filter .prov-pill.active{
    background:#080808;color:var(--accent-d);border-color:var(--accent);
    box-shadow:0 2px 8px rgba(232,148,60,.15);

  body.fullscreen-grid .fs-province-filter .prov-pill:hover:not(.active){
    background:#1a1a1a;color:var(--ink);text-shadow:0 0 8px rgba(248,250,252,.25);  /* 【提亮】省份筛选悬浮文字发光 */
  }
  body.fullscreen-grid #listView{display:none;}
  body.fullscreen-grid #gridView{display:block !important;padding:24px 40px 80px;}
  /* 网格容器：最多4列，卡片更大 */
  body.fullscreen-grid .city-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px;max-height:none;padding:0;
  }
  /* ===== 【顶部间距修改】第一行卡片预留上浮空间，避免 hover translateY(-8px)+scale 被上方筛选栏/边界遮挡 ===== */
  /* 4列布局 → 第一行为前4张卡片；仅增加其 margin-top，不动 gap、卡片宽高圆角阴影及 hover 动画数值 */
  body.fullscreen-grid .grid-card:nth-child(-n+4){margin-top:40px;}
  /* ===== 全屏卡片新样式 ===== */
  body.fullscreen-grid .grid-card{
    border-radius:var(--radius);overflow:visible;cursor:pointer;
    border:none;background:var(--card);box-shadow:var(--shadow-sm);
    position:relative;
    /* 3D 透视容器 + 空间保留：全屏模式同样启用立体摆动 */
    perspective:1000px;
    transform-style:preserve-3d;
    /* 【强化浮空】过渡改 0.3s cubic-bezier(.4,0,.2,1)，更顺滑跟手 */
    transition:all .3s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  body.fullscreen-grid .grid-card:hover{
    /* 【强化浮空】更柔和、更扩散的深色多层阴影，配合 JS 的 translateY 上浮 + scale + 3D 倾斜，营造明显抬升感 */
    box-shadow:0 18px 48px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.35);
  }
  /* 卡片封面区（保留 3D 透视属性，全屏模式同样产生漂浮效果）*/
  body.fullscreen-grid .grid-card .fs-hero{
    height:250px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
  }
  /* 【修复点】移除 translateZ(40px) 浮起，避免全屏模式卡片摆动时封面图溢出 */
  body.fullscreen-grid .grid-card:hover .fs-hero{
    transform:translateZ(0);
  }
  body.fullscreen-grid .grid-card .fs-hero img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  body.fullscreen-grid .grid-card .fs-hero .fs-hero-emoji{
    font-size:56px;line-height:1;filter:drop-shadow(0 3px 10px rgba(0,0,0,.3));
  }
  body.fullscreen-grid .grid-card .fs-hero .fs-hero-char{
    font-size:72px;font-weight:800;color:rgba(255,255,255,.92);
    text-shadow:0 4px 16px rgba(0,0,0,.25);letter-spacing:2px;
  }
  /* 封面顶部操作条 */

    position:absolute;top:0;left:0;right:0;padding:10px 14px;

  }
  body.fullscreen-grid .grid-card .fs-badge{
    padding:3px 10px;border-radius:18px;font-size:12px;font-weight:700;

  body.fullscreen-grid .grid-card .fs-badge.no-photos{color:#9aa5b1;}
  /* 渐变遮罩（底部） */
  body.fullscreen-grid .grid-card .fs-hero::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:45%;
    background:linear-gradient(to top,rgba(0,0,0,.3),transparent);
    pointer-events:none;
  }
  /* 卡片信息区 */
  body.fullscreen-grid .grid-card-body{
    padding:16px 16px 20px;
  }
  body.fullscreen-grid .grid-card-name{
    font-size:17px;font-weight:800;color:var(--ink);margin-bottom:2px;

  }
  body.fullscreen-grid .grid-card-province{

  }
  body.fullscreen-grid .grid-card-date{

    white-space:nowrap;
  }
  body.fullscreen-grid .grid-card-date::before{content:'📅';font-size:13px;}
  /* 星级：纯文字星形，无虚线框 */
  body.fullscreen-grid .grid-card .star-display{
    display:flex;align-items:center;gap:1px;border:none;outline:none;
  }
  body.fullscreen-grid .grid-card .star-display .star{

  }
  body.fullscreen-grid .grid-card-tags{
