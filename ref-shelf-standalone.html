<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>参考项目：记忆书架（原样复刻）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9eef0;font-family:'Microsoft YaHei','PingFang SC',sans-serif;padding:24px}
h1{font-size:15px;color:#3d525c;margin-bottom:6px;font-weight:600}
p.note{font-size:12px;color:#6b7f88;margin-bottom:14px}
.wrap{margin-bottom:28px}
.stage{position:relative;height:620px;border-radius:12px;overflow:hidden;background:#dfe7e9}
.shelf-line{position:absolute;left:6%;right:5%;bottom:76px;height:1px;background:linear-gradient(90deg,transparent,rgba(99,115,118,.2) 10%,rgba(99,115,118,.12) 88%,transparent);box-shadow:0 15px 36px rgba(82,91,89,.18)}

  /* ===== Inter 可变字体 self-host（替代 Google Fonts <link>，规避外域依赖与隐私问题）===== */
  @font-face{
    font-family:'Inter';
    src:url('assets/fonts/InterVariable.woff2') format('woff2-variations');
    font-weight:100 900;
    font-display:swap;
    font-style:normal;
  }
  @font-face{
    font-family:'Inter';
    src:url('assets/fonts/InterVariable-Italic.woff2') format('woff2-variations');
    font-weight:100 900;
    font-display:swap;
    font-style:italic;
  }
  /* Figtree 可变字体（self-host，仅用于 Chinese Footprint 标题 display 字体，reactbits variable-proximity 同款） */
  @font-face{
    font-family:'Figtree';
    src:url('assets/fonts/Figtree-Variable.ttf') format('truetype-variations');
    font-weight:100 900;
    font-display:swap;
    font-style:normal;
  }
  /* Playfair Display 可变字体（self-host，艺术风格衬线 display 字体，支持 wght 轴）
   * 【SKILL.md 4.1 SERIF DISCIPLINE】Fraunces 被 SPECIFICALLY BANNED，替换为允许池中的 Playfair Display。
   * 论证：旅行记录 = 旅行日记 = editorial / manuscript 美学，Playfair Display 经典衬线气质契合"记录足迹"编辑感。
   * VP 鼠标交互仍通过 wght 轴驱动（Playfair Display 仅有 wght 轴，无 opsz） */
  @font-face{
    font-family:'Playfair Display';
    src:url('assets/fonts/PlayfairDisplay-Variable.ttf') format('truetype-variations');
    font-weight:400 900;
    font-display:swap;
    font-style:normal;
  }
  /* Noto Serif SC 思源宋体（self-host 子集版，fonttools 按省市名 + 记忆书架文案共 557 字二次子集化，
   * 源自 @fontsource/noto-serif-sc chinese-simplified 子集；提供 400/500/700 三档字重。
   * 用于记忆书架省份名、城市详情大标题等中文衬线 display 场景（雅黑粗体显得生硬，宋体衬线更雅致）。
   * 子集外字符自动回退系统衬线（Songti SC/宋体），不影响正文渲染。 */
  @font-face{
    font-family:'Noto Serif SC';
    src:url('assets/fonts/NotoSerifSC-Subset-400.woff2') format('woff2');
    font-weight:400;
    font-display:swap;
    font-style:normal;
  }
  @font-face{
    font-family:'Noto Serif SC';
    src:url('assets/fonts/NotoSerifSC-Subset-500.woff2') format('woff2');
    font-weight:500;
    font-display:swap;
    font-style:normal;
  }
  @font-face{
    font-family:'Noto Serif SC';
    src:url('assets/fonts/NotoSerifSC-Subset-700.woff2') format('woff2');
    font-weight:700;
    font-display:swap;
    font-style:normal;
  }
  :root{
    /* ===== 全局配色：纯黑科技基底 + 青蓝主色（原为米白+橙）===== */
    --ink:#f8fafc;          /* 主标题文字：冷亮白（原 #1f2a37）*/
    --muted:#94a3b8;        /* 正文描述：浅冷灰（原 #7a8694）*/
    --accent:#38bdf8;       /* 科技青蓝主色（原 #e8943c 橙）*/
    --accent-d:#0ea5e9;     /* 深青蓝（原 #d97a1f）*/
    --accent-l:#7dd3fc;     /* 浅青蓝（原 #f5b06b）*/
    --blue:#38bdf8;         /* 同步科技青蓝（原 #3d7fb8）*/
    --blue-d:#0ea5e9;       /* 同步深青蓝（原 #2b6cb0）*/
    --card:#080808;         /* 卡片/容器深黑底板（原 #ffffff）*/
    --line:rgba(248,250,252,.08);   /* 冷调半透白分割线（原 rgba(31,42,55,.06)）*/
    --line-2:rgba(248,250,252,.06); /* 更淡分割线（原 rgba(31,42,55,.04)）*/
    --bg1:#020202;          /* 纯黑主背景（原 #f8f6f2 米白）*/
    --bg2:#020202;          /* 纯黑（原 #eef1f5）*/
    --sea1:#0a1828;         /* 深海蓝黑（原 #dbe9f6）*/
    --sea2:#08131f;         /* 更深（原 #c4d8ec）*/
    --shadow:0 8px 28px rgba(0,0,0,.50);      /* 深色柔和阴影（原 rgba(31,42,55,.10)）*/
    --shadow-sm:0 3px 12px rgba(0,0,0,.40);   /* 浅阴影（原 .06）*/
    --shadow-hover:0 14px 36px rgba(0,0,0,.60); /* hover 加深（原 .14）*/
    /* ===== 圆角系统（Shape Consistency Lock，skill 4.4）=====
     * 规则：卡片/面板 16px · 数据单元/输入 12px · 紧凑元素 8px · 按钮/胶囊 999px · 进度条/细条 6px
     * 全站统一使用这些变量，禁止散落硬编码值。滚动条 thumb 3px 属系统微件例外。 */
    --radius:16px;          /* 卡片/大面板（dash-card、star-border 容器） */
    --radius-sm:12px;       /* 数据单元（stat-cell）、小卡片、输入框、按钮组容器 */
    --radius-xs:8px;        /* 紧凑元素（icon 容器、小按钮） */
    --radius-pill:999px;    /* 按钮/胶囊（launch-btn、view-tab active、tag） */
    --radius-bar:6px;       /* 进度条/细条（prog-bar、prog-fill） */
    /* ===== Z-Index 层级系统（SKILL.md 6.F Z-INDEX RESTRAINT）=====
     * 文档化全站 z-index scale，禁止散落任意值。分层语义如下：
     *   0   基础内容层（卡片内文、默认流）
     *   1   卡片内提升（内容压过流星/背景层）
     *   2   粒子星空背景（启动页）
     *   3   射线/流体背景层
     *   5   云层旋转、装饰光带
     *   6   光线背景层
     *   8   底层动画背景
     *   10  启动页标题+按钮悬浮层
     *   20  背景噪声/纹理覆盖
     *   50  启动屏全屏遮罩 / 弹窗遮罩
     *   60  全局颗粒/噪声固定层
     *   80  顶部导航/固定栏
     *   100 页面过渡黑屏遮罩
     *   999 最高优先级（tooltip / 极端覆盖）
     * 使用时引用语义注释，禁止 z-50/z-10 散落堆砌 */
    --z-base:0; --z-raised:1; --z-bg-particle:2; --z-bg-ray:3; --z-bg-cloud:5;
    --z-bg-light:6; --z-bg-anim:8; --z-overlay-launch:10; --z-noise:20;
    --z-modal:50; --z-grain:60; --z-nav:80; --z-transition:100; --z-top:999;
    --pad:22px;
  }

  /* ===== 深色/浅色主题切换：body.light-theme 覆盖全局变量（默认深色不变）===== */
  body.light-theme{
    --ink:#1f2a37;              /* 主文字：深墨蓝（v1.2 配色）*/
    --muted:#7a8694;            /* 次要文字：中灰 */
    --accent:#e8943c;           /* 主强调：柔和橘 */
    --accent-d:#d97a1f;
    --accent-l:#f5a623;
    --blue:#3d7fb8;--blue-d:#2b6cb0;   /* 中蓝 */
    --card:#ffffff;
    --line:#e3e9f0;
    --line-2:rgba(227,233,240,.6);
    --bg1:#eaf1f8;--bg2:#d4e3f3;
    --sea1:#bed8ee;--sea2:#aacde7;   /* 海洋底色：整体调浅一档，保持小幅渐变 */
    --shadow:0 14px 40px rgba(31,42,55,.18);
    --shadow-sm:0 4px 14px rgba(31,42,55,.10);
    --shadow-hover:0 18px 46px rgba(31,42,55,.22);
  }
  /* 深色硬编码表面 → 浅色修正 */
  body.light-theme header{background:rgba(255,255,255,.82);box-shadow:0 2px 10px rgba(31,42,55,.04);}
  /* 浅色标题闪光：深墨底 + 橙色高光带扫过（v1.2 墨/橙配色），动画复用深色主题的扫光，流畅不卡顿 */

    background-image:linear-gradient(135deg,#1f2a37 0%,#1f2a37 42%,#e8943c 50%,#1f2a37 58%,#1f2a37 100%);

  }

  /* ===== Neon Glow 按钮（Originkit 风格，含旋转炫光）===== */
  @property --neon-deg{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }
  .theme-toggle-btn{
    position:relative;overflow:hidden;min-height:38px;padding:0 16px;
    border:1.5px solid rgba(56,189,248,.45);
    border-radius:var(--radius-pill);
    color:#e0f2fe;
    display:flex;align-items:center;gap:7px;
    font:600 13px/1 inherit;letter-spacing:.3px;
    cursor:pointer;outline:none;z-index:0;
    background:linear-gradient(135deg,rgba(14,165,233,.12) 0%,rgba(56,189,248,.06) 100%);
    box-shadow:
      0 0 8px rgba(56,189,248,.25),
      0 0 22px rgba(56,189,248,.10),
      inset 0 1px 0 rgba(255,255,255,.06);
    transition:color .35s ease,border-color .35s ease,box-shadow .35s ease,transform .35s ease;
    text-shadow:0 0 12px rgba(56,189,248,.35);
  }
  /* 旋转炫光：完整霓虹边框之上叠加一段更亮的流光绕圈旋转 */
  .theme-toggle-btn::before{
    content:'';position:absolute;inset:0;z-index:-1;
    border-radius:inherit;
    padding:1.5px;
    background:conic-gradient(from var(--neon-deg),
      rgba(56,189,248,0) 0deg,
      rgba(125,211,252,.95) 50deg,
      rgba(56,189,248,.35) 100deg,
      rgba(56,189,248,0) 160deg,
      rgba(14,165,233,.55) 260deg,
      rgba(56,189,248,0) 330deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask-composite:exclude;
    animation:neon-spin 4s linear infinite;
  }
  .theme-toggle-btn:hover{
    border-color:rgba(125,211,252,.85);
    color:#fff;
    box-shadow:
      0 0 14px rgba(56,189,248,.45),
      0 0 36px rgba(56,189,248,.22),
      0 0 56px rgba(56,189,248,.08);
    text-shadow:0 0 18px rgba(56,189,248,.55);
    transform:translateY(-1px);
  }
  .theme-toggle-btn:hover::before{animation-duration:1.6s;}
  .theme-toggle-btn:active{
    transform:scale(.97);
    transition:transform .1s ease;
  }
  .theme-toggle-btn svg{display:block;filter:drop-shadow(0 0 6px rgba(56,189,248,.4));}
  .theme-toggle-btn:hover svg{filter:drop-shadow(0 0 10px rgba(56,189,248,.6));}
  @keyframes neon-spin{
    to{--neon-deg:360deg;}
  }

  /* 浅色主题：天蓝霓虹（匹配页面浅蓝主调） */
  body.light-theme .theme-toggle-btn{
    border-color:rgba(14,165,233,.45);
    color:#075985;
    background:linear-gradient(135deg,rgba(14,165,233,.10) 0%,rgba(56,189,248,.05) 100%);
    box-shadow:
      0 0 8px rgba(14,165,233,.20),
      0 0 22px rgba(56,189,248,.10),
      inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow:0 0 8px rgba(14,165,233,.22);
  }
  body.light-theme .theme-toggle-btn::before{
    background:conic-gradient(from var(--neon-deg),
      rgba(14,165,233,0) 0deg,
      rgba(56,189,248,.95) 50deg,
      rgba(14,165,233,.35) 100deg,
      rgba(14,165,233,0) 160deg,
      rgba(2,132,199,.55) 260deg,
      rgba(14,165,233,0) 330deg);
  }
  body.light-theme .theme-toggle-btn:hover{
    border-color:rgba(2,132,199,.75);
    color:#0c4a6e;
    box-shadow:
      0 0 14px rgba(14,165,233,.35),
      0 0 36px rgba(56,189,248,.18),
      0 0 56px rgba(56,189,248,.06);
    text-shadow:0 0 14px rgba(14,165,233,.35);
  }
  body.light-theme .theme-toggle-btn svg{filter:drop-shadow(0 0 6px rgba(14,165,233,.35));}
  body.light-theme .theme-toggle-btn:hover svg{filter:drop-shadow(0 0 10px rgba(14,165,233,.55));}

  /* ===================== 人生地图足迹（家 → 按时间顺序飞行回放） ===================== */
  .footprint-btn .fp-btn-ico{display:grid;place-items:center;color:inherit;}
  .footprint-btn.active,
  body.light-theme .footprint-btn.active{
    box-shadow:
      0 0 16px rgba(56,189,248,.55),
      0 0 40px rgba(56,189,248,.28),
      0 0 64px rgba(56,189,248,.10);
    text-shadow:0 0 16px rgba(56,189,248,.6);
  }
  body.light-theme .footprint-btn.active{
    box-shadow:
      0 0 16px rgba(14,165,233,.40),
      0 0 40px rgba(56,189,248,.22),
      0 0 64px rgba(56,189,248,.08);
    text-shadow:0 0 14px rgba(14,165,233,.40);
  }
  @media(max-width:760px){.footprint-btn .fp-btn-label{display:none;}}
  /* 足迹图层：z:3 位于省份卡片层(z:4)之下，航线从卡片下方穿过 */
  .footprint-layer{
    position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;
    --fp-history:#fb923c;--fp-active:#fdba74;--fp-flow:#f97316;--fp-active-glow:rgba(251,146,60,.62);
    --fp-line:#fb923c;--fp-glow:rgba(249,115,22,.46);
    --fp-plane-a:#7dd3fc;--fp-plane-b:#0369a1;--fp-plane-glow:rgba(56,189,248,.38);--fp-dot:#fb923c;
    --fp-pill-bg:rgba(5,15,26,.92);--fp-pill-bd:rgba(125,211,252,.45);--fp-pill-tx:#eaf7ff;
  }
  body.light-theme .footprint-layer{
    --fp-history:#c2410c;--fp-active:#ea580c;--fp-flow:#f97316;--fp-active-glow:rgba(194,65,12,.42);
    --fp-line:#c2410c;--fp-glow:rgba(154,52,18,.3);
    --fp-plane-a:#818cf8;--fp-plane-b:#3730a3;--fp-plane-glow:rgba(99,102,241,.32);--fp-dot:#c2410c;
    --fp-pill-bg:rgba(255,255,255,.96);--fp-pill-bd:rgba(79,70,229,.5);--fp-pill-tx:#312e81;
  }
  .footprint-layer[hidden]{display:none;}
  #footprintLines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .fp-route-history{fill:none;stroke:var(--fp-history);stroke-width:2.2;stroke-linecap:round;opacity:.76;}
  .fp-route-active{fill:none;stroke:var(--fp-active);stroke-width:3;stroke-linecap:round;opacity:.86;filter:drop-shadow(0 0 8px var(--fp-active-glow));}
  .fp-route-flow-warm,.fp-route-flow-blue,.fp-route-flow-ambient{fill:none;stroke-linecap:round;pointer-events:none;}
  .fp-route-flow-warm{stroke:#fff1d6;stroke-width:4;stroke-dasharray:14 86;filter:drop-shadow(0 0 8px #fb923c);animation:fpRouteWarmFlow 2.3s linear infinite;}
  .fp-route-flow-blue{stroke:var(--fp-flow);stroke-width:3;stroke-dasharray:3 97;filter:drop-shadow(0 0 6px var(--fp-flow));animation:fpRouteBlueFlow 3.7s linear infinite;}
  .fp-route-flow-ambient{stroke:#fed7aa;stroke-width:2.5;stroke-dasharray:5 95;opacity:.9;filter:drop-shadow(0 0 6px #fb923c);animation:fpRouteAmbientFlow 6s linear infinite;}
  @keyframes fpRouteWarmFlow{to{stroke-dashoffset:-100;}}
  @keyframes fpRouteBlueFlow{to{stroke-dashoffset:-100;}}
  @keyframes fpRouteAmbientFlow{to{stroke-dashoffset:-100;}}
  .fp-stop-dot{fill:var(--fp-dot);stroke:#fff;stroke-width:1.2;}
  .fp-home-dot{fill:var(--fp-dot);stroke:#fff;stroke-width:1.6;}
  .fp-pulse{
    fill:none;stroke:var(--fp-line);stroke-width:2;
    transform-box:fill-box;transform-origin:center;
    animation:fpPulse .85s ease-out forwards;
  }
  @keyframes fpPulse{
    0%{transform:scale(.25);opacity:.95;}
    100%{transform:scale(3);opacity:0;}
  }
  @media(prefers-reduced-motion:reduce){.fp-route-flow-warm,.fp-route-flow-blue,.fp-route-flow-ambient{animation:none;stroke-dasharray:none;opacity:.38;}}
  .fp-plane{position:absolute;left:0;top:0;width:28.8px;height:28.8px;margin:-14.4px 0 0 -14.4px;opacity:.7;will-change:transform;}
  .fp-plane[hidden]{display:none;}
  .fp-plane svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 6px var(--fp-plane-glow)) saturate(.82);}
  .fp-plane .plane-top{fill:var(--fp-plane-a);opacity:.82;}
  .fp-plane .plane-bottom{fill:var(--fp-plane-b);opacity:.62;}
  .fp-plane .plane-dot{fill:#e8f5ff;opacity:.68;}
  /* 到站城市卡片：复用城市视图的封面、推荐指数和标签结构 */
  .fp-city-cards{position:absolute;inset:0;}
  .fp-arrival-card{pointer-events:none;cursor:default;}
  .fp-card-link{fill:none;stroke:rgba(129,140,248,.76);stroke-width:1.35;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgba(99,102,241,.34));}
  .fp-card-link-dot{fill:#a5b4fc;filter:drop-shadow(0 0 5px rgba(129,140,248,.55));}
  body.light-theme .fp-card-link{stroke:rgba(79,70,229,.78);filter:drop-shadow(0 0 3px rgba(67,56,202,.2));}
  body.light-theme .fp-card-link-dot{fill:#4f46e5;filter:drop-shadow(0 0 4px rgba(67,56,202,.3));}
  .fp-city-card{
    position:absolute;left:0;top:0;width:118px;height:50px;
    display:flex;flex-direction:column;justify-content:center;gap:2px;
    padding:5px 8px;text-align:left;pointer-events:none;
    border:1px solid rgba(125,211,252,.22);border-radius:var(--radius-sm);
    background:rgba(5,10,16,.42);
    animation:fpCardIn .28s cubic-bezier(.16,1,.3,1) both;
  }
  body.light-theme .fp-city-card{
    background:rgba(255,255,255,.52);border-color:rgba(79,70,229,.26);
  }
  @keyframes fpCardIn{
    0%{opacity:0;transform:translateY(8px) scale(.9);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  .fp-city-card .fp-card-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f1f5f9;font-size:11.5px;line-height:1.3;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .fp-city-card .fp-card-rating{display:inline-flex;align-items:center;gap:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7dd3fc;font-size:10px;line-height:1.3;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.55);}
  .fp-city-card .fp-card-tags{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a8bfd4;font-size:10px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  body.light-theme .fp-city-card .fp-card-name{color:#1f2a37;text-shadow:0 1px 2px rgba(255,255,255,.7);}
  body.light-theme .fp-city-card .fp-card-rating{color:#4f46e5;text-shadow:0 1px 2px rgba(255,255,255,.7);}
  body.light-theme .fp-city-card .fp-card-tags{color:#5b6b7d;text-shadow:0 1px 2px rgba(255,255,255,.7);}
  /* 到达顺序徽章：阿拉伯数字序号，主题色渐变 + 白描边 */
  .fp-card-badge{
    position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font:800 13px/1 inherit;color:#fff;
    background:linear-gradient(135deg,#38bdf8,#0284c7);
    border:2px solid #fff;box-shadow:0 4px 14px rgba(2,132,199,.55);
    letter-spacing:0;z-index:2;
  }
  body.light-theme .fp-card-badge{
    background:linear-gradient(135deg,#818cf8,#4338ca);
    box-shadow:0 4px 14px rgba(79,70,229,.45);
  }
  /* 底部控制面板（玻璃胶囊） */
  .footprint-panel{
    position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;
    border:1px solid rgba(125,211,252,.32);background:rgba(6,12,20,.9);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:calc(100% - 24px);
  }
  body.light-theme .footprint-panel{
    background:rgba(255,255,255,.93);border-color:rgba(79,70,229,.32);
    box-shadow:0 12px 28px rgba(31,42,55,.2);
  }
  .footprint-panel[hidden]{display:none;}
  .fp-ctl{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    border:1px solid rgba(125,211,252,.35);background:rgba(56,189,248,.12);color:var(--ink);
    cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1;
    transition:background .18s ease,border-color .18s ease,transform .12s ease;
  }
  .fp-ctl:hover{background:rgba(56,189,248,.24);}
  .fp-ctl:active{transform:scale(.94);}
  body.light-theme .fp-ctl{border-color:rgba(79,70,229,.32);background:rgba(99,102,241,.1);}
  body.light-theme .fp-ctl:hover{background:rgba(99,102,241,.2);}
  .fp-speed{width:auto;min-width:42px;border-radius:999px;padding:0 9px;font:700 11px/1 inherit;}
  .fp-status{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3;padding:0 4px;}
  .fp-status b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
  .fp-status span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
  .fp-status .fp-dist{color:#7dd3fc;font-weight:700;}
  body.light-theme .fp-status .fp-dist{color:#4f46e5;}
  .fp-journey-progress{display:none;min-width:280px;align-items:center;gap:12px;}
  .fp-progress-track{height:4px;flex:1;overflow:hidden;border-radius:4px;background:rgba(148,163,184,.18);}
  .fp-progress-fill{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#38bdf8,#bae6fd);box-shadow:0 0 10px rgba(56,189,248,.55);transition:width .18s linear;}
  .fp-progress-count{min-width:46px;color:#8ea8ba;font-size:11px;text-align:right;}
  .fp-memory-card{position:absolute;z-index:15;left:auto;right:30px;top:50%;translate:0 -50%;width:380px;padding:13px;border:1px solid rgba(125,211,252,.22);border-radius:22px;background:linear-gradient(145deg,rgba(10,29,47,.92),rgba(4,15,27,.88));box-shadow:0 24px 60px rgba(0,4,12,.48);backdrop-filter:blur(20px);pointer-events:none;}
  .fp-memory-card[hidden]{display:none;}
  .fp-memory-card.entering{animation:fpMemoryIn .55s ease both;}
  .fp-memory-cover{height:235px;border-radius:15px;background:linear-gradient(145deg,#15344d,#071522);background-size:cover;background-position:center;position:relative;overflow:hidden;}
  .fp-memory-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(2,8,15,.58),transparent 58%);}
  .fp-memory-index{position:absolute;z-index:1;right:10px;top:10px;min-width:27px;height:27px;padding:0 7px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(4,15,27,.72);color:#e5f5ff;font-size:10px;}
  .fp-memory-copy{padding:15px 11px 10px;}.fp-memory-meta{color:#7393aa;font-size:10px;letter-spacing:.08em;}.fp-memory-name{margin:7px 0 4px;color:#edf8ff;font-size:28px;line-height:1.2;}.fp-memory-arrival{color:#7dd3fc;font-size:11px;font-weight:700;}.fp-memory-note{margin:11px 0 0;color:#9bb0bf;font-size:11px;line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @keyframes fpMemoryIn{from{opacity:0;transform:translateX(22px) scale(.97);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
  body.footprint-cinematic .left-panel,body.footprint-cinematic .dash-panel,body.footprint-cinematic .panel-collapse-toggle,body.footprint-cinematic .legend,body.footprint-cinematic .province-focus-layer{display:none!important;}
  body.footprint-cinematic .fp-city-cards{display:block;}
  body.footprint-cinematic .footprint-panel{left:50%;right:auto;bottom:14px;width:min(1160px,calc(100% - 48px));min-height:76px;transform:translateX(-50%);display:grid;grid-template-columns:auto auto auto minmax(240px,320px) minmax(280px,1fr) auto auto;gap:12px;padding:14px 18px;border-radius:20px;background:linear-gradient(100deg,rgba(5,18,31,.94),rgba(7,31,48,.88));box-shadow:0 20px 56px rgba(0,4,12,.48);}
  body.footprint-cinematic .fp-journey-progress{display:flex;}
  body.footprint-cinematic .fp-ctl{width:38px;height:38px;font-size:14px;}
  body.footprint-cinematic .fp-speed{width:auto;min-width:52px;padding:0 12px;}
  body.footprint-cinematic .fp-status b{max-width:320px;font-size:14px;}body.footprint-cinematic .fp-status span{max-width:320px;font-size:11px;}
  body.light-theme.footprint-cinematic .footprint-panel{background:linear-gradient(100deg,rgba(249,252,254,.97),rgba(237,245,250,.95));border-color:rgba(61,127,184,.28);box-shadow:0 18px 48px rgba(47,76,96,.2);}
  body.light-theme.footprint-cinematic .fp-ctl{border-color:rgba(61,127,184,.28);background:rgba(255,255,255,.86);color:#31586e;box-shadow:inset 0 1px rgba(255,255,255,.8);}
  body.light-theme.footprint-cinematic .fp-ctl:hover{border-color:rgba(217,122,31,.46);background:#fff;color:#a85d1e;}
  body.light-theme.footprint-cinematic .fp-status b{color:#203b4c;}body.light-theme.footprint-cinematic .fp-status span{color:#667c89;}body.light-theme.footprint-cinematic .fp-status .fp-dist{color:#2b6cb0;}
  body.light-theme.footprint-cinematic .fp-progress-track{background:#d7e2ea;}body.light-theme.footprint-cinematic .fp-progress-fill{background:linear-gradient(90deg,#3d7fb8,#7db5d8);box-shadow:none;}body.light-theme.footprint-cinematic .fp-progress-count{color:#5e7685;}
  body.light-theme.footprint-cinematic .fp-memory-card{background:rgba(255,255,255,.94);border-color:rgba(79,70,229,.28);box-shadow:0 24px 60px rgba(31,42,55,.22);}
  body.light-theme.footprint-cinematic .fp-memory-name{color:#1f2a37;}body.light-theme.footprint-cinematic .fp-memory-meta,body.light-theme.footprint-cinematic .fp-memory-note{color:#62768a;}
  /* 沉浸回放期间：到站卡片/卡片连线/当前城市大卡片变浅变透明，让航线与飞机成为视觉焦点
     opacity 必须带 !important：卡片入场动画（provinceCardIn/fpMemoryIn）fill:both 会把 opacity 永久锁在关键帧终值，普通声明会被动画填充覆盖 */
  body.footprint-cinematic .province-map-card.fp-arrival-card{opacity:.5!important;filter:saturate(.75) brightness(1.06);}
  body.footprint-cinematic .fp-card-link,body.footprint-cinematic .fp-card-link-dot{opacity:.35;}
  body.footprint-cinematic .fp-memory-card{opacity:.75!important;filter:saturate(.8) brightness(1.05);}
  @media(max-width:1200px){.fp-memory-card{left:auto;right:18px;width:290px}.fp-memory-cover{height:174px}body.footprint-cinematic .footprint-panel{width:min(940px,calc(100% - 36px));grid-template-columns:auto auto auto minmax(200px,260px) minmax(220px,1fr) auto auto;}}
  @media(max-width:900px){body.footprint-cinematic .footprint-panel{grid-template-columns:auto auto auto 1fr auto auto}.fp-journey-progress{grid-column:1/-1;grid-row:2}.fp-memory-card{left:auto;right:14px;top:14px;translate:none;width:220px}.fp-memory-cover{height:128px}}
  @media(max-width:640px){
    .footprint-panel{bottom:12px;gap:6px;padding:6px 8px;}
    .fp-status b{max-width:132px;font-size:12px;}
    .fp-status span{max-width:132px;font-size:10px;}
    .fp-ctl{width:28px;height:28px;font-size:12px;}
  }
  /* 选择家的城市弹窗 */
  .fp-home-overlay{
    position:fixed;inset:0;z-index:10020;background:rgba(2,6,12,.62);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .fp-home-overlay[hidden]{display:none;}
  .fp-home-modal{
    width:min(440px,94vw);max-height:min(580px,88vh);display:flex;flex-direction:column;
    border-radius:16px;border:1px solid rgba(125,211,252,.3);background:#0a121d;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;
  }
  body.light-theme .fp-home-modal{background:#ffffff;border-color:rgba(79,70,229,.3);box-shadow:0 30px 70px rgba(31,42,55,.28);}
  .fp-home-head{padding:16px 46px 12px 18px;position:relative;}
  .fp-home-head h2{margin:0;font-size:16px;font-weight:800;}
  .fp-home-head p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.5;}
  .fp-home-close{
    position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;
    display:grid;place-items:center;font-size:14px;
  }
  .fp-home-close:hover{background:rgba(125,211,252,.14);}
  #fpHomeSearch{
    margin:0 18px 12px;padding:9px 12px;border-radius:10px;outline:none;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);
    font:500 13px/1.4 inherit;
  }
  #fpHomeSearch:focus{border-color:rgba(125,211,252,.6);}
  body.light-theme #fpHomeSearch{background:#f7f9fc;}
  .fp-home-list{
    overflow:auto;padding:0 12px 14px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;align-content:start;
  }
  .fp-home-item{
    padding:8px 10px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);cursor:pointer;font:600 13px/1.3 inherit;
    text-align:left;color:var(--ink);transition:border-color .15s ease,background .15s ease;
  }
  .fp-home-item:hover{border-color:rgba(125,211,252,.6);background:rgba(56,189,248,.1);}
  body.light-theme .fp-home-item{background:#fafbfd;}
  .fp-home-item.is-home{border-color:#34d399;}
  .fp-home-item.is-home .fp-home-city-name{color:#34d399;}
  .fp-home-item .cnt{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted);}
  .fp-home-empty{grid-column:1/-1;text-align:center;padding:26px 0;font-size:13px;color:var(--muted);}
  /* 我的家乡卡片（已设置家乡后点击「我的家乡」按钮显示，仅展示家乡这一个城市） */
  .my-home-card{
    margin:4px 18px 18px;padding:22px 16px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .my-home-icon{
    width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;
    border:1px solid rgba(245,158,11,.6);
    background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(251,191,36,.08));
    box-shadow:0 0 22px rgba(245,158,11,.35);
  }
  .my-home-name{font-size:22px;font-weight:800;color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.5);}
  .my-home-sub{font-size:13px;color:var(--muted);}
  .my-home-actions{display:flex;gap:10px;margin-top:12px;}
  .my-home-btn{
    padding:9px 18px;border-radius:999px;font:600 13px/1.2 inherit;cursor:pointer;
    color:var(--ink);border:1px solid var(--line);background:rgba(255,255,255,.04);
    transition:border-color .15s ease,background .15s ease;
  }
  .my-home-btn:hover{border-color:rgba(125,211,252,.6);background:rgba(56,189,248,.12);}
  .my-home-btn.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,#f59e0b,#d97706);}
  .my-home-btn.primary:hover{filter:brightness(1.08);}
  body.light-theme .my-home-btn{background:#f7f9fc;color:#1f2a37;}
  body.light-theme .my-home-btn.primary{color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);}
  body.light-theme .my-home-name{color:#b45309;text-shadow:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  /* 【SKILL.md 6.B REDUCED MOTION】全局覆盖：禁用所有无限循环动画（流星、边缘光辉、粒子、自转等），
   * MOTION_INTENSITY=6 > 3，必须完整支持 prefers-reduced-motion。
   * 已有 .vp-char 和 .launch-subtitle 局部覆盖，此块补充流星/光辉/其他 CSS 无限动画 */
  @media (prefers-reduced-motion: reduce){
    .meteor,.city-card-bglow,.shiny-text,.meteor::before{
      animation:none !important;
    }
    .meteor{opacity:0 !important;}
    .city-card-bglow{opacity:0 !important;}
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);  /* 【修复】恢复原始 body 渐变背景，射线改用高层 screen 叠加不再需要 body 透明 */
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    /* 【SKILL.md 3.E VIEWPORT STABILITY】100vh→100dvh，避免 iOS Safari 地址栏导致布局跳动 */
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* 顶部标题栏 */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    padding:14px 22px;
    background:rgba(8,8,8,.82);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(31,42,55,.04);
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .brand .pin{
    flex:0 0 auto;width:40px;height:40px;border-radius:13px;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    box-shadow:0 6px 14px rgba(14,165,233,.38),inset 0 1px 0 rgba(255,255,255,.22);
    position:relative;
  }
  /* 相机图标外圈微光，呼应青蓝主题 */
  .brand .pin::after{
    content:"";position:absolute;inset:-3px;border-radius:16px;
    border:1px solid rgba(56,189,248,.28);pointer-events:none;
  }
  .brand-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand h1{
    margin:0;font-size:20px;font-weight:800;letter-spacing:1.6px;
    line-height:1.25;
    /* Shiny Text 闪光效果（参考 reactbits shiny-text: spread=135, speed=1.6s, delay=1.4s, yoyo, pauseOnHover）*/
    background:linear-gradient(135deg,
      #7dd3fc 0%, #7dd3fc 42%,
      #ffffff 50%,
      #7dd3fc 58%, #7dd3fc 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shinyTextYoyo 6s ease-in-out infinite;
  }
  .brand .sub{
    margin:0;font-size:12px;line-height:1.4;letter-spacing:1px;
    max-width:min(34vw,420px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(135deg,
      #93c9ef 0%, #93c9ef 42%,
      #eaf7ff 50%,
      #93c9ef 58%, #93c9ef 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shinyTextYoyo 6s ease-in-out infinite;
    animation-delay:.8s;
    padding-left:1.6px;   /* 抵消中文引号起始的视觉缩进，与主标题对齐 */
  }
  /* Shiny Text yoyo 动画：正向扫光1.6s → 停顿1.4s → 反向扫光1.6s → 停顿1.4s，总周期6s */
  @keyframes shinyTextYoyo{
    0%   {background-position:150% 0;}
    26.7%{background-position:-50% 0;}
    50%  {background-position:-50% 0;}
    76.7%{background-position:150% 0;}
    100% {background-position:150% 0;}
  }
  /* pauseOnHover：鼠标悬停时暂停闪光动画 */
  .brand h1:hover, .brand .sub:hover{
    animation-play-state:paused;
  }
  .stats{display:flex;gap:10px;flex:0 0 auto;}
  .header-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .account-btn{
    position:relative;overflow:hidden;min-height:38px;max-width:150px;padding:0 13px;
    border:1.5px solid rgba(56,189,248,.45);
    border-radius:var(--radius-pill);
    background:linear-gradient(135deg,rgba(14,165,233,.12) 0%,rgba(56,189,248,.06) 100%);
    color:#e0f2fe;
    display:flex;align-items:center;gap:9px;font:600 12px/1 inherit;letter-spacing:.2px;
    cursor:pointer;outline:none;z-index:0;
    box-shadow:
      0 0 8px rgba(56,189,248,.25),
      0 0 22px rgba(56,189,248,.10),
      inset 0 1px 0 rgba(255,255,255,.06);
    transition:color .35s ease,border-color .35s ease,box-shadow .35s ease,transform .35s ease;
    text-shadow:0 0 12px rgba(56,189,248,.35);
  }
  .account-btn::before{
    content:'';position:absolute;inset:0;z-index:-1;
    border-radius:inherit;
    padding:1.5px;
    background:conic-gradient(from var(--neon-deg),
      rgba(56,189,248,0) 0deg,
      rgba(125,211,252,.95) 50deg,
      rgba(56,189,248,.35) 100deg,
      rgba(56,189,248,0) 160deg,
      rgba(14,165,233,.55) 260deg,
      rgba(56,189,248,0) 330deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask-composite:exclude;
    animation:neon-spin 4s linear infinite;
  }
  .account-btn:hover{
    border-color:rgba(125,211,252,.85);
    color:#fff;
    box-shadow:
      0 0 14px rgba(56,189,248,.45),
      0 0 36px rgba(56,189,248,.22),
      0 0 56px rgba(56,189,248,.08);
    text-shadow:0 0 18px rgba(56,189,248,.55);
    transform:translateY(-1px);
  }
  .account-btn:hover::before{animation-duration:1.6s;}
  .account-btn:active{transform:scale(.97);}
  .account-btn .account-dot{width:7px;height:7px;border-radius:50%;background:#64748b;box-shadow:0 0 0 4px rgba(100,116,139,.12);}
  .account-btn.signed-in .account-dot{background:var(--accent);box-shadow:0 0 0 4px rgba(56,189,248,.14),0 0 12px rgba(56,189,248,.5);}
  .account-btn .account-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* 浅色主题：天蓝霓虹（与主题切换/足迹/家乡按钮统一） */
  body.light-theme .account-btn{
    border-color:rgba(14,165,233,.45);
    color:#075985;
    background:linear-gradient(135deg,rgba(14,165,233,.10) 0%,rgba(56,189,248,.05) 100%);
    box-shadow:
      0 0 8px rgba(14,165,233,.20),
      0 0 22px rgba(56,189,248,.10),
      inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow:0 0 8px rgba(14,165,233,.22);
  }
  body.light-theme .account-btn::before{
    background:conic-gradient(from var(--neon-deg),
      rgba(14,165,233,0) 0deg,
      rgba(56,189,248,.95) 50deg,
      rgba(14,165,233,.35) 100deg,
      rgba(14,165,233,0) 160deg,
      rgba(2,132,199,.55) 260deg,
      rgba(14,165,233,0) 330deg);
  }
  body.light-theme .account-btn:hover{
    border-color:rgba(2,132,199,.75);
    color:#0c4a6e;
    box-shadow:
      0 0 14px rgba(14,165,233,.35),
      0 0 36px rgba(56,189,248,.18),
      0 0 56px rgba(56,189,248,.06);
    text-shadow:0 0 14px rgba(14,165,233,.35);
  }
  .stat{
    position:relative;overflow:hidden;
    background:#080808;border:1px solid var(--line);border-radius:12px;
    padding:6px 14px;text-align:center;box-shadow:var(--shadow-sm);
    min-width:74px;
  }
  .stat::before{
    content:'';position:absolute;inset:0;z-index:0;
    border-radius:inherit;padding:1.5px;
    background:linear-gradient(135deg,rgba(56,189,248,.55),rgba(125,211,252,.35),rgba(14,165,233,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask-composite:exclude;
    box-shadow:0 0 10px rgba(56,189,248,.25),0 0 20px rgba(56,189,248,.12);
    pointer-events:none;
  }
  .stat>span,.stat>label{position:relative;z-index:1;}
  body.light-theme .stat::before{
    background:linear-gradient(135deg,rgba(14,165,233,.5),rgba(56,189,248,.35),rgba(2,132,199,.5));
    box-shadow:0 0 10px rgba(14,165,233,.18),0 0 20px rgba(56,189,248,.08);
  }
  .stat span{display:block;font-size:18px;font-weight:800;color:var(--accent-d);line-height:1.1;white-space:nowrap;}
  .stat .stat-unit{display:inline;font-size:9px;font-weight:700;color:var(--muted);margin-left:2px;}
  .stat label{font-size:11px;color:var(--muted);}

  /* 地图区 */
  #mapWrap{
    position:relative;flex:1 1 auto;min-height:0;
    background:
      radial-gradient(120% 90% at 70% 18%, rgba(56,189,248,0.25) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(160deg,var(--sea1) 0%,var(--sea2) 100%);
    overflow:hidden;
  }
  #map{position:absolute;inset:0;}
  /* 省份聚焦层：地图负责省份高亮，DOM 层负责城市照片卡片与连接线
     z-index:4 低于左右面板(6)：城市视图卡片可自由延伸到面板区域下方（被面板盖住），不被钳成一条线 */
  .province-focus-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
  .province-focus-layer[hidden]{display:none;}
  .province-focus-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .province-focus-lines path{
    fill:none;
    stroke:rgba(129,140,248,.76);stroke-width:1.35;vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 0 4px rgba(99,102,241,.34));
  }
  .province-focus-lines circle{fill:#a5b4fc;filter:drop-shadow(0 0 5px rgba(129,140,248,.55));}
  body.light-theme .province-focus-lines path{
    stroke:rgba(79,70,229,.78);
    filter:drop-shadow(0 0 3px rgba(67,56,202,.20));
  }
  body.light-theme .province-focus-lines circle{fill:#4f46e5;filter:drop-shadow(0 0 4px rgba(67,56,202,.30));}
  .province-map-card{
    position:absolute;width:154px;height:70px;display:grid;grid-template-columns:62px 1fr;
    overflow:hidden;pointer-events:auto;cursor:pointer;border:1px solid rgba(125,211,252,.28);
    border-radius:var(--radius-sm);background:rgba(5,10,16,.96);box-shadow:0 14px 34px rgba(0,0,0,.58);
    padding:0;text-align:left;font:inherit;color:inherit;
    transform-origin:center;animation:provinceCardIn .24s cubic-bezier(.16,1,.3,1) both;
  }
  .province-map-card:hover{border-color:rgba(125,211,252,.68);box-shadow:0 18px 42px rgba(0,0,0,.66),0 0 20px rgba(56,189,248,.13);}
  .province-map-card:focus-visible{outline:2px solid var(--accent-l);outline-offset:3px;}
  .province-map-card{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;}
  .province-map-card.dragging{cursor:grabbing;animation:none;z-index:10;border-color:#7dd3fc;box-shadow:0 22px 50px rgba(0,0,0,.72),0 0 24px rgba(56,189,248,.22);}
  .province-map-card-image,.province-map-card-image-empty{
    width:62px;height:70px;display:block;background:#0b1722;
    pointer-events:none;-webkit-user-drag:none;user-drag:none;
  }
  .province-map-card-image{object-fit:cover;}
  .province-map-card-image-empty{display:grid;place-items:center;color:#64748b;font-size:10px;text-align:center;line-height:1.25;}
  .province-map-card-copy{min-width:0;padding:7px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
  .province-map-card-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f8fafc;font-size:13px;font-weight:800;}
  .province-map-card-rating{display:inline-flex;align-items:center;gap:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7dd3fc;font-size:10px;font-weight:700;}
  .province-map-card-intro{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#94a3b8;font-size:10px;line-height:1.25;
  }
  .province-focus-more{
    position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:7px 12px;
    border:1px solid rgba(125,211,252,.24);border-radius:var(--radius-pill);
    background:rgba(5,10,16,.92);color:#bae6fd;font-size:11px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.42);
  }
  @keyframes provinceCardIn{from{opacity:0;transform:translateY(7px) scale(.96)}to{opacity:1;transform:none}}
  body.fullscreen-grid .province-focus-layer{display:none;}
  /* 左侧数据面板 —— 紧贴最左端，纵向堆叠统计+时间轴 */
  .left-panel{
    position:absolute;left:0;top:0;z-index:6;
    width:380px;height:100%;
    display:flex;flex-direction:column;gap:20px;
    padding:20px;
    pointer-events:none;
  }
  .left-panel > *{pointer-events:auto;}
  .left-panel .dash-card{flex:0 0 auto;}
  /* 【修改点】timelinePanel 改为 flex 列容器：顶部固定 + 下方独立滚动 */
  .left-panel #timelinePanel{
    flex:1 1 auto;min-height:0;overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* 顶部固定区域：标题+按钮，不随轨迹滚动 */
  .left-panel #timelinePanel .tl-fixed-header{
    flex:0 0 auto;  /* 固定高度，不收缩 */
  }
  /* 下方可拖动滚动区域：激活态可纵横滚动，预览态完全锁定无滚动条 */
  .left-panel #timelinePanel .tl-scroll-area{
    flex:1 1 0;min-height:0;  /* 零 basis 稳定占据剩余高度，不随内容塌缩 */
    overflow:auto;  /* 激活态：纵横均可滚动 */
  }
  /* 预览态（未点击展示）：完全禁用滚动，隐藏所有滚动条 */
  .left-panel #timelinePanel .tl-scroll-area.tl-scroll-locked{
    overflow:hidden;  /* 预览态锁定，无滚动条 */
  }
  .left-panel #timelinePanel .tl-scroll-area::-webkit-scrollbar{height:5px;width:5px;}  /* 激活态显示纵横滚动条 */
  .left-panel #timelinePanel .tl-scroll-area.tl-scroll-locked::-webkit-scrollbar{height:0;width:0;}  /* 预览态隐藏所有滚动条 */
  .left-panel #timelinePanel .tl-scroll-area::-webkit-scrollbar-thumb{background:#2a3340;border-radius:3px;}
  .left-panel #timelinePanel .tl-scroll-area::-webkit-scrollbar-track{background:transparent;}
  .left-panel #miniTimeline{overflow:visible;}
  /* 右侧数据面板 —— 向上置顶，纵向填满视口，独立滚动，BFC 隔离防溢出 */
  .dash-panel{
    position:absolute;right:0;top:0;z-index:6;
    width:380px;height:100%;
    display:flex;flex-direction:column;gap:12px;
    overflow:hidden;             /* BFC 隔离：内部内容不向左溢出 */
    pointer-events:none;
    padding:20px 20px 20px 0;    /* 左侧无 padding 紧贴右栏边缘，右侧留白 */
  }
  .dash-panel > *{pointer-events:auto;}
  /* 左右信息区收起按钮：贴住对应面板边缘，收起后停留在屏幕边缘 */
  .left-panel,.dash-panel{
    transition:transform .28s cubic-bezier(.16,1,.3,1),opacity .2s ease,visibility 0s linear 0s;
  }
  .panel-collapse-toggle{
    position:absolute;top:50%;z-index:7;width:36px;height:78px;padding:0;
    display:grid;place-items:center;border:1px solid rgba(125,211,252,.3);
    background:rgba(5,13,20,.94);color:var(--accent);cursor:pointer;
    box-shadow:0 0 20px rgba(56,189,248,.16),inset 0 1px 0 rgba(255,255,255,.05);
    transform:translateY(-50%);
    transition:left .28s cubic-bezier(.16,1,.3,1),right .28s cubic-bezier(.16,1,.3,1),
               border-color .2s ease,background .2s ease,box-shadow .2s ease;
  }
  .panel-collapse-toggle:hover{
    border-color:rgba(125,211,252,.72);background:#07131d;
    box-shadow:0 0 24px rgba(56,189,248,.25),inset 0 1px 0 rgba(255,255,255,.08);
  }
  .panel-collapse-toggle:active{background:#0a1b27;}
  .panel-collapse-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .panel-collapse-toggle-left{left:360px;border-left:0;border-radius:0 12px 12px 0;}
  .panel-collapse-toggle-right{right:380px;border-right:0;border-radius:12px 0 0 12px;}
  .panel-collapse-toggle .panel-toggle-arrow{
    width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
    transition:transform .2s ease;
  }
  .panel-collapse-toggle-left .panel-toggle-arrow{transform:rotate(135deg);}
  .panel-collapse-toggle-right .panel-toggle-arrow{transform:rotate(-45deg);}
  body.left-panel-collapsed .left-panel{
    transform:translateX(calc(-100% - 8px));opacity:0;visibility:hidden;pointer-events:none;
    transition:transform .28s cubic-bezier(.16,1,.3,1),opacity .2s ease,visibility 0s linear .28s;
  }
  body.left-panel-collapsed .left-panel > *{pointer-events:none;}
  body.left-panel-collapsed .panel-collapse-toggle-left{left:0;}
  body.left-panel-collapsed .panel-collapse-toggle-left .panel-toggle-arrow{transform:rotate(-45deg);}
  body.right-panel-collapsed .dash-panel{
    transform:translateX(calc(100% + 8px));opacity:0;visibility:hidden;pointer-events:none;
    transition:transform .28s cubic-bezier(.16,1,.3,1),opacity .2s ease,visibility 0s linear .28s;
  }
  body.right-panel-collapsed .dash-panel > *{pointer-events:none;}
  body.right-panel-collapsed .panel-collapse-toggle-right{right:0;}
  body.right-panel-collapsed .panel-collapse-toggle-right .panel-toggle-arrow{transform:rotate(135deg);}
  /* 【固定布局】#cityCardsPanel 改为 flex 列容器：标题+按钮固定，仅列表内部独立滚动 */
  .dash-panel #cityCardsPanel{
    flex:1 1 auto;min-height:0;overflow:hidden; /* 容器自身不滚动，交由内部滚动 */
    display:flex;flex-direction:column;
    border-radius:var(--radius);
    border:1px solid var(--line-2);
    box-shadow:var(--shadow-sm);
  }
  .dash-panel #cityCardsPanel::-webkit-scrollbar{width:6px;}
  .dash-panel #cityCardsPanel::-webkit-scrollbar-thumb{background:#2a3340;border-radius:3px;}
  .dash-panel #cityCardsPanel::-webkit-scrollbar-track{background:transparent;}
  /* 【固定布局】标题+按钮栏：固定高度不收缩，始终锁定在顶部 */
  .dash-panel #cityCardsPanel > div:first-child{
    flex:0 0 auto; /* 不收缩不增长，固定在顶部 */
  }
  /* 【固定布局】列表/网格视图容器：填充剩余空间，内部独立纵向滚动 */
  .dash-panel #cityCardsPanel #listView,
  .dash-panel #cityCardsPanel #gridView{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  }
  .dash-panel #cityCardsPanel #listView::-webkit-scrollbar,
  .dash-panel #cityCardsPanel #gridView::-webkit-scrollbar{width:6px;}
  .dash-panel #cityCardsPanel #listView::-webkit-scrollbar-thumb,
  .dash-panel #cityCardsPanel #gridView::-webkit-scrollbar-thumb{background:#2a3340;border-radius:3px;}
  .dash-panel #cityCardsPanel #listView::-webkit-scrollbar-track,
  .dash-panel #cityCardsPanel #gridView::-webkit-scrollbar-track{background:transparent;}
  /* 统一卡片样式：统一圆角、柔和阴影、标准化内边距 */
  .dash-card{
    background:rgba(8,8,8,0.92);                      /* 实色半透明（原 var(--card) + backdrop-filter，skill 9.A/5 dashboard 不宜毛玻璃，改实色降低 GPU 重绘） */
    border:1px solid var(--line-2);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    padding:var(--pad);
    transition:box-shadow .25s ease;
  }

  /* ===== Star Border 星际边缘效果（参考 reactbits star-border: thickness=3）===== */
  /* 启用 star border 的卡片：position:relative + overflow:hidden 裁切光带 */
  .dash-card.star-border{
    position:relative;
  }
  /* 星际光带：conic-gradient 旋转，形成沿边缘流动的星形光效 */
  .dash-card.star-border::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:3px; /* thickness=3px */
    background:conic-gradient(from var(--star-angle,0deg),
      transparent 0deg,
      transparent 60deg,
      var(--star-color,#e88c2c) 90deg,
      transparent 120deg,
      transparent 300deg,
      var(--star-color,#e88c2c) 330deg,
      transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    z-index:0;
    animation:starBorderSpin 12s linear infinite;
  }
  @keyframes starBorderSpin{
    to{--star-angle:360deg;}
  }
  /* 注册 CSS 自定义属性以支持角度动画 */
  @property --star-angle{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }
  /* 卡片内容需要在光带之上 */
  .dash-card.star-border > *{position:relative;z-index:1;}
  .legend{
    position:absolute;left:400px;bottom:16px;z-index:5;
    display:flex;flex-direction:column;gap:8px;
    padding:12px 16px;border-radius:14px;
    background:rgba(8,8,8,.82);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(248,250,252,.08);box-shadow:var(--shadow-sm);
    font-size:12px;color:#3f4a57;
    font-weight:500;
    pointer-events:none;
  }
  .legend-head{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .legend .title{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;}
  .legend-content{display:flex;flex-direction:column;gap:8px;}
  .legend .row{display:flex;align-items:center;gap:8px;}
  .legend .op-hint{margin-left:2px;font-size:10px;color:var(--muted);opacity:.9;}
  .legend-toggle{
    width:24px;height:24px;padding:0;display:grid;place-items:center;flex:0 0 auto;
    border:1px solid rgba(125,211,252,.26);border-radius:8px;
    background:rgba(5,13,20,.92);color:#7dd3fc;cursor:pointer;pointer-events:auto;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
  }
  .legend-toggle:hover{background:rgba(14,165,233,.14);color:#e0f2fe;border-color:rgba(125,211,252,.58);}
  .legend-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .legend-toggle-arrow{
    width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:rotate(45deg) translate(-1px,-1px);transition:transform .18s ease;
  }
  body.legend-collapsed .legend{gap:0;padding:8px 10px;}
  body.legend-collapsed .legend-content{display:none;}
  body.legend-collapsed .legend-toggle-arrow{transform:rotate(225deg) translate(-1px,-1px);}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .dot.blue{background:var(--blue);box-shadow:0 0 0 2px rgba(56,189,248,.25);}
  .dot.gold{
    background:var(--accent);
    box-shadow:0 0 8px rgba(232,148,60,.75);
  }
  .dot.home{
    background:#fbbf24;
    box-shadow:0 0 8px rgba(245,158,11,.75);
  }

  /* ===== 人生寄语：顶栏下边缘折叠按钮 + 展开面板（未设置寄语时隐藏）===== */
  .motto-toggle-btn{
    position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:8;
    width:44px;height:20px;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(56,189,248,.38);border-top:none;
    border-radius:0 0 12px 12px;
    background:rgba(6,12,20,.88);
    color:#7dd3fc;
    transition:background .2s ease,color .2s ease,box-shadow .2s ease;
  }
  .motto-toggle-btn:hover{
    background:rgba(14,165,233,.18);color:#e0f2fe;
    box-shadow:0 4px 14px rgba(56,189,248,.35);
  }
  .motto-toggle-btn svg{transition:transform .3s ease;}
  .motto-toggle-btn[aria-expanded="true"] svg{transform:rotate(180deg);}
  body.light-theme .motto-toggle-btn{
    background:rgba(255,255,255,.92);border-color:rgba(79,70,229,.32);color:#4f46e5;
  }
  body.light-theme .motto-toggle-btn:hover{
    background:rgba(99,102,241,.12);color:#312e81;
    box-shadow:0 4px 14px rgba(79,70,229,.28);
  }
  .motto-panel{
    position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:7;
    max-width:min(76vw,760px);text-align:center;pointer-events:none;
    font-weight:600;font-size:clamp(22px,2.4vw,36px);line-height:1.6;
    letter-spacing:1.2px;color:#eaf6ff;overflow-wrap:anywhere;
    text-shadow:0 0 26px rgba(56,189,248,.55),0 2px 14px rgba(0,0,0,.65);
    animation:mottoPanelIn .45s ease both;
  }
  @keyframes mottoPanelIn{
    from{opacity:0;transform:translate(-50%,-12px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  body.light-theme .motto-panel{
    color:#17324d;
    text-shadow:0 0 20px rgba(79,70,229,.22),0 2px 10px rgba(255,255,255,.85);
  }
  body.fullscreen-grid .motto-toggle-btn,body.fullscreen-grid .motto-panel{display:none;}
  @media (prefers-reduced-motion:reduce){.motto-panel{animation:none;}.motto-toggle-btn svg{transition:none;}}

  /* ===== 地图搜索框（嵌入右侧面板顶部，跟随文档流）===== */
  /* 视觉对标 uiverse.io/Lakshay-art/curvy-earwig-22：多层圆锥渐变边框搜索框 */
  /* 颜色适配网页暖橙色调：紫粉色系 → 暖橙琥珀色系 */
  .map-search{
    position:relative;
    width:100%;
    flex-shrink:0;
    z-index:5;
    padding:16px 0;
    display:flex;
    justify-content:center;
  }

  /* ===== 搜索框主容器 #poda：多层圆锥渐变边框的承载层 ===== */
  .map-search #poda{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    width:100%;
    max-width:314px;
  }

  /* ===== 底层网格背景（已移除，保持搜索框背景干净）===== */
  .map-search .grid{display:none;}

  /* ===== 圆锥渐变边框层通用样式 ===== */
  .map-search .white,.map-search .border,.map-search .darkBorderBg,.map-search .glow{
    max-height:70px;max-width:314px;
    height:100%;width:100%;
    position:absolute;overflow:hidden;z-index:-1;
    border-radius:12px;
    filter:blur(3px);
  }

  /* ===== 搜索输入框 ===== */
  .map-search .input{
    background-color:#080808;
    border:none;
    width:100%;height:56px;
    border-radius:10px;
    color:var(--ink);
    padding-inline:59px;
    font-size:15px;
    font-weight:500;
    position:relative;z-index:1;
  }
  .map-search .input::placeholder{color:#94a3b8;}
  .map-search .input:focus{outline:none;}

  /* ===== 输入遮罩层：模拟光标闪烁效果 ===== */
  .map-search #main:focus-within>#input-mask{display:none;}
  .map-search #input-mask{
    pointer-events:none;
    width:100px;height:20px;
    position:absolute;
    background:linear-gradient(90deg,transparent,#080808);
    top:18px;left:70px;
  }

  /* ===== 浅蓝光斑遮罩（与底板浅蓝色系统一，降低饱和度）===== */
  .map-search #pink-mask{
    pointer-events:none;
    width:30px;height:20px;
    position:absolute;
    background:#38bdf8;
    top:10px;left:5px;
    filter:blur(20px);
    opacity:.5;
    transition:all 2s;
  }
  .map-search #main:hover>#pink-mask{opacity:0;}

  /* ===== 白色边框层：浅蓝圆锥渐变（低饱和度柔和漫射）===== */
  .map-search .white{
    max-height:63px;max-width:307px;
    border-radius:10px;filter:blur(2px);
  }
  .map-search .white::before{
    content:"";z-index:-2;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(83deg);
    position:absolute;
    width:600px;height:600px;
    filter:brightness(1.2);
    background-image:conic-gradient(
      rgba(0,0,0,0) 0%,
      #c8d8ea,
      rgba(0,0,0,0) 8%,
      rgba(0,0,0,0) 50%,
      #a8c4e0,
      rgba(0,0,0,0) 58%
    );
    transition:all 2s;
  }

  /* ===== 主边框层：浅蓝圆锥渐变（低饱和度，与底板色系融合）===== */
  .map-search .border{
    max-height:59px;max-width:303px;
    border-radius:11px;filter:blur(.5px);
  }
  .map-search .border::before{
    content:"";z-index:-2;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(70deg);
    position:absolute;
    width:600px;height:600px;
    filter:brightness(1.15);
    background-image:conic-gradient(
      #2a3540,
      #38bdf8 5%,
      #2a3540 14%,
      #2a3540 50%,
      #7dd3fc 60%,
      #2a3540 64%
    );
    transition:all 2s;
  }

  /* ===== 深色边框背景层：深蓝圆锥渐变（低饱和度柔和阴影）===== */
  .map-search .darkBorderBg{
    max-height:65px;max-width:312px;
  }
  .map-search .darkBorderBg::before{
    content:"";z-index:-2;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(82deg);
    position:absolute;
    width:600px;height:600px;
    background-image:conic-gradient(
      rgba(0,0,0,0),
      #0ea5e9,
      rgba(0,0,0,0) 10%,
      rgba(0,0,0,0) 50%,
      #4a90c8,
      rgba(0,0,0,0) 60%
    );
    transition:all 2s;
  }

  /* ===== 悬停时各层旋转 ===== */
  .map-search #poda:hover>.darkBorderBg::before{transform:translate(-50%,-50%) rotate(-98deg);}
  .map-search #poda:hover>.glow::before{transform:translate(-50%,-50%) rotate(-120deg);}
  .map-search #poda:hover>.white::before{transform:translate(-50%,-50%) rotate(-97deg);}
  .map-search #poda:hover>.border::before{transform:translate(-50%,-50%) rotate(-110deg);}

  /* ===== 聚焦时各层旋转（聚焦动画更慢）===== */
  .map-search #poda:focus-within>.darkBorderBg::before{transform:translate(-50%,-50%) rotate(442deg);transition:all 4s;}
  .map-search #poda:focus-within>.glow::before{transform:translate(-50%,-50%) rotate(420deg);transition:all 4s;}
  .map-search #poda:focus-within>.white::before{transform:translate(-50%,-50%) rotate(443deg);transition:all 4s;}
  .map-search #poda:focus-within>.border::before{transform:translate(-50%,-50%) rotate(430deg);transition:all 4s;}

  /* ===== 发光层：大范围柔和偏蓝光晕（与底板背景色系一致，低饱和度）===== */
  .map-search .glow{
    overflow:hidden;
    filter:blur(8px);
    opacity:.3;
    max-height:130px;max-width:354px;
  }
  .map-search .glow:before{
    content:"";z-index:-2;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(60deg);
    position:absolute;
    width:999px;height:999px;
    background-image:conic-gradient(
      #eef1f5,
      #38bdf8 5%,
      #eef1f5 38%,
      #eef1f5 50%,
      #7dd3fc 60%,
      #eef1f5 87%
    );
    transition:all 2s;
  }

  /* ===== 旋转动画 ===== */
  @keyframes searchRotate{
    100%{transform:translate(-50%,-50%) rotate(450deg);}
  }

  /* ===== 搜索图标按钮（Gooey 气泡核心）===== */
  /* 图标本身作为圆形气泡：与输入框同色 #080808 背景，聚焦时与输入框共享 gooey filter */
  .map-search #search-icon{
    position:absolute;
    left:10px;top:10px;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:#080808;
    z-index:3;
    color:#0ea5e9;
    cursor:pointer;
    box-shadow:0 1px 4px rgba(214,122,28,.10);
    transition:transform .45s cubic-bezier(.4,0,.2,1),left .45s cubic-bezier(.4,0,.2,1);
  }
  .map-search #search-icon svg{width:18px;height:18px;}

  /* ===== Gooey 黏稠效果（对标 aceternity gooey-input）===== */
  /* 核心：聚焦时 #main 容器应用 gooey filter，图标气泡与输入框边缘融合产生流体连接 */
  .map-search #main{
    position:relative;
    transition:filter .4s ease;
  }
  .map-search #main:focus-within{
    filter:url(#gooeyFilter);
  }
  /* 聚焦态：图标气泡向右轻微位移，与输入框之间产生黏稠拉伸连接 */
  .map-search #main:focus-within #search-icon{
    transform:scale(1.1);
    left:12px;
    animation:gooeyPulse .6s cubic-bezier(.4,0,.2,1);
  }
  @keyframes gooeyPulse{
    0%{transform:scale(1);}
    35%{transform:scale(1.18);}
    70%{transform:scale(1.06);}
    100%{transform:scale(1.1);}
  }
  /* 失焦时：图标回弹复位，gooey filter 消散 */
  .map-search #main:not(:focus-within) #search-icon{
    transform:scale(1);
  }

  /* ===== 过滤按钮（清除按钮，蓝色系适配底板）===== */
  .map-search #filter-icon{
    position:absolute;
    top:8px;right:8px;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
    max-height:40px;max-width:38px;
    height:100%;width:100%;
    isolation:isolate;overflow:hidden;
    border-radius:10px;
    background:linear-gradient(180deg,#2a3540,#1e2832,#3a4a5a);
    border:1px solid transparent;
    color:#38bdf8;
    font-size:16px;line-height:1;
    cursor:pointer;
    transition:opacity .2s;
  }
  .map-search .filterBorder{
    height:42px;width:40px;
    position:absolute;overflow:hidden;
    top:7px;right:7px;
    border-radius:10px;
  }
  .map-search .filterBorder::before{
    content:"";
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
    position:absolute;
    width:600px;height:600px;
    filter:brightness(1.2);
    background-image:conic-gradient(
      rgba(0,0,0,0),
      #6a8aaa,
      rgba(0,0,0,0) 50%,
      rgba(0,0,0,0) 50%,
      #6a8aaa,
      rgba(0,0,0,0) 100%
    );
    animation:searchRotate 4s linear infinite;
  }
  .map-search #main{position:relative;}

  /* ===== 清除按钮隐藏/显示（蓝色系适配底板）===== */
  .map-search .map-search-clear.hidden{display:none;}
  .map-search .map-search-clear{
    position:absolute;
    top:8px;right:8px;
    z-index:3;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;
    background:linear-gradient(180deg,#2a3540,#1e2832,#3a4a5a);
    color:#38bdf8;font-size:18px;line-height:1;
    cursor:pointer;
    border:1px solid transparent;
    transition:opacity .2s;
  }
  .map-search .map-search-clear:hover{color:#8ec5e8;}

  /* ===== 搜索结果下拉列表 ===== */
  .map-search-results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:rgba(8,8,8,.97);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line-2);border-radius:var(--radius);
    box-shadow:0 8px 28px rgba(31,42,55,.14);
    max-height:380px;overflow-y:auto;
    display:none;z-index:6;
  }
  .map-search-results.show{display:block;}
  .map-search-results::-webkit-scrollbar{width:5px;}
  .map-search-results::-webkit-scrollbar-thumb{background:#2a3340;border-radius:3px;}
  .map-search-group-title{
    font-size:10px;font-weight:700;color:var(--muted);
    letter-spacing:.5px;text-transform:uppercase;
    padding:10px 16px 4px;
  }
  .map-search-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 16px;cursor:pointer;
    transition:background .12s;
    border-radius:10px;margin:0 6px;
  }
  .map-search-item:hover{background:rgba(232,148,60,.08);}
  .map-search-item-icon{
    width:28px;height:28px;flex-shrink:0;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#fff;
  }
  .map-search-item-icon.city{background:linear-gradient(135deg,#5b8fb8,#3d6f9c);}
  .map-search-item-icon.att{background:linear-gradient(135deg,#38bdf8,#0ea5e9);}
  .map-search-item-text{flex:1;min-width:0;}
  .map-search-item-name{
    font-size:14px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .map-search-item-name mark{
    background:rgba(232,148,60,.2);color:var(--accent-d);
    border-radius:3px;padding:0 2px;
  }
  .map-search-item-sub{
    font-size:11px;color:var(--muted);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .map-search-empty{
    padding:24px 16px;text-align:center;
    font-size:13px;color:var(--muted);
  }

  /* 地图加载层 */
  .map-loader{
    position:absolute;inset:0;z-index:8;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:24px;background:rgba(238,243,248,.7);backdrop-filter:blur(2px);
    color:var(--muted);font-size:14px;
  }
  /* 【提亮】加载页文字更亮，提升可读性，仅作用于加载器文字，不影响其他 --muted 元素 */
  #loaderText{color:#1e3a8a;font-weight:600;font-size:15px;text-shadow:0 1px 2px rgba(255,255,255,.5);}
  .map-loader.hidden{display:none;}
  /* ===== 加载动画对标 uiverse.io/Praashoo7/lucky-hound-44：9柱放射小球弹跳 ===== */
  .uv-main{
    display:flex;align-items:center;justify-content:center;
    position:relative;width:14em;height:14em;
    /* 缩放适配：原动画em值较大，这里用font-size控制整体尺寸 */
    font-size:9px;
  }
  .uv-up{position:relative;width:14em;height:14em;display:flex;align-items:center;justify-content:center;}
  .uv-loaders,.uv-loadersB{display:flex;align-items:center;justify-content:center;}
  .uv-loader{
    position:absolute;width:1.15em;height:13em;border-radius:50px;background:#e0e0e0;
  }
  .uv-loader::after{
    content:"";position:absolute;left:0;top:0;width:1.15em;height:5em;background:#e0e0e0;
    border-radius:50px;border:1px solid #e2e2e2;
    box-shadow:inset 5px 5px 15px rgba(211,210,210,.67),inset -5px -5px 15px rgba(233,233,233,.67);
    mask-image:linear-gradient(to bottom,black calc(100% - 48px),transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom,black calc(100% - 48px),transparent 100%);
  }
  .uv-loader::before{
    content:"";position:absolute;bottom:0;right:0;width:1.15em;height:4.5em;background:#e0e0e0;
    border-radius:50px;border:1px solid #e2e2e2;
    box-shadow:inset 5px 5px 15px rgba(211,210,210,.67),inset -5px -5px 15px rgba(233,233,233,.67);
    mask-image:linear-gradient(to top,black calc(100% - 48px),transparent 100%);
    -webkit-mask-image:linear-gradient(to top,black calc(100% - 48px),transparent 100%);
  }
  .uv-loaderA{position:absolute;width:1.15em;height:13em;border-radius:50px;background:transparent;}
  .uv-ball0,.uv-ball1,.uv-ball2,.uv-ball3,.uv-ball4,.uv-ball5,.uv-ball6,.uv-ball7,.uv-ball8,.uv-ball9{
    width:1.15em;height:1.15em;border-radius:50%;
    background-color:rgba(232,232,232,1);
    box-shadow:inset 0 -10px 10px 0 rgba(0,0,0,.17),inset 0 -15px 15px 0 rgba(0,0,0,.15),
      inset 0 -40px 20px 0 rgba(0,0,0,.1),0 2px 1px rgba(0,0,0,.06),
      0 4px 2px rgba(0,0,0,.09),0 8px 4px rgba(0,0,0,.09),
      0 16px 8px rgba(0,0,0,.09),0 32px 16px rgba(0,0,0,.09),
      0 -1px 15px -8px rgba(0,0,0,.09);
    transition:transform 800ms cubic-bezier(1,-0.4,0,1.4);
    animation:uv-move 3.63s ease-in-out infinite;
  }
  .uv-loader:nth-child(2){transform:rotate(20deg);}
  .uv-loader:nth-child(3){transform:rotate(40deg);}
  .uv-loader:nth-child(4){transform:rotate(60deg);}
  .uv-loader:nth-child(5){transform:rotate(80deg);}
  .uv-loader:nth-child(6){transform:rotate(100deg);}
  .uv-loader:nth-child(7){transform:rotate(120deg);}
  .uv-loader:nth-child(8){transform:rotate(140deg);}
  .uv-loader:nth-child(9){transform:rotate(160deg);}
  .uv-loaderA:nth-child(2){transform:rotate(20deg);}
  .uv-loaderA:nth-child(3){transform:rotate(40deg);}
  .uv-loaderA:nth-child(4){transform:rotate(60deg);}
  .uv-loaderA:nth-child(5){transform:rotate(80deg);}
  .uv-loaderA:nth-child(6){transform:rotate(100deg);}
  .uv-loaderA:nth-child(7){transform:rotate(120deg);}
  .uv-loaderA:nth-child(8){transform:rotate(140deg);}
  .uv-loaderA:nth-child(9){transform:rotate(160deg);}
  .uv-ball1{animation-delay:.2s;}
  .uv-ball2{animation-delay:.4s;}
  .uv-ball3{animation-delay:.6s;}
  .uv-ball4{animation-delay:.8s;}
  .uv-ball5{animation-delay:1s;}
  .uv-ball6{animation-delay:1.2s;}
  .uv-ball7{animation-delay:1.4s;}
  .uv-ball8{animation-delay:1.6s;}
  .uv-ball9{animation-delay:1.8s;}
  @keyframes uv-move{
    0%{transform:translateY(0em);}
    50%{transform:translateY(12em);}
    100%{transform:translateY(0em);}
  }
  .map-error{max-width:340px;text-align:center;line-height:1.7;}
  .map-error a{color:var(--blue-d);cursor:pointer;text-decoration:underline;}
  .retry-btn{
    margin-top:6px;padding:8px 18px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;font-weight:600;
    box-shadow:0 6px 14px rgba(232,148,60,.35);
  }

  /* 模态框 */
  .modal-overlay{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;padding:16px;
    background:rgba(20,28,38,.5);backdrop-filter:blur(4px);
  }
  .modal-overlay.show{display:flex;animation:fade .2s ease;}
  /* 编辑弹窗叠加在城市详情页上层：详情页 z:10001、全屏网格 z:9999 均被覆盖，不跳转不退出当前页 */
  .modal-overlay.over-att-detail{z-index:10010;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  /* =====【滚动隔离核心】弹窗打开时锁定底层所有可滚动容器，仅弹窗内部可滚动 ===== */
  body.modal-open .left-panel,
  body.modal-open .dash-panel,
  body.modal-open .modal-body{
    overscroll-behavior:contain;  /* 阻止滚动链传播到底层 */
  }
  body.modal-open .left-panel > *,
  body.modal-open .dash-panel > *{
    pointer-events:none;  /* 弹窗遮罩期间，底层内容不响应交互 */
  }
  body.modal-open .modal-overlay,
  body.modal-open .modal-overlay *{
    pointer-events:auto;  /* 弹窗自身恢复正常交互 */
  }
  /* =====【弹窗尺寸放大】660→780px，高度 84vh→90vh，内部更舒展 ===== */
  .modal{
    width:min(780px,100%);max-height:90vh;display:flex;flex-direction:column;
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.3,1.1);
    /* 【性能优化】隔离弹窗内部重排重绘，拖拽/滚动不触发整页刷新 */
    contain:layout style;will-change:transform;
  }
  @keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  /* 【弹窗尺寸缩小】头部内边距 20→14px，标题字号 20→17px */
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#080808,#080808);
    flex:0 0 auto;
  }
  .modal-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .modal-title .pin-sm{color:var(--accent);flex:0 0 auto;}
  /* 【弹窗尺寸缩小】标题字号 20→17px */
  .modal-title h2{margin:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal-count{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px;white-space:nowrap;}
  /* 【弹窗尺寸缩小】关闭按钮 38→32px */
  .icon-btn{
    flex:0 0 auto;width:32px;height:32px;border-radius:var(--radius-xs);border:1px solid var(--line);
    /* 【SKILL.md 4.4 SHAPE CONSISTENCY LOCK】原 9px 硬编码改为圆角变量系统 --radius-xs:8px */
    background:#080808;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    display:grid;place-items:center;transition:.15s;
  }
  .icon-btn:hover{background:#0f0f0f;color:var(--ink);}
  /* 【弹窗尺寸缩小】地标栏内边距 24→18px，字号 13→12px */
  .modal-landmark{
    padding:8px 22px;font-size:12px;color:#7a8694;font-weight:500;
    background:linear-gradient(90deg,#080808,rgba(8,8,8,0));
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  /* 我的家乡分区标题：自然融入页面的简洁标题 + 底部短线装饰 */
  .hometown-banner{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:24px 0 22px;padding:0;
    font-size:18px;font-weight:600;letter-spacing:1px;line-height:1.4;text-align:center;
    color:#7dd3fc;
    flex:0 0 auto;
  }
  .hometown-banner::after{
    content:'';display:block;width:40px;height:2px;margin-top:10px;
    background:linear-gradient(90deg,transparent,rgba(56,189,248,.5),transparent);
    border-radius:1px;
  }
  body.light-theme .hometown-banner{
    color:#0284c7;
  }
  body.light-theme .hometown-banner::after{
    background:linear-gradient(90deg,transparent,rgba(14,165,233,.45),transparent);
  }
  /* =====【滚动隔离核心】弹窗 body 独立滚动容器，flex:1 + min-height:0 确保不撑破父容器 ===== */
  /* 【弹窗尺寸放大】body 内边距 14→16px，水平 18→22px，滚动区更舒展 */
  .modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 22px;
    /* 自定义滚动条适配深色主题 */
    scrollbar-width:thin;scrollbar-color:rgba(125,211,252,.4) transparent;
  }
  .modal-body::-webkit-scrollbar{width:6px;}
  .modal-body::-webkit-scrollbar-track{background:transparent;}
  .modal-body::-webkit-scrollbar-thumb{background:rgba(125,211,252,.35);border-radius:4px;}
  .modal-body::-webkit-scrollbar-thumb:hover{background:rgba(125,211,252,.6);}
  /* 【弹窗尺寸放大】照片网格放大：minmax 108→116px，gap 10→12px，配合更宽弹窗 */
  .thumbs{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px;
  }
  /* ===== 弹窗顶部城市大图缩略图：3D 浮空透视效果（全站统一）===== */
  .thumb{
    position:relative;aspect-ratio:1/1;border-radius:9px;overflow:visible;
    background:#080808;border:1px solid var(--line);box-shadow:var(--shadow-sm);
    cursor:pointer;
    /* 透视容器：给内部 img 提供 3D 空间 */
    perspective:600px;
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    border-radius:9px;
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s ease;
  }
  /* 悬浮时图片独立浮空：上浮 + 立体倾斜 + 放大 + 阴影加深 */
  .thumb:hover img{
    transform:perspective(600px) rotateX(-5deg) rotateY(5deg) translateZ(22px) scale(1.06);
    box-shadow:0 12px 28px rgba(0,0,0,.16);
  }
  /* 【弹窗尺寸缩小】删除图标 28→24px */
  .thumb-del{
    position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    border:none;cursor:pointer;color:#fff;font-size:15px;line-height:1;
    background:rgba(20,28,38,.6);backdrop-filter:blur(2px);
    display:grid;place-items:center;transition:.15s;
  }
  .thumb-del:hover{background:#e53e3e;}
  .thumb.dragging{opacity:.4;transform:scale(.92);}
  .thumb.drag-over{outline:3px dashed var(--accent);outline-offset:2px;}
  /* 【弹窗尺寸缩小】序号标 24→20px */
  .thumb-order{
    position:absolute;top:6px;left:6px;min-width:20px;height:20px;border-radius:50%;
    background:rgba(20,28,38,.55);backdrop-filter:blur(2px);color:#fff;font-size:11px;
    font-weight:700;display:grid;place-items:center;padding:0 4px;pointer-events:none;
  }
  .empty{
    text-align:center;color:var(--muted);font-size:13px;line-height:1.7;
    padding:32px 12px;border:1px dashed var(--line);border-radius:10px;background:#080808;
  }
  .empty .big{display:block;font-size:14px;color:#4a5563;margin-bottom:3px;font-weight:600;}
  /* 【弹窗尺寸缩小】底部通栏按钮内边距 18→12px */
  .modal-foot{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 22px;border-top:1px solid var(--line);background:rgba(0,0,0,.6);
    flex:0 0 auto;
  }
  /* 【弹窗尺寸缩小】按钮缩小：padding 11→8px，字号 15→13px */
  .btn{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    padding:8px 16px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;
    border:none;transition:.2s ease;user-select:none;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
    box-shadow:0 6px 14px rgba(232,148,60,.35);
  }
  .btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px);}
  /* 取消点亮：深色=暗玫红实底；浅色=浅玫瑰底玫红字（适配 v1.2 柔和浅色界面）*/
  #unlightBtn{background:#9f1239;color:#ffffff;border:1px solid #be123c;}
  #unlightBtn:hover{background:#be123c;}
  body.light-theme #unlightBtn{background:#fdf0f2;color:#9f1239;border:1px solid rgba(159,18,57,.30);}
  body.light-theme #unlightBtn:hover{background:#f9dfe5;}
  .hint{font-size:12px;color:var(--muted);}

  /* ===== 城市点评弹窗 ===== */
  /* Originkit Neon Glow 按钮 — 查看点评（与旅行足迹/主题切换/账号按钮统一风格） */
  .review-entry-btn{
    position:relative;overflow:hidden;flex:0 0 auto;
    min-height:38px;padding:0 18px;
    border:1.5px solid rgba(56,189,248,.45);
    border-radius:var(--radius-pill);
    color:#e0f2fe;
    display:flex;align-items:center;gap:7px;
    font:600 13px/1 inherit;letter-spacing:.3px;
    cursor:pointer;outline:none;z-index:0;
    margin-left:auto;
    background:linear-gradient(135deg,rgba(14,165,233,.12) 0%,rgba(56,189,248,.06) 100%);
    box-shadow:
      0 0 8px rgba(56,189,248,.25),
      0 0 22px rgba(56,189,248,.10),
      inset 0 1px 0 rgba(255,255,255,.06);
    transition:color .35s ease,border-color .35s ease,box-shadow .35s ease,transform .35s ease;
    text-shadow:0 0 12px rgba(56,189,248,.35);
  }
  .review-entry-btn::before{
    content:'';position:absolute;inset:0;z-index:-1;
    border-radius:inherit;
    padding:1.5px;
    background:conic-gradient(from var(--neon-deg),
      rgba(56,189,248,0) 0deg,
      rgba(125,211,252,.95) 50deg,
      rgba(56,189,248,.35) 100deg,
      rgba(56,189,248,0) 160deg,
      rgba(14,165,233,.55) 260deg,
      rgba(56,189,248,0) 330deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask-composite:exclude;
    animation:neon-spin 4s linear infinite;
  }
  .review-entry-btn:hover{
    border-color:rgba(125,211,252,.85);
    color:#fff;
    box-shadow:
      0 0 14px rgba(56,189,248,.45),
      0 0 36px rgba(56,189,248,.22),
      0 0 56px rgba(56,189,248,.08);
    text-shadow:0 0 18px rgba(56,189,248,.55);
    transform:translateY(-1px);
  }
  .review-entry-btn:hover::before{animation-duration:1.6s;}
  .review-entry-btn:active{
    transform:scale(.97);
    transition:transform .1s ease;
  }

  /* ===== 发布我的点评：预览弹窗 ===== */

  .publish-body{flex:1 1 auto;overflow-y:auto;padding:18px 22px;min-height:0;}
  .publish-body::-webkit-scrollbar{width:6px;}
  .publish-body::-webkit-scrollbar-track{background:transparent;}
  .publish-body::-webkit-scrollbar-thumb{background:rgba(125,211,252,.35);border-radius:4px;}
  .publish-author-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .publish-avatar{

  .publish-author-name{font-size:14px;font-weight:700;color:var(--ink);}
  .publish-author-sub{font-size:11px;color:var(--muted);}
  .publish-city-title{font-size:20px;font-weight:800;color:var(--ink);margin:2px 0 4px;}
  .publish-section{

  .publish-section-label{

  .publish-section-label .pub-toggle{

    color:var(--muted);user-select:none;

  body.light-theme .pub-toggle input{accent-color:#4f46e5;}
  .publish-rating{display:inline-flex;align-items:center;gap:2px;font-size:20px;color:#38bdf8;}
  body.light-theme .publish-rating{color:#4f46e5;}
  .publish-desc{font-size:13px;color:var(--ink);line-height:1.7;white-space:pre-wrap;}
  .publish-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .publish-tags .r-tag{font-size:12px;padding:4px 12px;}
  .publish-attractions{display:flex;flex-wrap:wrap;gap:6px;}
  .publish-attraction-chip{
    display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:14px;font-size:12px;
    background:rgba(56,189,248,.08);color:#38bdf8;border:1px solid rgba(56,189,248,.2);
  }
  body.light-theme .publish-attraction-chip{background:rgba(79,70,229,.07);color:#4f46e5;border-color:rgba(79,70,229,.2);}
  .publish-photos{display:flex;gap:6px;flex-wrap:wrap;}
  .publish-photos img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}

  body.light-theme .publish-visibility{background:rgba(79,70,229,.04);border-color:rgba(79,70,229,.25);}
  .publish-visibility-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .publish-visibility-grid{display:flex;flex-wrap:wrap;gap:8px 16px;}
  .pub-vis-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);cursor:pointer;user-select:none;}
  .pub-vis-item input{accent-color:#38bdf8;cursor:pointer;}
  body.light-theme .pub-vis-item input{accent-color:#4f46e5;}
  .publish-foot{

  .publish-cancel-btn{

  body.light-theme .publish-cancel-btn:hover{border-color:rgba(79,70,229,.4);}

  /* 灯箱 */
  .lightbox{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(0,0,0,.9);cursor:zoom-out;
  }
  .lightbox.show{display:flex;animation:fade .2s ease;}
