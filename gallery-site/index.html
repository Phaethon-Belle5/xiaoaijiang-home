<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伶俜 · 映像馆</title>
<meta name="description" content="伶俜的映像馆 — 在中国地图上点亮走过的城市，看每一帧光影">
<meta name="theme-color" content="#0B0E14">
<!-- 分享预览卡。映像馆整页是 canvas 画的，HTML 里一个 <img> 都没有 ——
     平台"找不到 og:image 就自己从页面挑一张图"的兜底在这里完全失效，所以必须显式给图。
     封面＝站点头像做成圆形（金色描边＋光晕，与主页 .slide-avatar 同款），1200x630 JPEG。 -->
<meta property="og:title" content="伶俜 · 映像馆">
<meta property="og:description" content="在中国地图上点亮走过的城市，看每一帧光影">
<meta property="og:type" content="website">
<meta property="og:url" content="https://map.231060101.xyz">
<meta property="og:site_name" content="伶俜 · 映像馆">
<meta property="og:image" content="https://map.231060101.xyz/assets/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="伶俜的头像">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://map.231060101.xyz/assets/og-cover.jpg">
<meta name="twitter:image:alt" content="伶俜的头像">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://home.xiaoaijiang.cloud">
<!-- 写实 3D 地球的资源提前并行拉取。只在开屏确实会显示时才预载，同一会话看过就不再下。 -->
<script>
(function(){
  try{
    if(sessionStorage.getItem('mapgallery-launched')==='1')return;
    ['assets/gl/echarts.min.js','assets/gl/echarts-gl.min.js','assets/gl/earth-2048.jpg','assets/gl/starfield-2048.jpg'].forEach(function(u){
      var l=document.createElement('link');
      l.rel='preload';l.as=/\.js$/.test(u)?'script':'image';l.href=u;
      document.head.appendChild(l);
    });
  }catch(e){}
})();
</script>
<link rel="icon" id="favicon" href="https://cdn.231060101.xyz/%E8%AF%B4%E8%AF%B4%E5%9B%BE%E7%89%87/%E9%98%BF%E5%91%A6.webp">
<style>
/* Inter 可变字体（self-host，供 Variable Proximity 光影足迹 eyebrow 的 wght 轴，48KB Latin） */
@font-face{font-family:'InterVar';src:url('assets/inter-var.woff2') format('woff2-variations');font-weight:100 900;font-display:swap;font-style:normal}
:root{
  --gold:#D4A843;--gold-bright:#E8C456;--gold-glow:rgba(212,168,67,0.25);
  --text-primary:#E8E2D9;--text-secondary:#A09888;--text-muted:#8A8070;
  --glass-bg:rgba(17,22,42,0.75);--glass-border:rgba(255,255,255,0.06);
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;--radius-pill:9999px;
  --shadow-card:0 4px 24px rgba(0,0,0,0.4);
  --shadow-card-hover:0 8px 40px rgba(0,0,0,0.5),0 0 30px var(--gold-glow);
  --space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --space-8:32px;--space-10:40px;--space-16:64px;--space-24:96px;
  --nav-h:64px;--container-max:1400px;--container-padding:32px;
  --font-display:'Cinzel','PingFang SC','Microsoft YaHei',serif;
  --font-body:'PingFang SC','Microsoft YaHei','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'Cascadia Code','JetBrains Mono','Consolas',monospace;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --canvas:#0B0E14; --wf-ink:#F2E8D5; --wf-body:#A09888; --wf-hairline:rgba(255,255,255,0.08);
  --text-primary:#E8E2D9;--text-secondary:#A09888;--text-muted:#8A8070;
  --glass-bg:rgba(17,22,42,0.75);--glass-border:rgba(255,255,255,0.06);
  --shadow-card:0 4px 24px rgba(0,0,0,0.4);
}
[data-theme="light"]{
  --canvas:#F5F0E8; --wf-ink:#1C2342; --wf-body:#5C4E3A; --wf-hairline:rgba(0,0,0,0.10);
  --text-primary:#1C2342;--text-secondary:#5C4E3A;--text-muted:#6B5D49;
  --glass-bg:rgba(255,255,255,0.65);--glass-border:rgba(0,0,0,0.08);
  --shadow-card:0 4px 24px rgba(31,38,60,0.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--canvas);color:var(--text-primary);line-height:1.6;overflow-x:hidden;transition:background .4s ease,color .4s ease}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--wf-hairline);border-radius:6px}
/* ===== ferrofluid 背景层 ===== */
#ferrofluidBg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
/* ===== 顶栏 ===== */
#topnav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:1000;display:flex;align-items:center;padding:0 var(--container-padding);transition:background .3s,box-shadow .3s}
#topnav.scrolled{background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-border)}
.nav-brand{font-family:var(--font-display);font-size:1.05em;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:var(--space-3);letter-spacing:.04em;cursor:pointer;user-select:none;transition:color .3s}
.nav-brand-star{font-size:1.2em;color:var(--gold);animation:starPulse 3s ease-in-out infinite}
@keyframes starPulse{0%,100%{opacity:1}50%{opacity:.5}}
.nav-spacer{flex:1}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-link{position:relative;padding:8px 16px;font-size:.82em;font-weight:500;letter-spacing:.02em;white-space:nowrap;color:var(--text-secondary);transition:color .3s;background:none;border:none}
.nav-link::after{content:'';position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .3s var(--ease-out)}
.nav-link:hover{color:var(--text-primary)}
.nav-link.on{color:var(--text-primary);font-weight:600}
.nav-link.on::after{transform:scaleX(1)}
.nav-actions{display:flex;align-items:center;gap:4px}
.nav-icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);background:none;border:none;transition:all .2s var(--ease-out)}
.nav-icon-btn:hover{color:var(--wf-ink);background:rgba(128,128,128,0.12)}
.nav-icon-btn .ic-sun{display:none}
[data-theme="light"] .nav-icon-btn .ic-moon{display:none}
[data-theme="light"] .nav-icon-btn .ic-sun{display:block}
.nav-hamburger{display:none}
/* ===== 页面容器 ===== */
main{position:relative;z-index:1;max-width:var(--container-max);margin:0 auto;padding:calc(var(--nav-h) + var(--space-16)) var(--container-padding) var(--space-24)}
.hero{text-align:center;margin-bottom:var(--space-10)}
.hero-eyebrow{font-family:var(--font-body);font-size:14px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:var(--space-3)}
.hero h1{font-family:var(--font-display);font-size:clamp(2rem,6vw,3.4rem);font-weight:700;color:var(--wf-ink);line-height:1.1;margin-bottom:var(--space-4)}
.hero p{color:var(--text-secondary);max-width:60ch;margin:0 auto;font-size:.95em}
/* ===== 工具条：视图切换 + 搜索 ===== */
.map-toolbar{display:flex;align-items:center;justify-content:center;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-5)}
.view-tabs{display:inline-flex;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-pill);padding:3px;backdrop-filter:blur(8px)}
.view-tab{padding:7px 20px;border:none;background:none;color:var(--text-secondary);font-size:.85em;border-radius:var(--radius-pill);transition:all .25s var(--ease-out)}
.view-tab.on{background:var(--gold);color:#1a1a1a;font-weight:600}
.view-tab.drill-back{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);backdrop-filter:blur(8px)}
.view-tab.drill-back:hover{border-color:var(--gold)}
.trip-btn{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);backdrop-filter:blur(8px);border-radius:var(--radius-pill);padding:7px 18px;font-size:.85em;transition:all .25s var(--ease-out)}
.trip-btn:hover{border-color:var(--gold)}
.trip-btn.on{background:var(--gold);color:#1a1a1a;font-weight:600;border-color:var(--gold)}
#mapMount{position:absolute;inset:0;width:100%;height:100%}
#provCardLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;display:none}
#provCards{position:absolute;inset:0;pointer-events:none;z-index:12;display:none}
#provCards.on,#provCardLines.on{display:block}
.prov-card{position:absolute;width:150px;pointer-events:auto;background:rgba(10,14,24,.82);border:1px solid var(--glass-border);border-radius:var(--radius-md);backdrop-filter:blur(12px);box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer;transform:translateY(6px);opacity:0;transition:opacity .4s var(--ease-out),transform .4s var(--ease-out),border-color .25s}
.prov-card.in{opacity:1;transform:translateY(0)}
.prov-card:hover{border-color:var(--gold)}
.prov-card .pc-cover{width:100%;height:74px;object-fit:cover;display:block;background:rgba(56,189,248,.08)}
.prov-card .pc-body{padding:8px 10px}
.prov-card .pc-name{font-size:.9em;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.prov-card .pc-meta{font-size:.76em;color:var(--text-secondary)}
.search-box{position:relative}
.search-box input{width:220px;max-width:52vw;padding:9px 16px 9px 38px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-primary);font-size:.85em;backdrop-filter:blur(8px);outline:none;transition:border-color .25s,filter .25s}
.search-box input:focus{border-color:var(--gold);filter:url(#gooeyFilter)}
.search-box .s-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-md);backdrop-filter:blur(14px);box-shadow:var(--shadow-card);max-height:280px;overflow-y:auto;z-index:30;display:none}
.search-results.show{display:block}
.search-results .sr-item{padding:9px 16px;font-size:.85em;color:var(--text-primary);cursor:pointer;transition:background .15s;display:flex;justify-content:space-between;gap:8px}
.search-results .sr-item:hover,.search-results .sr-item.active{background:var(--gold-glow)}
.search-results .sr-item mark{background:none;color:var(--gold-bright);font-weight:700}
.search-results .sr-empty{padding:12px 16px;font-size:.82em;color:var(--text-muted)}
/* ===== 地图（铺满全宽 + 接近满屏高） ===== */
#china-map{position:relative;left:50%;right:50%;width:100vw;margin-left:-50vw;margin-right:-50vw;height:calc(100vh - var(--nav-h) - 12px);min-height:520px;overflow:hidden;border-top:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);background:rgba(8,12,22,0.4);backdrop-filter:blur(8px)}
.map-empty,.map-loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:.9em;text-align:center;padding:var(--space-8)}
/* ===== 站点页脚 ===== */
.site-footer{position:relative;margin-top:var(--space-10);padding:28px 20px 34px;text-align:center;border-top:1px solid var(--glass-border);background:var(--glass-bg);backdrop-filter:blur(10px)}
.site-footer .foot-run{font-size:.92em;color:var(--text-primary);letter-spacing:.02em;margin-bottom:6px}
.site-footer .foot-run b{color:var(--gold-bright);font-variant-numeric:tabular-nums;font-weight:600}
.site-footer .foot-stats{font-size:.84em;color:var(--text-secondary);margin-bottom:12px}
.site-footer .foot-stats b{color:var(--text-primary);font-variant-numeric:tabular-nums;font-weight:600}
.site-footer .foot-stats .sep{margin:0 10px;opacity:.4}
.site-footer .foot-meta{font-size:.82em;color:var(--text-secondary);margin-bottom:5px}
.site-footer .foot-meta .sep{margin:0 8px;opacity:.4}
.site-footer .foot-meta a{color:var(--gold);text-decoration:none;transition:color .2s}
.site-footer .foot-meta a:hover{color:var(--gold-bright);text-decoration:underline}
.site-footer .foot-contact{display:flex;justify-content:center;gap:20px;margin-top:14px}
.site-footer .foot-contact a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;color:var(--text-secondary);border:1px solid var(--glass-border);transition:color .2s,border-color .2s,transform .2s}
.site-footer .foot-contact a:hover{color:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.site-footer .foot-beian{font-size:.78em;color:var(--text-muted)}
.site-footer .foot-beian a{color:var(--text-muted);text-decoration:none}
.site-footer .foot-beian a:hover{color:var(--text-secondary)}
.site-footer .foot-beian .sep{margin:0 8px;opacity:.4}
/* ===== 轻提示 toast ===== */
#toastHost{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:6000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);padding:12px 22px;border-radius:var(--radius-pill);font-size:.9em;backdrop-filter:blur(14px);box-shadow:var(--shadow-card);opacity:0;transform:translateY(12px);transition:opacity .3s var(--ease-out),transform .3s var(--ease-out);white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
/* ===== 右下角后台入口 ===== */
.admin-fab{position:fixed;left:22px;bottom:22px;z-index:400;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-secondary);backdrop-filter:blur(14px);box-shadow:var(--shadow-card);transition:color .25s,border-color .25s,transform .25s var(--ease-out)}
.admin-fab:hover{color:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.admin-fab svg{width:20px;height:20px}
@media(max-width:768px){.admin-fab{left:14px;bottom:14px;width:40px;height:40px}}
.map-hint{text-align:center;color:var(--text-secondary);font-size:.88em;margin-top:var(--space-4);opacity:.85}
.stat-row{display:flex;justify-content:center;gap:var(--space-8);margin-top:var(--space-5);flex-wrap:wrap}
.stat-item{text-align:center}
.stat-item .num{font-family:var(--font-display);font-size:1.6em;color:var(--gold);font-weight:700}
.stat-item .lbl{font-size:.78em;color:var(--text-muted);letter-spacing:.05em}
/* ===== 记忆入口（地图上方）===== */
.mem-launch{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:var(--space-8) auto var(--space-5);
  max-width:var(--container-max);padding:0 var(--container-padding)}
.ml-btn{font:inherit;font-size:.88em;color:var(--text-secondary);background:var(--glass-bg);
  border:1px solid var(--glass-border);border-radius:var(--radius-pill);padding:9px 22px;cursor:pointer;
  transition:all .24s var(--ease-out);backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:7px}
.ml-btn:hover{color:var(--gold-bright);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 18px var(--gold-glow)}
.ml-ic{color:var(--gold);font-size:1.05em}
/* ===== 记忆弹出层 ===== */
.mem-pop{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:3vh 2vw}
.mem-pop.show{display:flex}
.mp-scrim{position:absolute;inset:0;background:rgba(4,6,14,.82);backdrop-filter:blur(7px)}
.mp-box{position:relative;z-index:2;width:min(1180px,96vw);height:min(88vh,880px);display:flex;flex-direction:column;
  background:linear-gradient(170deg,rgba(20,26,46,.98),rgba(11,14,22,.99));border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 1px rgba(212,168,67,.08);overflow:hidden}
.mp-bar{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5);
  border-bottom:1px solid var(--glass-border);flex:none}
.mp-tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.mp-tab{font:inherit;font-size:.86em;color:var(--text-secondary);background:transparent;border:1px solid var(--glass-border);
  border-radius:var(--radius-pill);padding:6px 18px;cursor:pointer;transition:all .22s var(--ease-out)}
.mp-tab:hover{color:var(--text-primary);border-color:var(--gold-glow)}
.mp-tab.on{color:#1a1200;background:var(--gold);border-color:var(--gold)}
.mp-close{font:inherit;font-size:1.6em;line-height:1;color:var(--text-secondary);background:transparent;border:0;
  cursor:pointer;padding:0 4px;flex:none}
.mp-close:hover{color:var(--gold-bright)}
.mp-body{flex:1;overflow-y:auto;padding:var(--space-6) var(--space-8)}
.mp-body::-webkit-scrollbar{width:7px}
.mp-body::-webkit-scrollbar-thumb{background:var(--gold-glow);border-radius:9px}
.mem-panel{min-height:200px}
.mem-loading{text-align:center;color:var(--text-muted);padding:var(--space-10) 0}
.mem-sub{font-size:.8em;color:var(--text-muted);text-align:center;margin-top:6px}
/* 统计卡片 */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-4);margin-bottom:var(--space-10)}
.mem-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:var(--space-5);text-align:center;backdrop-filter:blur(8px);transition:all .25s var(--ease-out)}
.mem-card:hover{border-color:var(--gold-glow);box-shadow:var(--shadow-card-hover);transform:translateY(-2px)}
.mem-card .v{font-family:var(--font-display);font-size:2em;font-weight:700;color:var(--gold-bright);line-height:1.2;font-variant-numeric:tabular-nums}
.mem-card .v small{font-size:.42em;color:var(--text-muted);margin-left:3px;font-weight:400}
.mem-card .k{font-size:.76em;color:var(--text-muted);letter-spacing:.06em;margin-top:6px}
.mem-block{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6);backdrop-filter:blur(8px)}
.mem-block h3{font-size:.94em;color:var(--text-primary);font-weight:600;margin-bottom:var(--space-4);display:flex;align-items:center;gap:8px}
.mem-block h3::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px}
.mem-bars{display:flex;flex-direction:column;gap:9px}
.mem-bar{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:10px;font-size:.8em}
.mem-bar .n{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-bar .track{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.mem-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:99px;transition:width .6s var(--ease-out)}
.mem-bar .c{color:var(--text-muted);text-align:right;font-variant-numeric:tabular-nums}
.mem-chips{display:flex;flex-wrap:wrap;gap:7px}
.mem-chip{font-size:.76em;color:var(--text-secondary);background:rgba(255,255,255,.04);border:1px solid var(--glass-border);border-radius:var(--radius-pill);padding:3px 12px}
.mem-chip b{color:var(--gold-bright);font-weight:600;margin-left:4px}
/* 时间足迹 */
.mem-time{position:relative;padding-left:30px;max-width:900px;margin:0 auto}
.mem-time::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold-glow) 30%,rgba(212,168,67,.06) 100%)}
.mem-year{font-family:var(--font-display);font-size:1.5em;font-weight:700;color:var(--gold-bright);
  margin:var(--space-6) 0 var(--space-4);position:relative;letter-spacing:.04em}
.mem-year::before{content:'';position:absolute;left:-30px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold-glow),0 0 0 4px rgba(212,168,67,.12)}
.mem-year:first-child{margin-top:0}
.mem-node{position:relative;margin-bottom:var(--space-6);background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);backdrop-filter:blur(8px);transition:all .25s var(--ease-out)}
.mem-node:hover{border-color:var(--gold-glow);transform:translateX(3px)}
.mem-node::before{content:'';position:absolute;left:-27px;top:22px;width:9px;height:9px;border-radius:50%;
  background:var(--gold-pale);border:2px solid var(--canvas);box-shadow:0 0 8px var(--gold-glow)}
.mem-node-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.mem-node-m{font-family:var(--font-mono);font-size:.92em;color:var(--gold-bright);font-weight:600}
.mem-node-city{font-size:.78em;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mem-node-n{font-size:.72em;color:var(--text-muted);flex:none}
.mem-thumbs{display:flex;gap:7px;flex-wrap:wrap}
.mem-thumb{width:70px;height:70px;border-radius:10px;object-fit:cover;cursor:pointer;background:rgba(255,255,255,.04);
  border:1px solid var(--glass-border);transition:all .22s var(--ease-out)}
.mem-thumb:hover{transform:scale(1.06);border-color:var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.mem-more{width:70px;height:70px;border-radius:10px;background:rgba(255,255,255,.05);border:1px dashed var(--glass-border);
  display:flex;align-items:center;justify-content:center;font-size:.8em;color:var(--text-muted);cursor:pointer;transition:all .22s}
.mem-more:hover{color:var(--gold-bright);border-color:var(--gold)}
@media (max-width:640px){
  .mem-time{padding-left:22px}
  .mem-year::before{left:-22px;width:11px;height:11px}
  .mem-node::before{left:-21px}
  .mem-thumb,.mem-more{width:56px;height:56px}
  .mem-bar{grid-template-columns:70px 1fr 40px}
}
/* ===== 未定位照片 ===== */
.unlocated{margin-top:var(--space-8)}
.unlocated summary{cursor:pointer;color:var(--text-secondary);font-size:.88em;padding:var(--space-3) 0}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-3);margin-top:var(--space-4)}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;border:1px solid var(--wf-hairline);background:var(--glass-bg)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.photo-thumb:hover img{transform:scale(1.08)}
/* ===== 城市详情页 ===== */
#city-detail{position:fixed;inset:0;z-index:5000;display:none;overflow-y:auto;background:var(--canvas)}
#city-detail.show{display:block;animation:detailIn .4s var(--ease-out)}
@keyframes detailIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.det-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(38px) brightness(.32);transform:scale(1.15)}
.det-scrim{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(11,14,20,.4),rgba(11,14,20,.82))}
[data-theme="light"] .det-scrim{background:linear-gradient(180deg,rgba(245,240,232,.4),rgba(245,240,232,.85))}
.det-inner{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:var(--space-16) var(--container-padding) var(--space-24);color:#fff}
[data-theme="light"] .det-inner{color:var(--text-primary)}
.det-back{position:sticky;top:20px;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--radius-pill);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:.85em;backdrop-filter:blur(10px);transition:background .25s;z-index:3}
[data-theme="light"] .det-back{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);color:var(--text-primary)}
.det-back:hover{background:rgba(255,255,255,.24)}
.det-title{font-family:var(--font-display);font-size:clamp(2.2rem,6vw,4rem);font-weight:700;margin:var(--space-8) 0 var(--space-2);color:var(--gold-bright);text-shadow:0 4px 30px rgba(0,0,0,.5)}
.det-sub{color:rgba(255,255,255,.7);font-size:.95em;margin-bottom:var(--space-8)}
[data-theme="light"] .det-sub{color:var(--text-secondary)}
.det-infobar{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-10)}
.det-infobar .ib{flex:1;min-width:120px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-md);padding:var(--space-5);backdrop-filter:blur(12px)}
[data-theme="light"] .det-infobar .ib{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08)}
.det-infobar .ib .v{font-family:var(--font-display);font-size:1.5em;color:var(--gold);font-weight:700}
.det-infobar .ib .k{font-size:.76em;color:rgba(255,255,255,.55);letter-spacing:.05em;margin-top:4px}
[data-theme="light"] .det-infobar .ib .k{color:var(--text-muted)}
.det-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-4)}
.det-photos .dp{position:relative;aspect-ratio:3/4;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.det-photos .dp img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.det-photos .dp:hover img{transform:scale(1.06)}
.det-photos .dp .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;font-size:.76em;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;opacity:0;transition:opacity .3s}
.det-photos .dp:hover .cap{opacity:1}
.det-desc{color:rgba(255,255,255,.85);font-size:1em;line-height:1.75;max-width:64ch;margin-bottom:var(--space-5)}
[data-theme="light"] .det-desc{color:var(--text-primary)}
.det-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--space-8)}
.det-tags .tg{padding:5px 13px;border-radius:var(--radius-pill);font-size:.8em;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff}
[data-theme="light"] .det-tags .tg{color:var(--text-primary);border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.04)}
.det-tags .tg.scenic{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.4)}
.det-tags .tg.food{background:rgba(251,146,60,.18);border-color:rgba(251,146,60,.4)}
.det-sec-title{font-family:var(--font-display);font-size:1.4em;color:var(--gold-bright);margin:var(--space-10) 0 var(--space-5)}
.det-attractions .attr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4)}
.attr-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;transition:transform .3s var(--ease-out),border-color .3s}
[data-theme="light"] .attr-card{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08)}
.attr-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.attr-card .ac-cover{aspect-ratio:16/10;background:#0d1017 center/cover;position:relative}
.attr-card .ac-cover .ac-cnt{position:absolute;right:8px;bottom:8px;font-size:.72em;background:rgba(0,0,0,.55);color:#fff;padding:2px 9px;border-radius:var(--radius-pill)}
.attr-card .ac-body{padding:12px 14px}
.attr-card .ac-name{font-weight:600;font-size:.95em;color:#fff}
[data-theme="light"] .attr-card .ac-name{color:var(--text-primary)}
.attr-card .ac-meta{font-size:.76em;color:rgba(255,255,255,.55);margin-top:3px}
[data-theme="light"] .attr-card .ac-meta{color:var(--text-muted)}
#attr-detail{position:fixed;inset:0;z-index:5100;display:none;overflow-y:auto;background:var(--canvas)}
#attr-detail.show{display:block}
/* ===== SmokyText ===== */
.smoky span{display:inline-block;white-space:pre;animation:smokeReveal 1.2s var(--ease-out) both}
@keyframes smokeReveal{0%{opacity:0;filter:blur(12px);transform:translateY(6px)}100%{opacity:1;filter:blur(0);transform:none}}
/* ===== 3D 旋转木马照片查看器（移植自 Your-China-Travel） ===== */
.img-viewer{position:fixed;inset:0;z-index:10010;background:rgba(15,17,22,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;overflow:hidden;opacity:0;transition:opacity .3s ease}
.img-viewer.show{display:flex;opacity:1}
.img-viewer .stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:visible;perspective:1400px;perspective-origin:50% 50%}
.img-viewer .carousel-ring{position:relative;width:var(--card-w,330px);height:var(--card-h,440px);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.img-viewer .carousel-ring.dragging{transition:none}
.img-viewer .carousel-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.4);opacity:0;transition:opacity .4s ease;transform:scale(1.1)}
.img-viewer.cover-bg-mode .carousel-bg{opacity:1}
.img-viewer.cover-bg-mode{background:transparent}
.img-viewer .photo-card{position:absolute;top:0;left:0;width:var(--card-w,330px);height:var(--card-h,440px);background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;backface-visibility:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5);transform-style:preserve-3d}
.img-viewer .photo-card img{width:100%;height:100%;object-fit:cover;border-radius:8px;user-select:none;-webkit-user-drag:none;pointer-events:none;display:block}
.img-viewer .photo-card.is-active{box-shadow:0 24px 80px rgba(56,189,248,.35),0 8px 32px rgba(0,0,0,.5)}
.img-viewer .nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(248,250,252,.1);border:1px solid rgba(248,250,252,.18);color:#fff;font-size:26px;display:grid;place-items:center;backdrop-filter:blur(8px);transition:background .25s,transform .25s,opacity .25s;z-index:20}
.img-viewer .nav-btn:hover{background:rgba(248,250,252,.22);transform:translateY(-50%) scale(1.1)}
.img-viewer .nav-btn.disabled{opacity:.25;pointer-events:none}
.img-viewer .nav-prev{left:28px}.img-viewer .nav-next{right:28px}
.img-viewer .close-btn{position:absolute;top:22px;right:28px;width:42px;height:42px;border-radius:50%;background:rgba(248,250,252,.1);border:1px solid rgba(248,250,252,.18);color:#fff;font-size:22px;display:grid;place-items:center;backdrop-filter:blur(8px);transition:background .25s,transform .25s;z-index:20}
.img-viewer .close-btn:hover{background:rgba(232,148,60,.55);transform:rotate(90deg)}
.img-viewer .counter{position:absolute;top:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:14px;font-weight:500;background:rgba(0,0,0,.35);padding:6px 18px;border-radius:20px;backdrop-filter:blur(8px);z-index:20}
.img-viewer .thumb-strip{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 12px;background:rgba(0,0,0,.3);border-radius:12px;backdrop-filter:blur(8px);max-width:90vw;overflow-x:auto;overflow-y:hidden;z-index:20}
.img-viewer .thumb-strip::-webkit-scrollbar{height:0}
.img-viewer .thumb-strip .thumb{width:52px;height:52px;border-radius:6px;object-fit:cover;cursor:pointer;opacity:.5;flex-shrink:0;border:2px solid transparent;transition:opacity .2s,transform .2s,border-color .2s}
.img-viewer .thumb-strip .thumb:hover{opacity:.85;transform:scale(1.05)}
.img-viewer .thumb-strip .thumb.active{opacity:1;transform:scale(1.2);border-color:rgba(232,148,60,.8);box-shadow:0 4px 16px rgba(232,148,60,.3)}
.img-viewer .hint{position:absolute;bottom:90px;right:28px;color:rgba(255,255,255,.3);font-size:11px;z-index:20}
/* ===== 查看模式切换（普通 / 3D 照片环） ===== */
.view-mode-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
/* ===== 城市记忆：相册排版（按日期分组，1/2/3/4 图自动排版）===== */
.vseg{display:flex;gap:0;border:1px solid var(--glass-border);border-radius:var(--radius-pill);overflow:hidden}
.vseg-b{font:inherit;font-size:.78em;color:var(--text-muted);background:transparent;border:0;padding:4px 16px;cursor:pointer;transition:all .2s}
.vseg-b:hover{color:var(--text-secondary)}
.vseg-b.on{color:#1a1200;background:var(--gold)}
.det-album{display:none;flex-direction:column;gap:var(--space-8);padding-bottom:var(--space-6)}
.det-album.show{display:flex}
.alb-group{position:relative}
.alb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-3);
  padding-bottom:8px;border-bottom:1px solid var(--glass-border)}
.alb-date{font-family:var(--font-mono);font-size:.88em;color:var(--gold-bright);font-weight:600;letter-spacing:.02em}
.alb-city{font-size:.78em;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb-n{font-size:.72em;color:var(--text-muted);margin-left:auto}
.alb-grid{display:grid;gap:10px}
.alb-grid.g1{grid-template-columns:1fr}
.alb-grid.g2{grid-template-columns:1fr 1fr}
.alb-grid.g3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.alb-grid.g3 > :first-child{grid-row:1 / span 2}
.alb-grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.alb-grid.gN{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.alb-ph{position:relative;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;background:rgba(255,255,255,.04);
  border:1px solid var(--glass-border);transition:all .25s var(--ease-out);min-height:120px}
.alb-ph:hover{border-color:var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.alb-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease-out)}
.alb-ph:hover img{transform:scale(1.04)}
.alb-grid.g1 .alb-ph{aspect-ratio:16/9}
.alb-grid.g2 .alb-ph{aspect-ratio:4/3}
.alb-grid.g3 .alb-ph{aspect-ratio:auto;min-height:calc(50% - 5px)}
.alb-grid.g4 .alb-ph{aspect-ratio:1/1}
.alb-grid.gN .alb-ph{aspect-ratio:1/1}
.alb-cap{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;font-size:.74em;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .25s}
.alb-ph:hover .alb-cap{opacity:1}
.alb-empty{color:var(--text-muted);font-size:.84em;text-align:center;padding:var(--space-8) 0}
/* ===== 旅行轨迹：路线清单 ===== */
#tripPanel{position:absolute;left:16px;top:16px;width:280px;max-height:calc(100% - 32px);z-index:12;
  background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);
  backdrop-filter:blur(14px);box-shadow:var(--shadow-card);display:none;flex-direction:column;overflow:hidden}
#tripPanel.show{display:flex}
.tp-head{padding:var(--space-4) var(--space-5) var(--space-3);border-bottom:1px solid var(--glass-border)}
.tp-title{font-size:.9em;color:var(--text-primary);font-weight:600;display:flex;align-items:center;gap:7px}
.tp-title::before{content:'';width:3px;height:13px;background:var(--gold);border-radius:2px}
.tp-sub{font-size:.74em;color:var(--text-muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tp-list{overflow-y:auto;padding:8px 6px var(--space-4);flex:1}
.tp-list::-webkit-scrollbar{width:5px}
.tp-list::-webkit-scrollbar-thumb{background:var(--gold-glow);border-radius:9px}
.tp-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:6px 9px;border-radius:9px;
  font-size:.78em;transition:all .25s var(--ease-out)}
.tp-row .i{font-family:var(--font-mono);color:var(--text-muted);font-size:.9em;text-align:right}
.tp-row .n{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-row .d{color:var(--text-muted);font-family:var(--font-mono);font-size:.88em}
.tp-row.done{background:rgba(212,168,67,.07)}
.tp-row.done .n{color:var(--text-primary)}
.tp-row.now{background:var(--gold-glow);box-shadow:inset 0 0 0 1px var(--gold-pale)}
.tp-row.now .n{color:var(--gold-bright);font-weight:600}
.tp-row.now .i{color:var(--gold-bright)}
@media (max-width:760px){#tripPanel{width:calc(100% - 32px);max-height:44%}}
/* ===== 记忆书架：外观照搬参考项目 Your-China-Travel 的纸质书 ===== */
.shelf-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:26px 22px;margin-bottom:var(--space-4)}
/* 书：米白纸纹 + 左侧书脊压痕 + 右侧圆角 + 投影（对应 .shared-cover） */
.shelf-book{position:relative;aspect-ratio:5/6.4;cursor:pointer;overflow:hidden;
  border:1px solid #c8c5bb;border-radius:3px 12px 12px 3px;color:#183846;
  background:radial-gradient(#ae8f691a .6px,transparent .8px) 0 0/5px 5px,#f4f1e8;
  box-shadow:0 10px 22px rgba(24,56,70,.22);transition:transform .3s var(--ease-out),box-shadow .3s var(--ease-out)}
.shelf-book:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(24,56,70,.34)}
.shelf-book::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;z-index:4;pointer-events:none;
  background:linear-gradient(to right,rgba(59,42,27,.20),rgba(59,42,27,.04) 55%,transparent)}
/* 下半：封面图，从 26% 开始（同参考项目 .shared-cover-art inset:26% 0 0） */
.sb-bottom{position:absolute;left:0;right:0;bottom:0;top:26%;overflow:hidden}
.sb-bottom img{width:100%;height:100%;object-fit:cover;display:block}
.sb-bottom::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,#f4f1e8,transparent 30%,transparent 68%,rgba(13,34,43,.60))}
/* 上半：省份名（serif 深墨色，位置同参考项目 left:9% top:13%） */
.sb-top{position:absolute;left:9%;right:8%;top:12%;z-index:3}
.sb-prov{display:block;font-family:'Songti SC','Noto Serif SC',serif;font-size:1.16em;font-weight:700;
  color:#183846;letter-spacing:.02em;line-height:1.28;white-space:pre-line;overflow-wrap:anywhere}
.sb-badge{position:absolute;right:8%;bottom:5%;z-index:3;color:#fffdf3;font-size:.72em;font-weight:600;
  letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
/* 书里的页面一律纸质（对应 .book-page） */
.book-page{color:#244653;border:1px solid #d5cbbc;
  background:radial-gradient(#ae8f6922 .6px,transparent .8px) 0 0/5px 5px,linear-gradient(100deg,#ede4d4,#f8f3e9 22%,#f4ede1)}
.bp-inner{background:transparent;color:#244653}
/* 第 1 页：书封 */
.bp-prov{position:relative;height:100%;color:#183846;
  background:radial-gradient(#ae8f691a .6px,transparent .8px) 0 0/5px 5px,#f4f1e8}
.bp-prov-top{position:absolute;left:9%;right:8%;top:11%;z-index:3;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bp-prov-name{font-family:'Songti SC','Noto Serif SC',serif;font-size:clamp(20px,2.4vw,30px);font-weight:700;
  color:#183846;letter-spacing:.02em;overflow-wrap:anywhere}
.bp-prov-sub{font-size:12px;color:#657b80;font-weight:600;white-space:nowrap}
.bp-prov-img{position:absolute;left:0;right:0;bottom:0;top:26%;overflow:hidden}
.bp-prov-img img{width:100%;height:100%;object-fit:cover;display:block}
.bp-prov-img::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,#f4f1e8,transparent 30%,transparent 70%,rgba(13,34,43,.55))}
.bp-noimg{position:absolute;inset:26% 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:.82em;color:#657b80;text-align:center;line-height:1.9;background:#f4f1e8}
.bp-noimg small{opacity:.8;font-size:.9em}
/* 目录页 */
.bp-toc .bp-inner{justify-content:flex-start;padding-top:7%}
.bp-eyebrow{font-size:12px;color:#8d775f;letter-spacing:.08em;margin:0}
.bp-toc .bp-city,.bp-review .bp-city{font-family:'Songti SC','Noto Serif SC',serif;color:#183846}
.bp-toc .bp-city{font-size:clamp(20px,2.2vw,28px);margin:6px 0 0}
.toc-list{width:100%;max-width:420px;margin:14px auto 0;display:flex;flex-direction:column;gap:7px;
  max-height:58%;overflow-y:auto;padding-right:4px}
.toc-list::-webkit-scrollbar{width:5px}
.toc-list::-webkit-scrollbar-thumb{background:rgba(141,119,95,.4);border-radius:9px}
.toc-row{font:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:#fffdf8;border:1px solid #d5cbbc;border-radius:6px;padding:9px 14px;cursor:pointer;
  transition:all .22s var(--ease-out);text-align:left;box-shadow:0 2px 6px rgba(75,56,42,.08)}
.toc-row:hover{background:#fff;border-color:#ae8f69;transform:translateX(4px);box-shadow:0 4px 12px rgba(75,56,42,.16)}

.toc-m{color:#8d775f;font-size:.78em;flex:none}
/* 城市评价页 */
.bp-review .bp-inner{justify-content:center;gap:6px}
.bp-review .bp-city{font-size:clamp(20px,2.2vw,28px);margin:4px 0 2px}
.bp-stars{color:#c8862f;font-size:1.05em;letter-spacing:2px;margin:0}
.bp-review .bp-desc{font-size:14px;color:#3b5a66;line-height:1.95;max-width:84%;margin-top:10px;
  text-align:left;white-space:pre-wrap}
.bp-nod{opacity:.72;text-align:center}
.bp-stat{font-size:12px;color:#8d775f;margin-top:10px}
.bp-hint{font-size:12px;color:#8d775f;margin-top:auto;padding-top:12px}
.bk-page{font-size:.8em;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
/* 翻页相册弹层 */
.book-layer{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center}
.book-layer.show{display:flex}
.bk-scrim{position:absolute;inset:0;background:rgba(4,6,14,.9);backdrop-filter:blur(6px)}
.bk-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:var(--space-4);
  width:min(92vw,900px);max-height:94vh}
.bk-bar{display:flex;align-items:center;justify-content:space-between;width:100%;gap:var(--space-4)}
.bk-title{font-family:var(--font-display);font-size:1.05em;color:var(--gold-bright);font-weight:600}
.bk-close{font:inherit;font-size:1.5em;line-height:1;color:var(--text-secondary);background:transparent;border:0;cursor:pointer;padding:0 6px}
.bk-close:hover{color:var(--gold-bright)}
.bk-book{width:min(92vw,860px);height:min(70vh,560px)}
.bk-book.bk-fallback{height:auto;max-height:68vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-4)}
.bk-book.bk-fallback .book-page{height:auto}
.bk-book.bk-fallback .bp-photo img{max-height:60vh;object-fit:contain}
.bp-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0d1220;color:var(--text-primary);padding:var(--space-6);text-align:center;overflow:hidden}
.bp-cover .bp-eyebrow{font-size:.76em;color:var(--text-muted);letter-spacing:.08em}
.bp-cover .bp-city{font-family:var(--font-display);font-size:1.9em;color:var(--gold-bright);margin:8px 0 12px}
.bp-cover .bp-desc{font-size:.86em;color:var(--text-secondary);line-height:1.75;max-width:80%}
.bp-cover .bp-stat{font-size:.8em;color:var(--text-muted);margin-top:16px;font-variant-numeric:tabular-nums}
.bp-cover .bp-hint{font-size:.72em;color:var(--text-muted);margin-top:auto;opacity:.6}
.bp-photo{padding:0;justify-content:flex-start;background:#070a12}
.bp-photo img{width:100%;height:calc(100% - 54px);object-fit:cover;display:block}
.bp-cap{width:100%;padding:9px 14px;font-size:.8em;color:var(--text-secondary);display:flex;justify-content:space-between;gap:10px;
  background:rgba(255,255,255,.03);border-top:1px solid var(--glass-border);min-height:54px;align-items:center}
.bp-cap .bp-date{color:var(--text-muted);font-family:var(--font-mono);font-size:.92em;flex:none}
.bk-foot{display:flex;align-items:center;gap:var(--space-4)}
.bk-nav{font:inherit;font-size:.84em;color:var(--text-secondary);background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-pill);padding:6px 18px;cursor:pointer;transition:all .2s}
.bk-nav:hover{color:var(--gold-bright);border-color:var(--gold)}
.bk-page{font-size:.8em;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
/* ===== 照片流 ===== */
.stream-host{position:relative;width:100%;height:min(74vh,760px);border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--glass-border);background:#03040a;box-shadow:var(--shadow-card)}
.stream-frame{width:100%;height:100%;border:0;display:block}
.stream-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:var(--space-8);pointer-events:none;
  background:radial-gradient(ellipse at 50% 30%,rgba(125,140,255,.14),transparent 62%),#03040a}
.stream-frame + .stream-ph,.stream-frame ~ .stream-ph{display:none}
.sp-ic{font-size:2.2em;color:#7d8cff;opacity:.85;animation:spPulse 2.6s ease-in-out infinite}
@keyframes spPulse{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.sp-t{font-family:var(--font-display);font-size:1.3em;color:var(--text-primary);letter-spacing:.05em}
.sp-d{font-size:.84em;color:var(--text-secondary);line-height:1.9}
.sp-loader{margin-top:6px}
.sp-loader i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid rgba(125,140,255,.25);
  border-top-color:#7d8cff;animation:spSpin .9s linear infinite}
@keyframes spSpin{to{transform:rotate(360deg)}}
.mem-sub + .stream-host{margin-top:var(--space-4)}
.view-mode-row .vm-label{font-size:.82em;color:rgba(255,255,255,.6);letter-spacing:.03em}
[data-theme="light"] .view-mode-row .vm-label{color:var(--text-secondary)}
.switch{position:relative;width:50px;height:28px;border-radius:var(--radius-pill);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:background .25s var(--ease-out);flex-shrink:0}
[data-theme="light"] .switch{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.1)}
.switch .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s var(--ease-out)}
.switch[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.switch[aria-checked="true"] .knob{transform:translateX(22px)}
/* ===== 3D 地球开屏 ===== */
#launch{position:fixed;inset:0;z-index:9000;background:radial-gradient(circle at 50% 42%,#0a1424 0%,#050810 55%,#02030a 100%);overflow:hidden;opacity:1;transition:opacity 1s var(--ease-out)}
#launch.hide{opacity:0;pointer-events:none}
#launchStars,#launchGlobe{position:absolute;inset:0;width:100%;height:100%;display:block}
#launchGlobe{z-index:2}
/* 可选增强：写实 3D 地球。默认 opacity:0 不显示，只有设备真跑得起「写实」档时才淡入盖上来；
   跑不动（低配 / 老 GPU / 无 WebGL）就一直是 0，保持上面那台简略版地球 */
#launchGl{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity 1s var(--ease-out);pointer-events:auto;cursor:grab}
#launchGl.on{opacity:1}
.launch-overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:none}
.launch-eyebrow{font-family:'InterVar',var(--font-body);font-size:13px;letter-spacing:4px;color:rgba(212,168,67,.75);text-transform:uppercase;margin-bottom:18px;opacity:0;animation:launchFade .9s .3s var(--ease-out) forwards;pointer-events:auto}
.launch-eyebrow .vp-char{display:inline-block;font-variation-settings:'wght' 400;transition:none;will-change:font-variation-settings,color,filter}
.launch-eyebrow .vp-space{width:.34em}
.launch-title{margin-bottom:14px;display:flex;justify-content:center;line-height:1}
#launchTitleCanvas{display:block}
.launch-sub{color:rgba(226,232,240,.72);font-size:1.02em;margin-bottom:34px;opacity:0;animation:launchFade 1s 1.1s var(--ease-out) forwards}
@keyframes launchFade{to{opacity:1}}
@keyframes launchChar{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
/* ShinyButton：conic 旋转描边 */
.shiny-btn{position:relative;pointer-events:auto;padding:14px 40px;border:none;border-radius:var(--radius-pill);background:transparent;color:#fff;font-size:1em;font-weight:600;letter-spacing:.05em;cursor:pointer;opacity:0;animation:launchFade 1s 1.4s var(--ease-out) forwards;isolation:isolate}
.shiny-btn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.6px;background:conic-gradient(from var(--ang,0deg),transparent 0%,var(--gold-bright) 20%,transparent 40%,transparent 60%,#38bdf8 80%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shinySpin 3.5s linear infinite}
.shiny-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(212,168,67,.1);backdrop-filter:blur(6px);z-index:-1;transition:background .25s}
.shiny-btn:hover::after{background:rgba(212,168,67,.22)}
.shiny-btn span{position:relative;z-index:1}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes shinySpin{to{--ang:360deg}}
@media(prefers-reduced-motion:reduce){.shiny-btn::before{animation:none}.launch-eyebrow .vp-char{transition:none}}
/* ===== 响应式 ===== */
@media(max-width:768px){
  :root{--nav-h:52px;--container-padding:16px}
  .nav-links{display:none;position:fixed;top:var(--nav-h);left:0;right:0;flex-direction:column;background:var(--glass-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:var(--space-3);z-index:999}
  .nav-links.open{display:flex}
  .nav-link{width:100%;text-align:center;padding:12px}
  .nav-hamburger{display:flex}
  .nav-spacer{display:none}
  .search-box input{width:150px}
  .img-viewer .hint{display:none}
  .img-viewer .nav-btn{width:44px;height:44px;font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

/* ===== Ferrofluid 背景（移植自 Your-China-Travel） ===== */
(function(){
  const cv=document.getElementById('ferrofluidBg');if(!cv)return;
  const ctx=cv.getContext('2d');let W=0,H=0,DPR=1;const blobs=[];
  const palette=['rgba(56,189,248,0.16)','rgba(125,211,252,0.14)','rgba(203,213,225,0.13)','rgba(14,165,233,0.15)'];
  function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;cv.width=Math.max(1,W*DPR|0);cv.height=Math.max(1,H*DPR|0);ctx.setTransform(DPR,0,0,DPR,0,0);}
  function initBlobs(){blobs.length=0;if(W<=0||H<=0)return;for(let i=0;i<7;i++)blobs.push({x:Math.random()*W,y:Math.random()*H,r:120+Math.random()*160,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,c:palette[i%palette.length],ph:Math.random()*6.28});}
  let t=0,skip=0;
  function draw(){skip++;if(skip<2){requestAnimationFrame(draw);return;}skip=0;t+=.006;ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';blobs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<-b.r)b.x=W+b.r;if(b.x>W+b.r)b.x=-b.r;if(b.y<-b.r)b.y=H+b.r;if(b.y>H+b.r)b.y=-b.r;const rr=b.r*(1+Math.sin(t*1.3+b.ph)*.12);const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,rr);g.addColorStop(0,b.c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,rr,0,6.2832);ctx.fill();});ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw);}
  addEventListener('resize',()=>{resize();initBlobs();});resize();initBlobs();requestAnimationFrame(draw);
})();

/* ===== 数据（读新 D1 API：/cities + /photos） ===== */
let CITIES=[],GALLERY=[],mapCityPoints=[],mapUnlocated=[];
// 省级 adcode -> 省名（供地图省界高亮 + 统计覆盖省份数）
// 注意：之前是从 CHINA_GEO 的 properties.adcode 建的，但当初压缩 GeoJSON 时把 adcode
// 字段删掉了（只剩 name），于是索引里只有一个 "undefined" 键，省名全是空 ——
// 表现就是"覆盖省份 0"。这里改用标准行政区划代码表，稳定且不依赖 geo 文件。
const PROV_NAME_BY_ADCODE={
  '110000':'北京市','120000':'天津市','130000':'河北省','140000':'山西省','150000':'内蒙古自治区',
  '210000':'辽宁省','220000':'吉林省','230000':'黑龙江省','310000':'上海市','320000':'江苏省',
  '330000':'浙江省','340000':'安徽省','350000':'福建省','360000':'江西省','370000':'山东省',
  '410000':'河南省','420000':'湖北省','430000':'湖南省','440000':'广东省','450000':'广西壮族自治区',
  '460000':'海南省','500000':'重庆市','510000':'四川省','520000':'贵州省','530000':'云南省',
  '540000':'西藏自治区','610000':'陕西省','620000':'甘肃省','630000':'青海省','640000':'宁夏回族自治区',
  '650000':'新疆维吾尔自治区','710000':'台湾省','810000':'香港特别行政区','820000':'澳门特别行政区'
};
let PROV_BY_ADCODE={};
function buildProvIndex(){
  PROV_BY_ADCODE=Object.assign({},PROV_NAME_BY_ADCODE);
  // 若本地 geo 将来带回了 adcode，以它为准（名称可能与代码表略有差异）
  try{
    if(window.CHINA_GEO&&CHINA_GEO.features){
      CHINA_GEO.features.forEach(f=>{
        const p=(f&&f.properties)||{};
        if(p.adcode!=null&&p.name)PROV_BY_ADCODE[String(p.adcode)]=p.name;
      });
    }
  }catch(e){}
}
// 把 API 的 photo 归一化成下游期望的形状（url->image，ord->index）
function normPhoto(p){return {index:p.id,image:p.url,caption:p.caption||'',date:p.date||'',cityKey:p.cityKey};}
/* 图片体积优化：原图是 12–36MP（单张最大 4.7MB），而网格仅显示约 180–300px、
   3D 环图卡片约 330px，直接把原图塞进去是「图片加载慢」的根因。
   图床已额外上传两档派生版本（文件名加 _600 / _1600 后缀，放在 webp/600/ 与 webp/1600/）：
     600px  —— 网格 / 缩略条，69 张合计仅 2.5MB
     1600px —— 3D 环图卡片，69 张合计 13.6MB
   原图保留不动，后台仍使用原图 URL。 */
function optUrl(imgUrl,size){
  if(!imgUrl)return imgUrl;
  // 只处理图床的 webp 照片；外链、非 webp 的自定义图片一律原样返回，避免 404
  if(!/^https:\/\/img\.231060101\.xyz\/file\//.test(imgUrl))return imgUrl;
  const i=imgUrl.lastIndexOf('/');if(i<0)return imgUrl;
  const encName=imgUrl.slice(i+1);
  let base;try{base=decodeURIComponent(encName);}catch(e){base=encName;}
  if(!/\.webp$/i.test(base))return imgUrl;
  // 幂等：入参可能已经是 _600/_1600 版（例如缩略条传进来的是环图用的 1600 地址）。
  // 先剥掉可能已有的尺寸目录与文件名后缀，再按目标尺寸重新拼装，
  // 既能避免拼出 xxx_1600_600.webp，也能正确处理 1600 <-> 600 互换。
  const stem=base.replace(/_\d+\.webp$/i,'').replace(/\.[^.]+$/,'');
  let dir=imgUrl.slice(0,i+1).replace(/\/webp\/\d+\/$/,'/webp/');
  if(/\/webp\/$/.test(dir))dir=dir+size+'/';
  return dir+encodeURIComponent(stem+'_'+size+'.webp');
}
const thumbUrl=u=>optUrl(u,600);
const viewUrl=u=>optUrl(u,1600);
function buildMapData(){
  buildProvIndex();
  const byKey=new Map();
  // 用 /cities 建城市点（有坐标才上图）
  CITIES.forEach(c=>{
    if(c.lng==null||c.lat==null)return;
    byKey.set(c.cityKey,{cityKey:c.cityKey,cityName:c.name,name:PROV_BY_ADCODE[c.adcode]||'',adcode:c.adcode,
      coords:[c.lng,c.lat],rating:c.rating,description:c.description,visitMonths:c.visitMonths,tags:c.tags,
      isHometown:c.isHometown,cover:c.cover,photos:[]});
  });
  const unlocated=[];
  GALLERY.forEach(p=>{
    const np=normPhoto(p);
    if(np.cityKey&&byKey.has(np.cityKey))byKey.get(np.cityKey).photos.push(np);
    else unlocated.push(np);
  });
  return {cities:[...byKey.values()].filter(c=>c.photos.length),unlocated};
}
async function loadGallery(){
  try{
    const [rc,rp]=await Promise.all([fetch(API+'/cities'),fetch(API+'/photos')]);
    if(!rc.ok||!rp.ok)throw new Error('HTTP '+rc.status+'/'+rp.status);
    CITIES=await rc.json();GALLERY=await rp.json();
  }catch(e){
    document.getElementById('mapMount').innerHTML='<div class="map-empty">照片数据加载失败：'+escHtml(e.message)+'<br>请稍后刷新重试</div>';
    return;
  }
  renderAll();
}
/* ===== ECharts 依赖（多 CDN 回落） ===== */
let _echartsReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('加载失败'));document.head.appendChild(s);});}
function ensureECharts(){
  if(_echartsReady)return _echartsReady;
  _echartsReady=(async()=>{
    if(window.echarts)return;
    const cdns=['https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js','https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js','https://unpkg.com/echarts@5.4.3/dist/echarts.min.js'];
    for(const c of cdns){try{await loadScript(c);if(window.echarts)return;}catch(e){}}
    throw new Error('ECharts 不可用');
  })();
  return _echartsReady;
}

/* ===== 地图渲染（城市行政图 / 省份图 双视图 + 全城市暗点 + 家乡标记） ===== */
// 五角星 SVG path（家乡标记用）
const STAR_PATH='path://M512 76 L640 396 L976 396 L704 608 L816 940 L512 736 L208 940 L320 608 L48 396 L384 396 Z';
let mapChart=null,mapView='city',mapZoom=1.2,cityAdminGeo=null,allCityDots=[];
function loadScriptOnce(src,flag){return new Promise((res,rej)=>{if(window[flag]){res();return;}const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('加载失败 '+src));document.head.appendChild(s);});}
// 合并全国「地级市/直辖市」行政边界成一张图（省份 geo 里的地级市 + 四直辖市整体 polygon）
function buildCityAdminGeo(){
  if(cityAdminGeo)return cityAdminGeo;
  if(!window.CHINA_PROVINCES_GEO)return null;
  const feats=[];
  for(const k in window.CHINA_PROVINCES_GEO){
    // 直辖市（区级）跳过，用 CHINA_GEO 的整体 polygon 代替，避免碎成一堆区
    if(['110000','120000','310000','500000'].includes(k))continue;
    for(const f of window.CHINA_PROVINCES_GEO[k].features)feats.push(f);
  }
  if(window.CHINA_GEO)for(const f of window.CHINA_GEO.features){if(['北京市','天津市','上海市','重庆市'].includes(f.properties.name))feats.push(f);}
  cityAdminGeo={type:'FeatureCollection',features:feats};
  return cityAdminGeo;
}
// 全部 510 城的暗点（排除已去过的，避免和亮点重叠）
function buildAllCityDots(visitedNames){
  if(!window.CITIES_GEO)return [];
  const out=[];
  for(const name in window.CITIES_GEO){
    if(visitedNames.has(name))continue;
    const g=window.CITIES_GEO[name];
    out.push({name,coords:[g[0],g[1]],province:g[2]});
  }
  return out;
}
// 命中测试放 ZR 层：effectScatter 涟漪图元无 dataIndex，会吞 ECharts 高层 series click
function pointHitRadius(c){const n=(c.photos&&c.photos.length)||1;return c.isHometown?Math.min(24+n,34):Math.min(10+n*1.5,22);}
function bindMapClick(){
  const zr=mapChart.getZr();zr.off('click');
  zr.on('click',ev=>{
    const x=ev.offsetX,y=ev.offsetY;
    // 1) 先测已去过城市（亮点）→ 打开详情
    let best=null,bestD=Infinity;
    for(const c of mapCityPoints){const p=mapChart.convertToPixel({geoIndex:0},c.coords);if(!p)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bestD){bestD=d;best=c;}}
    if(best&&bestD<=pointHitRadius(best)+6){openCityDetail(best);return;}
    // 2) 再测未去过城市（暗点）→ 提示
    let dn=null,dnD=Infinity;
    for(const c of allCityDots){const p=mapChart.convertToPixel({geoIndex:0},c.coords);if(!p)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<dnD){dnD=d;dn=c;}}
    if(dn&&dnD<=14){toast('前面的区域以后再来探索吧');return;}
  });
}
function renderAll(){
  const {cities,unlocated}=buildMapData();
  mapCityPoints=cities;mapUnlocated=unlocated;
  allCityDots=buildAllCityDots(new Set(cities.map(c=>c.cityName)));
  renderStats();renderUnlocated();renderMemZone();
  const el=document.getElementById('mapMount');
  if(!cities.length&&!unlocated.length){el.innerHTML='<div class="map-empty">还没有照片 —— 登录后上传并标注城市，这里就会点亮</div>';return;}
  ensureECharts().then(()=>drawMap()).catch(e=>{el.innerHTML='<div class="map-empty">地图加载失败：'+escHtml(e.message)+'</div>';});
}
function citySeries(points,labelShow){
  const home=points.filter(c=>c.isHometown),norm=points.filter(c=>!c.isHometown);
  const mk=c=>({name:c.cityName,value:[c.coords[0],c.coords[1],c.photos.length],cityName:c.cityName,province:c.name,photos:c.photos,_city:c});
  const dot=c=>({name:c.name,value:[c.coords[0],c.coords[1]],_dim:true});
  return [
    // 未去过城市：小暗点（全部 510 城）
    {name:'未探索',type:'scatter',coordinateSystem:'geo',data:allCityDots.map(dot),silent:false,
      symbolSize:4,itemStyle:{color:'rgba(148,163,184,.42)'},
      emphasis:{scale:1.6,itemStyle:{color:'rgba(203,213,225,.9)'}},z:4},
    // 已去过城市：发光点（缩小涟漪/光晕）
    {name:'已记录城市',type:'effectScatter',coordinateSystem:'geo',data:norm.map(mk),
      symbolSize:v=>Math.min(8+(v[2]||1)*1.4,18),rippleEffect:{brushType:'stroke',scale:2.4,period:4},
      label:{show:labelShow,formatter:p=>mapZoom>=2.4?p.data.cityName:String(p.data.photos.length),color:'#dbeafe',fontSize:10,position:'right'},
      itemStyle:{color:'#38bdf8',shadowBlur:8,shadowColor:'rgba(56,189,248,.5)'},z:6},
    // 家乡：金色五角星
    {name:'家乡',type:'effectScatter',coordinateSystem:'geo',data:home.map(mk),
      symbol:STAR_PATH,symbolSize:v=>Math.min(24+(v[2]||1)*1.4,38),symbolKeepAspect:true,rippleEffect:{brushType:'stroke',scale:2.8,period:3.5},
      label:{show:true,formatter:p=>p.data.cityName,position:'top',color:'#f5c451',fontSize:11,fontWeight:'bold'},
      itemStyle:{color:'#f5c451',shadowBlur:14,shadowColor:'rgba(245,196,81,.7)'},z:7}
  ];
}
const commonTooltip={trigger:'item',backgroundColor:'rgba(8,8,8,.92)',borderColor:'rgba(212,168,67,.5)',textStyle:{color:'#f8fafc',fontSize:12},formatter:p=>{
  if(p.seriesType==='effectScatter'){const n=(p.data.photos||[]).length;return '<b>'+escHtml(p.data.cityName)+'</b>'+(p.data._city&&p.data._city.isHometown?' ★家乡':'')+'<br/>'+n+' 张照片<br/><span style="color:#94a3b8;font-size:11px">点击查看</span>';}
  if(p.seriesType==='scatter'&&p.data&&p.data._dim)return '<b>'+escHtml(p.data.name)+'</b><br/><span style="color:#94a3b8;font-size:11px">尚未探索</span>';
  return '';
}};
async function drawMap(){
  const el=document.getElementById('mapMount');
  // 城市视图需要地级市边界（3.9MB，按需加载）
  if(mapView==='city'){
    if(!window.CHINA_PROVINCES_GEO){el.innerHTML='<div class="map-loading">加载城市行政边界…</div>';try{await loadScriptOnce('assets/china-provinces-geo.js?v=20261001','CHINA_PROVINCES_GEO');}catch(e){toast('城市边界加载失败，暂用省份视图');mapView='province';syncViewTabs();}}
  }
  if(!window.CHINA_GEO){el.innerHTML='<div class="map-empty">缺少地理数据</div>';return;}
  if(mapChart){mapChart.dispose();mapChart=null;}
  el.innerHTML='';
  mapChart=echarts.init(el,null,{renderer:'canvas'});
  let mapName,regions;
  if(mapView==='city'){
    const geo=buildCityAdminGeo();
    echarts.registerMap('china-cities',geo);mapName='china-cities';
    const litSet=new Set(mapCityPoints.map(c=>c.cityName));
    regions=geo.features.map(f=>{const n=f.properties.name,lit=litSet.has(n);return {name:n,itemStyle:{areaColor:lit?'rgba(56,189,248,0.30)':'rgba(6,10,18,0.5)',borderColor:lit?'#38bdf8':'rgba(90,105,130,.45)',borderWidth:lit?1:0.4}};});
  }else{
    echarts.registerMap('china',window.CHINA_GEO);mapName='china';
    const provSet=new Set(mapCityPoints.map(c=>c.name).filter(Boolean));
    regions=window.CHINA_GEO.features.map(f=>{const n=f.properties.name,lit=provSet.has(n);return {name:n,itemStyle:{areaColor:lit?'rgba(56,189,248,0.16)':'rgba(6,10,18,0.5)',borderColor:lit?'#38bdf8':'#475569',borderWidth:lit?1:0.6}};});
  }
  mapChart.setOption({backgroundColor:'transparent',animation:false,
    textStyle:{fontFamily:'-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif'},
    tooltip:commonTooltip,
    geo:{map:mapName,roam:true,zoom:1.2,center:[104,36],scaleLimit:{min:.8,max:16},z:1,
      itemStyle:{areaColor:'rgba(6,10,18,0.5)',borderColor:'#475569',borderWidth:.5},
      regions,label:{show:false,color:'#9aa7bd',fontSize:10},
      emphasis:{itemStyle:{areaColor:'rgba(56,189,248,0.28)'},label:{show:false}}},
    series:[...citySeries(mapCityPoints,true),...tripLayers()]});
  mapChart.off('georoam');mapChart.on('georoam',()=>{const o=mapChart.getOption();mapZoom=(o.geo&&o.geo[0]&&o.geo[0].zoom)||1.2;if(provCardsOn)renderProvCards(false);});
  bindMapClick();
  if(provCardsOn)renderProvCards(false);
  openCityFromQuery();
}
// 深链：?city=渭南市 打开时直接进这座城市的详情
// （主页「已爬的山」里的山名链接就是走这里，见主站 linkMountains()）
let __cityDeepLinked=false;
function openCityFromQuery(){
  if(__cityDeepLinked)return;
  let name='';
  try{name=String(new URLSearchParams(location.search).get('city')||'').trim();}catch(e){}
  if(!name)return;
  __cityDeepLinked=true;
  const short=name.replace(/(市|自治州|地区|盟|自治县)$/,'');
  const c=mapCityPoints.find(x=>x.cityName===name)||mapCityPoints.find(x=>String(x.cityName).indexOf(short)===0);
  if(!c){toast('映像馆里还没有「'+name+'」的照片');return;}
  mapZoom=Math.max(mapZoom||1.2,3);
  try{mapChart.setOption({geo:{center:c.coords,zoom:3}});}catch(e){}

/* ===== 轨迹回放：按到访时间连线（ECharts lines + 流光 + 逐城揭示） ===== */
let tripOn=false,tripPlaying=false,tripTimer=null,tripN=0,tripSeq=[];
// 城市到访时间（越小越早）：优先 visitMonths（YYYY-MM），回落照片 date；解析不到→Infinity
function cityVisitTime(c){
  let best=Infinity;
  (c.visitMonths||[]).forEach(x=>{
    if(typeof x==='number')return;                 // 旧格式无年份，跳过精确排序
    const m=String(x).match(/^(\d{4})-(\d{1,2})$/);if(m)best=Math.min(best,(+m[1])*12+(+m[2]));
  });
  (c.photos||[]).forEach(p=>{
    const m=String(p.date||'').match(/(\d{4})\D{0,3}(\d{1,2})?/);
    if(m)best=Math.min(best,(+m[1])*12+(m[2]?+m[2]:1));
  });
  return best;
}
function buildTripSeq(){
  return mapCityPoints.map(c=>({c,t:cityVisitTime(c)}))
    .map((o,i)=>({...o,i}))                         // 稳定排序锚
    .sort((a,b)=>(a.t-b.t)||(a.i-b.i))
    .map(o=>({coords:o.c.coords,cityName:o.c.cityName,t:o.t}));
}
function tripLayers(){
  if(!tripOn||tripSeq.length<2)return [{name:'trip-path',type:'lines',coordinateSystem:'geo',data:[]},{name:'trip-nodes',type:'scatter',coordinateSystem:'geo',data:[]}];
  const n=Math.max(1,Math.min(tripN,tripSeq.length));
  const segs=[];
  for(let k=1;k<n;k++)segs.push({coords:[tripSeq[k-1].coords,tripSeq[k].coords]});
  const nodes=tripSeq.slice(0,n).map((s,k)=>({name:s.cityName,value:[s.coords[0],s.coords[1]],idx:k+1}));
  return [
    {name:'trip-path',type:'lines',coordinateSystem:'geo',z:8,
      effect:{show:true,period:3.6,trailLength:.35,symbol:'arrow',symbolSize:7,color:'#f5c451'},
      lineStyle:{color:'#f5c451',width:2,opacity:.55,curveness:.22},data:segs},
    {name:'trip-nodes',type:'scatter',coordinateSystem:'geo',z:9,symbolSize:16,
      itemStyle:{color:'#f5c451',borderColor:'#1a1200',borderWidth:1,shadowBlur:8,shadowColor:'rgba(245,196,81,.7)'},
      label:{show:true,formatter:p=>p.data.idx,color:'#1a1200',fontSize:10,fontWeight:'bold',position:'inside'},
      data:nodes}
  ];
}

/* ===== 省份聚焦卡片：按省聚合，左右分栏浮卡 + 贝塞尔引导线，防重叠 ===== */
let provCardsOn=false,provAgg=[];
function buildProvAgg(){
  const m=new Map();
  mapCityPoints.forEach(c=>{const pv=c.name;if(!pv)return;
    if(!m.has(pv))m.set(pv,{prov:pv,cities:0,photos:0,sx:0,sy:0,cover:''});
    const o=m.get(pv);o.cities++;o.photos+=c.photos.length;o.sx+=c.coords[0];o.sy+=c.coords[1];
    if(!o.cover){o.cover=c.cover||(c.photos[0]&&c.photos[0].image)||'';}});
  return [...m.values()].map(o=>({...o,lng:o.sx/o.cities,lat:o.sy/o.cities})).sort((a,b)=>b.photos-a.photos);
}
function positionProvCards(){
  if(!provCardsOn||!mapChart)return;
  const host=document.getElementById('provCards'),svg=document.getElementById('provCardLines');
  const rect=document.getElementById('china-map').getBoundingClientRect();
  const W=rect.width,H=rect.height;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  // 计算各省锚点像素，按 x 分左右栏；栏内按 y 排序竖排，防重叠
  const anchors=provAgg.map(p=>{const px=mapChart.convertToPixel({geoIndex:0},[p.lng,p.lat]);return px?{p,ax:px[0],ay:px[1]}:null;}).filter(Boolean);
  // 按锚点 x 排序后前半→左栏、后半→右栏，保证两栏数量均衡（东部省份扎堆时不至于挤爆一侧）
  const byX=[...anchors].sort((a,b)=>a.ax-b.ax);
  const half=Math.ceil(byX.length/2);
  const left=byX.slice(0,half).sort((a,b)=>a.ay-b.ay);
  const right=byX.slice(half).sort((a,b)=>a.ay-b.ay);
  const CARD_H=138,M=14,CW=150;
  const place=(arr,side)=>{
    const n=arr.length;if(!n)return[];
    const gap=n>1?Math.max(6,Math.min(14,(H-2*M-n*CARD_H)/(n-1))):10; // 溢出时压缩间距
    let y=Math.max(M,(H-(n*CARD_H+(n-1)*gap))/2);
    return arr.map(a=>{const cy=y;y+=CARD_H+gap;return {...a,cx:side==='L'?M:W-CW-M,cy};});
  };
  return {cards:[...place(left,'L'),...place(right,'R')],W,H,CW,CARD_H};
}
function renderProvCards(animate){
  const host=document.getElementById('provCards'),svg=document.getElementById('provCardLines');
  const layout=positionProvCards();if(!layout){host.innerHTML='';svg.innerHTML='';return;}
  const {cards,CW,CARD_H}=layout;
  host.innerHTML='';svg.innerHTML='';
  cards.forEach((c,i)=>{
    const anchorX=c.cx<layout.W/2?c.cx+CW:c.cx, edgeY=c.cy+CARD_H/2;
    // 贝塞尔引导线：卡片近侧中点 → 省锚点
    const x1=anchorX,y1=edgeY,x2=c.ax,y2=c.ay,mx=(x1+x2)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none');path.setAttribute('stroke','rgba(212,168,67,.55)');path.setAttribute('stroke-width','1.2');
    svg.appendChild(path);
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',x2);dot.setAttribute('cy',y2);dot.setAttribute('r','3');dot.setAttribute('fill','#f5c451');
    svg.appendChild(dot);
    const el=document.createElement('div');el.className='prov-card';el.style.left=c.cx+'px';el.style.top=c.cy+'px';
    el.onclick=()=>{setMapView('province');};
    el.innerHTML=(c.p.cover?'<img class="pc-cover" src="'+escHtml(thumbUrl(c.p.cover))+'" alt="" loading="lazy">':'<div class="pc-cover"></div>')+
      '<div class="pc-body"><div class="pc-name">'+escHtml(c.p.prov)+'</div><div class="pc-meta">'+c.p.cities+' 城 · '+c.p.photos+' 张</div></div>';
    host.appendChild(el);
    if(animate)setTimeout(()=>el.classList.add('in'),60*i);else el.classList.add('in');
  });
}

/* --- 通用小工具 --- */
function memHaversine(a,b){                       // [lng,lat] → 公里
  const R=6371,r=Math.PI/180;
  const dLat=(b[1]-a[1])*r,dLng=(b[0]-a[0])*r;
  const s=Math.sin(dLat/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function memTripKm(){
  const seq=buildTripSeq();let d=0;
  for(let i=1;i<seq.length;i++)d+=memHaversine(seq[i-1].coords,seq[i].coords);
  return Math.round(d);
}
function memPhotoMonth(p){                        // '2026-10' 或 null
  const m=String((p&&p.date)||'').match(/(\d{4})\D{0,3}(\d{1,2})?/);
  return m?(m[1]+'-'+String(m[2]?+m[2]:1).padStart(2,'0')):null;
}

/* 把站内数据整理成照片流要的形状：
   {id, cityKey, city, src, aspect, description, date, text, avg}
   这里把每张图在父页面压成 512px 的 JPEG data URL 再交给照片流。
   原因：照片流的 WebGL 纹理要求图片"不污染 canvas"，而跨域图片在 iframe 里
   即使声明了 crossOrigin 仍会被判为污染（父页面同一张图却可以正常读取）。
   改用同源 data URL 就彻底没有这个问题，同时顺带拿到真实宽高比和平均色。 */
const STREAM_TEX_MAX = 512;
function memStreamPrep(url) {
  return new Promise(resolve => {
    const fallback = () => resolve({ src: url, aspect: 4 / 3, avg: [0.82, 0.66, 0.27] });
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    const timer = setTimeout(() => finish({ src: url, aspect: 4 / 3, avg: [0.82, 0.66, 0.27] }), 9000);
    img.onload = () => {
      clearTimeout(timer);
      try {
        const w = img.naturalWidth || 4, h = img.naturalHeight || 3;
        const scale = Math.min(1, STREAM_TEX_MAX / Math.max(w, h));
        const cw = Math.max(2, Math.round(w * scale)), ch = Math.max(2, Math.round(h * scale));
        const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, cw, ch);
        let avg = [0.82, 0.66, 0.27];
        try {
          const d = ctx.getImageData(0, 0, cw, ch).data;
          let r = 0, g = 0, b = 0, n = 0;
          for (let k = 0; k < d.length; k += 4) { r += d[k]; g += d[k + 1]; b += d[k + 2]; n++; }
          if (n) avg = [r / n / 255, g / n / 255, b / n / 255];
        } catch (e) { /* 保留兜底色 */ }
        finish({ src: cv.toDataURL('image/jpeg', 0.82), aspect: w / h, avg: avg });
      } catch (e) { finish({ src: url, aspect: (img.naturalWidth || 4) / (img.naturalHeight || 3), avg: [0.82, 0.66, 0.27] }); }
    };
    img.onerror = () => { clearTimeout(timer); fallback(); };
    img.src = url;
  });
}
function memReadCatalog(){
  const cityOf=new Map(mapCityPoints.map(c=>[c.cityKey,c]));
  const raw=(GALLERY||[]).map((p,i)=>{
    const c=cityOf.get(p.cityKey);
    return {
      id:String(p.id!=null?p.id:i),
      cityKey:p.cityKey||'unknown',
      city:c?c.cityName:'未标注',
      src:viewUrl(p.url||p.image),
      aspect:4/3,
      description:p.caption||(c?c.cityName:'')||'',
      date:String(p.date||''),
      text:'',
      avg:[0.82,0.66,0.27],
    };
  });
  return Promise.all(raw.map(ph=>memStreamPrep(ph.src))).then(preps=>{
    preps.forEach((prep,i)=>{ raw[i].src=prep.src; raw[i].aspect=prep.aspect; raw[i].avg=prep.avg; });
    return { photos: raw, failed: 0 };
  });
}

  if(e.key==='ArrowDown'){e.preventDefault();searchActiveIdx=Math.min(searchActiveIdx+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();searchActiveIdx=Math.max(searchActiveIdx-1,0);}
  else if(e.key==='Enter'){if(searchActiveIdx>=0)pickSearch(searchActiveIdx);else if(searchHits.length)pickSearch(0);return;}
  else if(e.key==='Escape'){searchResults.classList.remove('show');searchInput.blur();return;}
  else return;
  items.forEach((it,i)=>it.classList.toggle('active',i===searchActiveIdx));
});

function renderCityAlbum(city){

/* ===== 3D 旋转木马照片查看器（移植自 Your-China-Travel，适配 URL 图源） ===== */
(function(){
  const viewer=document.createElement('div');
  viewer.className='img-viewer';
  viewer.innerHTML=
    '<button class="close-btn" title="关闭">&times;</button>'+
    '<div class="counter" id="viewerCounter"></div>'+
    '<div class="carousel-bg" id="carouselBg"></div>'+
    '<div class="stage"><div class="carousel-ring" id="carouselRing"></div>'+
    '<button class="nav-btn nav-prev" title="上一张">&#8249;</button>'+
    '<button class="nav-btn nav-next" title="下一张">&#8250;</button></div>'+
    '<div class="hint">拖拽滑动 · ← → 翻页 · ESC 关闭</div>'+
    '<div class="thumb-strip" id="viewerThumbStrip"></div>';
  document.body.appendChild(viewer);
  const vRing=viewer.querySelector('#carouselRing'),vBg=viewer.querySelector('#carouselBg'),
    vCounter=viewer.querySelector('#viewerCounter'),vPrev=viewer.querySelector('.nav-prev'),
    vNext=viewer.querySelector('.nav-next'),vClose=viewer.querySelector('.close-btn'),
    vThumbs=viewer.querySelector('#viewerThumbStrip');
  let photoList=[],currentIdx=0,isAnimating=false,cards=[],ringRotation=0,angleStep=0,radius=0,curCardW=330;
  function computeRingParams(){const n=photoList.length;if(n<=1){angleStep=0;radius=0;return;}angleStep=360/n;const baseR=(curCardW/2)/Math.tan((angleStep*Math.PI/180)/2);radius=Math.max(420,baseR*1.20);}
  function openViewer(photos,startIdx,opts){
    if(!photos||!photos.length)return;
    photoList=photos;currentIdx=Math.min(startIdx||0,photos.length-1);curCardW=330;
    vRing.style.setProperty('--card-w',curCardW+'px');vRing.style.setProperty('--card-h','440px');
    if(opts&&opts.bgUrl){vBg.style.backgroundImage='url("'+opts.bgUrl+'")';viewer.classList.add('cover-bg-mode');}
    else{vBg.style.backgroundImage='';viewer.classList.remove('cover-bg-mode');}
    vRing.innerHTML='';cards=[];computeRingParams();
    photoList.forEach((p,i)=>{const el=document.createElement('div');el.className='photo-card';const img=document.createElement('img');img.src=p.dataUrl;img.loading='lazy';el.appendChild(img);el.style.transform='rotateY('+(i*angleStep)+'deg) translateZ('+radius+'px)';vRing.appendChild(el);cards.push({el,img});});
    ringRotation=-currentIdx*angleStep;vRing.style.transition='none';vRing.style.transform='rotateY('+ringRotation+'deg)';
    requestAnimationFrame(()=>{vRing.style.transition='';});
    updateActive();renderThumbs();updateNav();vCounter.textContent=(currentIdx+1)+' / '+photoList.length;
    viewer.classList.add('show');
  }
  function closeViewer(){viewer.classList.remove('show','cover-bg-mode');vBg.style.backgroundImage='';vRing.innerHTML='';cards=[];photoList=[];vThumbs.innerHTML='';}
  function updateActive(){cards.forEach((c,i)=>c.el.classList.toggle('is-active',i===currentIdx));}
  // 缩略条尺寸只有 ~60px，用 600px 版本即可，避免为几十张小图拉取大图
  function renderThumbs(){vThumbs.innerHTML='';photoList.forEach((p,i)=>{const t=document.createElement('img');t.className='thumb'+(i===currentIdx?' active':'');t.src=thumbUrl(p.dataUrl);t.loading='lazy';t.addEventListener('click',e=>{e.stopPropagation();if(i!==currentIdx)switchTo(i);});vThumbs.appendChild(t);});}
  function updateThumbActive(){vThumbs.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===currentIdx));const a=vThumbs.querySelector('.thumb.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
  function updateNav(){const single=photoList.length<=1;vPrev.classList.toggle('disabled',single);vNext.classList.toggle('disabled',single);}
  function switchTo(newIdx){
    if(isAnimating)return;const n=photoList.length;if(n<=1)return;
    newIdx=((newIdx%n)+n)%n;if(newIdx===currentIdx)return;isAnimating=true;
    const forward=((newIdx-currentIdx)%n+n)%n;
    if(forward<=n/2)ringRotation-=forward*angleStep;else ringRotation+=(n-forward)*angleStep;
    vRing.style.transform='rotateY('+ringRotation+'deg)';currentIdx=newIdx;
    vCounter.textContent=(currentIdx+1)+' / '+photoList.length;updateActive();updateNav();updateThumbActive();

  }
  function prev(){if(photoList.length>1)switchTo(currentIdx-1);}
  function next(){if(photoList.length>1)switchTo(currentIdx+1);}
  vPrev.addEventListener('click',e=>{e.stopPropagation();prev();});
  vNext.addEventListener('click',e=>{e.stopPropagation();next();});
  vClose.addEventListener('click',e=>{e.stopPropagation();closeViewer();});
  /* 拖拽旋转（tanh 粘滞） */
  let dragging=false,dragStartX=0,dragStartRotation=0,dragRAF=false,dragPending=0;
  const STICKY_MAX=70,TANH_SCALE=600;
  function stickyDamp(dx){const sign=dx>=0?1:-1;return sign*STICKY_MAX*Math.tanh(Math.abs(dx)/TANH_SCALE);}
  viewer.addEventListener('mousedown',e=>{if(e.target.closest('.nav-btn')||e.target.closest('.close-btn')||e.target.closest('.thumb'))return;dragging=true;dragStartX=e.clientX;dragStartRotation=ringRotation;vRing.classList.add('dragging');e.preventDefault();});

  document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;vRing.classList.remove('dragging');const steps=Math.round(-(ringRotation-dragStartRotation)/angleStep);if(steps!==0)switchTo(currentIdx+steps);else{ringRotation=dragStartRotation;vRing.style.transform='rotateY('+ringRotation+'deg)';}});
  /* 触摸拖拽 */
  let tStartX=0,tStartRot=0,touching=false;
  viewer.addEventListener('touchstart',e=>{if(e.target.closest('.nav-btn')||e.target.closest('.close-btn')||e.target.closest('.thumb'))return;touching=true;tStartX=e.touches[0].clientX;tStartRot=ringRotation;vRing.classList.add('dragging');},{passive:true});
  viewer.addEventListener('touchmove',e=>{if(!touching)return;ringRotation=tStartRot+stickyDamp(e.touches[0].clientX-tStartX);vRing.style.transform='rotateY('+ringRotation+'deg)';},{passive:true});
