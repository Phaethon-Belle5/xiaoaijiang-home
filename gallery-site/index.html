  document.addEventListener('keydown',e=>{if(!viewer.classList.contains('show'))return;if(e.key==='Escape')closeViewer();else if(e.key==='ArrowLeft')prev();else if(e.key==='ArrowRight')next();});
  window.openViewer=openViewer;
})();

/* ===== 3D 地球开屏（纯 canvas 自绘，无外部依赖） ===== */
(function(){
  const scr=document.getElementById('launch');if(!scr)return;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  // 只首次进站放开屏
  if(sessionStorage.getItem('mapgallery-launched')==='1'){scr.remove();return;}
  // Dust Text Reveal：标题「映像馆」由尘埃粒子汇聚成形（纯 canvas，无字体依赖）
  dustReveal(document.getElementById('launchTitleCanvas'),'映像馆',reduce);
  // Variable Proximity：eyebrow「PHOTO FOOTPRINTS · 光影足迹」随光标靠近变粗+变亮+发光
  variableProximity(document.getElementById('launchEyebrow'),reduce);

  const gc=document.getElementById('launchGlobe'),gx=gc.getContext('2d');
  const sc=document.getElementById('launchStars'),sx=sc.getContext('2d');
  let W=0,H=0,DPR=1,R=0,cx=0,cy=0;
  // 球面点：背景蓝点（fibonacci 均布）
  const bg=[];const N=reduce?380:820;
  for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;bg.push([Math.cos(th)*r,y,Math.sin(th)*r]);}
  // 中国省质心 → 金色点（经纬度转球面坐标）
  const gold=[];
  function ll2xyz(lng,lat){const p=(90-lat)*Math.PI/180,t=(lng+0)*Math.PI/180;return [Math.sin(p)*Math.cos(t),Math.cos(p),Math.sin(p)*Math.sin(t)];}
  if(window.CHINA_GEO)for(const f of CHINA_GEO.features){const c=f.properties.center||f.properties.centroid;if(c)gold.push(ll2xyz(c[0],c[1]));}
  // 采样省界更密的金点（让中国轮廓更明显）
  if(window.CHINA_GEO)for(const f of CHINA_GEO.features){const g=f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;let step=0;
    for(const poly of polys)for(const ring of poly)for(const pt of ring){if((step++%7)===0)gold.push(ll2xyz(pt[0],pt[1]));}}
  const stars=[];
  function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    [gc,sc].forEach(c=>{c.width=W*DPR|0;c.height=H*DPR|0;});
    gx.setTransform(DPR,0,0,DPR,0,0);sx.setTransform(DPR,0,0,DPR,0,0);
    R=Math.min(W,H)*0.30;cx=W/2;cy=H*0.46;
    stars.length=0;const sn=reduce?90:200;for(let i=0;i<sn;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,tw:Math.random()*6.28});
  }
  addEventListener('resize',resize);resize();

  let rot=-1.9,tilt=0.42,raf=0,t=0,dragging=false,lastX=0,vel=0.0038;
  function project(p){ // 绕 Y 轴旋转 + 固定 X 倾斜
    const cosR=Math.cos(rot),sinR=Math.sin(rot);
    let x=p[0]*cosR - p[2]*sinR, z=p[0]*sinR + p[2]*cosR, y=p[1];
    const cosT=Math.cos(tilt),sinT=Math.sin(tilt);
    const y2=y*cosT - z*sinT, z2=y*sinT + z*cosT;
    return [cx+x*R, cy+y2*R, z2]; // z2>0 = 朝向观众
  }
  function frame(){
    t+=0.016;
    // 星空微闪
    sx.clearRect(0,0,W,H);
    for(const s of stars){const a=.4+.6*(0.5+0.5*Math.sin(t*1.5+s.tw));sx.fillStyle='rgba(220,235,255,'+a.toFixed(3)+')';sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fill();}
    // 地球
    gx.clearRect(0,0,W,H);
    // 深色海洋球体 + 光晕
    const grad=gx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R*1.15);
    grad.addColorStop(0,'rgba(20,40,70,.55)');grad.addColorStop(.7,'rgba(8,16,30,.5)');grad.addColorStop(1,'rgba(4,8,16,0)');
    gx.fillStyle=grad;gx.beginPath();gx.arc(cx,cy,R*1.08,0,6.283);gx.fill();
    if(!dragging)rot+=vel;
    // 背景蓝点
    for(const p of bg){const q=project(p);if(q[2]<0)continue;const dep=(q[2]+1)/2;gx.fillStyle='rgba(90,140,200,'+(0.15+dep*0.35).toFixed(3)+')';gx.beginPath();gx.arc(q[0],q[1],0.7+dep*1.1,0,6.283);gx.fill();}
    // 金色中国点
    for(const p of gold){const q=project(p);if(q[2]<0.02)continue;const dep=(q[2]+1)/2;gx.fillStyle='rgba(245,196,81,'+(0.35+dep*0.6).toFixed(3)+')';gx.shadowBlur=6;gx.shadowColor='rgba(245,196,81,.6)';gx.beginPath();gx.arc(q[0],q[1],1+dep*1.6,0,6.283);gx.fill();}
    gx.shadowBlur=0;

  }
  frame();
  // 拖拽转动
  gc.style.pointerEvents='auto';gc.style.cursor='grab';
  gc.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;gc.style.cursor='grabbing';});
  addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;rot+=dx*0.006;vel=dx*0.0006||vel;});
  addEventListener('pointerup',()=>{dragging=false;gc.style.cursor='grab';if(Math.abs(vel)<0.001)vel=0.0038;});

  /* ===== 可选增强：ECharts-GL 写实地球 =====
     开屏本来就是上面那台自绘的简略地球（零依赖、秒出）。
     这里只是「锦上添花」：设备真的跑得起「写实」档时才把写实地球淡入盖上来；
     低配 / 老 GPU / 不支持 WebGL 就什么都不做，保持简略版——这是预期行为，不是失败。
     资源全部自托管在 assets/gl/ 下，不引用 echarts.apache.org 或 jsdelivr。 */
  const glHost=document.getElementById('launchGl');
  function loadScript(src){
    return new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src=src;s.async=true;
      s.onload=()=>res();s.onerror=()=>rej(new Error('load fail: '+src));
      document.head.appendChild(s);
    });
  }
  // 地球直径只跟视口「高度」成正比，竖屏手机上会横向溢出被切，所以按宽高比把相机拉远
  function glDistance(){return Math.max(210,Math.round(264*(innerHeight/Math.max(1,innerWidth))));}
  const GL_TEX='assets/gl/';
  // 只保留「写实」档：能跑哪档用哪档；连写实都跑不了就留在简略地球上，不退到质感差的档
  const GL_TIERS=[
    {name:'写实+后处理+地形', disp:0.04, post:true,  ambient:true,  shadow:true },
    {name:'写实+地形',        disp:0.04, post:false, ambient:true,  shadow:true },
    {name:'写实(无地形)',      disp:0,    post:false, ambient:true,  shadow:true },
    {name:'写实(仅主光)',      disp:0,    post:false, ambient:false, shadow:true },
    {name:'写实(无阴影)',      disp:0,    post:false, ambient:false, shadow:false},
  ];
  function glOption(t){
    const light={main:{intensity:5,shadow:t.shadow}};
    if(t.ambient)light.ambientCubemap={texture:GL_TEX+'pisa.hdr',diffuseIntensity:0.2};
    const globe={
      baseTexture:GL_TEX+'earth-2048.jpg',
      environment:GL_TEX+'starfield-2048.jpg',
      shading:'realistic',
      realisticMaterial:{roughness:0.9},
      light:light,
      // 系统开了「减弱动态效果」只关自转，地球照样换成写实的
      // maxDistance 要够大，否则竖屏算出来的距离会被夹回去，等于没拉远
      viewControl:{autoRotate:!reduce,autoRotateSpeed:5,autoRotateAfterStill:2,distance:glDistance(),alpha:24,minDistance:150,maxDistance:900}
    };
    if(t.disp){globe.heightTexture=GL_TEX+'earth-2048.jpg';globe.displacementScale=t.disp;}
    if(t.post)globe.postEffect={enable:true};
    // 背景透明：星空环境会盖满，正常看不出差别；万一静默画不出东西，底下的简略地球能透出来
    return {backgroundColor:'transparent',globe:globe};
  }
  function preloadImg(src){
    return new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=src;});
  }
  async function initRealisticGlobe(){
    if(!glHost||typeof echarts==='undefined')return false;
    let chart;
    try{chart=echarts.init(glHost,null,{renderer:'canvas'});}
    catch(e){console.warn('[globe] init 失败，保持简略地球：',e.message);return false;}
    // 先把贴图灌进缓存，免得第一帧画出来是个没贴图的球
    await Promise.all([preloadImg(GL_TEX+'earth-2048.jpg'),preloadImg(GL_TEX+'starfield-2048.jpg')]);
    for(const t of GL_TIERS){
      let threw=null;
      try{chart.setOption(glOption(t),true);}catch(e){threw=e;}
      if(threw){console.warn('[globe] '+t.name+' 抛错，降级重试：',threw.message);continue;}
      console.log('[globe] 已启用：'+t.name);
      addEventListener('resize',function(){try{chart.setOption({globe:{viewControl:{distance:glDistance()}}});chart.resize();}catch(e){}});
      scr.__glChart=chart;
      glHost.classList.add('on');
      cancelAnimationFrame(raf);   // 写实地球已覆盖，停掉简略版的动画循环省电
      return true;
    }
    try{chart.dispose();}catch(e){}
    console.log('[globe] 写实档都跑不了，保持简略地球');
    return false;
  }
  // 不做 hasWebGL() 预检（会先占掉一个上下文，部分机型还会误报「不支持」）：
  // 直接尝试，抛错就逐档降级，最差就是继续用上面那台简略地球。
  loadScript('assets/gl/echarts.min.js')
    .then(()=>loadScript('assets/gl/echarts-gl.min.js'))
    .then(()=>{if(scr.isConnected&&!scr.classList.contains('hide'))return initRealisticGlobe();return false;})
    .catch(e=>console.warn('[globe] 脚本加载失败，保持简略地球：',e.message));

  function enter(){
    sessionStorage.setItem('mapgallery-launched','1');
    scr.classList.add('hide');
    setTimeout(()=>{cancelAnimationFrame(raf);scr.remove();},1050);
  }
  document.getElementById('launchEnter').addEventListener('click',enter);
  scr.__enter=enter;

  /* ===== Dust Text Reveal：文字采样为目标点，尘埃粒子从四周汇聚成形 ===== */
  function dustReveal(cv,text,reduce){
    if(!cv)return;const ctx=cv.getContext('2d');
    const dpr=Math.min(devicePixelRatio||1,2);
    const fs=Math.round(Math.min(innerWidth*0.16,110));      // 标题字号（随屏宽）
    const pad=Math.round(fs*0.35);
    // 先离屏测量文字，采样像素点为粒子目标
    const off=document.createElement('canvas'),octx=off.getContext('2d');
    const font='700 '+fs+'px "Cinzel","PingFang SC","Microsoft YaHei",serif';

    octx.fillText(text,pad,ch/2);
    const img=octx.getImageData(0,0,cw,ch).data;
    const targets=[],step=Math.max(3,Math.round(fs/26));      // 采样密度
    for(let y=0;y<ch;y+=step)for(let x=0;x<cw;x+=step){if(img[(y*cw+x)*4+3]>128)targets.push([x,y]);}
    // 画布实际尺寸
    cv.width=cw*dpr;cv.height=ch*dpr;cv.style.width=cw+'px';cv.style.height=ch+'px';
    ctx.scale(dpr,dpr);
    // 每个目标点生成一个粒子：初始散落在外圈，向目标收敛
    const parts=targets.map(t=>{
      const ang=Math.random()*6.283,dist=Math.max(cw,ch)*(0.5+Math.random()*0.6);
      return {tx:t[0],ty:t[1],x:cw/2+Math.cos(ang)*dist,y:ch/2+Math.sin(ang)*dist,
        delay:Math.random()*0.5,sz:0.7+Math.random()*1.3};
    });
    if(reduce){ // 降级：直接画字，不动画
      ctx.font=font;ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(text,pad,ch/2);return;
    }
    const T=1600,start=performance.now();let done=false;
    function ease(t){return 1-Math.pow(1-t,3);}
    function frame(now){
      const gt=Math.min(1,(now-start)/T);
      ctx.clearRect(0,0,cw,ch);
      let settled=0;
      for(const p of parts){
        const lt=Math.min(1,Math.max(0,(gt-p.delay)/(1-p.delay)));
        const e=ease(lt);
        const x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e;
        const alpha=0.15+e*0.85;
        // 汇聚中为青蓝尘埃，成形后转暖白
        const c=e<0.85?'rgba(125,211,252,'+alpha.toFixed(2)+')':'rgba(255,252,244,'+alpha.toFixed(2)+')';
        ctx.fillStyle=c;
        const s=p.sz*(e<0.85?1.4-e*0.5:1);
        ctx.fillRect(x,y,s,s);
        if(lt>=1)settled++;
      }
      if(settled<parts.length||gt<1)raf2=requestAnimationFrame(frame);
      else{ // 收尾：整体发光实心字
        ctx.clearRect(0,0,cw,ch);ctx.font=font;ctx.textBaseline='middle';
        ctx.shadowColor='rgba(56,189,248,.55)';ctx.shadowBlur=fs*0.25;
        ctx.fillStyle='#fff';ctx.fillText(text,pad,ch/2);ctx.shadowBlur=0;
        done=true;
      }
    }
    let raf2=requestAnimationFrame(frame);
  }

  /* ===== Variable Proximity：拆字为 span，光标靠近按 gaussian 变粗+变亮+发光 ===== */
  function variableProximity(el,reduce){
    if(!el)return;
    const txt=el.textContent;el.textContent='';
    [...txt].forEach(ch=>{const s=document.createElement('span');s.className=ch===' '?'vp-char vp-space':'vp-char';s.textContent=ch;el.appendChild(s);});
    if(reduce)return;
    const chars=[...el.querySelectorAll('.vp-char')];
    const R=90,FROM=350,TO=800;let mx=-9999,my=-9999,dirty=false,cache=[],cacheOk=false;
    const gauss=(d)=>Math.exp(-(d*d)/(2*R*R));
    function recache(){cache=chars.map(c=>{const r=c.getBoundingClientRect();return {el:c,cx:r.left+r.width/2,cy:r.top+r.height/2};});cacheOk=cache.length>0;}
    function tick(){
      if(dirty){dirty=false;if(!cacheOk)recache();
        for(const it of cache){
          const inf=gauss(Math.hypot(it.cx-mx,it.cy-my));
          const w=Math.round(FROM+(TO-FROM)*inf);
          it.el.style.fontVariationSettings="'wght' "+w;
          const r=Math.round(212+(245-212)*inf),g=Math.round(168+(232-168)*inf),b=Math.round(67+(212-67)*inf);
          it.el.style.color='rgb('+r+','+g+','+b+')';
          it.el.style.filter=inf>0.12?'drop-shadow(0 0 '+(1+inf*7).toFixed(1)+'px rgba(212,168,67,'+(0.2+inf*0.6).toFixed(2)+'))':'none';
        }
      }
      rafVp=requestAnimationFrame(tick);
    }
    addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dirty=true;},{passive:true});
    addEventListener('resize',()=>{cacheOk=false;});
    let rafVp=requestAnimationFrame(tick);
  }
})();

/* ===== 页脚：运行时间 + 真实访问统计 ===== */
(function(){
  // 运行起点：2026-06-17 00:00:00 北京时间（UTC+8）→ 用带时区的 ISO 保证各端一致
  const SINCE=new Date('2026-06-17T00:00:00+08:00').getTime();
  const runEl=document.getElementById('footRun');
  function tickRun(){
    let s=Math.floor((Date.now()-SINCE)/1000);if(s<0)s=0;
    const d=Math.floor(s/86400);s-=d*86400;
    const h=Math.floor(s/3600);s-=h*3600;
    const m=Math.floor(s/60);const ss=s-m*60;
    const pad=n=>String(n).padStart(2,'0');
    if(runEl)runEl.textContent=d+' 天 '+pad(h)+' 时 '+pad(m)+' 分 '+pad(ss)+' 秒';
  }
  tickRun();setInterval(tickRun,1000);
  // 真实访问统计：localStorage 匿名 vid 去重 UV
  const fmt=n=>Number(n).toLocaleString('en-US');
  let vid=localStorage.getItem('mapgallery-vid');
  if(!vid){vid=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));localStorage.setItem('mapgallery-vid',vid);}
  const pvEl=document.getElementById('footPv'),uvEl=document.getElementById('footUv');
  fetch(API+'/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vid})})
    .then(r=>r.json())
    .then(s=>{if(pvEl)pvEl.textContent=fmt(s.pv);if(uvEl)uvEl.textContent=fmt(s.uv);})
    .catch(()=>{if(pvEl)pvEl.textContent='—';if(uvEl)uvEl.textContent='—';});
})();
