<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>映像馆 · 管理后台</title>
<style>
:root{
  --gold:#D4A843;--gold-bright:#E8C456;
  --text-primary:#E8E2D9;--text-secondary:#A09888;--text-muted:#8A8070;
  --glass-bg:rgba(17,22,42,0.75);--glass-border:rgba(255,255,255,0.08);
  --canvas:#0B0E14;--panel:#141926;--panel-2:#1b2130;
  --radius:12px;--radius-pill:9999px;--ok:#4ade80;--err:#f87171;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --font:'PingFang SC','Microsoft YaHei','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--canvas);color:var(--text-primary);line-height:1.55;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--gold);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.btn{padding:9px 18px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.86em;transition:all .2s var(--ease)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:var(--gold-bright)}
.btn.danger{color:var(--err);border-color:rgba(248,113,113,.35)}
.btn.danger:hover{background:rgba(248,113,113,.12)}
.btn.sm{padding:5px 12px;font-size:.8em}
.btn:disabled{opacity:.45;pointer-events:none}
/* 登录 */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#141c30,#0B0E14);z-index:100}
#login .card{width:min(92vw,380px);background:var(--panel);border:1px solid var(--glass-border);border-radius:16px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#login h1{font-size:1.3em;margin-bottom:6px}
#login p{color:var(--text-muted);font-size:.85em;margin-bottom:22px}
#login input{width:100%;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.95em;outline:none;transition:border-color .2s}
#login input:focus{border-color:var(--gold)}
#login .btn{width:100%;margin-top:16px;justify-content:center}
#login .msg{margin-top:14px;font-size:.82em;min-height:1.2em;text-align:center}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
/* 布局 */
#app{display:none;min-height:100vh;grid-template-columns:300px 1fr}
#app.on{display:grid}
.side{background:var(--panel);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-head .t{font-size:1.02em;font-weight:600}
.side-head .t small{display:block;color:var(--text-muted);font-size:.62em;font-weight:400;letter-spacing:.05em}
.side-tools{padding:12px 14px;display:flex;gap:8px}
.side-tools .btn{flex:1;justify-content:center}
.city-list{flex:1;overflow-y:auto;padding:4px 10px 16px}
.city-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px}
.city-item:hover{background:var(--panel-2)}
.city-item.on{background:rgba(212,168,67,.16);outline:1px solid rgba(212,168,67,.3)}
.city-item .nm{flex:1;font-size:.9em}
.city-item .nm small{display:block;color:var(--text-muted);font-size:.72em}
.city-item .cnt{font-size:.74em;color:var(--text-muted);background:var(--panel-2);padding:2px 8px;border-radius:var(--radius-pill)}
.city-item .star{color:var(--gold);font-size:.72em}
.sec-label{padding:14px 18px 6px;font-size:.72em;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
/* 主区 */
.main{padding:26px 34px 80px;max-width:1080px}
.main-empty{color:var(--text-muted);padding:80px 0;text-align:center}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
.topbar h2{font-size:1.5em}.topbar h2 small{color:var(--text-muted);font-size:.55em;font-weight:400;margin-left:8px}
.block{background:var(--panel);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px}
.block h3{font-size:1em;margin-bottom:16px;color:var(--gold)}
.field{margin-bottom:16px}
.field>label{display:block;font-size:.8em;color:var(--text-secondary);margin-bottom:7px}
.field input[type=text],.field textarea{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.9em;outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:74px}
.field .hintcount{float:right;color:var(--text-muted);font-size:.9em}
.row{display:flex;gap:20px;flex-wrap:wrap}.row>.field{flex:1;min-width:200px}
.stars{display:flex;gap:4px;font-size:1.5em;color:#3a4152}
.stars span{cursor:pointer;transition:color .15s}.stars span.on{color:var(--gold)}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months label{font-size:.8em;padding:5px 10px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--panel-2);cursor:pointer;user-select:none}
.months label.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.months input{display:none}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.86em;cursor:pointer}
/* 标签 */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--radius-pill);font-size:.8em;border:1px solid var(--glass-border)}
.tag.scenic{background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.4)}
.tag.food{background:rgba(251,146,60,.14);border-color:rgba(251,146,60,.4)}
.tag.other{background:rgba(148,163,184,.14)}
.tag b{cursor:pointer;opacity:.6}.tag b:hover{opacity:1;color:var(--err)}
.tag-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag-add input{flex:1;min-width:120px;padding:8px 12px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.84em;outline:none}
.tag-add select{padding:8px 12px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.84em}
/* 照片网格 */
.up-drop{border:1.5px dashed var(--glass-border);border-radius:var(--radius);padding:26px;text-align:center;color:var(--text-muted);font-size:.86em;transition:border-color .2s,background .2s;cursor:pointer;margin-bottom:18px}
.up-drop.drag{border-color:var(--gold);background:rgba(212,168,67,.06)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pcard{background:var(--panel-2);border:1px solid var(--glass-border);border-radius:10px;overflow:hidden;position:relative}
.pcard.cover{outline:2px solid var(--gold)}
.pcard.dragging{opacity:.4}
.pcard .ph{aspect-ratio:3/4;background:#0d1017;position:relative;cursor:grab}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pcard .badge{position:absolute;top:6px;left:6px;font-size:.66em;background:var(--gold);color:#1a1a1a;padding:2px 8px;border-radius:var(--radius-pill);font-weight:600}
.pcard .meta{padding:9px 10px}
.pcard .meta input{width:100%;padding:5px 8px;border-radius:7px;border:1px solid var(--glass-border);background:var(--panel);color:var(--text-primary);font-size:.76em;outline:none;margin-bottom:5px}
.pcard .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.pcard .acts .btn{flex:1;padding:4px 6px;font-size:.72em;min-width:auto}
.up-item{font-size:.78em;color:var(--text-muted);margin-top:6px}
/* 未定位 */
.uloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.uloc .pcard select{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--glass-border);background:var(--panel);color:var(--text-primary);font-size:.78em;margin-top:5px}
/* toast + modal */
#toastHost{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--glass-border);padding:11px 20px;border-radius:var(--radius-pill);font-size:.86em;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:all .3s var(--ease)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-color:rgba(248,113,113,.5)}.toast.ok{border-color:rgba(74,222,128,.5)}
.modal{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .card{width:min(94vw,460px);max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--glass-border);border-radius:16px;padding:26px}
.modal h3{margin-bottom:16px}
.modal .search-res{max-height:280px;overflow-y:auto;margin-top:10px}
.modal .sr{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.86em;display:flex;justify-content:space-between}
.modal .sr:hover{background:var(--panel-2)}.modal .sr small{color:var(--text-muted)}
.modal .x{float:right;font-size:1.4em;color:var(--text-muted);cursor:pointer;line-height:1}
@media(max-width:820px){#app.on{grid-template-columns:1fr}.side{height:auto;position:static}.main{padding:20px}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>映像馆 · 管理后台</h1>
    <p>输入管理密码登录</p>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password">
    <button class="btn primary" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="app">
  <aside class="side">
    <div class="side-head">
      <div class="t">映像馆<small>MAP GALLERY 后台</small></div>
      <button class="btn sm" onclick="doLogout()">退出</button>
    </div>
    <div class="side-tools">
      <button class="btn sm primary" onclick="openAddCity()">+ 新增城市</button>
      <a class="btn sm" href="/" target="_blank" style="flex:1;text-align:center">看前台 ↗</a>
    </div>
    <div class="sec-label">城市（<span id="cityCount">0</span>）</div>
    <div class="city-list" id="cityList"></div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty">← 从左侧选择一个城市开始编辑，或「+ 新增城市」</div>
  </main>
</div>

<!-- 新增城市 modal -->
<div class="modal" id="addCityModal">
  <div class="card">
    <span class="x" onclick="closeAddCity()">&times;</span>
    <h3>新增城市</h3>
    <input type="text" id="addCitySearch" placeholder="搜索城市名（如 杭州）…" autocomplete="off"
      style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);outline:none">
    <div class="search-res" id="addCityRes"></div>
  </div>
</div>

<div id="toastHost"></div>

<script src="assets/china-geo.js"></script>
<script src="assets/cities-geo.js"></script>
<script>
const API='https://mapi.231060101.xyz';
const TOKEN_KEY='mapgallery-admin-token';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CITIES=[],curCity=null,curDetail=null,UNLOCATED=[];
let PROV_ADCODE={}; // 省名→adcode
for(const f of (window.CHINA_GEO?CHINA_GEO.features:[]))PROV_ADCODE[f.properties.name]=String(f.properties.adcode);

function toast(msg,type){const h=document.getElementById('toastHost');const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;h.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),320);},2400);}
function token(){return sessionStorage.getItem(TOKEN_KEY)||'';}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({},opts.headers||{});
  const tk=token();if(tk)headers['Authorization']='Bearer '+tk;
  const res=await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body});
  if(res.status===401){handleUnauth();throw new Error('未授权');}
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error((data&&data.error)||('HTTP '+res.status));
  return data;
}
function handleUnauth(){sessionStorage.removeItem(TOKEN_KEY);document.getElementById('app').classList.remove('on');document.getElementById('login').style.display='';toast('登录已过期，请重新登录','err');}

/* ===== 登录 ===== */
async function doLogin(){
  const pw=document.getElementById('pw').value;const msg=document.getElementById('loginMsg');
  if(!pw){msg.className='msg err';msg.textContent='请输入密码';return;}
  document.getElementById('loginBtn').disabled=true;msg.className='msg';msg.textContent='登录中…';
  try{
    const res=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const data=await res.json();
    if(!res.ok||!data.token)throw new Error(data.error==='unauthorized'?'密码错误':(data.error||'登录失败'));
    sessionStorage.setItem(TOKEN_KEY,data.token);
    document.getElementById('pw').value='';
    enterApp();
  }catch(e){msg.className='msg err';msg.textContent=e.message;}
  finally{document.getElementById('loginBtn').disabled=false;}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogout(){try{await api('/logout',{method:'POST'});}catch(e){}sessionStorage.removeItem(TOKEN_KEY);location.reload();}
async function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  await loadCities();
}
async function boot(){
  if(!token())return;
  try{const me=await fetch(API+'/me',{headers:{'Authorization':'Bearer '+token()}}).then(r=>r.json());if(me.authed){enterApp();return;}}catch(e){}
  sessionStorage.removeItem(TOKEN_KEY);
}
boot();

/* ===== 城市列表 ===== */
async function loadCities(){
  CITIES=await api('/cities');
  CITIES.sort((a,b)=>(b.photoCount||0)-(a.photoCount||0)||a.name.localeCompare(b.name,'zh'));
  document.getElementById('cityCount').textContent=CITIES.length;
  renderCityList();
  await loadUnlocated();
}
function renderCityList(){
  const el=document.getElementById('cityList');
  el.innerHTML=CITIES.map(c=>
    '<div class="city-item'+(curCity===c.cityKey?' on':'')+'" onclick="selectCity(\''+esc(c.cityKey)+'\')">'+
      '<div class="nm">'+esc(c.name)+(c.isHometown?' <span class="star">★</span>':'')+
        (c.rating?'<small>'+'★'.repeat(c.rating)+'</small>':'')+'</div>'+
      '<div class="cnt">'+(c.photoCount||0)+'</div>'+
    '</div>'
  ).join('')||'<div style="padding:16px;color:var(--text-muted);font-size:.84em">还没有城市，点上方「+ 新增城市」</div>';
}
async function loadUnlocated(){
  try{UNLOCATED=await api('/unlocated');}catch(e){UNLOCATED=[];}
  if(!curCity)renderMainEmpty();
}
function renderMainEmpty(){
  document.getElementById('main').innerHTML=
    '<div class="main-empty">← 从左侧选择一个城市开始编辑，或「+ 新增城市」</div>'+
    (UNLOCATED.length?renderUnlocatedBlock():'');
  if(UNLOCATED.length)bindUnlocatedSelects();
}
async function selectCity(ck){
  curCity=ck;renderCityList();
  document.getElementById('main').innerHTML='<div class="main-empty">加载中…</div>';
  try{curDetail=await api('/city/'+encodeURIComponent(ck));}catch(e){toast(e.message,'err');return;}
  renderEditor();
}

/* ===== 城市编辑器 ===== */
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let editState={rating:0,isHometown:false,visitMonths:[],tags:[]};
function renderEditor(){
  const c=curDetail.city||{cityKey:curCity,name:curCity,rating:0,description:'',visitMonths:[],tags:[],isHometown:false};
  const nowY=new Date().getFullYear();
  const vm=(c.visitMonths||[]).map(x=>typeof x==='number'?(nowY+'-'+String(x).padStart(2,'0')):String(x));
  editState={rating:c.rating||0,isHometown:!!c.isHometown,year:nowY,visitMonths:vm,tags:(c.tags||[]).slice()};
  const photos=curDetail.photos||[];
  document.getElementById('main').innerHTML=
    '<div class="topbar"><h2>'+esc(c.name)+(window.CITIES_GEO&&CITIES_GEO[curCity]?'<small>'+esc(CITIES_GEO[curCity][2]||'')+'</small>':'')+'</h2>'+
      '<button class="btn danger" onclick="delCity()">删除城市</button></div>'+
    '<div class="block"><h3>城市信息</h3>'+
      '<div class="row"><div class="field"><label>星级</label><div class="stars" id="starBox"></div></div>'+
        '<div class="field"><label>家乡</label><label class="chk"><input type="checkbox" id="homeChk"'+(editState.isHometown?' checked':'')+'> 标记为家乡（地图金色高亮）</label></div></div>'+
      '<div class="field"><label>简介 <span class="hintcount"><span id="descCount">0</span>/200</span></label>'+
        '<textarea id="descInput" maxlength="200" placeholder="写点这座城市的感受…">'+esc(c.description||'')+'</textarea></div>'+
      '<div class="field"><label>游玩年月　<select id="yearSel" style="padding:4px 10px;border-radius:8px;border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.82em"></select> 年，勾选月份：</label>'+
        '<div class="months" id="monthBox"></div><div class="tags" id="vmChips" style="margin-top:10px"></div></div>'+
      '<div class="field"><label>标签</label><div class="tags" id="tagBox"></div>'+
        '<div class="tag-add"><input type="text" id="tagInput" placeholder="标签文字，回车添加">'+
          '<select id="tagCat"><option value="scenic">景点</option><option value="food">美食</option><option value="other">其他</option></select>'+
          '<button class="btn sm" onclick="addTag()">添加</button></div></div>'+
      '<button class="btn primary" onclick="saveCity()">保存城市信息</button></div>'+
    '<div class="block"><h3>照片（'+photos.length+'）</h3>'+
      '<div class="up-drop" id="upDrop">拖照片到这里，或点击选择文件（可多选）<div class="up-item" id="upStatus"></div></div>'+
      '<input type="file" id="fileInput" accept="image/*" multiple hidden>'+
      '<div class="pgrid" id="pgrid"></div></div>'+
    '<div class="block"><h3>景点</h3>'+
      '<div class="tag-add" style="margin-bottom:14px"><input type="text" id="attrName" placeholder="景点名称">'+
        '<input type="text" id="attrDate" placeholder="日期 2026-01-01" style="max-width:150px;flex:0 0 auto;padding:8px 12px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--panel-2);color:var(--text-primary);font-size:.84em">'+
        '<button class="btn sm primary" onclick="addAttraction()">+ 添加景点</button></div>'+
      '<div id="attrList"></div></div>'+
    (UNLOCATED.length?renderUnlocatedBlock():'');
  renderStars();renderYearSel();renderMonths();renderVmChips();renderTags();
  const desc=document.getElementById('descInput'),cnt=document.getElementById('descCount');
  cnt.textContent=desc.value.length;desc.oninput=()=>cnt.textContent=desc.value.length;
  renderPhotos();bindUpload();renderAttractions();
  if(UNLOCATED.length)bindUnlocatedSelects();
}
function renderStars(){const b=document.getElementById('starBox');b.innerHTML=[1,2,3,4,5].map(n=>'<span class="'+(n<=editState.rating?'on':'')+'" onclick="setStar('+n+')">★</span>').join('');}
function setStar(n){editState.rating=(editState.rating===n?0:n);renderStars();}
function renderYearSel(){const sel=document.getElementById('yearSel');if(!sel)return;const y=new Date().getFullYear();let opts='';for(let yr=y;yr>=y-25;yr--)opts+='<option value="'+yr+'"'+(yr===editState.year?' selected':'')+'>'+yr+'</option>';sel.innerHTML=opts;sel.onchange=()=>{editState.year=+sel.value;renderMonths();};}
function ym(v){return editState.year+'-'+String(v).padStart(2,'0');}
function renderMonths(){document.getElementById('monthBox').innerHTML=MONTHS.map((m,i)=>{const key=ym(i+1),on=editState.visitMonths.includes(key);return '<label class="'+(on?'on':'')+'"><input type="checkbox" onchange="toggleMonth('+(i+1)+')"'+(on?' checked':'')+'>'+m+'</label>';}).join('');}
function toggleMonth(v){const key=ym(v),i=editState.visitMonths.indexOf(key);if(i>=0)editState.visitMonths.splice(i,1);else editState.visitMonths.push(key);editState.visitMonths.sort();renderMonths();renderVmChips();}
function renderVmChips(){const el=document.getElementById('vmChips');if(!el)return;el.innerHTML=editState.visitMonths.length?editState.visitMonths.slice().sort().map(s=>'<span class="tag scenic">'+esc(s.slice(0,4)+'年'+(+s.slice(5,7))+'月')+' <b onclick="delVm(\''+s+'\')">×</b></span>').join(''):'<span style="color:var(--text-muted);font-size:.82em">未选择游玩年月</span>';}
function delVm(key){const i=editState.visitMonths.indexOf(key);if(i>=0)editState.visitMonths.splice(i,1);renderMonths();renderVmChips();}
function renderTags(){document.getElementById('tagBox').innerHTML=editState.tags.map((t,i)=>'<span class="tag '+esc(t.category||'other')+'">'+esc(t.text)+' <b onclick="delTag('+i+')">×</b></span>').join('')||'<span style="color:var(--text-muted);font-size:.82em">暂无标签</span>';}
function addTag(){const inp=document.getElementById('tagInput'),cat=document.getElementById('tagCat').value,txt=inp.value.trim();if(!txt)return;editState.tags.push({text:txt.slice(0,20),category:cat});inp.value='';renderTags();}
function delTag(i){editState.tags.splice(i,1);renderTags();}
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='tagInput'&&e.key==='Enter'){e.preventDefault();addTag();}});
async function saveCity(){
  const body={rating:editState.rating,isHometown:document.getElementById('homeChk').checked,
    description:document.getElementById('descInput').value,visitMonths:editState.visitMonths,tags:editState.tags};
  try{await api('/city/'+encodeURIComponent(curCity),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('已保存','ok');await refreshCity();}catch(e){toast(e.message,'err');}
}
async function delCity(){
  const photos=curDetail.photos||[];
  if(!confirm('删除城市「'+curCity+'」？'+(photos.length?'它下面有 '+photos.length+' 张照片，会一并删除（含 R2 图片）。':'')))return;
  try{await api('/city/'+encodeURIComponent(curCity),{method:'DELETE'});
    toast('已删除城市','ok');curCity=null;curDetail=null;await loadCities();renderMainEmpty();
  }catch(e){toast(e.message,'err');}
}
async function refreshCity(){curDetail=await api('/city/'+encodeURIComponent(curCity));await loadCities();renderEditor();}

/* ===== 照片 ===== */
function renderPhotos(){
  const photos=curDetail.photos||[];
  const cover=curDetail.city&&curDetail.city.coverR2Key;
  const grid=document.getElementById('pgrid');
  grid.innerHTML=photos.map((p,i)=>
    '<div class="pcard'+((cover&&cover===p.url)?' cover':'')+'" draggable="true" data-id="'+p.id+'">'+
      '<div class="ph">'+((cover&&cover===p.url)?'<span class="badge">封面</span>':'')+'<img src="'+esc(p.url)+'" loading="lazy"></div>'+
      '<div class="meta">'+
        '<input type="text" value="'+esc(p.caption)+'" placeholder="标题" onchange="updPhoto('+p.id+',{caption:this.value})">'+
        '<input type="text" value="'+esc(p.date)+'" placeholder="日期 2026-01-01" onchange="updPhoto('+p.id+',{date:this.value})">'+
        '<div class="acts">'+
          '<button class="btn sm" onclick="movePhoto('+i+',-1)">←</button>'+
          '<button class="btn sm" onclick="movePhoto('+i+',1)">→</button>'+
          '<button class="btn sm" onclick="setCover('+p.id+')">封面</button>'+
          '<button class="btn sm danger" onclick="delPhoto('+p.id+')">删</button>'+
        '</div></div></div>'
  ).join('')||'<div style="color:var(--text-muted);font-size:.84em">还没有照片，拖或选文件上传</div>';
  bindDragReorder();
}
async function updPhoto(id,patch){try{await api('/photo/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});toast('已更新','ok');}catch(e){toast(e.message,'err');}}
async function delPhoto(id){if(!confirm('删除这张照片？会同时删 R2 图片，不可恢复'))return;try{await api('/photo/'+id,{method:'DELETE'});toast('已删除','ok');await refreshCity();}catch(e){toast(e.message,'err');}}
async function setCover(id){const p=(curDetail.photos||[]).find(x=>x.id===id);if(!p)return;try{await api('/city/'+encodeURIComponent(curCity),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({coverR2Key:p.url})});toast('已设为封面','ok');await refreshCity();}catch(e){toast(e.message,'err');}}
async function movePhoto(i,dir){const photos=curDetail.photos||[];const j=i+dir;if(j<0||j>=photos.length)return;try{await api('/reorder-photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idA:photos[i].id,idB:photos[j].id})});await refreshCity();}catch(e){toast(e.message,'err');}}
let dragId=null;
function bindDragReorder(){
  document.querySelectorAll('#pgrid .pcard').forEach(card=>{
    card.addEventListener('dragstart',()=>{dragId=+card.dataset.id;card.classList.add('dragging');});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');dragId=null;});
    card.addEventListener('dragover',e=>e.preventDefault());
    card.addEventListener('drop',async e=>{e.preventDefault();const targetId=+card.dataset.id;if(!dragId||dragId===targetId)return;await reorderTo(dragId,targetId);});
  });
}
async function reorderTo(fromId,toId){
  let photos=(curDetail.photos||[]).slice();
  let fi=photos.findIndex(p=>p.id===fromId),ti=photos.findIndex(p=>p.id===toId);
  if(fi<0||ti<0)return;const step=fi<ti?1:-1;
  try{while(fi!==ti){const a=photos[fi].id,b=photos[fi+step].id;
      await api('/reorder-photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idA:a,idB:b})});
      const t=photos[fi];photos[fi]=photos[fi+step];photos[fi+step]=t;fi+=step;}
    await refreshCity();
  }catch(e){toast(e.message,'err');await refreshCity();}
}
function bindUpload(){
  const drop=document.getElementById('upDrop'),input=document.getElementById('fileInput');
  drop.onclick=()=>input.click();
  input.onchange=()=>{if(input.files.length)uploadFiles([...input.files]);input.value='';};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag');};
  drop.ondragleave=()=>drop.classList.remove('drag');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(fs.length)uploadFiles(fs);};
}
async function uploadFiles(files){
  const status=document.getElementById('upStatus');let done=0;
  for(const f of files){status.textContent='上传中 '+(done+1)+'/'+files.length+'：'+f.name;
    try{const qs='?cityKey='+encodeURIComponent(curCity)+'&name='+encodeURIComponent(f.name);
      await api('/photo'+qs,{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});done++;
    }catch(e){toast(f.name+'：'+e.message,'err');}}
  status.textContent='';toast('上传完成 '+done+'/'+files.length,'ok');await refreshCity();
}

/* ===== 景点管理 ===== */
function renderAttractions(){
  const el=document.getElementById('attrList');if(!el)return;
  const attrs=curDetail.attractions||[];
  el.innerHTML=attrs.map(a=>
    '<div class="block" style="background:var(--panel-2);margin-bottom:14px" data-aid="'+a.id+'">'+
      '<div class="tag-add" style="margin-bottom:10px">'+
        '<input type="text" value="'+esc(a.name)+'" onchange="updAttraction('+a.id+',{name:this.value})" placeholder="景点名">'+
        '<input type="text" value="'+esc(a.visitDate||'')+'" onchange="updAttraction('+a.id+',{visitDate:this.value})" placeholder="日期" style="max-width:140px;flex:0 0 auto;padding:8px 12px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--panel);color:var(--text-primary);font-size:.84em">'+
        '<button class="btn sm danger" onclick="delAttraction('+a.id+')">删景点</button></div>'+
      '<input type="text" value="'+esc(a.notes||'')+'" onchange="updAttraction('+a.id+',{notes:this.value})" placeholder="备注/描述" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--glass-border);background:var(--panel);color:var(--text-primary);font-size:.84em;margin-bottom:12px">'+
      '<div class="up-drop" style="padding:16px" onclick="document.getElementById(\'af'+a.id+'\').click()">+ 上传景点照片<input type="file" id="af'+a.id+'" accept="image/*" multiple hidden></div>'+
      '<div class="pgrid" style="margin-top:12px">'+(a.photos||[]).map(p=>
        '<div class="pcard"><div class="ph" style="cursor:default"><img src="'+esc(p.url)+'" loading="lazy"></div>'+
          '<div class="meta"><div class="acts"><button class="btn sm danger" onclick="delAttrPhoto('+p.id+')">删</button></div></div></div>').join('')+'</div>'+
    '</div>'
  ).join('')||'<div style="color:var(--text-muted);font-size:.84em">还没有景点，上方添加。</div>';
  (curDetail.attractions||[]).forEach(a=>{const inp=document.getElementById('af'+a.id);if(inp)inp.onchange=()=>{if(inp.files.length)uploadAttrPhotos(a.id,[...inp.files]);inp.value='';};});
}
async function addAttraction(){
  const name=document.getElementById('attrName').value.trim();if(!name){toast('请输入景点名','err');return;}
  const visitDate=document.getElementById('attrDate').value.trim();
  try{await api('/attraction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cityKey:curCity,name,visitDate})});toast('已添加景点','ok');await refreshCity();}catch(e){toast(e.message,'err');}
}
async function updAttraction(id,patch){try{await api('/attraction/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});toast('已更新','ok');}catch(e){toast(e.message,'err');}}
async function delAttraction(id){if(!confirm('删除该景点及其所有照片？'))return;try{await api('/attraction/'+id,{method:'DELETE'});toast('已删除','ok');await refreshCity();}catch(e){toast(e.message,'err');}}
async function delAttrPhoto(id){if(!confirm('删除这张景点照片？'))return;try{await api('/attraction-photo/'+id,{method:'DELETE'});toast('已删除','ok');await refreshCity();}catch(e){toast(e.message,'err');}}
async function uploadAttrPhotos(aid,files){
  let done=0;toast('上传中…');
  for(const f of files){try{await api('/attraction-photo?attractionId='+aid+'&name='+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});done++;}catch(e){toast(f.name+'：'+e.message,'err');}}
  toast('景点照片上传 '+done+'/'+files.length,'ok');await refreshCity();
}

/* ===== 未定位照片：指派到城市 ===== */
function renderUnlocatedBlock(){
  const opts=CITIES.map(c=>'<option value="'+esc(c.cityKey)+'">'+esc(c.name)+'</option>').join('');
  return '<div class="block"><h3>未定位照片（'+UNLOCATED.length+'）</h3>'+
    '<div style="color:var(--text-muted);font-size:.82em;margin-bottom:14px">给每张选择所属城市即可归类；也可直接删除。</div>'+
    '<div class="uloc">'+UNLOCATED.map(p=>
      '<div class="pcard" data-id="'+p.id+'"><div class="ph"><img src="'+esc(p.url)+'" loading="lazy"></div>'+
        '<div class="meta"><select data-uloc="'+p.id+'"><option value="">— 指派到城市 —</option>'+opts+'</select>'+
        '<div class="acts"><button class="btn sm danger" onclick="delPhoto('+p.id+')">删</button></div></div></div>'
    ).join('')+'</div></div>';
}
function bindUnlocatedSelects(){
  document.querySelectorAll('select[data-uloc]').forEach(sel=>{
    sel.onchange=async()=>{const id=+sel.dataset.uloc,ck=sel.value;if(!ck)return;
      try{await api('/photo/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({cityKey:ck})});
        toast('已归类到 '+ck,'ok');if(curCity)await refreshCity();else{await loadCities();renderMainEmpty();}
      }catch(e){toast(e.message,'err');}
    };
  });
}

/* ===== 新增城市 ===== */
function openAddCity(){document.getElementById('addCityModal').classList.add('on');document.getElementById('addCitySearch').value='';document.getElementById('addCityRes').innerHTML='';document.getElementById('addCitySearch').focus();}
function closeAddCity(){document.getElementById('addCityModal').classList.remove('on');}
document.getElementById('addCityModal').addEventListener('click',e=>{if(e.target.id==='addCityModal')closeAddCity();});
document.getElementById('addCitySearch').addEventListener('input',e=>{
  const q=e.target.value.trim();const res=document.getElementById('addCityRes');
  if(!q||!window.CITIES_GEO){res.innerHTML='';return;}
  const exist=new Set(CITIES.map(c=>c.cityKey));
  const hits=Object.keys(CITIES_GEO).filter(n=>n.includes(q)).slice(0,30);
  res.innerHTML=hits.map(n=>{const g=CITIES_GEO[n];const dis=exist.has(n);
    return '<div class="sr"'+(dis?' style="opacity:.4;pointer-events:none"':' onclick="createCity(\''+esc(n)+'\')"')+'><span>'+esc(n)+(dis?'（已存在）':'')+'</span><small>'+esc(g[2]||'')+'</small></div>';
  }).join('')||'<div class="sr"><small>没有匹配的城市</small></div>';
});
async function createCity(name){
  const g=window.CITIES_GEO[name];if(!g)return;
  const adcode=PROV_ADCODE[g[2]]||'';
  try{await api('/city/'+encodeURIComponent(name),{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,adcode,lng:g[0],lat:g[1]})});
    toast('已新增城市 '+name,'ok');closeAddCity();await loadCities();await selectCity(name);
  }catch(e){toast(e.message,'err');}
}
</script>
