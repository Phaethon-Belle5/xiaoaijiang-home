let _curMemoId=null;
function getGhToken(){return sessionStorage.getItem('xiaoaijiang-gh')||'';}
function ghLogin(){window.location.href=API_URL+'/oauth/login';}
async function ghLogout(){
  const t=getGhToken();
  if(t)await fetch(API_URL+'/oauth/logout',{method:'POST',headers:{Authorization:'Bearer '+t}}).catch(()=>{});
  sessionStorage.removeItem('xiaoaijiang-gh');sessionStorage.removeItem('xiaoaijiang-gh-user');
  renderCommentAuth();
}
async function openMemoDetail(id){
  _curMemoId=id;
  const m=(data.memos||[]).find(x=>x.id===id);if(!m)return;
  document.getElementById('memo-detail-text').textContent=m.text||'';
  document.getElementById('memo-detail-date').textContent=m.date||'';
  const img=document.getElementById('memo-detail-img');
  if(m.image){img.src=m.image;img.style.display='block';}else{img.removeAttribute('src');img.style.display='none';}
  document.getElementById('memo-detail-overlay').classList.add('show');
  document.getElementById('memo-detail-overlay').setAttribute('aria-hidden','false');
  renderCommentAuth();
  loadComments(id);
}
function closeMemoDetail(){
  document.getElementById('memo-detail-overlay').classList.remove('show');
  document.getElementById('memo-detail-overlay').setAttribute('aria-hidden','true');
  _curMemoId=null;
}
async function loadComments(id){
  const list=document.getElementById('memo-cmt-list'),title=document.getElementById('memo-cmt-title');
  list.innerHTML='<div class="comment-empty">加载中…</div>';
  try{
    const r=await fetch(API_URL+'/comments/'+encodeURIComponent(id));
    if(!r.ok)throw new Error('err');
    const comments=await r.json();
    title.textContent='评论 ('+(comments.length||0)+')';
    renderComments(comments);
  }catch(e){list.innerHTML='<div class="comment-empty">评论加载失败</div>';}
}
function renderComments(comments){
  const list=document.getElementById('memo-cmt-list');
  if(!comments||!comments.length){list.innerHTML='<div class="comment-empty">还没有评论，来抢沙发～</div>';return;}
  list.innerHTML=comments.map(c=>`
    <div class="comment-item">
      <img class="comment-avatar" src="${escHtml(c.avatar||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="comment-body">
        <div class="comment-head"><span class="comment-user">${escHtml(c.user||'匿名')}</span><span class="comment-date">${escHtml((c.date||'').slice(0,10))}</span></div>
        <p class="comment-content">${escHtml(c.content)}</p>
      </div>
    </div>`).join('');
}
function renderCommentAuth(){
  const auth=document.getElementById('memo-cmt-auth'),inputRow=document.getElementById('memo-cmt-input-row');
  if(!auth)return;
  const token=getGhToken();
  if(token){
    let uname='';
    try{uname=JSON.parse(sessionStorage.getItem('xiaoaijiang-gh-user')||'{}').login||'';}catch(e){}
    auth.innerHTML='<span class="gh-login-btn" style="cursor:default">已登录：<span class="gh-user">'+escHtml(uname||'GitHub')+'</span></span> <button class="gh-login-btn" onclick="ghLogout()">退出</button>';
    if(inputRow)inputRow.style.display='flex';
  }else{
    auth.innerHTML='<button class="gh-login-btn" onclick="ghLogin()">用 GitHub 登录评论</button>';
    if(inputRow)inputRow.style.display='none';
  }
}
async function submitComment(){
  if(!_curMemoId)return;
  const token=getGhToken();
  if(!token){ghLogin();return;}
  const input=document.getElementById('memo-cmt-input');
  const content=(input.value||'').trim();
  if(!content)return;

<!-- Particle Background Canvas -->
<canvas id="particle-canvas" style="position:fixed;inset:0;z-index:989;pointer-events:none"></canvas>

<!-- Particle System -->
<script>
(function(){
  var canvas = document.getElementById('particle-canvas');
  if (!canvas) { return; }
  var ctx = canvas.getContext('2d');
  var W = canvas.width = window.innerWidth;
  var H = canvas.height = window.innerHeight;
  var mouseX = -500, mouseY = -500;
  var particles = [];
  var COUNT = 200;
  var COLOR = '#FF9FFC';
  var MAX_DIST = 180;

  window.addEventListener('resize', function(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });
  document.addEventListener('mousemove', function(e){ mouseX = e.clientX; mouseY = e.clientY; });
  document.addEventListener('mouseleave', function(){ mouseX = -500; mouseY = -500; });

  function Particle(){
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 3 + 1.5;
    this.phase = Math.random() * Math.PI * 2;
  }
  Particle.prototype.move = function(){
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
    if (this.y < -10) this.y = H + 10;
    if (this.y > H + 10) this.y = -10;
    var dx = mouseX - this.x;
    var dy = mouseY - this.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 250 && dist > 0) {
      this.vx += (dx / dist) * 0.06;
      this.vy += (dy / dist) * 0.06;
    }
    var speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > 0.6) { this.vx *= 0.98; this.vy *= 0.98; }
  };
  Particle.prototype.draw = function(t){
    var s = Math.sin(t * 0.002 + this.phase) * 0.4 + 0.6;
    ctx.globalAlpha = 0.3 + s * 0.3;
    ctx.fillStyle = COLOR;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * s, 0, Math.PI * 2);
    ctx.fill();
  };

  for (var i = 0; i < COUNT; i++) particles.push(new Particle());

  function loop(now){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++){
      particles[i].move();
      particles[i].draw(now);
    }
    ctx.strokeStyle = COLOR;
    ctx.lineWidth = 0.5;
    for (var i = 0; i < particles.length; i++){
      for (var j = i + 1; j < particles.length && j < i + 25; j++){
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST){
          ctx.globalAlpha = (1 - dist / MAX_DIST) * 0.12;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }
  requestAnimationFrame(loop);
});
</script>

<!-- Click Burst Particles -->
<canvas id="clickfx-canvas" style="position:fixed;inset:0;z-index:999;pointer-events:none"></canvas>
<script>
(function(){
  var canvas=document.getElementById('clickfx-canvas');
  if(!canvas)return;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced)return;
  var ctx=canvas.getContext('2d');
  var W,H,dpr=Math.min(window.devicePixelRatio||1,1.5);
  function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  resize();window.addEventListener('resize',resize);
  var COLORS=['#D4A843','#E8C456','#9075D9','#FF9FFC','#38bdf8','#f472b6','#4ade80','#fb7185'];
  var parts=[];
  var running=false;
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=0.02;
      if(p.life<=0){parts.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(0.5+p.life),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(parts.length){requestAnimationFrame(loop);}else{running=false;ctx.clearRect(0,0,W,H);}
  }
  document.addEventListener('pointerdown',function(e){
    if(localStorage.getItem('xiaoaijiang-fx-click')==='0')return;
    if(e.target.closest&&e.target.closest('#admin-overlay,#login-overlay,#lightbox,.music-panel,#pet-container'))return;
    var n=8+Math.floor(Math.random()*7);
    for(var i=0;i<n;i++){
      var ang=Math.random()*Math.PI*2,sp=1+Math.random()*4;
      parts.push({x:e.clientX,y:e.clientY,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.5,g:0.15,life:0.6+Math.random()*0.5,size:1.5+Math.random()*3,color:COLORS[Math.floor(Math.random()*COLORS.length)]});
    }
    if(!running){running=true;loop();}
  },{passive:true});
})();
</script>

    pet.style.left=(origLeft+dx)+'px';
    pet.style.top=(origTop+dy)+'px';
  });
  pet.addEventListener('pointerup',function(e){
    if(!dragging)return;
    dragging=false;
    if(!moved){nextAnim();return;}
    var r=pet.getBoundingClientRect();
    pet.style.left=Math.max(0,Math.min(r.left,window.innerWidth-r.width))+'px';
    pet.style.top=Math.max(0,Math.min(r.top,window.innerHeight-r.height))+'px';
  });
  setTimeout(showBubble,2500);
  setInterval(function(){if(!bubble.classList.contains('show'))showBubble();},22000);
})();
</script>

</body>
</html>
