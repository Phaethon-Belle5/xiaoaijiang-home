/* ---- Reset ---- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--font-body);color:var(--wf-body);background:var(--wf-canvas);min-height:100vh;line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}

::selection{background:var(--gold-pale);color:var(--void)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}

ul,ol{list-style:none}

/* ---- Star Corner Decorations ---- */
.star-corners,.star-corners-4{position:relative}

@keyframes starPulse{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.7;transform:scale(1.15)}}
@keyframes starTwinkle{0%,100%{opacity:0.35}30%{opacity:0.8}60%{opacity:0.35}80%{opacity:0.55}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes navSlideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes heroReveal{from{opacity:0;transform:translateY(40px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--gold-glow)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes bgDrift{0%{transform:scale(1.05) translate(0,0)}50%{transform:scale(1.08) translate(-1%,-1%)}100%{transform:scale(1.05) translate(0,0)}}
@keyframes blurIn{from{filter:blur(12px);opacity:0}to{filter:blur(0);opacity:1}}
@keyframes shinySweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
h1,h2,h3,h4,.card-heading,.portfolio-title{background:linear-gradient(110deg,var(--grad-a) 30%,var(--grad-b) 48%,var(--grad-b) 52%,var(--grad-a) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:none!important}
.shiny-text{animation:none!important;display:inline-block}
.shiny-text-gold{animation:none!important;display:inline-block}
button,.btn,.slide-cta,.download-btn,input,textarea,select,.card-label,.nav-brand,.footer-logo,.nav-brand-star,.parchment-card,.parchment-card *,.bento-parchment,.bento-parchment *,.news-card,.news-card *,.testimonial-card,.testimonial-card *,.contact-card,.contact-card *,.dark-card,.dark-card *,.bento-dark,.bento-dark *{-webkit-text-fill-color:initial!important;background-clip:border-box!important}
.reveal{opacity:0;transition:opacity 0.7s var(--ease-out),transform 0.7s var(--ease-out)}
.reveal-up{transform:translateY(28px)}.reveal-left{transform:translateX(-20px)}.reveal-right{transform:translateX(20px)}.reveal-scale{transform:scale(0.92)}
.reveal-left{transform:translateX(-24px)}
.reveal-right{transform:translateX(24px)}
.reveal-scale{transform:scale(0.94)}
.reveal.visible{opacity:1;transform:translateY(0) translateX(0) scale(1)}
.reveal-d1{transition-delay:0s}.reveal-d2{transition-delay:.06s}.reveal-d3{transition-delay:.12s}
.reveal-d4{transition-delay:.18s}.reveal-d5{transition-delay:.24s}.reveal-d6{transition-delay:.30s}
#topnav{animation:navSlideDown 0.6s var(--ease-out) both}
.carousel-slide.active .slide-eyebrow{animation:heroReveal 0.8s .2s var(--ease-out) both}
.carousel-slide.active .slide-headline{animation:heroReveal 0.8s .35s var(--ease-out) both}
.carousel-slide.active .slide-bio{animation:heroReveal 0.8s .5s var(--ease-out) both}
.carousel-slide.active .slide-cta{animation:heroReveal 0.8s .65s var(--ease-out) both}
.carousel-slide.active .slide-cta:hover{animation:pulse 2.5s 1.5s ease-out infinite}
.carousel-slide.active .slide-avatar{animation:heroReveal 0.8s .1s var(--ease-out) both}
.carousel-slide.active .slide-bg{animation:bgDrift 12s ease-in-out infinite}
.star-corners:hover::before,.star-corners:hover::after,.star-corners-4:hover::before,.star-corners-4:hover::after{animation:starTwinkle 2s ease-in-out infinite}
.gallery-item img{filter:blur(8px);transition:filter 0.5s ease,opacity 0.5s ease}
.gallery-item img.loaded{filter:blur(0)}
.portfolio-item img{filter:blur(8px);transition:filter 0.5s ease,transform 0.6s ease}
.portfolio-item img.loaded{filter:blur(0)}
.slide-cta:active,.btn:active,.download-btn:active{transform:scale(0.96)!important;transition:transform 0.1s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}.carousel-slide .slide-bg{animation:none}.gallery-item img,.portfolio-item img{filter:none}.shiny-text,.shiny-text-gold{animation:none!important;display:inline-block}}

/* ---- Section Headers ---- */
.section-header{text-align:center;margin-bottom:var(--space-16)}
.section-header .header-eyebrow{font-family:var(--font-body);font-size:15px;letter-spacing:1.5px;color:var(--wf-mute);text-transform:uppercase;margin-bottom:var(--space-3);font-weight:500}
.section-header .header-headline{font-family:var(--font-display);font-size:clamp(1.4rem,3vw,2.2rem);font-weight:600;color:var(--wf-ink);line-height:1.2;margin-bottom:var(--space-4)}
.section-header .header-desc{font-size:0.92em;color:var(--wf-body);max-width:55ch;margin:0 auto;line-height:1.8}
.section-divider{width:120px;height:1px;background:var(--wf-hairline);margin:0 auto var(--space-12)}

/* ============================================================
   MODULE 1 — GLASS NAV
   ============================================================ */
#topnav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:1000;
  display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);
  background:transparent;border-bottom:1px solid transparent;
  transition:background 0.5s var(--ease-out),border-color 0.5s var(--ease-out);
}
#topnav.scrolled{background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-border);box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.nav-brand{font-family:var(--font-display);font-size:1.05em;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:var(--space-3);letter-spacing:.04em;cursor:pointer;user-select:none;transition:color 0.3s}
.nav-brand:hover{color:var(--wf-ink)}
.nav-brand-star{font-size:1.2em;color:var(--gold);animation:starPulse 3s ease-in-out infinite}
.nav-spacer{flex:1}
.nav-actions{display:flex;align-items:center;gap:4px}
.nav-icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05em;color:var(--text-secondary);transition:all 0.2s var(--ease-out)}
.nav-icon-btn:hover{color:var(--wf-ink);background:rgba(0,0,0,0.04)}
.nav-icon-btn .ic-sun{display:none}
[data-theme="light"] .nav-icon-btn .ic-moon{display:none}
[data-theme="light"] .nav-icon-btn .ic-sun{display:block}
.nav-hamburger{display:none}

/* Pill Nav — 下划线高亮 */
.pill-nav-wrap{position:relative;display:flex;align-items:center;gap:2px}
.pill-nav-item{position:relative;padding:8px 16px;cursor:pointer;font-size:.82em;font-weight:500;letter-spacing:.02em;white-space:nowrap;transition:color .3s;color:var(--text-secondary);background:transparent;border:none;font-family:var(--font-body)}
.pill-nav-item::after{content:'';position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .3s var(--ease-out)}
.pill-nav-item:hover{color:var(--text-primary)}
.pill-nav-item.on{color:var(--text-primary);font-weight:600}
.pill-nav-item.on::after{transform:scaleX(1)}

/* ============================================================
   MODULE 2 — FULL-SCREEN CAROUSEL HERO
   ============================================================ */
#carousel-section{position:relative;z-index:1;min-height:100dvh;height:100dvh;overflow:hidden;background:transparent}
.carousel-track{position:relative;width:100%;height:100%}
.carousel-slide{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center}
.carousel-slide.active{opacity:1;visibility:visible;pointer-events:auto;z-index:1}
.carousel-slide .slide-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.45);transform:scale(1.05);transition:transform 8s ease}
.carousel-slide.active .slide-bg{transform:scale(1)}
.carousel-slide .slide-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,255,255,0.3) 100%),linear-gradient(to top,var(--wf-canvas) 0%,transparent 40%)}
.carousel-slide[data-index="0"] .slide-vignette{background:radial-gradient(ellipse at 28% 38%,rgba(144,117,217,0.22),transparent 60%),linear-gradient(to top,var(--wf-canvas) 0%,transparent 40%)}
.carousel-slide[data-index="1"] .slide-vignette{background:radial-gradient(ellipse at 72% 26%,rgba(212,168,67,0.20),transparent 60%),linear-gradient(to top,var(--wf-canvas) 0%,transparent 40%)}
.carousel-slide[data-index="2"] .slide-vignette{background:radial-gradient(ellipse at 50% 80%,rgba(168,45,63,0.18),transparent 60%),linear-gradient(to top,var(--wf-canvas) 0%,transparent 40%)}
.carousel-slide .slide-content{position:relative;z-index:2;text-align:center;max-width:720px;padding:var(--space-8) var(--space-10);background:rgba(10,16,30,0.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.14);border-radius:var(--radius-xl);box-shadow:var(--shadow-card)}
[data-theme="light"] .carousel-slide .slide-content{background:rgba(255,255,255,0.35);border:1px solid rgba(0,0,0,0.08)}
.slide-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto var(--space-5);border:3px solid var(--gold);box-shadow:0 0 40px var(--gold-glow);cursor:pointer;transition:transform 0.3s}
.slide-avatar:hover{transform:scale(1.06)}
.slide-eyebrow{font-family:var(--font-display);font-size:0.7em;letter-spacing:0.2em;color:var(--wf-purple);text-transform:uppercase;margin-bottom:var(--space-4)}
.slide-headline{font-family:var(--font-display);font-size:clamp(1.5rem,4vw,2.8rem);font-weight:600;color:var(--wf-ink);line-height:1.15;margin-bottom:var(--space-4)}
.slide-bio{font-size:0.95em;color:var(--wf-body);line-height:1.9;margin-bottom:var(--space-8);max-width:55ch;margin-left:auto;margin-right:auto;white-space:pre-line}
.slide-cta{display:inline-flex;align-items:center;gap:var(--space-2);padding:12px 24px;background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);color:var(--text-primary);border-radius:var(--radius-pill);font-weight:500;font-size:0.92em;letter-spacing:-0.01em;cursor:pointer;transition:all 0.2s var(--ease-out)}
.slide-cta:hover{background:rgba(255,255,255,0.14);border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.slide-cta:active{transform:scale(0.97)}
/* Carousel controls */
.carousel-dots{position:absolute;bottom:var(--space-10);left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:var(--space-3);align-items:center}
.visit-badge{font-size:.72em;color:var(--text-muted);letter-spacing:.05em;margin-top:var(--space-4);opacity:.85}
/* 全站固定 ICP 备案底栏 */
.icp-bar{position:fixed;bottom:0;left:0;right:0;z-index:990;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(8,10,16,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--surface-border);font-size:.62em;color:var(--text-muted)}
.icp-bar a{color:inherit;text-decoration:none}
.icp-bar a:hover{color:var(--gold)}
.carousel-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3);cursor:pointer;transition:all 0.3s var(--ease-out)}
.carousel-dot.active,.carousel-dot:hover{background:var(--gold);transform:scale(1.3);box-shadow:0 0 12px var(--gold-glow)}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--text-primary);font-size:1.2em;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.25s var(--ease-out);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.carousel-arrow:hover{background:rgba(255,255,255,0.12);border-color:var(--gold);color:var(--gold)}
.carousel-arrow.prev{left:var(--space-6)}.carousel-arrow.next{right:var(--space-6)}

/* ============================================================
   MODULE 3 — CONTENT PARTITION (Bento + Portfolio + About)
   ============================================================ */
#content-section{position:relative;z-index:1;padding:var(--space-24) 0;background:transparent}
.bento-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--space-6);max-width:var(--container-max);margin:0 auto var(--space-16);padding:0 var(--container-padding)}
.bento-tile{position:relative;border-radius:var(--radius-lg);overflow:hidden}
.bento-tile.wide{grid-column:span 7}.bento-tile.medium{grid-column:span 5}.bento-tile.small{grid-column:span 4}.bento-tile.mini{grid-column:span 3}
.bento-image{background-size:cover;background-position:center;min-height:280px;transition:transform 0.6s var(--ease-out)}
.bento-image:hover{transform:scale(1.04)}
.bento-parchment{background:var(--wf-canvas);border:1px solid var(--wf-hairline);padding:var(--space-8);display:flex;flex-direction:column;transition:all 0.3s var(--ease-out);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.bento-parchment:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}
.bento-dark{background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);padding:var(--space-8);display:flex;flex-direction:column;transition:all 0.35s var(--ease-out);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.bento-dark:hover{border-color:var(--gold-pale);box-shadow:var(--shadow-card-hover)}
.bento-dark .card-label{display:block;text-align:center;font-family:var(--font-display);font-size:1.08em;font-weight:600;letter-spacing:.04em;color:var(--wf-ink);background:linear-gradient(110deg,var(--grad-a) 30%,var(--grad-b) 48%,var(--grad-b) 52%,var(--grad-a) 70%);background-size:200% 100%;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important}
.bento-dark .card-heading{color:var(--wf-ink);font-family:var(--font-display)}
.bento-dark .card-text{color:var(--wf-body);white-space:pre-wrap}

/* Portfolio grid — unified Webflow card style */
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-6);max-width:var(--container-max);margin:0 auto;padding:0 var(--container-padding)}
.portfolio-item{position:relative;background:var(--wf-canvas);border:1px solid var(--wf-hairline);border-radius:var(--radius-md);overflow:hidden;transition:all 0.2s var(--ease-out);cursor:pointer;box-shadow:var(--shadow-card)}
.portfolio-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover);border-color:var(--wf-mute-soft)}
.portfolio-item img{width:100%;height:160px;object-fit:cover;transition:transform 0.4s ease}
.portfolio-item:hover img{transform:scale(1.04)}
.portfolio-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s}
.portfolio-overlay span{color:#fff;font-weight:500;font-size:0.85em;padding:8px 20px;border:1px solid rgba(255,255,255,0.6);border-radius:4px;letter-spacing:-0.01em}
.portfolio-item:hover .portfolio-overlay{opacity:1}
.portfolio-info{padding:12px 16px;background:var(--wf-canvas);border-top:1px solid var(--wf-hairline)}
.portfolio-title{font-family:var(--font-display);font-size:0.88em;font-weight:600;color:var(--wf-ink);margin-bottom:4px;letter-spacing:-0.01em}
.portfolio-link{font-size:0.78em;color:var(--wf-mute);word-break:break-all}

/* Portfolio sub-nav */
/* ---- Photo Gallery (Masonry) ---- */
#gallery-section{position:relative;z-index:1;padding:var(--space-24) 0;background:transparent}
.gallery-item{break-inside:avoid;margin-bottom:var(--space-5);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;position:relative;transition:transform 0.2s var(--ease-out),box-shadow 0.2s var(--ease-out);border:1px solid var(--wf-hairline);background:var(--wf-canvas);box-shadow:var(--shadow-card)}
.gallery-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover);border-color:var(--wf-mute-soft)}
.gallery-item img{width:100%;display:block;transition:transform 0.6s ease}
.gallery-item:hover img{transform:scale(1.06)}
.gallery-item .gallery-caption{font-size:0.82em;position:absolute;bottom:0;left:0;right:0;padding:var(--space-4) var(--space-5);background:linear-gradient(transparent,rgba(0,0,0,0.6));color:#fff;opacity:0;transition:opacity 0.3s;display:flex;justify-content:space-between;align-items:flex-end}
.gallery-item:hover .gallery-caption{opacity:1}
.gallery-caption .g-cap-text{flex:1;font-weight:500}
.gallery-caption .g-cap-date{font-family:var(--font-mono);font-size:0.75em;opacity:0.8}
/* Desktop masonry columns */
.gallery-grid{columns:3 280px;column-gap:var(--space-5);max-width:var(--container-max);margin:0 auto;padding:0 var(--container-padding)}

/* Lightbox */
#lightbox{position:fixed;inset:0;z-index:10100;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;cursor:pointer}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:var(--radius-md);box-shadow:0 0 80px rgba(0,0,0,0.6)}
#lightbox .lb-close{position:absolute;top:var(--space-6);right:var(--space-6);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:1.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
#lightbox .lb-close:hover{background:rgba(255,255,255,0.18)}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:1.3em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
#lightbox .lb-nav:hover{background:rgba(255,255,255,0.14);border-color:var(--gold)}
#lightbox .lb-prev{left:var(--space-6)}#lightbox .lb-next{right:var(--space-6)}
#lightbox .lb-caption{position:absolute;bottom:var(--space-8);left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.7);font-size:0.88em;text-align:center}
@media(max-width:768px){.gallery-grid{columns:2 140px;column-gap:var(--space-3)}.gallery-item{margin-bottom:var(--space-3)}#lightbox .lb-nav{width:36px;height:36px;font-size:1em}}

/* Form row (admin panel) */
.form-row{display:flex;gap:var(--space-3);margin-bottom:var(--space-3)}
.form-row input,.form-row textarea{
  flex:1;padding:10px 14px;border:1px solid var(--surface-border);border-radius:var(--radius-sm);
  font-family:var(--font-body);font-size:.86em;color:var(--text-primary);background:var(--astral);
  outline:none;transition:border-color 0.2s;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--gold)}
.form-row textarea{min-height:70px;resize:vertical}

/* ============================================================
   MODULE 5 — FOOTER WITH CONTACT
   ============================================================ */
#footer-section{position:relative;z-index:1;padding:var(--space-20) 0;background:transparent;text-align:center}
.contact-card{
  display:inline-flex;flex-wrap:wrap;gap:var(--space-8);justify-content:center;
  background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:var(--radius-xl);
  padding:var(--space-8) var(--space-12);margin-bottom:var(--space-12);box-shadow:var(--shadow-card);
}
.contact-item{display:flex;align-items:center;gap:var(--space-3);color:var(--text-secondary);font-size:0.9em;white-space:pre-wrap}
.contact-item .c-icon{font-size:1.3em;flex-shrink:0}
#footer-main{border-top:1px solid var(--surface-border);background:transparent;padding:var(--space-10) 0}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:var(--space-10);max-width:var(--container-max);margin:0 auto;padding:0 var(--container-padding)}
.footer-brand .footer-logo{font-family:var(--font-display);font-size:1.05em;font-weight:700;color:var(--text-primary);margin-bottom:var(--space-3)}
.footer-brand .footer-tagline{font-size:0.78em;color:var(--text-muted);line-height:1.7}
.footer-col .footer-heading{font-family:var(--font-display);font-size:0.72em;font-weight:600;letter-spacing:0.1em;color:var(--gold-pale);margin-bottom:var(--space-4);text-transform:uppercase}
.footer-col .footer-link{display:block;padding:4px 0;font-size:0.82em;color:var(--text-secondary);transition:color 0.2s;cursor:pointer}
.footer-col .footer-link:hover{color:var(--gold)}
.footer-bottom{max-width:var(--container-max);margin:var(--space-10) auto 0;padding:var(--space-6) var(--container-padding);border-top:1px solid var(--surface-border);display:flex;justify-content:space-between;align-items:center;font-size:0.74em;color:var(--text-muted)}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 28px;background:var(--gold);color:var(--void);border-radius:var(--radius-pill);font-size:0.88em;font-weight:600;cursor:pointer;transition:all 0.25s var(--ease-out);letter-spacing:.02em}
.btn:hover{background:var(--gold-bright);transform:translateY(-2px);box-shadow:0 6px 24px var(--gold-glow)}
.btn:active{transform:scale(0.97)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--surface-border-strong)}
.btn-ghost:hover{background:rgba(255,255,255,0.04);border-color:var(--gold);color:var(--gold-bright);box-shadow:none;transform:translateY(-1px)}
.btn-sm{padding:5px 14px;font-size:0.76em}
.btn-danger{color:var(--crimson);background:transparent;border:1px solid var(--surface-border)}
.btn-danger:hover{background:rgba(168,45,63,0.1);border-color:var(--crimson);box-shadow:none}

/* ---- Admin Entry (gear) ---- */
#admin-entry-btn{position:fixed;bottom:28px;left:24px;width:38px;height:38px;background:#1a1a1a;border:1px solid #333;border-radius:4px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:#999;z-index:990;opacity:0.5;transition:all 0.25s;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
#admin-entry-btn:hover{opacity:1;color:#fff;border-color:#555;transform:scale(1.05)}

/* ---- Back to Top ---- */
#back-to-top{position:fixed;bottom:150px;right:24px;width:38px;height:38px;background:var(--astral-elevated);border:1px solid var(--surface-border);border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);z-index:998;opacity:0;transform:translateY(10px);pointer-events:none;transition:all 0.3s;box-shadow:var(--shadow-card)}
/* 悬浮音乐播放器 */
.music-float{position:fixed;bottom:34px;right:150px;z-index:995;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.music-float.panel-open .music-fab{position:absolute;top:-12px;left:0;z-index:2}
.music-fab{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s var(--ease-out);user-select:none;color:var(--gold);touch-action:none}
.music-fab:hover{transform:scale(1.08)}
.music-fab .m-note{display:flex;align-items:center;justify-content:center;color:var(--gold)}
.music-fab .m-eq{display:none;align-items:flex-end;gap:2px;height:18px}
.music-fab.playing .m-note{display:none}
.music-fab.playing .m-eq{display:flex}
.music-fab .m-eq i{width:3px;background:var(--gold);border-radius:2px;animation:eqbounce 1s ease-in-out infinite}
.music-fab .m-eq i:nth-child(2){animation-delay:.15s}
.music-fab .m-eq i:nth-child(3){animation-delay:.3s}
@keyframes eqbounce{0%,100%{height:5px}50%{height:18px}}
.music-panel{display:none;width:280px;background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:16px;box-shadow:var(--shadow-card);padding:14px 16px}
.music-panel.open{display:block;animation:viewIn .3s var(--ease-out)}
.music-title{font-size:.85em;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
.music-progress{height:5px;background:rgba(255,255,255,.12);border-radius:3px;cursor:pointer;margin-bottom:10px;position:relative}
.music-progress .bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:3px;width:0%}
.music-controls{display:flex;align-items:center;gap:8px}
.music-btn{width:32px;height:32px;border-radius:50%;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s;flex-shrink:0;background:transparent;border:none}
.music-btn:hover{color:var(--gold)}
.music-btn.play{width:40px;height:40px;color:var(--gold)}
.music-btn.play .ic-pause{display:none}
.music-btn.play.playing .ic-play{display:none}
.music-btn.play.playing .ic-pause{display:block}
.music-vol{flex:1;display:flex;align-items:center;gap:6px;color:var(--text-muted);min-width:0}
.music-vol input{flex:1;min-width:0;accent-color:var(--gold);height:4px}
/* 桌宠 */
.pet-container{position:fixed;bottom:100px;left:12px;z-index:996;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.pet-img{width:120px;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.45))}
.pet-bubble{position:relative;width:210px;margin-bottom:4px;display:none;transform-origin:bottom center}
.pet-bubble.show{display:block;animation:bubbleIn .3s var(--ease-out)}
.pet-bubble-bg{width:100%;height:auto;display:block}
.pet-msg{position:absolute;top:12px;left:0;right:0;bottom:30px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 24px;font-size:.78em;color:#3a3320;line-height:1.5;overflow:hidden}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (max-width:768px){.pet-img{width:88px}.pet-bubble{width:168px}.pet-msg{font-size:.7em;padding:2px 18px}}
/* 主页音乐卡片 */
.music-card-section{max-width:var(--container-max);margin:0 auto;padding:var(--space-16) var(--container-padding) var(--space-24)}
.music-card{display:flex;align-items:center;gap:var(--space-6);max-width:760px;margin:0 auto;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:var(--space-6) var(--space-8);box-shadow:var(--shadow-card);justify-content:center}
.music-card-section{padding-left:var(--space-6);padding-right:var(--space-6)}
.mc-disc{width:170px;height:170px;border-radius:50%;background:repeating-radial-gradient(circle,#2a2a2a 0 2px,#151515 2px 4px);flex-shrink:0;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.mc-disc.playing{animation:discspin 8s linear infinite}
@keyframes discspin{to{transform:rotate(360deg)}}
.mc-disc::before{content:'';position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--gold-bright),var(--gold-pale));opacity:.92}
.mc-disc.has-cover::before{display:none}
.music-fab.has-cover{background-size:cover!important;background-position:center!important}
.mc-disc-hole{position:absolute;top:50%;left:50%;width:14px;height:14px;border-radius:50%;background:#0B0E14;transform:translate(-50%,-50%);z-index:2}
.mc-info{flex:1;max-width:440px;min-width:0}
.mc-eyebrow{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:var(--space-2)}
.mc-title{font-family:var(--font-display);font-size:1.05em;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:var(--space-2)}
.mc-stage{position:relative;height:120px;margin-bottom:var(--space-3)}
.mc-lyric{font-size:.9em;color:var(--gold-bright);height:100%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.6;letter-spacing:.02em;padding:0 var(--space-2)}
.mc-list-btn,.music-list-btn{margin-top:var(--space-2);padding:5px 16px;border-radius:9999px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text-secondary);font-size:.74em;cursor:pointer;transition:all .2s}
.mc-list-btn:hover,.music-list-btn:hover{border-color:var(--gold);color:var(--gold)}
.music-playlist{max-height:190px;overflow-y:auto;margin-top:var(--space-2);border-top:1px solid var(--glass-border);padding-top:var(--space-2)}
.mc-playlist{position:absolute;inset:0;overflow-y:auto;text-align:left;display:none;border:1px solid var(--glass-border);border-radius:10px;background:rgba(10,16,30,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:var(--space-2)}
[data-theme="light"] .mc-playlist{background:rgba(255,255,255,0.6)}
.mc-playlist::-webkit-scrollbar,.music-playlist::-webkit-scrollbar{width:4px}
.mc-playlist::-webkit-scrollbar-thumb,.music-playlist::-webkit-scrollbar-thumb{background:rgba(212,168,67,0.4);border-radius:2px}
.mc-play-item{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.8em;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.mc-play-item:hover{background:rgba(255,255,255,0.08);color:var(--text-primary)}
.mc-play-item.active{color:var(--gold-bright);background:rgba(212,168,67,0.1);font-weight:600}
.mc-progress{height:5px;background:rgba(255,255,255,.12);border-radius:3px;cursor:pointer;margin-bottom:var(--space-5);position:relative}
.mc-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:3px}
.mc-controls{display:flex;align-items:center;gap:var(--space-4);justify-content:center}
.mc-btn{width:38px;height:38px;border-radius:50%;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s;background:transparent;border:none}
.mc-btn:hover{color:var(--gold)}
.mc-btn.mc-play{width:48px;height:48px;color:var(--gold)}
.mc-btn.mc-play .ic-pause{display:none}
.mc-btn.mc-play.playing .ic-play{display:none}
.mc-btn.mc-play.playing .ic-pause{display:block}
[data-theme="light"] .mc-progress{background:rgba(0,0,0,.12)}
/* 自定义光标（仅指针设备） */
@media (pointer:fine){
  body.custom-cursor,body.custom-cursor *{cursor:none!important}
  body.custom-cursor input,body.custom-cursor textarea,body.custom-cursor select{cursor:auto!important}
}
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:100000;border-radius:50%;display:none}
.cursor-dot{width:6px;height:6px;background:var(--gold);box-shadow:0 0 6px var(--gold-glow)}
.cursor-ring{width:32px;height:32px;border:1.5px solid rgba(212,168,67,0.6);transition:width .2s,height .2s,border-color .2s,background .2s}
.cursor-ring.hover{width:52px;height:52px;border-color:var(--gold);background:rgba(212,168,67,0.12)}
body.custom-cursor .cursor-dot,body.custom-cursor .cursor-ring{display:block}
#back-to-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
#back-to-top:hover{background:var(--gold);color:var(--void);border-color:var(--gold)}

/* ---- Wallpaper Controls ---- */
#wp-stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--void)}
#wp-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#wp-stage .wp-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;filter:brightness(0.85)}
#wp-stage .wp-img.on{opacity:1}
.wp-controls{position:fixed;bottom:36px;right:24px;z-index:998;display:flex;gap:6px;align-items:center}
.wp-dot{width:9px;height:9px;border-radius:50%;background:rgba(212,168,67,0.35);cursor:pointer;transition:all 0.2s}
.wp-dot.on,.wp-dot:hover{background:var(--gold);transform:scale(1.3)}
.wp-video-toggle{width:26px;height:26px;border-radius:50%;background:var(--astral-elevated);border:1px solid var(--surface-border);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all 0.2s}
.wp-video-toggle:hover{color:var(--gold);border-color:var(--gold)}

/* ---- Admin Panel (Dark) ---- */
#admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;display:none;align-items:center;justify-content:center}
#admin-overlay.show{display:flex}
#admin-panel{background:#1a1a1a;border:1px solid #333;border-radius:8px;box-shadow:0 24px 48px rgba(0,0,0,0.4);max-width:640px;width:94vw;max-height:88vh;z-index:9999;color:#e0e0e0;display:flex;flex-direction:column;overflow:hidden}
#admin-panel h3{font-family:var(--font-display);font-size:0.95em;font-weight:600;color:#fff;letter-spacing:0.04em}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 20px 0}
.admin-head h3{margin:0}
.admin-tabs{display:flex;gap:6px;padding:14px 20px 0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin;flex-shrink:0}
.admin-tab{flex-shrink:0;padding:7px 14px;border-radius:6px;font-size:.78em;color:#bbb;background:#2a2a2a;border:1px solid #3a3a3a;cursor:pointer;user-select:none;white-space:nowrap;transition:all .15s;font-family:var(--font-body)}
.admin-tab:hover{color:#fff;border-color:#555}
.admin-tab.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:600}
.admin-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 20px}
.tab-page{display:none}
.tab-page.active{display:block}
.admin-group label{display:block;font-size:0.74em;color:#999;margin-bottom:4px;letter-spacing:.02em}
.admin-group input[type="text"],.admin-group textarea,.admin-group input[type="url"],.admin-group input[type="color"],.admin-group select{width:100%;padding:9px 12px;border:1px solid #444;border-radius:4px;font-family:var(--font-body);font-size:.85em;color:#e0e0e0;background:#2a2a2a;outline:none;transition:border-color 0.2s}
.admin-group input:focus,.admin-group textarea:focus,.admin-group select:focus{border-color:#666}
.admin-btn-row{display:flex;gap:8px;padding:14px 20px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #333;background:#1a1a1a;flex-shrink:0}

/* Wallpaper list items */
.wp-list{margin-bottom:12px}
.wp-list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#2a2a2a;border-radius:8px;margin-bottom:6px}
.wp-list-thumb{width:48px;height:30px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#333}
.wp-list-url{flex:1;min-width:0;font-size:.78em;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp-list-actions{display:flex;gap:4px;flex-shrink:0}
.wp-list-actions button{padding:3px 8px;font-size:.7em;border-radius:4px;border:1px solid #444;background:#333;cursor:pointer;color:#aaa;transition:all 0.15s}
.wp-list-actions button:hover{background:#444;color:#fff}
.wp-list-actions button.del:hover{background:rgba(238,29,54,0.2);color:#ee1d36;border-color:#ee1d36}

/* Login */
#login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:10000;display:none;align-items:center;justify-content:center}
#login-overlay.show{display:flex}
#login-box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:28px 24px;max-width:340px;width:88vw;text-align:center}
#login-box h3{font-family:var(--font-display);font-size:1em;font-weight:600;margin-bottom:6px;color:#fff}
#login-box p{font-size:0.8em;color:#999;margin-bottom:14px}
#login-box input{width:100%;padding:10px 12px;border:1px solid #444;border-radius:4px;font-size:.86em;color:#e0e0e0;outline:none;text-align:center;margin-bottom:10px;background:#2a2a2a;font-family:var(--font-body)}
#login-box input:focus{border-color:#666}

/* Toast */
#toast-container{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:10001;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 24px;border-radius:var(--radius-sm);font-size:.82em;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:auto;font-weight:500;font-family:var(--font-body)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#38A169;color:#fff}
.toast.error{background:var(--crimson);color:#fff}
.toast.info{background:var(--text-primary);color:var(--void)}

/* ---- Responsive ---- */
@media(max-width:1024px){
  :root{--nav-h:56px;--container-padding:20px}
  #topnav{padding:0 var(--space-5)}
  .bento-grid{grid-template-columns:repeat(6,1fr)}
  .bento-tile.wide{grid-column:span 6}.bento-tile.medium{grid-column:span 3}.bento-tile.small{grid-column:span 3}.bento-tile.mini{grid-column:span 3}
  .footer-grid{grid-template-columns:1fr 1fr}
  .carousel-arrow{display:none}
}
@media(max-width:768px){
  :root{--nav-h:48px;--container-padding:16px}
  #topnav{padding:0 var(--space-4)}
  .pill-nav-wrap.open{display:flex;position:fixed;top:var(--nav-h);left:0;right:0;background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);flex-direction:column;padding:var(--space-3);z-index:999;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
  .pill-nav-wrap.open{display:flex;}
  .pill-nav-wrap.open .pill-nav-item{width:100%;justify-content:center;padding:12px 16px;font-size:.85em}
  .nav-hamburger{display:flex}
  .nav-spacer{display:none}
  .bento-grid{grid-template-columns:1fr}
  .bento-tile.wide,.bento-tile.medium,.bento-tile.small,.bento-tile.mini{grid-column:span 1}
  .portfolio-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr;text-align:center}
  .footer-bottom{flex-direction:column;gap:var(--space-3);text-align:center}
  .contact-card{flex-direction:column;align-items:center;gap:var(--space-4)}
  .carousel-arrow{width:36px;height:36px;font-size:0.9em}
  .carousel-arrow.prev{left:var(--space-3)}.carousel-arrow.next{right:var(--space-3)}
  .wp-controls{bottom:28px;right:60px}
  .admin-tabs{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
  .admin-tab{padding:6px 10px;font-size:.72em}
  #back-to-top{bottom:140px;right:16px}
  #admin-entry-btn{bottom:26px;left:14px}
  .form-row{flex-direction:column}
}
@media(min-width:769px){.pill-nav-wrap{display:flex!important}}
</style>

// ============================================================
// SPLASH SCREEN

(function(){
  var overlay=document.getElementById('splash-overlay');
  var video=document.getElementById('splash-video');
  var skip=document.getElementById('splash-skip');
  if(!overlay||!video)return;
  try{if(sessionStorage.getItem('splashSeen')){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);return;}sessionStorage.setItem('splashSeen','1');}catch(e){}
  var done=false;
  function hide(){
    if(done)return;done=true;
    overlay.classList.add('fade-out');
    // Remove from DOM after transition
    setTimeout(function(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);},900);
  }
  video.playbackRate=2.0;video.play().catch(function(){
    // Autoplay blocked or load failed — hide splash immediately
    hide();
  });
  video.addEventListener('ended',hide);
  skip.addEventListener('click',hide);
  // Fallback: if video stalls for 8 seconds, auto-skip
  var fallback=setTimeout(function(){
    if(!done&&video.currentTime<0.5)hide();
  },8000);
  video.addEventListener('timeupdate',function(){
    if(video.currentTime>0.5){clearTimeout(fallback);}
  });
})();

let currentView='home'; // home|content|memos|gallery|contact

function startCarousel(){
  if(currentView!=='home'||carouselTimer)return;
  if(!document.querySelector('.carousel-slide'))return;
  carouselTimer=setInterval(carouselNext,CAROUSEL_INTERVAL);
  bindCarouselPause();
}
function stopCarousel(){
  if(carouselTimer){clearInterval(carouselTimer);carouselTimer=null;}
}
function resumeCarousel(){if(currentView==='home'&&!carouselTimer&&document.querySelector('.carousel-slide'))startCarousel();}
function bindCarouselPause(){
  if(!bindCarouselPause._done){
    bindCarouselPause._done=true;
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCarousel();else setTimeout(resumeCarousel,400);});
  }
  // renderMain 每次重建 track 元素，须按引用重绑（不能在旧元素上永久绑定）
  const tr=document.getElementById('carousel-track');
  if(!tr||tr===bindCarouselPause._track)return;
  bindCarouselPause._track=tr;
  tr.addEventListener('mouseenter',()=>stopCarousel());
  tr.addEventListener('mouseleave',()=>setTimeout(resumeCarousel,500));
  tr.addEventListener('focusin',()=>stopCarousel());
  tr.addEventListener('focusout',()=>setTimeout(resumeCarousel,500));
}
function renderViewState(){
  document.querySelectorAll('#main .view').forEach(v=>v.classList.toggle('active',v.dataset.view===currentView));
  document.querySelectorAll('.pill-nav-item').forEach(l=>l.classList.toggle('on',l.dataset.nav===currentView));
  if(currentView==='home'){startCarousel();bindCarouselPause();}else stopCarousel();
  initReveal();
  // 立即触发当前视口内 reveal（确定性，不依赖 IO 时序）
  document.querySelectorAll('#main .view.active .reveal').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top<window.innerHeight&&r.bottom>0)el.classList.add('visible');
  });
  if(currentView==='gallery')initMapAlbum();else disposeMap();
}
function navigateTo(view,opts){
  opts=opts||{};
  if(!VIEW_MAP[view])view='home';
  if(view===currentView){
    if(opts.updateHash!==false)try{history.pushState(null,'','#/'+view);}catch(e){location.hash='#/'+view;}
    return;
  }
  currentView=view;
  renderViewState();
  window.scrollTo({top:0,behavior:'instant'});
  const nl=document.getElementById('nav-links');if(nl)nl.classList.remove('open');
  const nh=document.getElementById('nav-hamburger');if(nh)nh.setAttribute('aria-expanded','false');
  if(opts.updateHash!==false)try{history.pushState(null,'','#/'+view);}catch(e){location.hash='#/'+view;}
}
function readViewFromHash(){
  const m=location.hash.match(/^#\/(\w+)/);
  return m&&VIEW_MAP[m[1]]?m[1]:'home';
}
window.addEventListener('hashchange',()=>{
  if(location.hash.startsWith('#sync='))return;
  navigateTo(readViewFromHash(),{updateHash:false});
});

const DB_NAME='xiaoaijiang-db',DB_VER=1;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=()=>{req.result.createObjectStore('store');};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function dbGet(key){
  try{const db=await openDB();return new Promise(r=>{const t=db.transaction('store','readonly');const q=t.objectStore('store').get(key);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}catch(e){return null}
}
async function dbSet(key,val){
  try{const db=await openDB();return new Promise(r=>{const t=db.transaction('store','readwrite');const q=t.objectStore('store').put(val,key);q.onsuccess=()=>r(true);q.onerror=()=>r(false);});}catch(e){return false}
}
async function dbDel(key){
  try{const db=await openDB();return new Promise(r=>{const t=db.transaction('store','readwrite');t.objectStore('store').delete(key);t.oncomplete=()=>r(true);});}catch(e){return false}
}

async function fetchWithRetry(url,opts,retries=3){
  for(let i=0;i<retries;i++)try{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),5e3*(i+1));
    const r=await fetch(url,{...opts,signal:ctrl.signal});
    return clearTimeout(t),r.ok?r:(r.status>=500?Promise.reject(new Error('Server error '+r.status)):r);
  }catch(e){if(i===retries-1)throw e;await new Promise(r=>setTimeout(r,1e3*Math.pow(2,i)))}
}

async function loadData(){
  const def=JSON.parse(JSON.stringify(DEFAULT_DATA));
  let result=def;
  // 1. 立即从本地加载（毫秒级，不阻塞渲染）
  try{const saved=await dbGet(LS_KEY);if(saved)result=mergeData(JSON.parse(JSON.stringify(def)),saved);}catch(e){console.warn('DB load:',e.message)}
  // 2. 后台静默从云端同步（不阻塞页面渲染）
  syncFromCloud(result);
  return result;}

function mergeData(d,s){
  if(s.profile)d.profile={...d.profile,...s.profile};
  if(s.wallpaper){d.wallpaper={...d.wallpaper,...s.wallpaper};if(s.wallpaper.images?.length)d.wallpaper.images=s.wallpaper.images;if(s.wallpaper.videos?.length){/* 云端只存了 duration，保留本地/默认视频的 src */const localVids=d.wallpaper.videos||[];const defVids=DEFAULT_DATA.wallpaper.videos||[];d.wallpaper.videos=s.wallpaper.videos.map((v,i)=>{if(v&&v.src)return v;const cand=(localVids[i]&&localVids[i].src)?localVids[i]:defVids[i];return (cand&&cand.src)?{src:cand.src,duration:(v&&v.duration)||cand.duration}:v;});}else if(s.wallpaper.video)d.wallpaper.videos=[{src:s.wallpaper.video,duration:8}];}
  if(s.about)d.about={...d.about,...s.about};
  if(s.contact)d.contact={...d.contact,...s.contact};
  if(s.accent)d.accent=s.accent;
  if(s.testimonials?.length)d.testimonials=s.testimonials;
  if(Array.isArray(s.petMessages)&&s.petMessages.length)d.petMessages=s.petMessages;
  if(Array.isArray(s.memos))d.memos=s.memos;
  if(s.portfolio?.length)d.portfolio=s.portfolio;
  if(s.gallery?.length)d.gallery=s.gallery;
  if(s.modules?.length)d.modules=s.modules;
  if(s.bgm!==undefined)d.bgm=s.bgm;
  if(s.cloudMusicIds!==undefined)d.cloudMusicIds=s.cloudMusicIds;
  if(s.content)d.content={...d.content,...s.content};
  d.navItems=VIEW_ITEMS.slice(); // 导航固定为常量，忽略云端旧值
  return d;
}

async function syncFromCloud(localResult){
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(API_URL+'/data',{signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok)return;
    const remote=await r.json();
    if(!remote?.profile)return;
    const _cloudVids=remote.wallpaper?.videos||[];
    if(remote.wallpaper&&(!_cloudVids.length||_cloudVids.every(v=>!v.src))){
      var vids=[];
      for(var i=0;i<20;i++){
        try{
          var vr=await fetch(API_URL+'/data/wp-v-'+i,{signal:ctrl.signal});
          if(vr.ok){var vd=await vr.json();if(vd&&vd.src)vids.push(vd);else break;}
          else break;
        }catch(e){break;}
      }
      if(vids.length)remote.wallpaper.videos=vids;
    }
    if(JSON.stringify(remote.profile)!==JSON.stringify(data.profile)||JSON.stringify(remote.content)!==JSON.stringify(data.content)||JSON.stringify(remote.memos)!==JSON.stringify(data.memos)||JSON.stringify(remote.cloudMusicIds)!==JSON.stringify(data.cloudMusicIds)||JSON.stringify(remote.bgm)!==JSON.stringify(data.bgm)){
      const preserveImages={};
      if(data.profile?.avatar?.startsWith('data:'))preserveImages.avatar=data.profile.avatar;
      if(data.content){
        ['slide1Bg','slide2Bg','slide3Bg'].forEach(k=>{if(data.content[k]?.startsWith('data:'))preserveImages[k]=data.content[k];});
      }
      data=mergeData(data,remote);
      if(preserveImages.avatar&&data.profile)data.profile.avatar=preserveImages.avatar;
      if(data.content)Object.keys(preserveImages).forEach(k=>{if(k!=='avatar')data.content[k]=preserveImages[k];});
      await dbSet(LS_KEY,data);
      applyAll();
    }
  }catch(e){console.warn('Bg sync skipped:',e.message)}
}

function saveData(showToast=true){
  // Strip large base64 images before cloud sync
  const cloud=JSON.parse(JSON.stringify(data));
  const strip=(obj,keys)=>{keys.forEach(k=>{if(obj[k]&&obj[k].startsWith('data:'))obj[k]='';});};
  if(cloud.profile)strip(cloud.profile,['avatar']);
  if(cloud.content){['slide1Bg','slide2Bg','slide3Bg'].forEach(k=>{if(cloud.content[k]&&cloud.content[k].startsWith('data:'))cloud.content[k]='';});}
  if(cloud.wallpaper){if(cloud.wallpaper.images)cloud.wallpaper.images=cloud.wallpaper.images.map(u=>u.startsWith('data:')?'':u);if(cloud.wallpaper.videos){cloud.wallpaper.videos=cloud.wallpaper.videos.map(v=>({duration:v.duration}));}}
  if(cloud.portfolio)cloud.portfolio.forEach(p=>{if(p.image&&p.image.startsWith('data:'))p.image='';});
  if(cloud.gallery)cloud.gallery.forEach(g=>{if(g.image&&g.image.startsWith('data:'))g.image='';});

  // Always save to local IndexedDB first
  dbSet(LS_KEY,data).catch(e=>console.warn('DB save:',e));

  // Sync changed keys only (smaller payload, faster sync)
  const hdrs=authHeaders();
  const keys=['profile','content','wallpaper','about','portfolio','gallery','modules','contact','accent','memos','bgm','cloudMusicIds','petMessages'];
  let synced=0,authFailed=false;
  const videos=(data.wallpaper?.videos||[]).filter(v=>v.src&&v.src.startsWith('data:'));
  Promise.all(keys.map(k=>{
    if(cloud[k]===undefined)return;
    const body=JSON.stringify(cloud[k]);
    if(body.length>200000000)return; // skip large payloads (images)
    return fetch(API_URL+'/data/'+k,{method:'POST',headers:hdrs,body:body}).then(r=>{if(r.status===401){authFailed=true;return;}if(r.ok)synced++;});
  }).concat(videos.map((v,i)=>fetch(API_URL+'/data/wp-v-'+i,{method:'POST',headers:hdrs,body:JSON.stringify(v)}).then(r=>{if(r.status===401){authFailed=true;return;}if(r.ok)synced++;})))).then(()=>{
    if(authFailed){handleAuthFail();return;}
    if(showToast)toast(synced>0?'已保存并同步到云端':'已保存到本设备','success');
  }).catch(()=>{
    if(showToast)toast('已保存到本设备','info');
  });
}

function copySyncLink(){
  const sync=JSON.parse(JSON.stringify(data));
  if(sync.profile.avatar?.startsWith('data:'))sync.profile.avatar='';
  (sync.wallpaper.images||[]).forEach((u,i)=>{if(u.startsWith('data:'))sync.wallpaper.images[i]='';});
  (sync.wallpaper.videos||[]).forEach(v=>{if(v.src?.startsWith('data:'))v.src='';});
  (sync.portfolio||[]).forEach(p=>{if(p.image?.startsWith('data:'))p.image='';});
  const json=JSON.stringify(sync);
  const b64=btoa(unescape(encodeURIComponent(json)));
  const url=location.origin+location.pathname+'#sync='+b64;
  navigator.clipboard.writeText(url).then(()=>{toast('同步链接已复制！','success');}).catch(()=>{prompt('手动复制此链接，在其他设备打开：',url);});
}

function importFromHash(){
  const hash=location.hash;
  if(!hash.startsWith('#sync='))return;
  try{
    const b64=hash.replace('#sync=','');
    const json=decodeURIComponent(escape(atob(b64)));
    const imported=JSON.parse(json);
    if(imported.profile){
      const merged={...JSON.parse(JSON.stringify(DEFAULT_DATA)),...imported};
      if(data.profile.avatar?.startsWith('data:'))merged.profile.avatar=data.profile.avatar;
      (data.wallpaper.images||[]).forEach((u,i)=>{if(u.startsWith('data:')&&!merged.wallpaper.images[i])merged.wallpaper.images[i]=u;});
      (data.wallpaper.videos||[]).forEach((v,i)=>{if(v.src?.startsWith('data:')&&!merged.wallpaper.videos[i]?.src)merged.wallpaper.videos[i]=v;});
      data=merged;
      saveData(false);applyAll();
      history.replaceState(null,null,location.pathname);
      toast('配置已同步！','success');
    }
  }catch(e){console.warn('Sync import failed:',e.message);}
}

let videoQueue=[],videoIdx=0,videoTimeout=null;
function initWallpapers(){
  const stage=document.getElementById('wp-stage');stage.innerHTML='';const w=data.wallpaper;
  if(wpTimer)clearInterval(wpTimer);if(videoTimeout)clearTimeout(videoTimeout);
  if(w.type==='video'&&(w.videos||[]).length){
    videoQueue=w.videos;videoIdx=0;playVideoQueue(stage);renderWpControls();
  }else{
    const imgs=w.images||[];if(!imgs.length)return;
    imgs.forEach((url,i)=>{
      const d=document.createElement('div');d.className='wp-img'+(i===0?' on':'');
      if(i===0)d.style.backgroundImage=`url(${url})`;else d.dataset.bg=url;
      d.setAttribute('aria-hidden','true');stage.appendChild(d);
    });
    wpIndex=0;startWpTimer();renderWpControls();
    requestIdleCallback?requestIdleCallback(loadRemainingWp):setTimeout(loadRemainingWp,2000);
    function loadRemainingWp(){document.querySelectorAll('#wp-stage .wp-img[data-bg]').forEach(d=>{d.style.backgroundImage=`url(${d.dataset.bg})`;d.removeAttribute('data-bg');});}
  }
}
function playVideoQueue(stage,oldVid){
  if(videoIdx>=videoQueue.length)videoIdx=0;
  const item=videoQueue[videoIdx];if(!item||!item.src)return;
  const v=document.createElement('video');v.src=item.src;v.autoplay=true;v.muted=true;v.playsInline=true;
  v.setAttribute('aria-hidden','true');
  v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s';
  const cleanup=()=>{v.remove();videoIdx++;if(videoIdx<videoQueue.length)playVideoQueue(stage,null);else{data.wallpaper.type='image';saveData();initWallpapers();}};
  v.onerror=cleanup;
  stage.appendChild(v);
  const swap=()=>{
    if(videoTimeout)clearTimeout(videoTimeout);
    v.style.opacity='1';
    if(oldVid){oldVid.style.opacity='0';setTimeout(()=>{try{oldVid.remove()}catch(e){}},700);}
    v.play().catch(()=>{});
    const dur=(item.duration||8)*1000;
    videoTimeout=setTimeout(()=>{videoIdx++;playVideoQueue(stage,v);},Math.max(dur,3000));
    renderWpControls();
  };
  v.oncanplay=swap;
  // 不随视频自然结束立即切换：统一按 duration（默认 30s）节奏轮播，视频播完静止显示最后一帧
  setTimeout(()=>{if(v.style.opacity==='0')swap();},2500);
}
function startWpTimer(){
  if(wpTimer)clearInterval(wpTimer);
  if(data.wallpaper.type==='video'||(data.wallpaper.images||[]).length<=1)return;
  wpTimer=setInterval(()=>{const s=document.querySelectorAll('#wp-stage .wp-img');if(!s.length)return;s[wpIndex].classList.remove('on');wpIndex=(wpIndex+1)%s.length;s[wpIndex].classList.add('on');},data.wallpaper.interval*1000);
}
function renderWpControls(){
  const c=document.getElementById('wp-controls');if(!c){const d=document.createElement('div');d.className='wp-controls';d.id='wp-controls';document.body.appendChild(d);}
  const cc=document.getElementById('wp-controls');cc.innerHTML='';
  if(data.wallpaper.type==='video'&&(data.wallpaper.videos||[]).length){
    data.wallpaper.videos.forEach((_,i)=>{
      const d=document.createElement('span');d.className='wp-dot'+(i===videoIdx?' on':'');
      d.onclick=()=>{videoIdx=i;playVideoQueue(document.getElementById('wp-stage'));};
      d.setAttribute('aria-label','视频 '+(i+1));d.setAttribute('role','button');d.setAttribute('tabindex','0');
      d.onkeydown=e=>{if(e.key==='Enter'){videoIdx=i;playVideoQueue(document.getElementById('wp-stage'));}};
      cc.appendChild(d);
    });
    const b=document.createElement('button');b.className='wp-video-toggle';b.textContent='⏯';b.title='暂停/播放';
    b.setAttribute('aria-label','切换视频播放');
    b.onclick=()=>{const v=document.querySelector('#wp-stage video');if(!v)return;v.paused?(v.play().catch(()=>{}),toast('已播放','info')):(v.pause(),toast('已暂停','info'));};
    cc.appendChild(b);return;
  }
  if((data.wallpaper.images||[]).length<=1)return;
  data.wallpaper.images.forEach((_,i)=>{const d=document.createElement('span');d.className='wp-dot'+(i===wpIndex?' on':'');d.onclick=()=>switchWallpaper(i);d.setAttribute('aria-label','壁纸 '+(i+1));d.setAttribute('role','button');d.setAttribute('tabindex','0');d.onkeydown=e=>{if(e.key==='Enter')switchWallpaper(i);};cc.appendChild(d);});
}
function switchWallpaper(i){const s=document.querySelectorAll('#wp-stage .wp-img');if(!s.length)return;s[wpIndex].classList.remove('on');wpIndex=i;s[wpIndex].classList.add('on');renderWpControls();}

let revealObserver=null;
function initReveal(){
  if(revealObserver)revealObserver.disconnect();
  revealObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});},{rootMargin:'0px 0px -40px 0px',threshold:0.1});
  document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));
  // Lazy image blur-up
  document.querySelectorAll('.gallery-item img, .portfolio-item img').forEach(img=>{
    if(img.complete)img.classList.add('loaded');
    else{img.addEventListener('load',function(){this.classList.add('loaded')});img.addEventListener('error',function(){this.classList.add('loaded')});}
  });
}

function applyAccent(color){
  const hex=/^#[0-9a-fA-F]{6}$/.test(color||'')?color:'';
  const base=(hex&&color!=='#000000'&&color!=='#ffffff')?color:'#D4A843';
  const s=document.documentElement.style;
  s.setProperty('--gold',base);
  s.setProperty('--gold-bright','color-mix(in srgb,'+base+' 100%,white 18%)');
  s.setProperty('--gold-pale','color-mix(in srgb,'+base+' 100%,black 28%)');
  s.setProperty('--gold-glow','color-mix(in srgb,'+base+' 30%,transparent)');
}

function buildCarouselDots(){
  totalSlides=document.querySelectorAll('.carousel-slide').length;
  if(isNaN(currentSlide))currentSlide=0;
  const container=document.getElementById('carousel-dots');
  if(!container)return;
  container.innerHTML='';
  for(let i=0;i<totalSlides;i++){
    const dot=document.createElement('span');
    dot.className='carousel-dot'+(i===0?' active':'');
    dot.addEventListener('click',()=>{goToSlide(i);resetCarouselTimer();});
    dot.setAttribute('aria-label','Slide '+(i+1));dot.setAttribute('role','button');dot.tabIndex=0;
    container.appendChild(dot);
  }
  startCarousel();
}
function goToSlide(index){
  if(!totalSlides)return;
  const slides=document.querySelectorAll('.carousel-slide');
  const dots=document.querySelectorAll('.carousel-dot');
  if(!slides.length)return;
  slides[currentSlide]?.classList.remove('active');
  if(dots[currentSlide])dots[currentSlide].classList.remove('active');
  currentSlide=((index%totalSlides)+totalSlides)%totalSlides;
  slides[currentSlide]?.classList.add('active');
  if(dots[currentSlide])dots[currentSlide].classList.add('active');
  slides.forEach((s,i)=>s.setAttribute('aria-hidden',String(i!==currentSlide)));
}
function carouselNext(){goToSlide(currentSlide+1);resetCarouselTimer();}
function carouselPrev(){goToSlide(currentSlide-1);resetCarouselTimer();}
function resetCarouselTimer(){clearInterval(carouselTimer);carouselTimer=null;startCarousel();}

let mapChart=null,mapCityPoints=[],mapUnlocated=[],mapCurrentCity=null;
let _mapDepsLoaded=false;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('加载失败 '+src));document.head.appendChild(s);});}
async function ensureMapDeps(){
  if(_mapDepsLoaded)return;
  if(!window.echarts){
    const cdns=['https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js','https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js'];
    let ok=false;
    for(const c of cdns){try{await loadScript(c);if(window.echarts){ok=true;break;}}catch(e){}}
    if(!ok)throw new Error('ECharts 不可用');
  }
  if(!window.CHINA_GEO)await loadScript('assets/china-geo.js');
  if(!window.CITIES_GEO)await loadScript('assets/cities-geo.js');
  _mapDepsLoaded=true;
}
function normalizeCity(name){
  const raw=String(name||'').trim();
  if(!raw||!window.CITIES_GEO)return null;
  if(CITIES_GEO[raw])return raw;
  const strip=s=>s.replace(/[市区县盟州地区特别行政区自治州]+$/,'');
  const clean=strip(raw);
  if(!clean)return null;
  for(const k of Object.keys(CITIES_GEO)){if(strip(k)===clean)return k;}
  // 省名/包含匹配
  const hit=Object.keys(CITIES_GEO).find(k=>k===raw||k.includes(clean)&&clean.length>=2);
  return hit||null;
}
function buildMapData(){
  const byKey=new Map();
  const unlocated=[];
  (data.gallery||[]).forEach((item,i)=>{
    const loc=normalizeCity(item.location);
    if(loc&&CITIES_GEO[loc]){
      const c=CITIES_GEO[loc];
      const key=c[0]+','+c[1];
      if(!byKey.has(key))byKey.set(key,{name:c[2]||loc,cityName:loc,coords:[c[0],c[1]],photos:[]});
      byKey.get(key).photos.push(Object.assign({index:i},item));
    }else if(item.location&&String(item.location).trim()){
      unlocated.push(Object.assign({index:i},item));
    }
  });
  return {cities:[...byKey.values()],unlocated};
}
function renderMap(){
  const el=document.getElementById('china-map');
  if(!el)return;
  if(mapChart){mapChart.dispose();mapChart=null;}
  const {cities,unlocated}=buildMapData();
  mapCityPoints=cities;mapUnlocated=unlocated;mapCurrentCity=null;
  document.getElementById('city-photo-panel')?.classList.remove('show');
  renderMapUnlocated();
  if(!cities.length){el.innerHTML='<div class="map-empty">还没有标记地点的照片 —— 在管理后台给照片填「地点(城市)」，就能点亮地图</div>';return;}

  mapChart=echarts.init(el,{renderer:'canvas'});
  echarts.registerMap('china',window.CHINA_GEO);
  const provSet=new Set(cities.map(c=>c.name).filter(Boolean));
  const regions=window.CHINA_GEO.features.map(f=>{
    const n=f.properties.name;
    const lit=provSet.has(n);
    return {name:n,itemStyle:{areaColor:lit?'rgba(56,189,248,0.22)':'rgba(5,8,14,0.55)',borderColor:lit?'#38bdf8':'#475569',borderWidth:lit?1.5:0.8}};
  });
  const scatterData=cities.map(c=>({name:c.cityName,value:[c.coords[0],c.coords[1]],cityName:c.cityName,province:c.name,photos:c.photos}));
  let mapZoom=1.55;
  mapChart.setOption({
    backgroundColor:'transparent',animation:false,
    tooltip:{trigger:'item',backgroundColor:'rgba(8,8,8,.92)',borderColor:'rgba(212,168,67,.5)',textStyle:{color:'#f8fafc',fontSize:12},formatter:p=>{
      if(p.seriesType==='effectScatter'){const n=(p.data.photos||[]).length;return '<b>'+p.data.cityName+'</b><br/>'+n+' 张照片<br/><span style="color:#94a3b8;font-size:11px">点击查看照片</span>';}
      return p.name;
    }},
    geo:{map:'china',roam:true,zoom:1.55,center:[105,36.5],scaleLimit:{min:0.8,max:14},z:1,
      itemStyle:{areaColor:'rgba(5,8,14,0.55)',borderColor:'#475569',borderWidth:0.8},
      regions:regions,label:{show:true,color:'#7d8aa0',fontSize:10},
      emphasis:{itemStyle:{areaColor:'rgba(56,189,248,0.3)'},label:{color:'#f8fafc'}}},
    series:[{name:'已记录城市',type:'effectScatter',coordinateSystem:'geo',data:scatterData,
      symbolSize:12,rippleEffect:{brushType:'stroke',scale:4,period:4},
      label:{show:true,formatter:p=>mapZoom>=2.6?p.data.cityName:String(p.data.photos.length),color:'#e2e8f0',fontSize:11,position:'right'},
      itemStyle:{color:'#38bdf8',shadowBlur:14,shadowColor:'rgba(56,189,248,.6)'},z:6}]
  });
  // 放大（或缩小）时切换城市点标注：放大显示城市名，缩小时显示照片数
  mapChart.on('georoam',()=>{
    const opt=mapChart.getOption();
    const z=(opt.geo&&opt.geo[0]&&opt.geo[0].zoom)||1.55;
    mapZoom=z;
    mapChart.setOption({series:[{label:{show:true,fontSize:z>=2.6?12:11,color:'#e2e8f0'}}]});
  });
  mapChart.on('click',p=>{if(p.seriesType==='effectScatter'&&p.data&&p.data.photos)showCityPhotos(p.data);});

let _audio=null,_playlist=[],_plIdx=0,_musicInitDone=false,_curLyrics=[],_lyricTimer=null,_activeLyric='';
function getAudio(){if(!_audio)_audio=document.getElementById('bgm-audio')||new Audio();return _audio;}
function parseLrc(txt){
  if(!txt||txt.length>20000)return[];
  const out=[];
  txt.split('\n').forEach(line=>{
    const m=[...line.matchAll(/\[(\d{2,}):(\d{2})(?:\.(\d{2,3}))?\]/g)];
    if(m.length){
      const text=line.replace(/\[\d{2,}:\d{2}(?:\.\d{2,3})?\]/g,'').trim();
      if(text)m.forEach(mm=>{out.push({time:parseInt(mm[1])*60+parseInt(mm[2])+(mm[3]?parseInt(mm[3])/(mm[3].length===3?1000:100):0),text});});
    }
  });
  return out.sort((a,b)=>a.time-b.time);
}
function playSong(song){
  const a=getAudio();
  a.src=song.src;a.dataset.name=song.name;
  a.loop=_playlist.length<=1; // 多曲自动切歌，单曲循环
  _curLyrics=[]; _activeLyric='';
  if(_lyricTimer){clearInterval(_lyricTimer);_lyricTimer=null;}
  if(song.cover){
    const disc=document.getElementById('mc-disc');
    if(disc){disc.classList.add('has-cover');disc.style.backgroundImage='url("'+song.cover+'")';disc.style.backgroundSize='cover';disc.style.backgroundPosition='center';}
    const fab=document.getElementById('music-fab');
    if(fab){fab.classList.add('has-cover');fab.style.backgroundImage='url("'+song.cover+'")';fab.style.backgroundSize='cover';fab.style.backgroundPosition='center';}
  }
  const lyEl=document.getElementById('mc-lyric');
  if(song.lrc&&/^https?:/.test(song.lrc)){
    if(lyEl)lyEl.textContent='♪ 正在加载歌词...';
    fetch(song.lrc).then(r=>r.ok?r.text():'').then(txt=>{
      _curLyrics=parseLrc(txt);
      if(lyEl&&!_curLyrics.length)lyEl.textContent='♪ 纯音乐，请欣赏 ♪';
    }).catch(()=>{if(lyEl)lyEl.textContent='♪ 纯音乐，请欣赏 ♪';});
  }else if(lyEl){
    lyEl.textContent='♪ 纯音乐，请欣赏 ♪';
  }
  a.play().catch(()=>{});
  refreshMusicUI();
}
function nextSong(){if(!_playlist.length)return;_plIdx=(_plIdx+1)%_playlist.length;playSong(_playlist[_plIdx]);}
function prevSong(){if(!_playlist.length)return;_plIdx=(_plIdx-1+_playlist.length)%_playlist.length;playSong(_playlist[_plIdx]);}
function refreshMusicUI(){
  const fab=document.getElementById('music-fab'),playBtn=document.getElementById('music-play'),title=document.getElementById('music-title');
  if(!fab)return;
  const a=getAudio();const playing=!a.paused&&!a.ended&&a.src;
  fab.classList.toggle('playing',playing);
  if(playBtn)playBtn.classList.toggle('playing',playing);
  if(title)title.textContent=(_playlist[_plIdx]&&_playlist[_plIdx].name)||'未在播放';
  syncMusicCard();
  renderPlaylist();
}
function updateLyric(){
  const el=document.getElementById('mc-lyric');
  if(!el)return;
  if(!_curLyrics.length){el.textContent='♪ 纯音乐，请欣赏 ♪';return;}
  const t=getAudio().currentTime||0;
  let line='';
  for(let i=_curLyrics.length-1;i>=0;i--){if(t>=_curLyrics[i].time){line=_curLyrics[i].text;break;}}
  if(line!==_activeLyric){
    _activeLyric=line;
    let idx=0;
    if(_lyricTimer)clearInterval(_lyricTimer);
    _lyricTimer=setInterval(()=>{
      idx++;
      el.textContent=_activeLyric.slice(0,idx)||' ';
      if(idx>=_activeLyric.length)clearInterval(_lyricTimer);
    },55);
  }
}
function loadMetingSongs(ids){
  const list=ids.split(',').map(s=>s.trim()).filter(Boolean);
  if(!list.length)return;
  Promise.all(list.map(id=>
    fetch('https://api.injahow.cn/meting/?server=netease&type=song&id='+id)
      .then(r=>r.ok?r.json():null).catch(()=>null)
  )).then(results=>{
    const songs=[];
    (results||[]).forEach(res=>{
      const s=(Array.isArray(res)?res[0]:res)||{};
      if(s&&s.url)songs.push({name:(s.name||s.title||'未知歌曲')+' - '+(s.artist||s.author||'未知歌手'),src:s.url,cover:s.pic||s.cover||'',lrc:s.lrc||''});
    });
    // 高清封面：跟随 pic 重定向拿到 CDN URL，param 90y90→500y500
    Promise.all(songs.map(s=>
      s.cover?fetch(s.cover,{method:'HEAD',redirect:'follow'}).then(r=>{
        const u=r.url||'';
        return (u.includes('param=90y90'))?u.replace('param=90y90','param=500y500'):(u||s.cover);
      }).catch(()=>s.cover):Promise.resolve('')
    )).then(covers=>{
      songs.forEach((s,i)=>{if(covers[i])s.cover=covers[i];});
      if(songs.length){_playlist=songs;_plIdx=0;playSong(_playlist[0]);}
      else toast('歌曲加载失败，检查歌曲ID','info');
    }).catch(()=>{
      if(songs.length){_playlist=songs;_plIdx=0;playSong(_playlist[0]);}
      else toast('歌曲加载失败，检查歌曲ID','info');
    });
  }).catch(()=>toast('音乐加载失败','info'));
}
function loadMetingPlaylist(pid){
  fetch('https://api.i-meto.com/meting/api?server=netease&type=playlist&id='+pid)
    .then(r=>r.json()).then(list=>{
      if(!Array.isArray(list)||!list.length)throw new Error('empty');
      _playlist=list.map(s=>({name:(s.title||'')+' - '+(s.author||''),src:s.url,cover:s.pic||'',lrc:s.lrc||''})).filter(s=>s.src);
      _plIdx=0;
      playSong(_playlist[0]);
    }).catch(()=>{
      if(/^https?:/.test(data.bgm||''))playSong({name:'背景音乐',src:data.bgm,cover:'',lrc:''});
      else toast('歌单加载失败，可在后台设置音频直链','info');
    });
}
function syncMusicSource(){
  const fab=document.getElementById('music-fab');
  if(!fab)return;
  const ids=String(data.cloudMusicIds||'').trim();
  if(ids){fab.style.display='flex';loadMetingSongs(ids);return;}
  const bgm=String(data.bgm||'').trim();
  if(!bgm){fab.style.display='none';syncMusicCard();return;}
  fab.style.display='flex';
  const a=getAudio();
  if(/^netease:/.test(bgm)){loadMetingPlaylist(bgm.replace(/^netease:/,''));return;}
  if(/^\d+$/.test(bgm)){loadMetingPlaylist(bgm);return;}
  // 直链：仅当当前 src 不同才更新
  if(a.src!==bgm&&(!_playlist.length||a.dataset.name!=='背景音乐')){_playlist=[{name:'背景音乐',src:bgm,cover:'',lrc:''}];_plIdx=0;playSong(_playlist[0]);}
}

function bindMusicCard(){
  const playBtn=document.getElementById('mc-play');
  if(!playBtn)return;
  playBtn.onclick=e=>{e.stopPropagation();const a=getAudio();if(a.src){(a.paused?a.play():a.pause()).catch(()=>{});}else toast('后台还没设置音乐','info');};
  document.getElementById('mc-prev').onclick=e=>{e.stopPropagation();prevSong();};
  document.getElementById('mc-next').onclick=e=>{e.stopPropagation();nextSong();};
  const prog=document.getElementById('mc-progress');
  prog.onclick=e=>{const a=getAudio();if(!a.duration)return;const r=prog.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration;};
  document.getElementById('mc-list-btn').onclick=e=>{
    e.stopPropagation();
    const p=document.getElementById('mc-playlist'),ly=document.getElementById('mc-lyric');
    const showing=p.style.display==='block';
    p.style.display=showing?'none':'block';
    ly.style.display=showing?'flex':'none';
  };
  syncMusicCard();
  renderPlaylist();
}
function syncMusicCard(){
  const title=document.getElementById('mc-title'),disc=document.getElementById('mc-disc'),
        playBtn=document.getElementById('mc-play'),bar=document.getElementById('mc-bar'),
        lyric=document.getElementById('mc-lyric');
  if(!title)return;
  const a=getAudio();
  const playing=!!a.src&&!a.paused&&!a.ended;
  title.textContent=(_playlist[_plIdx]&&_playlist[_plIdx].name)||'未在播放';
  if(disc)disc.classList.toggle('playing',playing);
  if(playBtn)playBtn.classList.toggle('playing',playing);
  if(a.duration&&bar)bar.style.width=(a.currentTime/a.duration*100)+'%';
  if(lyric&&!playing&&!_activeLyric)lyric.textContent=_curLyrics.length?'♪ 点击播放，歌词同步显示 ♪':'♪ 纯音乐，请欣赏 ♪';
}
function renderPlaylist(){
  const containers=[document.getElementById('mc-playlist'),document.getElementById('music-playlist')];
  containers.forEach(container=>{
    if(!container)return;
    if(!_playlist.length){container.innerHTML='';return;}
    container.innerHTML=_playlist.map((s,i)=>
      '<div class="mc-play-item'+(i===_plIdx?' active':'')+'" data-i="'+i+'">'+(i===_plIdx?'♪ ':'')+escHtml(s.name)+'</div>'
    ).join('');
  });
  document.querySelectorAll('.mc-play-item').forEach(el=>{
    el.addEventListener('click',function(){
      const i=parseInt(this.dataset.i);
      if(i===_plIdx){const a=getAudio();if(a.paused)a.play().catch(()=>{});}
      else{_plIdx=i;playSong(_playlist[i]);}
    });
  });
  document.getElementById('mc-list-btn').textContent='播放列表 ('+_playlist.length+')';
  document.getElementById('music-list-btn').textContent='播放列表 ('+_playlist.length+')';
}
function initMusicPlayer(){
  if(_musicInitDone){syncMusicSource();return;}
  _musicInitDone=true;
  const fab=document.getElementById('music-fab'),panel=document.getElementById('music-panel'),
        playBtn=document.getElementById('music-play'),prog=document.getElementById('music-progress'),
        bar=document.getElementById('music-bar'),volInp=document.getElementById('music-vol');
  if(!fab)return;
  const a=getAudio();
  a.volume=parseFloat(localStorage.getItem('xiaoaijiang-vol')||'0.7');
  if(volInp)volInp.value=a.volume;
  a.addEventListener('play',refreshMusicUI);
  a.addEventListener('pause',refreshMusicUI);
  a.addEventListener('ended',()=>{_playlist.length>1?nextSong():refreshMusicUI();});
  a.addEventListener('timeupdate',()=>{
    if(a.duration&&bar)bar.style.width=(a.currentTime/a.duration*100)+'%';
    syncMusicCard();
    updateLyric();
  });
  fab.addEventListener('click',e=>{
    if(window.__fabDragged){window.__fabDragged=false;return;}
    e.stopPropagation();
    panel.classList.toggle('open');
    panel.setAttribute('aria-hidden',String(!panel.classList.contains('open')));
    floatEl.classList.toggle('panel-open',panel.classList.contains('open'));
  });
  // FAB 可拖拽（拖拽与点击区分，参考桌宠实现）
  const floatEl=document.getElementById('music-float');
  let fDrag=false,fMoved=false,fSX=0,fSY=0,fOX=0,fOY=0;
  function endFabDrag(){
    if(!fDrag)return;
    fDrag=false;
    if(fMoved){
      window.__fabDragged=true;
      const r=floatEl.getBoundingClientRect();
      floatEl.style.left=Math.max(0,Math.min(r.left,window.innerWidth-r.width))+'px';
      floatEl.style.top=Math.max(0,Math.min(r.top,window.innerHeight-r.height))+'px';
    }
  }
  fab.addEventListener('pointerdown',e=>{
    fDrag=true;fMoved=false;
    fSX=e.clientX;fSY=e.clientY;
    const r=floatEl.getBoundingClientRect();
    fOX=r.left;fOY=r.top;
    floatEl.style.left=fOX+'px';floatEl.style.top=fOY+'px';
    floatEl.style.right='auto';floatEl.style.bottom='auto';
    try{fab.setPointerCapture(e.pointerId);}catch(err){}
  });
  fab.addEventListener('pointermove',e=>{
    if(!fDrag)return;
    const dx=e.clientX-fSX,dy=e.clientY-fSY;
    if(Math.abs(dx)>3||Math.abs(dy)>3)fMoved=true;
    floatEl.style.left=(fOX+dx)+'px';
    floatEl.style.top=(fOY+dy)+'px';
  });
  fab.addEventListener('pointerup',endFabDrag);
  fab.addEventListener('pointercancel',endFabDrag);
  playBtn.addEventListener('click',e=>{e.stopPropagation();if(a.src){(a.paused?a.play():a.pause()).catch(()=>{});}else toast('后台还没设置音乐','info');});
  document.getElementById('music-prev').addEventListener('click',e=>{e.stopPropagation();prevSong();});
  document.getElementById('music-next').addEventListener('click',e=>{e.stopPropagation();nextSong();});
  prog.addEventListener('click',e=>{if(!a.duration)return;const r=prog.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration;});
  volInp.addEventListener('input',()=>{a.volume=parseFloat(volInp.value);localStorage.setItem('xiaoaijiang-vol',volInp.value);});
  document.getElementById('music-list-btn').addEventListener('click',e=>{e.stopPropagation();const p=document.getElementById('music-playlist');p.style.display=p.style.display==='block'?'none':'block';});
  renderPlaylist();
  syncMusicSource();
}

let lbIndex=0;
function openLightbox(i){
  lbIndex=i;const items=data.gallery||[];if(!items.length)return;
  const item=items[lbIndex];
  const img=document.getElementById('lightbox-img');if(img){img.src=item.image||'';img.alt=item.caption||item.location||'照片';}

  document.getElementById('lightbox')?.classList.add('show');
}
function closeLightbox(){document.getElementById('lightbox')?.classList.remove('show')}
function lightboxNav(dir){
  const items=data.gallery||[];if(!items.length)return;
  lbIndex=(lbIndex+dir+items.length)%items.length;
  const item=items[lbIndex];
  const img=document.getElementById('lightbox-img');if(img){img.src=item.image||'';img.alt=item.caption||item.location||'照片';}
  const cap=document.getElementById('lightbox-caption');if(cap)cap.textContent=item.caption||'';
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox')?.classList.contains('show'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')lightboxNav(-1);
  if(e.key==='ArrowRight')lightboxNav(1);
});

function openAdmin(){
  if(!isAdmin){document.getElementById('login-overlay').classList.add('show');document.getElementById('login-pwd').value='';return;}

var _loginBusy=false;
function authHeaders(){return Object.assign({'Content-Type':'application/json'},sessionToken?{Authorization:'Bearer '+sessionToken}:{});}
function handleAuthFail(){if(!isAdmin)return;isAdmin=false;sessionToken='';sessionStorage.removeItem('xiaoaijiang-session');const lo=document.getElementById('login-overlay');if(lo)lo.classList.add('show');const lp=document.getElementById('login-pwd');if(lp)lp.focus();toast('登录已过期，请重新登录','info');}
async function verifyLogin(){
  const pwd=document.getElementById('login-pwd').value;
  if(!pwd){toast('请输入密码','error');return;}
  if(_loginBusy)return;_loginBusy=true;
  try{
    const r=await fetch(API_URL+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    if(r.ok){
      const j=await r.json();
      sessionToken=j.token||'';if(sessionToken)sessionStorage.setItem('xiaoaijiang-session',sessionToken);
      isAdmin=true;document.getElementById('login-overlay').classList.remove('show');showAdminPanel();toast('验证通过','success');
    }else if(r.status===401){toast('密码错误','error');}
    else{toast('登录失败，请重试','error');}
  }catch(e){toast('网络错误，登录失败','error');}
  finally{_loginBusy=false;}
}

// 音乐歌单顺序调整（管理面板）
const _musicNameCache={};
let _mioDebounce=null,_mioSaveTimer=null;
function musicIdList(){const v=document.getElementById('e-music-ids');return v?(v.value.split(',').map(s=>s.trim()).filter(Boolean)):[];}
function setMusicIdList(ids){const v=document.getElementById('e-music-ids');if(v)v.value=ids.join(',');}
function renderMusicIdOrder(){
  const box=document.getElementById('music-id-order');
  if(!box)return;
  const ids=musicIdList();
  box.innerHTML=ids.length?ids.map((id,i)=>`
    <div class="mio-row" data-mio="${i}" style="padding:5px 8px;background:var(--astral-elevated);border-radius:8px;margin-bottom:4px;display:flex;align-items:center;gap:6px">
      <span style="font-size:.72em;color:var(--text-secondary);white-space:nowrap">#${i+1}</span>
      <span class="mio-name" data-mio-id="${escHtml(id)}" style="flex:1;min-width:0;font-size:.78em;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(_musicNameCache[id]||'加载歌名中...')}</span>
      <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:.7em" onclick="moveMusicId(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:.7em" onclick="moveMusicId(${i},1)" ${i===ids.length-1?'disabled':''}>↓</button>
    </div>`).join(''):'<p style="font-size:.78em;color:var(--text-secondary)">暂无歌曲，在上方输入歌曲ID</p>';
}
function moveMusicId(i,dir){
  const ids=musicIdList();const j=i+dir;
  if(j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  setMusicIdList(ids);
  data.cloudMusicIds=ids.join(','); // 同步到 data；保存做防抖合并，避免连点竞态
  renderMusicIdOrder();
  clearTimeout(_mioSaveTimer);
  _mioSaveTimer=setTimeout(()=>{saveData();toast('顺序已保存','success');},700);
}
function fetchMusicOrderNames(){
  const ids=musicIdList();
  ids.forEach(id=>{
    if(_musicNameCache[id])return;
    fetch('https://api.injahow.cn/meting/?server=netease&type=song&id='+id,{signal:AbortSignal.timeout(8000)})
      .then(r=>r.ok?r.json():null).catch(()=>null)
      .then(res=>{
        const s=(Array.isArray(res)?res[0]:res)||{};
        const nm=(s.name||s.title||'').trim(),ar=(s.artist||s.author||'').trim();
        _musicNameCache[id]=(nm||ar)?((nm||'未知歌曲')+(ar?' - '+ar:'')):('(无法解析，ID '+id+')');
        const box=document.getElementById('music-id-order');
        if(box){const el=box.querySelector('.mio-name[data-mio-id="'+id+'"]');if(el)el.textContent=_musicNameCache[id];}
      }).catch(()=>{_musicNameCache[id]='ID '+id;});
  });
}
